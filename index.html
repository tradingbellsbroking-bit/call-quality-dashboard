<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --text: #e8e8ec; --muted: #9297a3;
    --accent: #7c9eff; --border: #262a35;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); margin: 0; padding: 32px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 4px; flex-wrap: wrap; }
  .header { display: flex; align-items: center; gap: 14px; }
  .header img { height: 40px; width: auto; max-width: 180px; object-fit: contain; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; }
  .subtitle { color: var(--muted); font-size: 13px; margin: 4px 0 28px; }
  .lang-toggle {
    display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  }
  .lang-toggle button {
    background: var(--panel); color: var(--muted); border: none; padding: 7px 14px;
    font-size: 13px; cursor: pointer; font-weight: 600;
  }
  .lang-toggle button.active { background: var(--accent); color: #0b0e14; }
  .btn-small {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    padding: 7px 14px; font-size: 13px; cursor: pointer; font-weight: 600;
    border-radius: 8px;
  }
  .btn-small:hover { border-color: var(--accent); }
  .btn-danger { color: #ff6b6b; border-color: #ff6b6b55; }
  .btn-danger:hover { border-color: #ff6b6b; background: #ff6b6b18; }
  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px; }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; min-width: 0;
  }
  .panel h2 { font-size: 15px; font-weight: 600; margin: 0 0 14px; color: var(--text); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px;
  }
  .card .label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .card .value { font-size: 24px; font-weight: 700; }
  .filter-row { margin-bottom: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  select {
    background: #0f1115; color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; font-size: 13px; min-height: 36px;
  }
  .chart-box { position: relative; height: 260px; }
  .table-scroll { max-height: 520px; overflow-y: auto; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 480px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td.wrap { white-space: normal; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  tbody tr { cursor: pointer; transition: background 0.1s; }
  tbody tr:hover { background: #1d212b; }
  .score-pill {
    display: inline-block; padding: 2px 8px; border-radius: 999px; font-weight: 600; font-size: 12px;
  }
  .empty { color: var(--muted); padding: 40px; text-align: center; }

  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    align-items: center; justify-content: center; z-index: 100; padding: 24px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    max-width: 640px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 24px;
  }
  .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; gap: 10px; }
  .modal-header h3 { margin: 0; font-size: 17px; }
  .modal-close {
    background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer;
    line-height: 1; padding: 4px;
  }
  .modal-meta { color: var(--muted); font-size: 12.5px; margin-bottom: 16px; }
  .modal-score { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px; }
  .modal-score .num { font-size: 26px; font-weight: 700; }
  .modal-section { margin-bottom: 16px; }
  .modal-section h4 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted);
    margin: 0 0 8px;
  }
  .modal-section ul { margin: 0; padding-left: 18px; }
  .modal-section li { margin-bottom: 5px; line-height: 1.4; }
  .tag-strength { color: #4ade80; }
  .tag-issue { color: #f87171; }
  .tag-improve { color: #7c9eff; }

  @media (max-width: 820px) {
    body { padding: 16px; }
    .grid { grid-template-columns: 1fr; }
    .cards { grid-template-columns: 1fr 1fr; }
    .header img { height: 32px; }
    h1 { font-size: 19px; }
    .chart-box { height: 220px; }
    .modal { max-width: 100%; padding: 18px; border-radius: 10px; }
    .modal-backdrop { padding: 10px; }
    select, .lang-toggle button { min-height: 40px; }
  }
  @media (max-width: 480px) {
    .cards { grid-template-columns: 1fr; }
    .card .value { font-size: 20px; }
    td.wrap {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      max-width: 220px;
    }
  }
</style>
</head>
<body>

const DATA = [{"call_id": "2026-08-27_NeelamRajput_01", "date": "2026-08-27", "scored_at": "2026-09-01T05:54:29", "agent": "Neelam Rajput", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-TBE460-9558086694-20260827-114246.mp3.mp3.mpeg", "drive_file_id": "", "call_number": "", "phone_number": "9558086694", "language": "hi", "notes": "", "score": 3.0, "call_category": "", "client_profile_en": "Client (Mahesh) has a demat account with Angel One opened about 6 years ago; he has never traded/bought or sold any stock in it, and it is now deactivated. He states he does not know what the stock market is. No other demographic details were gathered.", "client_profile_hi": "ग्राहक (महेश) के पास लगभग 6 साल पहले खोला गया Angel One का डीमैट अकाउंट है; उन्होंने उसमें कभी कोई ट्रेडिंग/खरीद-बिक्री नहीं की है और अब वह डीएक्टिवेट है। वह कहते हैं कि उन्हें शेयर बाजार के बारे में पता नहीं है। कोई अन्य डेमोग्राफिक जानकारी एकत्र नहीं की गई।", "summary_en": "The agent gave factually incorrect information (claiming demat and bank accounts are 'the same') and turned argumentative and dismissive when the confused customer pushed back, without securing any next step.", "summary_hi": "एजेंट ने तथ्यात्मक रूप से गलत जानकारी दी (यह कहते हुए कि डीमैट और बैंक अकाउंट 'एक ही' हैं) और जब भ्रमित ग्राहक ने सवाल उठाए तो एजेंट बहसबाज़ी और उपेक्षापूर्ण हो गई, और कोई अगला कदम भी तय नहीं हुआ।", "strengths_en": ["Agent did extract some useful background — existing Angel One account, 6-year tenure, no trades made.", "Agent identified the account deactivation as the core issue to address."], "strengths_hi": ["एजेंट ने कुछ उपयोगी जानकारी निकाली — मौजूदा Angel One अकाउंट, 6 साल पुराना, कोई ट्रेड नहीं किया गया।", "एजेंट ने अकाउंट डीएक्टिवेशन को मुख्य समस्या के रूप में पहचाना।"], "issues_en": ["Agent incorrectly told the customer 'dono same hi hain' (bank and demat accounts are the same) — a misleading/inaccurate statement.", "Agent became argumentative and condescending: 'Arre sir!', 'Mujhse zyada aapko pata hai kya?' instead of calmly clarifying doubts.", "No next step or clear process was agreed upon by the end of the call; the customer's confusion was never resolved."], "issues_hi": ["एजेंट ने गलत तरीके से कहा 'दोनों सेम ही हैं' (बैंक और डीमैट अकाउंट एक जैसे हैं) — यह भ्रामक/गलत बयान है।", "एजेंट बहसबाज़ी और उपेक्षापूर्ण हो गई: 'अरे सर!', 'मुझसे ज़्यादा आपको पता है क्या?' — शांति से समझाने के बजाय।", "कॉल के अंत तक कोई अगला कदम या स्पष्ट प्रक्रिया तय नहीं हुई; ग्राहक की उलझन दूर नहीं हुई।"], "improvements_en": ["Correct and clarify facts precisely — never claim bank and demat accounts are identical.", "Respond to a first-time investor's confusion patiently with simple explanations, not dismissive pushback.", "Close every call with a concrete next step, e.g., scheduling a callback or KYC assistance."], "improvements_hi": ["तथ्यों को सही और सटीक रूप से स्पष्ट करें — कभी न कहें कि बैंक और डीमैट अकाउंट एक जैसे हैं।", "पहली बार निवेश कर रहे ग्राहक की उलझन का सरल भाषा में धैर्यपूर्वक जवाब दें, उपेक्षा से नहीं।", "हर कॉल को किसी ठोस अगले कदम के साथ बंद करें, जैसे कॉलबैक शेड्यूल करना या KYC में सहायता देना।"], "transcript": "[00:02] AGENT: Hello.\n[00:03] CUSTOMER: Haan, hello?\n[00:04] AGENT: Ji, Mahesh ji baat kar rahe hain?\n[00:06] CUSTOMER: Boliye, ma'am.\n[00:07] AGENT: Haan, Mahesh ji, main Neelam baat kar rahi hoon Kotak Securities ke behalf pe authorized person.\n[00:13] CUSTOMER: Haan, boliye na.\n[00:14] AGENT: Actually, maine aapko support to service ke regarding call kiya tha. Abhi working vagaira kar rahe hain aap stock market mein?\n[00:21] CUSTOMER: Nahi, ma'am. Kya hota hai ye stock market?\n[00:25] AGENT: Achha, stock market nahi jaante hain aap, sir?\n[00:28] CUSTOMER: Nahi jaanta.\n[00:30] AGENT: Toh mera ye jo call aaya, woh aapko first time aaya Mahesh ji?\n[00:34] CUSTOMER: Nahi, kiya hoga aap log pata nahi, aap bol rahe ho first time, toh...\n[00:37] AGENT: Nahi nahi, mera toh first time hi kiya, lekin kisi aur ka call nahi aaya aapko? Kyunki aapka profile pe stock market mein registered hai, sir.\n[00:44] CUSTOMER: Nahi, aapne first time diya, toh zaahir si baat hai first time hi aaya. Aisa toh mujhe kisi ka call nahi aaya.\n[00:52] AGENT: Hm hm.\n[00:54] AGENT: Actually, isme aisa rehta hai sir ki isme Demat ka process rehta hai. Demat ke uh ka process karne ke baad mein agar aap investment karna chahte hain jaise Mutual Fund, SIP, IPO, ya share market mein aap kar sakte hain sir, Indian market mein equity aur commodity market mein.\n[01:07] CUSTOMER: Haan, mera mera Demat Demat account agar active hua, toh kya karna padega?\n[01:11] AGENT: Achha, account active kar sakte hain, sir.\n[01:14] CUSTOMER: Kaise?\n[01:16] AGENT: Aap application se bhi process kar sakte hain. Hamara toh Kotak Neo ke naam se Play Store pe application hai sir, usme aap apna process...\n[01:22] CUSTOMER: Mera mera Demat account toh pehle deactive hai, active kaise karenge, woh bataye?\n[01:27] AGENT: Haan, toh process karenge toh active ho jayega na, sir.\n[01:30] CUSTOMER: Woh kaise?\n[01:31] AGENT: Bina process ke kaise active ho jayega? Kahin pe bhi agar aap account open karoge toh KYC process...\n[01:36] CUSTOMER: Main finger in... main 5 saal pehle account khulwaya tha, aur deactive ho gaya hai. Main abhi check karwaya, toh deactive...\n[01:42] AGENT: Angel One mein?\n[01:44] CUSTOMER: Haan, Angel One mein.\n[01:45] AGENT: Kitna time ho gaya account open kiye hue?\n[01:48] CUSTOMER: Saala...\n[01:49] AGENT: Saalbhar ho gaye hain?\n[01:50] CUSTOMER: 6 saal, 6 saal.\n[01:51] AGENT: Oh, 6 saal ho gaye? 6 saal mein kaam kitni baar kiye hain aap usme?\n[01:55] CUSTOMER: Nahi kiya, kuch bhi nahi kiya.\n[01:57] AGENT: Arre sir! Phir account open kyun kiya aapne, sir?\n[02:00] CUSTOMER: Mera man tha ye woh account open karne ka, so...\n[02:04] AGENT: Achha, aisa tha? Toh woh toh koi sa bhi application ho sir, agar aap account open kar liye, 6 mahine ke pehle agar aap usme koi bhi stock buy/sell nahi karenge na sir, toh woh toh l se main aapka Demat check kar rahi hoon, mujhe toh sab kuch zero dikh raha hai. Aapne kuch add nahi kiya hai aur aap keh rahe ho ki maine add kiya hai. Toh mujhe ek baar...\n[02:53] CUSTOMER: Lekin mere paas mere paas toh dikha raha hai na.\n[02:55] AGENT: Toh main kya bol rahi hoon aapko? Agar aap screenshot lena nahi aata hai, theek hai, dusre phone se photo click karke bhejo.\n[03:04] CUSTOMER: Chaliye theek hai, main aapko bhejta hoon.\n[03:06] AGENT: Theek hai, kitni der mein?\n[03:08] CUSTOMER: Abhi toh bike chala raha hoon, aadhe-paune ghante lagenge.\n[03:10] AGENT: Theek hai, main 12:00 baje aapko phir dobara phone karti hoon, okay?\n[03:15] CUSTOMER: Theek.\n[03:16] AGENT: Haan."}, {"call_id": "2026-08-28_UNMAPPED_TBE465_02", "date": "2026-08-28", "scored_at": "2026-09-01T07:18:45", "agent": "UNMAPPED_TBE465", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-532_TBE465-8003960604-20260828-125909.mp3.mp3.mpeg", "drive_file_id": "", "call_number": "", "phone_number": "8003960604", "language": "hi", "notes": "", "score": 3.0, "call_category": "", "client_profile_en": "Male customer with a Kotak-linked trading account (unique client code ~10JWG) who added ₹15,000 in funds and is seeing a minus ₹102 balance discrepancy that does not match the agent's terminal view. A family member (referred to as 'chacha'/uncle) was also present/involved on the call. No trading experience, objective, or holdings profiling was done.", "client_profile_hi": "एक पुरुष ग्राहक जिनका Kotak से जुड़ा ट्रेडिंग अकाउंट है (यूनीक क्लाइंट कोड लगभग 10JWG), जिन्होंने ₹15,000 का फंड जोड़ा था और उनके खाते में माइनस ₹102 की गड़बड़ी दिख रही है जो एजेंट के टर्मिनल पर मेल नहीं खा रही। कॉल के दौरान एक पारिवारिक सदस्य ('चाचा') भी मौजूद/शामिल थे। ग्राहक के ट्रेडिंग अनुभव, उद्देश्य या होल्डिंग्स की कोई प्रोफाइलिंग नहीं की गई।", "summary_en": "The agent failed to resolve a simple balance-discrepancy query through confused, repetitive troubleshooting, causing the customer's family to grow suspicious and the customer to disengage without resolution.", "summary_hi": "एजेंट एक साधारण बैलेंस गड़बड़ी की समस्या को भ्रमित और दोहराव भरी ट्रबलशूटिंग के जरिए हल नहीं कर पाई, जिससे ग्राहक के परिवार को शक हुआ और ग्राहक बिना समाधान के कॉल से हट गया।", "strengths_en": ["Agent apologized promptly for a missed earlier call, showing basic courtesy.", "Attempted step-by-step screen-navigation guidance to diagnose the issue."], "strengths_hi": ["एजेंट ने पहले छूटी हुई कॉल के लिए तुरंत माफी मांगी, जो बुनियादी शिष्टाचार दिखाता है।", "समस्या का निदान करने के लिए स्क्रीन-नेविगेशन में चरण-दर-चरण मार्गदर्शन देने की कोशिश की।"], "issues_en": ["Agent repeatedly asked the same/confusing questions ('yeh kisi aur account ka bhej diya', 'client code' twice) without resolving the core discrepancy.", "Asking about the caller's relationship ('Daddy hain, papa hain ya husband hain?') and pushing for a portfolio screenshot from an unrelated family member ('chacha') raised suspicion, with the family member openly questioning why he was even talking to the bank/agent.", "Call ended abruptly with customer saying he'd call back later and no concrete next step or resolution was secured."], "issues_hi": ["एजेंट ने बार-बार वही/भ्रमित करने वाले सवाल पूछे ('यह किसी और अकाउंट का भेज दिया', 'क्लाइंट कोड' दो बार) लेकिन मूल गड़बड़ी हल नहीं कर पाई।", "कॉलर के रिश्ते के बारे में पूछना ('डैडी हैं, पापा हैं या हसबैंड हैं?') और एक असंबंधित पारिवारिक सदस्य ('चाचा') से पोर्टफोलियो स्क्रीनशॉट मांगना संदेह पैदा करता है, जिससे परिवार का सदस्य खुले तौर पर पूछता है कि वे बैंक/एजेंट से बात ही क्यों कर रहे हैं।", "कॉल अचानक समाप्त हो गई जब ग्राहक ने कहा कि वह बाद में कॉल करेगा, और कोई ठोस अगला कदम या समाधान तय नहीं हुआ।"], "improvements_en": ["Diagnose account issues internally first before repeatedly asking the customer for screenshots/codes to reduce confusion.", "Avoid unnecessary personal questions about family relationships that erode trust and derail the call.", "Secure a clear resolution commitment or ca  स्वीकार करने से पहले कुछ हद तक दोहराव और दबाव भरा रहा।", "strengths_en": ["Clear identification as Kotak Securities Authorized Person and reference to the previous conversation.", "Eventually respected the customer's timeline and scheduled a concrete follow-up call for Monday-Tuesday.", "Confirmed the customer already has a demat account before ending the call."], "strengths_hi": ["कोटक सिक्योरिटीज़ की अधिकृत व्यक्ति के रूप में स्पष्ट पहचान और पिछली बातचीत का संदर्भ दिया।", "आखिर में ग्राहक के समय को स्वीकार करते हुए सोमवार-मंगलवार के लिए एक ठोस फॉलो-अप कॉल तय की।", "कॉल समाप्त करने से पहले पुष्टि की कि ग्राहक के पास पहले से डीमैट अकाउंट है।"], "issues_en": ["Agent repeatedly pushed for an immediate call arrangement ('Kab free ho jaoge?', 'Monday tak karwa doon?') even after the customer said twice he was out in the field and unavailable.", "Minimal profiling — no attempt to understand SIP amount, investment goal, or why the plan is tied to salary.", "Response to 'salary nahi aayi' was slightly dismissive ('jab aani rahegi tab aayegi') instead of empathetically addressing the concern."], "issues_hi": ["ग्राहक द्वारा दो बार यह बताने के बावजूद कि वह फील्ड में है और उपलब्ध नहीं है, एजेंट ने बार-बार तुरंत कॉल तय करने पर जोर दिया ('कब फ्री हो जाओगे?', 'सोमवार तक करवा दूं?')।", "बहुत कम प्रोफाइलिंग हुई — SIP राशि, निवेश लक्ष्य, या सैलरी से जुड़े प्लान के कारण को समझने का कोई प्रयास नहीं हुआ।", "'सैलरी नहीं आई' पर जवाब थोड़ा उपेक्षापूर्ण था ('जब आनी रहेगी तब आएगी') न कि सहानुभूतिपूर्वक चिंता को संबोधित करना।"], "improvements_en": ["Accept a clearly stated unavailability the first time it's said, rather than repeating the ask in different forms.", "Ask a couple of quick profiling questions (target SIP amount, investment goal) to personalize the pitch.", "Acknowledge the salary concern with empathy before pivoting to the account-opening benefit."], "improvements_hi": ["ग्राहक द्वारा पहली बार स्पष्ट रूप से बताई गई अनुपलब्धता को स्वीकार करें, बजाय इसे अलग-अलग तरीकों से दोहराने के।", "पिच को व्यक्तिगत बनाने के लिए कुछ त्वरित प्रोफाइलिंग सवाल पूछें (लक्षित SIP राशि, निवेश लक्ष्य)।", "अकाउंट खोलने के लाभ पर बढ़ने से पहले सैलरी संबंधी चिंता को सहानुभूति के साथ स्वीकार करें।"], "transcript": "[00:03] AGENT: Hello?\n[00:04] AGENT: Laxman ji baat kar rahe hain?\n[00:07] CUSTOMER: Ji.\n[00:08] AGENT: Laxman ji baat kar rahe hain kya?\n[00:10] CUSTOMER: Ji haan, ji.\n[00:13] AGENT: Ji Laxman ji, main Kotak se baat kar rahi hoon, Kotak Securities Authorized Person Sapna.\n[00:18] CUSTOMER: Ji.\n[00:20] AGENT: Sir, last time aapse meri demat services ke baare mein baat hui thi, yaad hai aapko?\n[00:26] CUSTOMER: Kis ke baare mein?\n[00:28] AGENT: Sir, demat services ke baare mein baat hua tha, trading ke purpose se baat karni thi. SIP, mutual funds mein jo investment kiya jata hai na, uske liye demat account hum log open karke dete hain.\n[00:40] CUSTOMER: Ji.\n[00:41] AGENT: Toh uske baare mein baat karni thi sir.\n[00:44] CUSTOMER: Ji.\n[00:47] AGENT: Toh abhi recently aapka jo hai, plan bana?\n[00:53] CUSTOMER: Plan bana hai ma'am, wahi toh salary ka toh abhi aaya nahi mera.\n[00:58] AGENT: Sir dekhiye, salary ka toh aisa hai ki jab aani rahegi tab aayegi woh. Par at least kam se kam account aap open kar lenge toh aapko saari cheezein matlab aap usmein woh hota jayega na aapka, start karte jayenge aap.\n[01:21] AGENT: Hello?\n[01:22] CUSTOMER: Ji, hello?\n[01:24] AGENT: Ji, aapka jo hai, aap kya karna chah rahe the? Unlisted buy karna hai sir aapko ya SIP karni thi?\n[01:32] CUSTOMER: Main toh SIP...\n[01:35] AGENT: SIP karni thi, theek hai. Toh SIP toh waise bhi monthly hoti hai ₹1000, ₹2000, ₹5000, aapke upar depend karta hai. Toh agar aap plan puri tarah se agar jaanna chahte hain toh main call arrange karwa doon kya aapko?\n[01:49] CUSTOMER: Call arrange... Haan, main toh ma'am thoda field mein hoon, bahar mein hoon. Thoda samay nahi de paunga abhi.\n[01:54] AGENT: Kab free ho jaoge aap?\n[01:57] CUSTOMER: Main ek aad ghante mein free ho jaunga ma'am.\n[02:00] AGENT: Theek hai. Toh main ye keh... Main ye keh rahi hoon Laxman ji, agar abhi plan ban raha hai aapka SIP ka, toh main aapko call arrange karwaun department se. Agar aapka abhi plan nahi ban raha hai toh main aapko abhi call arrange nahi karwaungi. Jab aapka plan hai, jaise Monday, Tuesday ya aane wali ek tareekh se agar banta hai, toh main tab se aapka jo hai call arrange karwa doon aapko? Aap batao kab karna hai?\n[02:27] CUSTOMER: Haan ji? Abhi abhi bhi theek nahi, main toh bahar mein hoon, aadha ek ghanta lagega mere ko wapas aane mein.\n[02:34] AGENT: Nahi nahi, aap bahar hain sir. Hota kya hai dekhiye, department se jo call aata hai na aapko, SIP department se, woh log kya karte hain jankari bhi de dete hain aur hath-o-hath aapka SIP punch bhi karwa dete hain. Toh main ye bol rahi hoon ki SIP agar apna punch karne ka ekdam complete plan ban gaya ho toh main aapko arrange karwaun call. Agar nahi bana ho toh phir jab aap kahein tab arrange karwa doon, aisa.\n[02:56] CUSTOMER: Ji, abhi nahi karwayen ma'am, abhi nahi.\n[02:59] AGENT: Theek hai, Monday tak karwa doon? Monday-Tuesday tak?\n[03:02] CUSTOMER: Ji ji, theek hai.\n[03:03] AGENT: Theek hai, Monday-Tuesday tak main aapko call arrange... Demat toh hai na sir aapke paas?\n[03:08] CUSTOMER: Ji ji.\n[03:09] AGENT: Theek hai sir, okay.\n[03:10] CUSTOMER: Theek hai."}, {"call_id": "2026-08-27_UNMAPPED_TBE465_02", "date": "2026-08-27", "scored_at": "2026-09-01T07:20:27", "agent": "UNMAPPED_TBE465", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-532_TBE465-9460603919-20260827-171653.mp3.mp3.mpeg", "drive_file_id": "", "call_number": "", "phone_number": "9460603919", "language": "hi", "notes": "", "score": 6.0, "call_category": "", "client_profile_en": "Male customer (Munni Singh Shekhawat) who registered his number on the Wealthsy website expressing interest in Mutual Fund/SIP investment; he stated he wants to start investing from 1st September when new plans are expected to launch, and prefers to be contacted after that date.", "client_profile_hi": "पुरुष ग्राहक (मुन्नी सिंह शेखावत) जिन्होंने Wealthsy वेबसाइट पर Mutual Fund/SIP निवेश में रुचि दिखाते हुए अपना नंबर दर्ज किया था; उन्होंने बताया कि वे 1 सितंबर से निवेश शुरू करना चाहते हैं जब नई योजनाएं लॉन्च होने की उम्मीद है, और उसके बाद ही संपर्क करने को प्राथमिकता दी।", "summary_en": "The agent politely acknowledged the enquiry and secured a callback for 1st September but failed to do any real profiling and repeated the same pitch despite the customer clearly stating his timeline.", "summary_hi": "एजेंट ने विनम्रता से पूछताछ को स्वीकार किया और 1 सितंबर के लिए कॉलबैक तय किया, लेकिन कोई वास्तविक प्रोफाइलिंग नहीं की और ग्राहक द्वारा अपनी समयसीमा स्पष्ट रूप से बताने के बाद भी वही बात दोहराई।", "strengths_en": ["Polite, calm tone throughout with no pressure tactics.", "Correctly identified the brand (Wealthsy) and the original enquiry (MF/SIP investment).", "Eventually agreed to align the callback with the customer's stated preference of 1st September."], "strengths_hi": ["पूरी कॉल में विनम्र, शांत लहजा और कोई दबाव नहीं डाला।", "ब्रांड (Wealthsy) और मूल पूछताछ (MF/SIP निवेश) को सही तरीके से पहचाना।", "अंत में ग्राहक की बताई प्राथमिकता के अनुसार 1 सितंबर को कॉलबैक तय करने पर सहमत हुए।"], "issues_en": ["Agent kept pushing for an appointment/call today despite the customer twice stating he'll only proceed after 1st September.", "No profiling done at all — no questions on investment amount, goal, or risk appetite.", "Customer's mild irritation ('Ab baat karne ka kya fayda?') shows the repetition wasn't well received."], "issues_hi": ["ग्राहक द्वारा दो बार यह कहने के बावजूद कि वे 1 सितंबर के बाद ही आगे बढ़ेंगे, एजेंट आज ही अपॉइंटमेंट/कॉल के लिए ज़ोर देती रही।", "कोई प्रोफाइलिंग नहीं की गई — निवेश राशि, लक्ष्य या जोखिम क्षमता पर कोई सवाल नहीं पूछा।", "ग्राहक की हल्की झुंझलाहट ('अब बात करने का क्या फायदा?') दर्शाती है कि दोहराव ठीक से स्वीकार नहीं हुआ।"], "improvements_en": ["Listen for and act on the customer's stated timeline immediately instead of repeating the pitch.", "Capture basic profiling details (investment amount, goal) even briefly before scheduling a callback.", "Confirm the next step clearly and close faster once the customer agrees, to avoid unnecessary back-and-forth."], "improvements_hi": ["ग्राहक की बताई समयसीमा को सुनकर तुरंत उस पर अमल करें, बार-बार वही बात न दोहराएं।", "कॉलबैक तय करने से पहले संक्षेप में भी बुनियादी प्रोफाइलिंग (निवेश राशि, लक्ष्य) कर लें।", "ग्राहक की सहमति मिलने पर अगला कदम स्पष्ट रूप से पुष्टि करें और अनावश्यक बातचीत से बचें।"], "transcript": "[00:05] AGENT: Hello?\n[00:06] CUSTOMER: Hello.\n[00:07] AGENT: Uh ji, Munni Singh Shekhawat ji baat kar rahe hain sir?\n[00:10] CUSTOMER: Haan, bol raha hoon.\n[00:12] AGENT: Ji, namaskar sir. Wealthsy se baat kar rahi hoon main.\n[00:16] CUSTOMER: Kahan se bol rahe ho?\n[00:17] AGENT: Ji, Wealthsy se baat kar rahi hoon. Aapne humari website pe number apna update kiya hua tha uh investment ke liye. Investment matlab aap Mutual Fund ya SIP mein koi investment karna chahte hain uske baare mein jaankari chahiye thi aapko?\n[00:31] CUSTOMER: Haan, September mein karenge abhi toh. Woh kya hai, kuch time baad ki hai usse 1 September se naye plan aa rahe hain.\n[00:38] AGENT: Haan, haan bilkul aa rahe hain sir, bilkul. But woh yeh hai ki woh jo bhi plan aa rahe hain aapko uske baare mein puri purna roop se jaankari ke liye aapko call arrange karwa doon kya main? Aap kahein toh department se...\n[00:50] CUSTOMER: Haan toh September mein karenge 1 tarikh se, 1 tarikh ke baad.\n[00:54] AGENT: Haan, woh aap bilkul September mein kariye ga. I agree with you jo aap keh rahe hain, par uske liye aapko behtar aapko jaankari mil jaaye, behtar aapko cheezein pata chal jaaye, behtar aapko yeh pata chal jaaye ki main kis goal ke liye hume karna hai aur kisme kitna hume kya return mil raha hai, hain na? Toh woh saari jo aapko information milti hai woh department se milti hai. Toh main aap mujhe ek apna samay de dijiye, maine just because aapko ek appointment call kiya hai ki aap mujhe ek samay de dijiye, us din hi us samay us tarikh ko us din ko aapko call aayega department se.\n[01:27] CUSTOMER: 1 tarikh ko agar working day hai toh dekh lo us din ko.\n[01:30] AGENT: Teekh hai. 1 tarikh ko working day hai, main teekh hai, 1 tarikh ko hi phone karoon main aapko? Karwa doon?\n[01:35] CUSTOMER: Ji, ji.\n[01:36] AGENT: Okay, aaj kal mein koi baat nahi ho payegi aapse?\n[01:39] CUSTOMER: Ab baat karne ka kya fayda? Main keh raha hoon na plan hi jab 1 tarikh se launch ho rahe hain.\n[01:43] AGENT: Chaliye teekh hai, aise kar lete hain. Hain na? Main aapko 1 tarikh ke baad aapko call back karwa deti hoon.\n[01:49] CUSTOMER: Teekh hai, teekh hai.\n[01:50] AGENT: Okay sir. Number save kar lijiye ga, Sapna Wealthsy likh lijiye ga, yaad rahega aapko.\n[01:55] CUSTOMER: Teekh hai, yaad rahega.\n[01:56] AGENT: Okay, thank you so much sir.\n[01:59] CUSTOMER: Okay."}, {"call_id": "2026-08-28_UNMAPPED_TBE465_03", "date": "2026-08-28", "scored_at": "2026-09-01T07:21:26", "agent": "UNMAPPED_TBE465", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-532_TBE465-9975100049-20260828-120419.mp3.mp3.mpeg", "drive_file_id": "", "call_number": "", "phone_number": "9975100049", "language": "hi", "notes": "", "score": 5.0, "call_category": "", "client_profile_en": "Customer named Ganesh; was earlier told by a 'sir' (referenced as Sharad ji) to activate his account today; on his own, without being told, he placed an options trade today for 6 lots and incurred a loss; he states he doesn't have much trading knowledge but understands 'from reading'; he was at home during the call.", "client_profile_hi": "ग्राहक का नाम गणेश है; उन्हें पहले किसी 'सर' (शरद जी के रूप में संदर्भित) ने आज खाता एक्टिवेट करने को कहा था; उन्होंने खुद से, बिना बताए, आज 6 लॉट का ऑप्शन ट्रेड लिया जिसमें नुकसान हुआ; उनका कहना है कि उन्हें ज्यादा ट्रेडिंग नहीं आती लेकिन 'पढ़कर' समझ आता है; कॉल के समय वे घर पर थे।", "summary_en": "The agent never identifies herself or the company and asks repetitive/confusing questions, though she does uncover a relevant issue (unauthorized independent trading causing a loss) and steers the client back to company-given trades.", "summary_hi": "एजेंट ने कभी अपना या कंपनी का नाम नहीं बताया और बार-बार दोहराए गए/भ्रमित करने वाले सवाल पूछे, हालांकि उसने एक प्रासंगिक मुद्दा (बिना अनुमति के स्वतंत्र ट्रेडिंग से नुकसान) उजागर किया और ग्राहक को कंपनी द्वारा दिए गए ट्रेड की ओर वापस मोड़ा।", "strengths_en": ["Agent identified that the customer traded independently and caused himself a loss, and redirected him to rely on company-provided trades instead.", "Calm, non-aggressive tone maintained throughout despite the customer's confusion.", "Asked for a screenshot proof and set a next step (resume Monday) to follow up."], "strengths_hi": ["एजेंट ने पहचाना कि ग्राहक ने खुद ट्रेड किया और नुकसान उठाया, और उसे कंपनी द्वारा दिए गए ट्रेड पर निर्भर रहने की सलाह दी।", "ग्राहक की उलझन के बावजूद पूरी कॉल में शांत, गैर-आक्रामक स्वर बनाए रखा।", "स्क्रीनशॉट प्रूफ मांगा और अगला कदम (सोमवार से काम शुरू) तय किया।"], "issues_en": ["No introduction at all — the agent never states her name or the company (TradingBells/IIFL/Kotak), which is a basic professionalism and trust failure.", "Repeated and confusing questions ('Kahan par hain aap', asked twice; guessing 'Paanch lot? Do lot?' before the customer answers) show weak listening flow.", "The purpose of the call is never clearly stated upfront, leaving the customer to piece together why he's being asked these things."], "issues_hi": ["कोई परिचय नहीं दिया गया — एजेंट ने कभी अपना नाम या कंपनी (ट्रेडिंगबेल्स/IIFL/कोटक) नहीं बताया, जो एक बुनियादी पेशेवर और विश्वास की कमी है।", "बार-बार और भ्रमित करने वाले सवाल ('आप कहां हैं' दो बार पूछा गया; ग्राहक के जवाब से पहले 'पांच लॉट? दो लॉट?' अनुमान लगाना) कमजोर सुनने की क्षमता दिखाते हैं।", "कॉल का उद्देश्य शुरुआत में स्पष्ट रूप से नहीं बताया गया, जिससे ग्राहक को खुद समझना पड़ा कि उससे ये सवाल क्यों पूछे जा रहे हैं।"], "improvements_en": ["Start every call with a clear, professional introduction stating name and company before asking any questions.", "Avoid guessing answers (e.g., lot size) before the customer responds; ask once and wait.", "Clearly state the call's purpose upfront (e.g., 'calling to confirm your account activation') to reduce customer confusion."], "improvements_hi": ["हर कॉल की शुरुआत नाम और कंपनी बताते हुए स्पष्ट, पेशेवर परिचय से करें, उसके बाद ही सवाल पूछें।", "ग्राहक के जवाब से पहले जवाब (जैसे लॉट साइज़) का अनुमान लगाने से बचें; एक बार पूछें और प्रतीक्षा करें।", "कॉल का उद्देश्य शुरुआत में ही स्पष्ट रूप से बताएं (जैसे 'आपका खाता एक्टिवेशन कन्फर्म करने के लिए कॉल कर रही हूं') ताकि ग्राहक की उलझन कम हो।"], "transcript": "[00:01] AGENT: Hello, Ganesh ji baat kar rahe hain?\n[00:03] CUSTOMER: Haan, Ganesh ji bol raha hoon.\n[00:05] AGENT: Haan sir, baat hua aapka sir se? Unhone aapko bataya tha na ki aaj activate karna hai account?\n[00:11] CUSTOMER: Haan, kiya, kiya tha.\n[00:13] AGENT: Achha, kar liya aapne?\n[00:17] AGENT: Matlab aap gaye hain kya wahan par sir ke paas? Ya kahan par hain aap abhi?\n[00:25] AGENT: Hello?\n[00:30] AGENT: Ganesh ji, aawaz aa rahi hai aapko?\n[00:33] CUSTOMER: Haan, aawaz aa rahi hai.\n[00:34] AGENT: Haan, main yeh keh rahi hoon kahan par hain aap abhi? Matlab kahin bahar...\n[00:37] CUSTOMER: Ghar par hi hain mere.\n[00:38] AGENT: Achha, ghar par hain. Sharad ji ke ghar par hain kya aap?\n[00:41] CUSTOMER: Nahi nahi, mere ko hai na dusre jagah bahar jaana hai, iske liye main thoda trade kiya tha subah, thoda... thoda ji.\n[00:47] AGENT: Achha, kiya tha aapne?\n[00:49] CUSTOMER: Haan, kiya tha thoda thoda.\n[00:51] AGENT: Achha, kya, kya liya tha aapne? Koi option mein liya tha kya?\n[00:55] CUSTOMER: Option mein liya tha, yeh maloom nahi pada lekin kuch thoda par hai, main screenshot nikaal ke...\n[01:01] AGENT: Aap main wahi, haan screenshot mujhe bhej sakte hain kya?\n[01:04] CUSTOMER: Haan, bhej sakta hoon.\n[01:06] AGENT: Main yeh bol rahi hoon aapko ki aapne khud ne liya ki Sharad ji ne aapko karwaya kaam?\n[01:10] CUSTOMER: Nahi, khud ne liya tha maine.\n[01:12] AGENT: Achha, aapko aata hai kya? Matlab main isliye confirm kar rahi hoon kyunki main, meri aur aapki itni baat nahi ho paayi hai na ki aapko kitna kaam aata hai, nahi aata hai, isliye main pooch rahi hoon aapko.\n[01:23] CUSTOMER: Nahi, itna nahi aata hai, par lekin padh kar jo aata hai na.\n[01:28] AGENT: Achha, nahi aapko jo hai trade hum log hi dete hain yahan se. Aapko basically koi pareshaan hone wali baat nahi hai ki aapko koi market research karna hai, wo hum de dete hain sab aapko trade. Toh aap sir mujhe haan, aap jo trade aapne liya hai na wo mujhe uska screenshot de dijiye.\n[01:44] CUSTOMER: Haan, bhejta hoon main, kal...\n[01:47] AGENT: Bhej dijiye, koi baat nahi, phir uske baad hum Monday se phir kaam shuru karenge. Par aaj jo trade kiya hai kitne lot pe kiya tha kaam?\n[01:58] AGENT: Paanch lot? Do lot?\n[02:05] CUSTOMER: Cheh, cheh lot hue the, thoda bahut ho gaya loss...\n[02:10] AGENT: Theek hai. Screenshot de dijiye ek baar mujhe, main check kar...\n[02:14] CUSTOMER: Okay, bhejta hoon.\n[02:15] AGENT: Okay, okay."}, {"call_id": "2026-08-28_UNMAPPED_TBE667_02", "date": "2026-08-28", "scored_at": "2026-09-01T07:22:36", "agent": "UNMAPPED_TBE667", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-532_TBE667-7358601691-20260828-094644.mp3.mp3.mpeg", "drive_file_id": "", "call_number": "", "phone_number": "7358601691", "language": "hi", "notes": "", "score": 6.0, "call_category": "", "client_profile_en": "Male customer, age 22, currently employed in a job (private sector implied). No prior stock market trading experience, though he mentions having 'applied' for share market/demat account once before (details unclear). Customer expressed general interest in extra earning options outside his job but has not pursued any specific skill or investment yet.", "client_profile_hi": "पुरुष ग्राहक, उम्र 22 वर्ष, फिलहाल नौकरी (संभवतः प्राइवेट सेक्टर) में कार्यरत। स्टॉक मार्केट में कोई पूर्व ट्रेडिंग अनुभव नहीं है, हालांकि उसने बताया कि उसने पहले शेयर मार्केट/डीमैट खाते के लिए 'अप्लाई' किया था (विवरण स्पष्ट नहीं)। ग्राहक ने नौकरी के अलावा अतिरिक्त कमाई में सामान्य रुचि जताई लेकिन अभी तक कोई विशेष स्किल या निवेश शुरू नहीं किया।", "summary_en": "The agent delivered a generic, motivational pitch and gathered only surface-level profiling, resulting in a vague close after rushing past the customer's request to pause the call.", "summary_hi": "एजेंट ने एक सामान्य, प्रेरणादायक पिच दी और केवल सतही प्रोफाइलिंग की, जिसके कारण ग्राहक के कॉल रोकने के अनुरोध को नजरअंदाज करते हुए एक अस्पष्ट क्लोजिंग हुई।", "strengths_en": ["Agent opens professionally, references the earlier incomplete call and correctly identifies himself as calling on behalf of Kotak Securities.", "Maintains a calm, non-aggressive tone throughout despite a confused customer."], "strengths_hi": ["एजेंट पेशेवर तरीके से शुरुआत करता है, पहले की अधूरी कॉल का ज़िक्र करता है और खुद को सही तरीके से Kotak Securities की ओर से बता कर पेश करता है।", "ग्राहक के भ्रमित जवाबों के बावजूद एजेंट पूरी कॉल में शांत, गैर-आक्रामक टोन बनाए रखता है।"], "issues_en": ["Profiling is shallow and confused — agent repeats the age question and never clarifies what the customer meant by having previously 'applied' for share market/demat, missing a real buying signal.", "The pitch is a generic motivational script (₹50/day savings example, 'easy money' framing) rather than tailored to this specific customer's stated situation.", "When the customer asked to pause and call back in 5 minutes, the agent ignored this and rushed to close the call instead ('hamari call almost khatam ho gayi hai')."], "issues_hi": ["प्रोफाइलिंग सतही और उलझी हुई है — एजेंट उम्र का सवाल दोहराता है और यह कभी स्पष्ट नहीं करता कि ग्राहक ने पहले शेयर मार्केट/डीमैट के लिए 'अप्लाई' करने से क्या मतलब बताया था, जिससे एक वास्तविक खरीद संकेत छूट जाता है।", "पिच एक सामान्य प्रेरक स्क्रिप्ट है (₹50/दिन बचत का उदाहरण, 'आसान पैसा' का फ्रेमिंग) न कि इस विशेष ग्राहक की स्थिति के अनुसार बनाई गई।", "जब ग्राहक ने 5 मिनट रुकने और वापस कॉल करने को कहा, एजेंट ने इसे नज़रअंदाज़ करते हुए कॉल जल्दी बंद कर दी ('हमारी कॉल लगभग खत्म हो गई है')।"], "improvements_en": ["Clarify what 'applied for share market' meant before moving to a generic pitch — it could be a strong entry point for personalization.", "Avoid phrases like 'aasani se paisa banaya ja sakta hai' which edge toward overpromising returns — keep language balanced.", "Honor the customer's request to pause/call back rather than rushing the close; this preserves trust and improves follow-through likelihood."], "improvements_hi": ["सामान्य पिच पर जाने से पहले यह स्पष्ट करें कि 'शेयर मार्केट के लिए अप्लाई किया था' का क्या मतलब था — यह पर्सनलाइजेशन के लिए एक मज़बूत मौका हो सकता है।", "'आसानी से पैसा बनाया जा सकता है' जैसे वाक्यों से बचें जो रिटर्न को अधिक आशाजनक बनाकर पेश करते हैं — भाषा संतुलित रखें।", "ग्राहक के रुकने/वापस कॉल करने के अनुरोध का सम्मान करें, जल्दबाज़ी में कॉल बंद न करें; इससे भरोसा बना रहता है और आगे बढ़ने की संभावना बढ़ती है।"], "transcript": "[00:00] CUSTOMER: Hello?\n[00:02] AGENT: Hello, good morning.\n[00:03] CUSTOMER: Haan, good morning.\n[00:04] AGENT: Rahul baat kar raha hoon Kotak Securities se be half of authorized person. Hamari baat hui thi sir pehle lekin aap shayad job mein the tab thik se baat nahi ho payi hamari puri, abhi baat ho payegi?\n[00:13] CUSTOMER: Haan, abhi ho payega.\n[00:15] AGENT: Thik hai.\n[00:16] AGENT: Bas aapke 2 minute 2 minute sun lijiyega, ya free 2 minute mein main puri ki puri aap hi ke fayde ki baat karunga, usse thik se samajh lijiyega aur ek request hai jahan par bhi aapko doubt hai na mujhse puch lijiyega, thik hai?\n[00:26] CUSTOMER: Okay.\n[00:27] AGENT: Uh, sir sabse pehle main ye jaan-na chahunga, aap ek job karte hain lekin kya aapko stock market ke baare mein jaankari, isse pehle aapne working kiya hai stock market mein?\n[00:36] CUSTOMER: Nahi, sir.\n[00:40] AGENT: Pehle kaam kiya hai stock market mein trading?\n[00:45] AGENT: Hello?\n[00:47] CUSTOMER: Haan, hello. Nahi, wo stock...\n[00:50] AGENT: Nahi kiya aapne, right?\n[00:52] CUSTOMER: Kiya tha, share market mein apply kiya tha.\n[00:56] AGENT: Accha accha, aapne kiya tha. Kya aapne demat account wagera open kiya tha? Stock market ke baare mein thodi bahut jaankari hogi aapki?\n[01:01] CUSTOMER: Haan.\n[01:03] AGENT: Thik hai. Okay, aapki age kya hogi?\n[01:09] CUSTOMER: Kiya tha 1 year.\n[01:10] AGENT: Haan, aapki umar kitni hogi?\n[01:13] CUSTOMER: Kiske?\n[01:14] AGENT: Age age, aapki age kya hai?\n[01:17] CUSTOMER: Age 22.\n[01:18] AGENT: Thik hai. Dekhiye, kya hota hai na, stock market mein sabse ziada main agar sabse ziada kahin paisa hai toh woh hai stock market. Sirf India se nahi, puri duniya se paisa aata hai stock market mein, right? Abhi aap karte hain job, aapke saath problem ye hoti hai ki aapke paas time hota nahi hai aur agar aap private sector mein kaam karte hain toh bada mushkil ho jaata hai, timing ka bhi problem hota hai aur kaam ka bhi tension hota hai. Lekin dikkat ye hoti hai ki aisa hi agar chalta raha toh 3 saal, 5 saal ke baad bhi aap naukri karte rahenge, aap kuch aur nahi kar payenge. Thik hai?\n[01:47] CUSTOMER: Um.\n[01:47] AGENT: Ab kabhi kabhi aap sochte hain ki naukri karte-karte main aisa kya karoon jisse meri extra earning ho jaye ya 3 ya 5 saal ke baad mujhe kabhi naukri na karne ki zaroorat pade, aisa kabhi sochte hain aap?\n[01:57] CUSTOMER: Sochta toh hoon.\n[01:59] AGENT: Toh uske liye kuch kar rahe hain, kuch extra aisi koi cheezein seekh rahe hain aap, koi skill wagera seekh rahe hain?\n[02:07] CUSTOMER: Haan.\n[02:09] AGENT: Kis tarah ki skill seekh rahe hain aap?\n[02:11] CUSTOMER: Aur toh try nahi kiya.\n[02:15] AGENT: Thik hai, thik hai, main aapko bata doon stock market mein agar sahi jaankari aur experience ho, toh aasani se paisa banaya ja sakta hai, thik hai? Aur jisko iske baare mein sahi jaankari aur experience hai woh market se paise pe paise banate ja rahe hain aur ameer hote ja rahe hain aur jisko jaankari nahi hai ya aadhi adhuri jiske paas free knowledge hai, woh ya toh stock market mein aate nahi hai aur aa gaye toh thoda bahut loss karke nikal jaate hain, thik hai? Lekin agar wahi sir sahi jaankari aur experience hum aapko dein toh aapko nahi lagta aap stock market mein easily paisa kama sakte hain?\n[02:48] CUSTOMER: Sahi bola.\n[02:50] AGENT: Ji, aapko kya karna hota hai sahi aapko jaise aap job kar rahe hain use karte rahiye, lekin uske saath-saath stock market mein aaiye, isme dhire-dhire seekhte jaiye, chhoti-chhoti amount lagake usme experience lijiye. Woh sab hum aapko batayenge, kis company ke shares ko kam keemat mein kharidna hai, kab mehenga mein bechna hai, right? Taki aapka ziada se ziada profit banaya jaye. Jaise udaharan ke taur pe abhi aap ek job karte hain, agar main aapko bolu ki ₹50 per day per day bachaiye, toh ₹50 per day agar aap bachate hain toh 30 din mein hote hain ₹1500 aur 1 saal mein kitne ho jaate hain ₹18,000. Toh ye farak hota hai compounding ka. Aapne bachaye kitne the ₹50 lekin 1 saal ke baad aapko bhi nahi pata tha uski amount ₹18,000 ho jayegi. Same stock market mein bhi aise hi kaam hota hai, thoda thoda profit karke 3 se 5 saal mein itni amount ho jaati hai badi wali ki aapko ho sakta hai ki 3 ya 5 saal ke baad aapko kabhi naukri karne ki zaroorat na pade, right?\n[03:42] CUSTOMER: Hmm.\n[03:43] AGENT: Ab sawal ye aata hai ki ye information jo hum aapko jo hum aapko guide denge, training denge, learning denge, kya iske paise lagte hain? Toh jawab hai nahi, iske hum aapse koi paise nahi lete. Even iske liye jo account bhi iske liye ek account ki zaroorat padti hai jise kehte hain Demat account. Jab aap Demat account open karte hain tab aapki stock market mein investment trading start ki jaati hai aur account open karte hain aap Kotak se aaj toh aapko woh bhi free hai, uske ट लिंक को अभी तक न खोलने का कारण बताया।", "summary_en": "The agent was polite and identified the real blocker (no smartphone) but delivered an overloaded generic pitch and closed the call without any concrete next step.", "summary_hi": "एजेंट विनम्र था और असली बाधा (स्मार्टफोन न होना) की पहचान की, लेकिन एक सामान्य और अत्यधिक जानकारी वाला पिच दिया और कॉल को किसी ठोस अगले कदम के बिना समाप्त किया।", "strengths_en": ["Agent remained calm and patient throughout, even when repeating information.", "Correctly identified the client's actual barrier (no smartphone for WhatsApp/app access) rather than assuming disinterest.", "Did basic profiling by asking about occupation and prior trading experience."], "strengths_hi": ["एजेंट पूरी कॉल में शांत और धैर्यवान रहा, भले ही जानकारी दोहरानी पड़ी।", "ग्राहक की असली बाधा (व्हाट्सएप/ऐप के लिए स्मार्टफोन न होना) की सही पहचान की, बिना यह मान लिए कि ग्राहक की दिलचस्पी नहीं है।", "ग्राहक का पेशा और पिछला ट्रेडिंग अनुभव पूछकर बुनियादी प्रोफाइलिंग की।"], "issues_en": ["Pitch was generic and overloaded — explained stock market basics, commodities, F&O and mutual funds to a client whose only stated problem was 'I don't know how to open the account'.", "No solution was offered for the smartphone barrier (e.g., assisted/in-branch account opening) — the call simply ended with 'call me once you get a smartphone', which is a vague, open-ended close.", "Statement 'stock market mein paisa kamana bahut aasan hai' oversimplifies risk and could mislead a first-time investor."], "issues_hi": ["पिच सामान्य और अत्यधिक जानकारी से भरा था — स्टॉक मार्केट की बुनियादी बातें, कमोडिटी, F&O और म्यूचुअल फंड समझाए गए, जबकि ग्राहक ने सिर्फ यह कहा था कि 'मुझे अकाउंट खोलना नहीं आता'।", "स्मार्टफोन की बाधा के लिए कोई हल नहीं दिया गया (जैसे सहायता प्राप्त/ब्रांच में अकाउंट खोलना) — कॉल केवल 'स्मार्टफोन आ जाए तो कॉल करना' पर खत्म हुई, जो एक अस्पष्ट, बिना ठोस योजना वाला समापन है।", "'स्टॉक मार्केट में पैसा कमाना बहुत आसान है' जैसा वाक्य जोखिम को अत्यधिक सरल बनाता है और नए 04] AGENT: Aapko saari cheezein clear hain ya main phir se ek baar bata doon sir?\n[01:08] CUSTOMER: Batao sir.\n[01:10] AGENT: Theek hai main ek baar phir se dhyan se dhyan se suniyega. Pehle sabse pehle main yeh jaanna chahta hoon aapne pehle iske pehle kabhi stock market mein trading ya investment kiya tha?\n[01:21] AGENT: Hello?\n[01:25] CUSTOMER: Haan sir bolo.\n[01:27] AGENT: Haan sir, main aapse yeh pooch raha hoon kya iske pehle aapne kabhi stock market mein trading ya investment ki thi aapne iske pehle kabhi? Experience hai aapko?\n[01:36] CUSTOMER: Nahi sir.\n[01:37] AGENT: Nahi hai. Theek hai main ek baar phir se bata deta hoon aapko, dhyan se suniyega. Yeh aap hi ke fayde ki hai. Stock market mein paisa kamana bahut aasan hai lekin sahi jankari aur experience chahiye. Aur stock market mein hum paise kaise kamate hain? Kisi company ke shares ko kam keemat mein khareed ke mehangay mein bechna hota hai. Jitna hum mehanga bechenge utna hume profit hota hai. Yeh bas waise hi hai jaise hum koi business karte hain. Toh hum kya karte hain kisi se kam keemat mein samaan khareedte hain aur mehangay mein bech dete hain. Right? Toh stock market bhi usi tarah se hai. Yahan pe bahut si companiyan listed hain. Aapko kis company ke shares ko kab khareedna hai, kab bechna hai yeh saari hum aapko batate hain, uske koi paise nahi lete hain. Iske alaawa commodity ho gaya ya phir aapko futures and option mein karna hai ya phir aapko trading jo hai mutual fund aapne suna hoga aaj kal iske kaafi yeh chal rahe hain, ads wogera chal raha hai. Agar aapko mutual fund mein karna hai toh woh bhi hum aapko help karte hain, right? Aap in sab mein investment start karne ke liye hume ek account ki zaroorat padti hai jise kehte hain Demat account. Theek hai?\n[02:37] CUSTOMER: Theek hai sir.\n[02:38] AGENT: Ji. Toh woh Demat account ko open karna bhi agar aap Kotak se karte hain toh uske liye koi paise nahi lete hain. Even agar aapko jo recommendation denge, jo aapki help karenge, sahaya
