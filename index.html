t account banayenge kaise? Demat account banayenge tabhi toh aap stock market mein trading investment jab bhi aapko start karni hogi tab kar payenge na aap.\n[04:39] CUSTOMER: Aap kahan se bol rahe hain?\n[04:41] AGENT: Accha main kahan se bol raha hoon? Main bol raha hoon Vijay Nagar Indore Madhya Pradesh se. Theek hai? Humara office hai yahan pe Kotak Securities ke taraf se baat kar rahe hain hum. Aap kabhi bhi aake humse mil sakte hain, yahan pe office mein visit kar sakte hain. Abhi aap kaun si city mein job kar rahe hain?\n[04:55] CUSTOMER: Hum Kherliwala se bol rahe hain.\n[04:59] AGENT: Accha accha accha. Theek hai, Indore Madhya Pradesh yeh hub hai, financial hub hai. Theek hai? Toh aap kabhi bhi aake mil sakte hain aur jo bhi aapko services milegi yeh on call milegi ya phir aapko WhatsApp pe bhi agar aap comfortable hain toh WhatsApp pe bhi aapko bata diya jaayega aur aap hume is number pe call bhi kar sakte hain, WhatsApp pe bhi baat kar sakte hain sabah 9:00 se leke shaam ke 6:00 baje tak. Theek hai?\n[05:20] CUSTOMER: Ji.\n[05:21] AGENT: Theek hai, toh abhi aap mobile ko bana lijiye. Jab ban jaayega aap hume contact kariyega ya hum aapko contact kar lenge, theek hai?\n[05:27] CUSTOMER: Theek hai sir.\n[05:28] AGENT: Aur koi jankari chahte hain stock market se related?\n[05:32] CUSTOMER: Nahi sir.\n[05:33] AGENT: Okay. Thank you so much. Have a good day. Happy Raksha Bandhan."}, {"call_id": "2026-08-28_UNMAPPED_TBE667_04", "date": "2026-08-28", "scored_at": "2026-09-01T07:24:44", "agent": "UNMAPPED_TBE667", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-532_TBE667-9831656731-20260828-132253.mp3.mp3.mpeg", "drive_file_id": "", "call_number": "", "phone_number": "9831656731", "language": "hi", "notes": "", "score": 6.0, "call_category": "", "client_profile_en": "Male customer who previously had a Kotak Demat account and traded in F&O; investment amounts ranged from ₹25,000-50,000 up to ₹1 lakh. He stopped trading after being charged unexpected brokerage/charges he was not informed about (says he wasn't told upfront, only via an email he didn't check), and support could not waive/reduce the charges when he asked. Currently not investing due to lack of funds, but has stated he would consider restarting if the charges issue is resolved.", "client_profile_hi": "पुरुष ग्राहक, पहले Kotak में डीमैट अकाउंट था और F&O में ट्रेडिंग करता था; निवेश राशि ₹25,000-50,000 से लेकर ₹1 लाख तक रही। अचानक चार्जेस कटने की वजह से ट्रेडिंग बंद कर दी, जिनकी जानकारी पहले नहीं दी गई थी (केवल एक ईमेल में बताया गया था जो उसने नहीं देखा), और सपोर्ट टीम चार्जेस कम/माफ नहीं कर पाई। फिलहाल पैसों की कमी के कारण निवेश नहीं कर रहा, लेकिन कहा है कि चार्जेस की समस्या हल होने पर फिर से शुरू करने पर विचार करेगा।", "summary_en": "Agent listened well and profiled the customer's past trading and reason for stopping, but the call ended abruptly without a pitch or any confirmed next step.", "summary_hi": "एजेंट ने ग्राहक की बात ध्यान से सुनी और उसके पिछले ट्रेडिंग अनुभव व बंद करने की वजह को समझा, लेकिन कॉल बिना कोई पिच दिए या अगला कदम तय किए अचानक समाप्त हो गई।", "strengths_en": ["Agent patiently let the customer narrate the full charges complaint without interrupting.", "Good follow-up profiling questions on investment amount and trading segment (F&O).", "Calm, professional tone throughout with no pressure tactics."], "strengths_hi": ["एजेंट ने ग्राहक को चार्जेस की पूरी शिकायत बिना बीच में रोके बताने दिया।", "निवेश राशि और ट्रेडिंग सेगमेंट (F&O) के बारे में अच्छे फॉलो-अप प्रोफाइलिंग सवाल पूछे।", "पूरी कॉल में शांत और पेशेवर लहजा बनाए रखा, कोई दबाव नहीं डाला।"], "issues_en": ["The core charges complaint (his main reason for stopping) was never actually addressed or resolved before the call cut off.", "No pitch or relevant solution was delivered — agent was mid-explanation ('main aapko batata hoon kya hua hai actually') when interrupted.", "No callback time or next step was secured; the call ends on 'hold kijiye' with no closure."], "issues_hi": ["ग्राहक की मुख्य शिकायत (चार्जेस के कारण ट्रेडिंग बंद करना) कॉल कटने से पहले हल नहीं की गई।", "कोई पिच या समाधान नहीं दिया गया — एजेंट 'मैं आपको बताता हूं क्या हुआ है' कहते हुए बीच में ही रुक गया।", "कोई कॉलबैक समय या अगला कदम तय नहीं हुआ; कॉल 'होल्ड कीजिए' पर बिना किसी समापन के खत्म हो जाती है।"], "improvements_en": ["Address the charges complaint directly and clearly explain how it would be different this time before pitching anything else.", "When the customer asks to hold, agree but immediately lock a specific callback time to avoid losing the lead.", "Prepare a clear, concise solution statement (e.g. revised charge structure) rather than starting a long explanation that got cut off."], "improvements_hi": ["किसी भी नई पिच से पहले चार्जेस की शिकायत को सीधे संबोधित करें और स्पष्ट बताएं कि इस बार क्या अलग होगा।", "जब ग्राहक होल्ड के लिए कहे, तो सहमत हों लेकिन तुरंत एक निश्चित कॉलबैक समय तय करें ताकि लीड न खो जाए।", "लंबी अधूरी व्याख्या शुरू करने के बजाय एक स्पष्ट और संक्षिप्त समाधान (जैसे संशोधित चार्ज संरचना) पहले से तैयार रखें।"], "transcript": "[00:02] AGENT: Hello?\n[00:03] CUSTOMER: Hello?\n[00:04] AGENT: Good afternoon, main Rahul baat kar raha hoon Kotak Securities se, behalf of authorized person.\n[00:09] CUSTOMER: Boliyen sir.\n[00:10] AGENT: Ji, maine aapko call kiya hai stock market investment ke regarding. Currently aap kuch stock market me investment kar rahe hai?\n[00:18] CUSTOMER: Main abhi nahi kar raha, abhi balance nahi hai mere paas.\n[00:21] AGENT: Achha achha achha. Aapne kabhi kiya hai sir investment iske pehle?\n[00:25] CUSTOMER: Haan, kiya hai. Kotak mein karta tha DeMat account.\n[00:28] AGENT: Kotak mein aap kar rahe hai? Abhi active hai ya nahi hai?\n[00:31] CUSTOMER: Abhi main deactive... main nahi kar raha abhi isme.\n[00:35] AGENT: Achha abhi aap nahi kar rahe. Koi baat nahi. Main bas jaanna chahta tha ki aap kyun nahi kar rahe, koi reason hai ya fir chhod diya hai?\n[00:41] CUSTOMER: Haan, reason usme mera charges mujhe pata nahi tha. Pehle zero balance tha, main naya naya tha. Toh free mein tha toh main trading kaafi karta tha, galat sahi jo bhi hota tha, 10 hazar 5 hazar. Aur ek din maine itna trading kiya ki mera profit ke saath saath mera 1000 profit ke jagah par minus aapka... matlab 3000 profit hua, 1000 profit hua toh minus minus 2000 uska yeh dikha raha tha. Toh fir baad mein maine pata kiya toh bola gaya ki aapka charges start ho gaya. Toh maine kaha ki main charges toh mujhe pata nahi hai, charges to batana chahiye tha aapko. Unhone kaha ki bhai mail kar diya gaya tha. Aapne jaisa abhi phone kiya na, toh is tarah ka kabhi phone-won bhi nahi aaya mera paas. Aur main message aur phone mail utna check, mail nahi check karta. Bol rahe hai mail mein aaya aapka. Abhi sabka rules, regulations... hum bole yaar hum isi se use karta tha. Ab apne, agar main phir karna chahunga, maine kaha ki thik hai aap mujhe isko yeh kijiyen, isko aap zero karwaiye ya kuch kam karwaiye toh main isko aage badhunga. Toh fir bole ki main koshish karta hoon, lekin unhone bola ki nahi ho payega, toh maine chhod diya us tab se. Ab jaisa hai waisa chal raha hai.\n[01:46] AGENT: Main aapki baat samajh gaya hoon. Kya aapki investment jaan sakta hoon main, kitni investment kiya tha aapne?\n[01:51] CUSTOMER: Main 25, 50 aisi chalta tha, 1 lakh tak bhi kiya tha maine.\n[01:54] AGENT: Thik hai, main maan ke-\n[01:55] CUSTOMER: Aur maine kaha bhi tha ki agar aisa kuch hua toh main phir se start kar sakta hoon, main sochunga zaroor.\n[02:00] AGENT: Thik hai, main aapki baat samajh gaya hoon. Main aapko batata hoon ki kya hua hai actually. Mujhe kuch cheezein samajhni hongi, jaise aapne amount daala tha 25 to 50, aapne kis segment mein kiya tha trading?\n[02:10] CUSTOMER: F&O mein kiya tha.\n[02:11] AGENT: F&O mein, thik hai. Thik hai, main aapko ek baar phir se bata deta hoon. Kyunki jaise haan-\n[02:18] CUSTOMER: Sir, aap do minute rukiye na, ek call aa raha hai. Hold kijiyen na."}, {"call_id": "2026-08-27_UNMAPPED_TBE668_01", "date": "2026-08-27", "scored_at": "2026-09-01T07:25:45", "agent": "UNMAPPED_TBE668", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-532_TBE668-6204453934-20260827-120042.mp3.mp3.mpeg", "drive_file_id": "", "call_number": "", "phone_number": "6204453934", "language": "hi", "notes": "", "score": 3.0, "call_category": "", "client_profile_en": "Male customer named Shivam, working an 8-hour job (approx. 2 PM–10 PM shift) with family responsibilities including young children. He has a dormant trading account, made a few trades in the past but stopped due to lack of time. He had a prior negative impression of stock market trading based on a friend's bad experience and prefers face-to-face/offline dealings over remote guidance. He has some interest in chemical sector stocks (mentioned a company 'Solvay').", "client_profile_hi": "शिवम नाम का पुरुष ग्राहक, जो 8 घंटे की नौकरी (लगभग दोपहर 2 बजे से रात 10 बजे तक की शिफ्ट) करता है और जिसके परिवार में छोटे बच्चों की जिम्मेदारी है। उसका ट्रेडिंग अकाउंट निष्क्रिय है, पहले कुछ ट्रेड किए थे लेकिन समय की कमी के कारण बंद कर दिया। एक दोस्त के बुरे अनुभव के कारण शेयर मार्केट को लेकर पहले से नकारात्मक धारणा है और वह दूर से गाइडेंस लेने की बजाय आमने-सामने डील करना पसंद करता है। उसे केमिकल सेक्टर के शेयरों (Solvay कंपनी का जिक्र किया) में कुछ रुचि है।", "summary_en": "The agent handled tone and listening reasonably well but made an unrealistic and misleading guaranteed-return claim ('8-10% daily profit'), which is a serious compliance violation capping the score.", "summary_hi": "एजेंट ने टोन और सुनने में ठीक-ठाक व्यवहार किया, लेकिन एक अवास्तविक और भ्रामक गारंटीड रिटर्न का दावा ('रोज़ाना 8-10% प्रॉफिट') किया, जो एक गंभीर कंप्लायंस उल्लंघन है और स्कोर को सीमित करता है।", "strengths_en": ["Agent remained calm and patient throughout despite the customer's skepticism and distractions.", "Addressed the customer's concern about needing 'face-to-face' dealing by explaining the online nature of demat trading.", "Asked about the customer's work timing to tailor the pitch around time constraints."], "strengths_hi": ["ग्राहक के संदेह और ध्यान भटकाव के बावजूद एजेंट पूरे समय शांत और धैर्यवान रही।", "'आमने-सामने' डील की ग्राहक की चिंता को डीमैट ट्रेडिंग के ऑनलाइन स्वरूप को समझाकर संबोधित किया।", "पिच को समय की कमी के अनुसार ढालने के लिए ग्राहक की ड्यूटी टाइमिंग पूछी।"], "issues_en": ["Agent made a guaranteed profit claim: 'daily basis pe aapke investment ka 8 se 10 percent tak ka profit aapko market se milega' – a serious compliance violation.", "No clear next step was secured; call ended with a vague 'chaliye theek hai karte hain' and no concrete follow-up plan.", "Profiling was shallow – agent didn't explore past trading segment, capital available, or specific reason behind distrust in enough depth."], "issues_hi": ["एजेंट ने गारंटीड प्रॉफिट का दावा किया: 'daily basis pe aapke investment ka 8 se 10 percent tak ka profit aapko market se milega' – यह एक गंभीर कंप्लायंस उल्लंघन है।", "कोई स्पष्ट अगला कदम तय नहीं हुआ; कॉल एक अस्पष्ट 'चलिए ठीक है करते हैं' के साथ बिना किसी ठोस फॉलो-अप योजना के समाप्त हुई।", "प्रोफाइलिंग सतही रही – एजेंट ने पिछले ट्रेडिंग सेगमेंट, उपलब्ध पूंजी या अविश्वास के पीछे के कारण को पर्याप्त गहराई से नहीं जाना।"], "improvements_en": ["Never quote a fixed daily/percentage return figure — replace with responsible, non-guaranteed language about market-linked outcomes.", "Close the call with a concrete next step, e.g., schedule a specific callback time or confirm a small fund top-up commitment.", "Dig deeper into why the customer distrusts remote advisory to tailor reassurance (e.g., transparency measures, trial period) rather than a generic online-trading explanation."], "improvements_hi": ["कभी भी निश्चित दैनिक/प्रतिशत रिटर्न का आंकड़ा न दें — इसके बजाय मार्केट-लिंक्ड परिणामों के बारे में जिम्मेदार, गैर-गारंटीड भाषा का प्रयोग करें।", "कॉल को एक ठोस अगले कदम के साथ बंद करें, जैसे किसी निश्चित समय पर कॉलबैक शेड्यूल करना या छोटी फंड टॉप-अप प्रतिबद्धता की पुष्टि करना।", "ग्राहक के रिमोट एडवाइजरी पर अविश्वास के पीछे की वजह को गहराई से समझें ताकि सामान्य ऑनलाइन-ट्रेडिंग स्पष्टीकरण की बजाय पारदर्शिता उपाय या ट्रायल पीरियड जैसे आश्वासन दिए जा सकें।"], "transcript": "[00:02] AGENT: Hello?\n[00:03] CUSTOMER: Hello?\n[00:04] AGENT: Good afternoon, sir.\n[00:06] CUSTOMER: Good afternoon. Batayiye kya baat hai?\n[00:08] AGENT: Mayuri baat kar rahi hoon. Mr. Shivam ji se baat ho rahi hai?\n[00:12] CUSTOMER: Jee, Shivam ji se baat ho rahi hai main.\n[00:14] AGENT: Okay. Kotak Securities Private Limited se baat kar rahi hoon, authorized person ke behalf pe.\n[00:20] CUSTOMER: Jee.\n[00:21] AGENT: Share market regarding call kiya hai aapko. Kaisa work chal raha hai abhi market mein?\n[00:28] CUSTOMER: Humne toh chhod diya hai. Hum nahi kar rahe hain share market se kuch.\n[00:33] AGENT: Okay okay. Toh kitna time ho gaya sir band kiye hue?\n[00:37] CUSTOMER: Main kiya hi nahi. Thoda sa main kiya tha fir uske baad block kar diya. Mere paas time nahi milta hai main miss ka wajah se.\n[00:43] AGENT: Okay okay. Toh sir agar market ke liye aapko knowledge diya jaaye, daily basis pe aapko zyada time bhi nahi dena rahega, 5 se 10 minute ka time lagega. Toh agar aap interested hain toh sir main aapko yahan se daily basis pe support provide kar sakti hoon. Aapko koi service charge bhi pay nahi karna rahega.\n[01:01] AGENT: Hello?\n[01:02] CUSTOMER: Haan jee.\n[01:03] AGENT: Haan, batayiye sir.\n[01:04] CUSTOMER: Isme choice utna lagta nahi hai. Mujhe kuch pata bhi nahi hai, naya naya aakar kya hota hai.\n[01:11] AGENT: Nahi toh sir dekhiye, ek cheez hai ki agar aap dekhiye market ko lekar interested hain, market jaanna chahte hain, aap kuch seekhna chahte hain toh aapko yahan se saari cheezein mil sakti hain. Aapko market mein kaise kaam hota hai jaise Nifty, Bank Nifty, Sensex aapne suna hi hoga na?\n[01:27] CUSTOMER: Jee.\n[01:28] AGENT: Haan, toh inmein kaise kaam hota hai, kaise hum kisi stock ko buy kar sakte hain, kaise sell kar sakte hain, stop loss, target, saari cheezein aapko A to Z saari cheezein yahan se batayi jayengi, sikhayi jayengi. On call pe aapko saari training di jayegi, saath hi saath kuch cheezein aapko nahi samajh aa rahi hai toh aap screenshot share karke bhi us cheez ko samajh sakte hain. Yeh saari cheezein aapko batayi jayengi. Saath hi saath daily basis pe hum kaise kaam kar sakte hain, aapka investment jo rehta hai uske behalf pe hum daily basis pe kitna return nikaal sakte hain, saari cheezein yahan se aapko milengi sir. Toh chahein agar aap toh minimum sir 15-20 hazar ke fund se kaam start karo. Daily basis pe aapke investment ka 8 se 10 percent tak ka profit aapko market se milega. Aur koi bhi... haan?\n[02:15] CUSTOMER: Pichle din pehle lagta hai saal bhar pehle main Dilli mein tha. Toh wahan pe ek banda jude hue the share market se. Usne mere ko video dikhaya, usme bohot dhokhadhari wala uska bata raha tha, \"Yaar dekho main itna ka share khareeda tha.\" Pata nahi kya kya hua tha. Toh woh bata tha ki aisa aisa hai. Par mera room mein ek bagal mein dost rehte hain, unka naam hai... toh share market mein woh lagate hain.\n[02:43] AGENT: Haan.\n[02:44] CUSTOMER: Humne unse iske baare mein puri detail se nahi pata hai. Toh iske liye...\n[02:48] AGENT: Achha, toh pehle kisne matlab aapko bataya tha jiska aap bol rahe hain ki kisi ne kaam karwaya tha aapko?\n[02:54] CUSTOMER: Nahi, woh toh mera dost tha toh woh hi upload kiya tha. Bola, \"Yaar dekho na aisa aisa hota hai.\"\n[03:00] AGENT: Haan.\n[03:01] CUSTOMER: Toh humne bola ki theek hai. Fir uske baad phone itna aane laga, aap yeh kariye, woh kariye. Mere paas time utna hai hi nahi. Main 8 ghanta ka job karta hoon fir baaki ghar apna time milta hai, humari zimmedari dekhna rehta hai.\n[03:16] AGENT: Toh timing kya hai aapka?\n[03:18] CUSTOMER: Timing hai abhi toh jaa rahe hain 2 se 10 baje raat tak abhi duty mein rahenge. 10 baje ke baad aayenge.\n[03:26] AGENT: Haan.\n[03:27] CUSTOMER: Phir chhote chhote bachhe hain...\n[03:28] AGENT: Haan, market time dekhiye, market timing rehta hai subah 9:15 ko market open hota hai, 3:30 baje tak ka market rehta hai. Toh isi beech mein aapko zyada time nahi, sirf agar aap chahein toh 15-20 minute ka time aapko dena rahega. Aur iske alaawa kuch nahi karna rahega. Jaise maine abhi aapko call kiya hai, main aapko bata rahi hoon, same isi tarah on market mein live market mein main aapko call karke bataungi ki sir yeh stock hai ya Nifty ki yeh position hai, yeh aapko buy karni hai, itne rupaye se buy karni hai, itne rupaye pe sell karni hai. Saari cheezein main aapko yahan se bataungi. Us cheez ka aapko koi tension nahi lena rahega aur doosri cheez rehti hai sir ki aapko kisi tarah ka koi charges bhi pay nahi karna hai. Koi service amount wagera nahi hai humari company ka.\n[04:13] CUSTOMER: Hmm, woh toh sahi hai. Par vichar karenge is cheez pe. Kyunki humne yeh cheez kyunki jab hum koi bhi kaam karte hain aamna-saamne se karte hain, woh sahi rehta hai. Woh bhale se ₹1 aapka nuksan chala jaaye ya ₹2 nuksan chala jaaye, ₹2 fayda ho ya ₹2 ghaata ho. Par jo saamne se banda jo saamne se karta hai na woh alag tarika se karta hai deal vagera aur kuch alag tarika se deal hota hai, samjhe? Aisa rehta hai aaj share khareide, pata nahi kal bikega, nahi bikega, kya hoga, nahi hoga. Banda ko woh tarika ka laga rehta hai.\n[04:48] AGENT: Nahi sir dekhiye, woh cheez main samajh rahi hoon. Baki isme toh online hi kaam hota hai na. Aap agar koi share bhi khareid rahe hain toh aapko Demat mein aap usko buy karenge aur usi mein usko sell karenge. Aap aisa toh hai nahi ki wahan kisi jo bhi company ka hum share khareid rahe hain us company mein jaake kuch karna rahega. Saari cheezein online hoti hain toh bas wahi mein aapko guide karungi.\n[05:08] CUSTOMER: Jaise aapne anubhav kara hai, jaise ab hum koi chemical department se khareedna hai kyunki chemical mein mera knowledge bhi hai aur abhi jaise BSF ka bhi chal raha hai videshi chemical hai, Solvay company ka. Toh isme toh iska liye hume batayega toh achha tarika se toh hum samajh ke toh jud sakte hain.\n[05:29] AGENT: Theek hai matlab aapko wahi share khareidne hain. Par sir kaam toh yeh rehta hai na ki humko jahan se profit mile. Ab aisa toh hai nahi ki saare share ka price same chal raha ho ya saare share badh rahe hon. Koi minus mein bhi ja raha hoga, koi neeche bhi gir raha hoga. Par humko wahi share khareidna hai na sir jisse humko profit mile. Aisa thodi hota hai ki jo humko pasand ho bas wahi share khareidein hum.\n[05:53] CUSTOMER: Haan.\n[05:54] CUSTOMER: Chaliye theek hai karte hain, thoda sa gale mein kuch phansna ho gaya.\n[06:00] AGENT: Okay okay, theek hai.\n[06:03] CUSTOMER: Kya hua?\n[06:05] CUSTOMER: Laar chala gaya.\n[06:08] CUSTOMER: Khana chhanali mein."}, {"call_id": "2026-08-27_UNMAPPED_TBE668_02", "date": "2026-08-27", "scored_at": "2026-09-01T07:26:26", "agent": "UNMAPPED_TBE668", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-532_TBE668-7665381494-20260827-183347.mp3.mp3.mpeg", "drive_file_id": "", "call_number": "", "phone_number": "7665381494", "language": "hi", "notes": "", "score": 4.0, "call_category": "", "client_profile_en": "Customer is Mohan, an existing contact who had a prior conversation with the agent about the share market. He is currently working/trading on his own (self-directed), and reports his work/trading is going well. No age, income, or detailed broker/segment information was gathered before the call cuts off.", "client_profile_hi": "ग्राहक मोहन हैं, जो पहले से एजेंट के संपर्क में हैं और उनसे शेयर मार्केट के बारे में पहले भी बात हो चुकी है। वे फिलहाल स्वयं (सेल्फ) ट्रेडिंग/काम कर रहे हैं और बताते हैं कि उनका काम अच्छा चल रहा है। कॉल खत्म होने से पहले उनकी उम्र, आय, ब्रोकर या ट्रेडिंग सेगमेंट जैसी विस्तृत जानकारी एकत्र नहीं की गई।", "summary_en": "The agent began basic profiling politely but never clearly identified the company/purpose or reached a pitch or next step before the call transcript ends.", "summary_hi": "एजेंट ने विनम्रता से बुनियादी प्रोफाइलिंग शुरू की, लेकिन कंपनी/उद्देश्य को स्पष्ट रूप से नहीं बताया और कॉल खत्म होने से पहले कोई पिच या अगला कदम तय नहीं हुआ।", "strengths_en": ["Agent maintains a calm, polite tone throughout, addressing the customer respectfully as 'sir'.", "Agent starts relevant profiling by asking whether the customer trades self or via advice."], "strengths_hi": ["एजेंट पूरी बातचीत में शांत और विनम्र लहजा बनाए रखती है और ग्राहक को सम्मानपूर्वक 'सर' कहकर बुलाती है।", "एजेंट यह पूछकर संबंधित प्रोफाइलिंग शुरू करती है कि ग्राहक स्वयं ट्रेड करता है या किसी की सलाह लेता है।"], "issues_en": ["Agent introduces herself only as 'Mayuri, Stock Market se' without clearly naming TradingBells/IIFL/Kotak or Bellseye, leaving the identity vague.", "The purpose of the call ('baat hui thi meri share market regarding') is never clearly stated or connected to a specific reason.", "The transcript ends with no pitch, no relevant recommendation, and no next step secured."], "issues_hi": ["एजेंट अपनी पहचान केवल 'मयूरी, स्टॉक मार्केट से' के रूप में देती है, TradingBells/IIFL/Kotak या Bellseye का स्पष्ट नाम नहीं लिया गया, जिससे पहचान अस्पष्ट रह जाती है।", "कॉल का उद्देश्य ('बात हुई थी मेरी शेयर मार्केट रीगार्डिंग') कभी स्पष्ट रूप से नहीं बताया गया और किसी खास कारण से नहीं जोड़ा गया।", "ट्रांसक्रिप्ट किसी पिच, संबंधित सुझाव या अगले कदम के बिना ही समाप्त हो जाती है।"], "improvements_en": ["Clearly state the company identity (TradingBells/IIFL/Kotak) at the start to build trust and compliance clarity.", "State the specific purpose of the callback explicitly instead of vaguely referencing a prior conversation.", "Complete profiling quickly and move to a relevant pitch with a clear next step before the call ends."], "improvements_hi": ["विश्वास और स्पष्टता बनाने के लिए शुरुआत में कंपनी की पहचान (TradingBells/IIFL/Kotak) स्पष्ट रूप से बताएं।", "पिछली बातचीत का अस्पष्ट संदर्भ देने के बजाय कॉलबैक का स्पष्ट उद्देश्य बताएं।", "प्रोफाइलिंग जल्दी पूरी करें और कॉल खत्म होने से पहले संबंधित पिच और स्पष्ट अगले कदम तक पहुंचें।"], "transcript": "[00:03] AGENT: Hello?\n[00:04] CUSTOMER: Hello.\n[00:06] AGENT: Good evening sir. Mohan ji baat kar rahe hain?\n[00:08] CUSTOMER: Haan ji.\n[00:09] AGENT: Mohan ji Mayuri baat kar rahi hoon Stock Market se.\n[00:13] CUSTOMER: Haan Mayuri ji.\n[00:14] AGENT: Sir baat hui thi sir meri share market regarding.\n[00:17] CUSTOMER: Haan ji.\n[00:18] AGENT: Abhi working kar rahe hain sir?\n[00:20] CUSTOMER: Haan ji.\n[00:21] AGENT: Okay. Kaisa kaam chal raha hai sir abhi aapka?\n[00:24] CUSTOMER: Badhiya.\n[00:26] AGENT: Self working karte hain ki kisi ki advice le rahe hain?\n[00:29] CUSTOMER: Haan ji?\n[00:30] AGENT: Self working karte hain ki kisi ki advice le rahe hain sir?\n[00:34] CUSTOMER: Working karte hain."}, {"call_id": "2026-08-27_UNMAPPED_TBE668_03", "date": "2026-08-27", "scored_at": "2026-09-01T07:27:09", "agent": "UNMAPPED_TBE668", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-532_TBE668-8789971475-20260827-155414.mp3.mp3.mpeg", "drive_file_id": "", "call_number": "", "phone_number": "8789971475", "language": "hi", "notes": "", "score": 6.0, "call_category": "", "client_profile_en": "Client is Mr. Pawan Kumar, a self-directed trader with 5 years of market experience who trades both options and holds equity positions; he does not currently use an advisory service. No occupation, age, or income details were gathered.", "client_profile_hi": "क्लाइंट श्री पवन कुमार हैं, जो 5 साल के अनुभव वाले स्वयं ट्रेड करने वाले ट्रेडर हैं और ऑप्शन्स तथा होल्डिंग दोनों करते हैं; वे फिलहाल किसी एडवाइजरी सेवा का उपयोग नहीं करते। पेशा, उम्र या आय की जानकारी नहीं ली गई।", "summary_en": "The agent gathered basic trading profile information professionally but delivered a generic pitch and the call cut off before any concrete next step was secured.", "summary_hi": "एजेंट ने पेशेवर तरीके से बुनियादी ट्रेडिंग प्रोफाइल जानकारी ली, लेकिन पिच सामान्य थी और कॉल किसी ठोस अगले कदम तय होने से पहले ही कट गई।", "strengths_en": ["Correctly identified company as Kotak Securities and confirmed customer identity upfront.", "Asked relevant profiling questions on experience, self-trading vs advisory, and segments traded (options/holding)."], "strengths_hi": ["कंपनी की पहचान सही तरीके से कोटक सिक्योरिटीज के रूप में की और शुरुआत में ग्राहक की पहचान की पुष्टि की।", "अनुभव, स्वयं ट्रेडिंग बनाम एडवाइजरी, और ट्रेड किए जाने वाले सेगमेंट (ऑप्शन/होल्डिंग) पर प्रासंगिक प्रोफाइलिंग प्रश्न पूछे।"], "issues_en": ["Pitch was generic ('full time service broker', 'daily support') without connecting to any specific customer need or buying signal.", "When customer asked 'why free', the explanation was vague and circular rather than a clear value proposition.", "Call ends abruptly mid-sentence with no next step, callback, or account-opening action confirmed."], "issues_hi": ["पिच सामान्य थी ('फुल टाइम सर्विस ब्रोकर', 'डेली सपोर्ट') और किसी विशिष्ट ग्राहक आवश्यकता या खरीद संकेत से नहीं जोड़ी गई।", "जब ग्राहक ने पूछा 'फ्री में क्यों करते हैं', तो जवाब स्पष्ट वैल्यू प्रपोजिशन के बजाय अस्पष्ट और घुमावदार था।", "कॉल बीच वाक्य में अचानक समाप्त हो गई, बिना किसी अगले कदम, कॉलबैक, या अकाउंट-ओपनिंग एक्शन की पुष्टि के।"], "improvements_en": ["Tailor the pitch to the customer's stated activity (options + holding) rather than a generic list of all services.", "Give a concrete, specific reason for the free service (e.g., brokerage-based revenue model) to build trust.", "Always close with a clear next step, such as scheduling a callback or confirming interest in account opening."], "improvements_hi": ["ग्राहक की बताई गई गतिविधि (ऑप्शन + होल्डिंग) के अनुसार पिच को तैयार करें, न कि सभी सेवाओं की सामान्य सूची दें।", "फ्री सेवा का ठोस और स्पष्ट कारण बताएं (जैसे ब्रोकरेज-आधारित रेवेन्यू मॉडल) ताकि भरोसा बने।", "हमेशा कॉल को एक स्पष्ट अगले कदम के साथ बंद करें, जैसे कॉलबैक शेड्यूल करना या अकाउंट खोलने में रुचि की पुष्टि करना।"], "transcript": "[00:00] AGENT: Hello?\n[00:03] AGENT: Hello?\n[00:05] CUSTOMER: Haan?\n[00:06] AGENT: Ji, good afternoon sir.\n[00:07] CUSTOMER: Haan.\n[00:08] AGENT: Mr. Pawan Kumar ji baat kar rahe hain?\n[00:11] CUSTOMER: Haan.\n[00:12] AGENT: Ji, Mayuri baat kar rahi hoon sir, Kotak Securities Private Limited se.\n[00:15] CUSTOMER: Haan.\n[00:16] AGENT: Share market regarding call kiya hai aapko.\n[00:19] CUSTOMER: Kya karna hai aapka?\n[00:21] AGENT: Working kar rahe hain abhi aap market mein, investment, trading?\n[00:24] CUSTOMER: Haan, kar rahe hain.\n[00:28] CUSTOMER: Haan, boliye.\n[00:30] AGENT: Actually sir, meri company mein aapka number register hua tha as a active trader, isliye maine call kiya hai.\n[00:36] AGENT: Hamari jo company ek full time service broker hai sir, jo market mein daily basis pe support provide karti hai.\n[00:44] AGENT: Hello?\n[00:45] CUSTOMER: Haan, sun raha hoon main, boliye.\n[00:46] AGENT: Ji, to bata sakte hain sir aapko kitna time hua hai market mein?\n[00:50] CUSTOMER: 5 saal.\n[00:52] AGENT: Okay, aur abhi self-working karte hain ya phir kisi ki advice le rahe hain, kisi ke sath kaam kar rahe hain?\n[00:57] CUSTOMER: Main khud hi karta hoon.\n[00:59] AGENT: Okay, okay, kafi acchi baat hai sir.\n[01:02] AGENT: To abhi aap option vagera mein karte hain ya phir holding karte hain sir?\n[01:05] CUSTOMER: Dono karta hoon.\n[01:07] AGENT: Dono karte hain, okay. Hamare yahan se bhi sir dekhiye option, equity, commodity, uske baad mein SIP, IPO, upcoming IPO vagera jo bhi aap karna chahen uske liye yahan se aapko suggestion mil sakta hai.\n[01:19] AGENT: Aur uske liye koi aapko charges vagera bhi pay nahi karna rehta hai. Agar aap interested hain to bataiye sir.\n[01:24] CUSTOMER: Aap free mein kyun karte hain?\n[01:26] AGENT: Sir, actually hamari company jo hai full-time service broker hai. Full-time service broker matlab aapko sari service support milti hai free of cost, bas aapko hamari company ka Demat account open karna rehta hai.\n[01:37] CUSTOMER: Kaun sa aapka company ka Demat account hai?\n[01:39] AGENT: Kotak Securities.\n[01:42] AGENT: Abhi..."}, {"call_id": "2026-08-28_UNMAPPED_TBE668_01", "date": "2026-08-28", "scored_at": "2026-09-01T07:27:53", "agent": "UNMAPPED_TBE668", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-532_TBE668-9341964307-20260828-113154.mp3.mp3.mpeg", "drive_file_id": "", "call_number": "", "phone_number": "9341964307", "language": "hi", "notes": "", "score": 4.0, "call_category": "", "client_profile_en": "Female customer, existing registered client of Kotak Securities flagged as an 'active trader,' who confirmed she does invest/trade in the share market when asked directly. No further details (trading experience, duration, current holdings, or reason for inactivity) were established during the call.", "client_profile_hi": "महिला ग्राहक, Kotak Securities की मौजूदा रजिस्टर्ड क्लाइंट जिन्हें 'active trader' के रूप में चिन्हित किया गया है, उन्होंने सीधे पूछे जाने पर पुष्टि की कि वे शेयर मार्केट में निवेश/ट्रेडिंग करती हैं। कॉल के दौरान कोई और जानकारी (ट्रेडिंग अनुभव, समयावधि, मौजूदा होल्डिंग्स, या ट्रेडिंग रुकने का कारण) प्राप्त नहीं की गई।", "summary_en": "The agent introduced herself clearly but the call broke down into repeated confusion and ended without any profiling or next step secured.", "summary_hi": "एजेंट ने स्पष्ट रूप से अपना परिचय दिया, लेकिन कॉल बार-बार भ्रम में उलझ गई और बिना किसी प्रोफाइलिंग या अगले कदम के समाप्त हो गई।", "strengths_en": ["Agent clearly identified herself and the company (Mayuri, Kotak Securities) at the start.", "Agent checked audio connectivity before proceeding with the pitch."], "strengths_hi": ["एजेंट ने शुरुआत में स्पष्ट रूप से अपना नाम और कंपनी (मयूरी, Kotak Securities) बताया।", "एजेंट ने आगे बढ़ने से पहले आवाज़ साफ आ रही है या नहीं, यह जांचा।"], "issues_en": ["Customer repeatedly showed confusion ('Kya phir se?', 'Kaun sa market mein?') indicating the agent's questions were not clear or well-paced.", "No profiling was completed — trading experience, duration or reason for inactivity were never established.", "Call ends abruptly with a vague 'Theek hai' and no next step, callback, or clear plan secured."], "issues_hi": ["ग्राहक ने बार-बार भ्रम दिखाया ('क्या फिर से?', 'कौन से मार्केट में?'), जिससे स्पष्ट है कि एजेंट के सवाल स्पष्ट या ठीक गति से नहीं थे।", "कोई प्रोफाइलिंग पूरी नहीं हुई — ट्रेडिंग अनुभव, समयावधि या निष्क्रियता का कारण कभी पता नहीं चला।", "कॉल एक अस्पष्ट 'ठीक है' के साथ अचानक समाप्त हो गई, बिना किसी अगले कदम, कॉलबैक या स्पष्ट योजना के।"], "improvements_en": ["Ask simpler, one-part questions and confirm the customer understood before moving to the next one.", "Slow the pace given the customer's clear difficulty following, rather than repeating the same phrasing.", "Always close with a concrete next step, such as a scheduled callback or a specific offer to follow up on."], "improvements_hi": ["सरल, एक-भाग वाले सवाल पूछें और आगे बढ़ने से पहले पुष्टि करें कि ग्राहक ने समझा है।", "ग्राहक को समझने में स्पष्ट कठिनाई को देखते हुए गति धीमी करें, न कि वही वाक्य दोहराएं।", "हमेशा किसी ठोस अगले कदम के साथ कॉल समाप्त करें, जैसे तय कॉलबैक या किसी विशेष ऑफर पर फॉलो-अप।"], "transcript": "[00:01] CUSTOMER: Hello? [audio unclear or repeating here — collapsed from 3 near-identical segments]\n[00:04] AGENT: Good morning, ma'am.\n[00:06] CUSTOMER: Hello?\n[00:10] CUSTOMER: Hello?\n[00:11] AGENT: Hello, good morning ma'am, aawaz aa rahi hai?\n[00:14] CUSTOMER: Haan ma'am, aawaz aa rahi hai.\n[00:16] AGENT: Mayuri baat kar rahi hoon Kotak Securities Private Limited se.\n[00:20] CUSTOMER: Haan.\n[00:21] AGENT: Share market regarding call kiya tha humne. Working kar rahe hain share market mein?\n[00:24] CUSTOMER: Haan.\n[00:26] AGENT: Kaisa work chal raha hai abhi market mein aapka investment, trading?\n[00:32] CUSTOMER: Kya phir se?\n[00:34] AGENT: Share market mein investment karte hain, ma'am?\n[00:38] CUSTOMER: Haan, karte hain.\n[00:40] AGENT: Okay, okay. Actually ma'am aapka number meri company mein registered hua tha as a active trader. Yahan se daily basis pe market support provide kiya jata hai.\n[00:48] AGENT: Isi ke regarding maine call kiya hai.\n[00:51] AGENT: Toh abhi bata sakte hain aapko kitna time ho gaya market mein kaam karte hue?\n[00:57] CUSTOMER: Abhi time?\n[00:59] AGENT: Ji.\n[01:01] AGENT: Matlab kitne samay se aap kaam kar rahi hain market mein?\n[01:04] CUSTOMER: Kauns market mein?\n[01:06] AGENT: Ma'am, share market ki baat kar rahi hoon na.\n[01:14] AGENT: Hello?\n[01:17] CUSTOMER: Theek hai."}, {"call_id": "2026-08-27_UNMAPPED_TBE668_04", "date": "2026-08-27", "scored_at": "2026-09-01T07:28:32", "agent": "UNMAPPED_TBE668", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-532_TBE668-9602426704-20260827-144900.mp3.mp3.mpeg", "drive_file_id": "", "call_number": "", "phone_number": "9602426704", "language": "hi", "notes": "", "score": 4.0, "call_category": "", "client_profile_en": "Male customer (Mr. Ranveer) contacted via cold call from Kotak Securities; he states he is not currently doing any investment or trading and initially says he is not interested. No further profiling details (broker, experience, income) were captured.", "client_profile_hi": "पुरुष ग्राहक (मिस्टर रणवीर) को Kotak Securities की कोल्ड कॉल आई; उन्होंने बताया कि वे फिलहाल कोई निवेश या ट्रेडिंग नहीं कर रहे हैं और शुरुआत में कहा कि उन्हें दिलचस्पी नहीं है। ब्रोकर, अनुभव, आय जैसी अन्य कोई प्रोफाइलिंग जानकारी एकत्र नहीं की गई।", "summary_en": "The agent identified herself and the company correctly but kept probing after the customer's clear refusal without adjusting the approach or securing any next step.", "summary_hi": "एजेंट ने अपनी और कंपनी की पहचान सही बताई, लेकिन ग्राहक के स्पष्ट इनकार के बाद भी वैसे ही सवाल पूछती रही और कोई अगला कदम तय नहीं किया।", "strengths_en": ["Clear and correct identification as Kotak Securities authorised person.", "Calm, polite tone maintained throughout despite the customer's refusal."], "strengths_hi": ["Kotak Securities की अधिकृत व्यक्ति के रूप में स्पष्ट और सही पहचान दी गई।", "ग्राहक के इनकार के बावजूद पूरी बातचीत में शांत और विनम्र लहजा बना रहा।"], "issues_en": ["Customer said 'Interested nahi hoon' but agent continued with the same script ('working kar rahe hain market mein investment, trading?') instead of acknowledging the refusal.", "No profiling was attempted beyond a generic question; reason for inactivity or broker relationship was never explored.", "Call ends with no next step, callback, or closing statement secured."], "issues_hi": ["ग्राहक ने कहा 'Interested nahi hoon' फिर भी एजेंट वही स्क्रिप्ट दोहराती रही ('working kar rahe hain market mein investment, trading?') और इनकार को स्वीकार नहीं किया।", "एक सामान्य सवाल के अलावा कोई प्रोफाइलिंग नहीं की गई; ग्राहक की निष्क्रियता का कारण या पहले के ब्रोकर संबंध का पता नहीं लगाया गया।", "कॉल किसी अगले कदम, कॉलबैक या क्लोजिंग स्टेटमेंट के बिना समाप्त हो जाती है।"], "improvements_en": ["Acknowledge the customer's refusal explicitly before asking a follow-up question, to build trust rather than sound scripted.", "Ask a light open-ended question about why they are inactive before pitching further.", "Even if the customer declines, close with a soft next step like 'may I share details on WhatsApp / call you later?' rather than trailing off."], "improvements_hi": ["अगला सवाल पूछने से पहले ग्राहक के इनकार को स्पष्ट रूप से स्वीकार करें, ताकि यह स्क्रिप्टेड न लगे और भरोसा बने।", "आगे पिच करने से पहले हल्के ढंग से पूछें कि वे ट्रेडिंग क्यों नहीं कर रहे।", "ग्राहक के इनकार के बाद भी हल्का अगला कदम तय करें, जैसे 'क्या मैं व्हाट्सएप पर जानकारी भेज सकती हूं / बाद में कॉल कर सकती हूं?' बिना बात को अधूरा छोड़े।"], "transcript": "[00:02] AGENT: Hello?\n[00:04] AGENT: Hello?\n[00:07] AGENT: Yeah, good afternoon sir.\n[00:09] AGENT: Hello?\n[00:12] CUSTOMER: Haan hello.\n[00:14] AGENT: Mayuri baat kar rahi hoon main Kotak Securities Private Limited se.\n[00:17] CUSTOMER: Main karwati hoon baat Deepak ko.\n[00:23] CUSTOMER: Deepak se.\n[00:42] CUSTOMER: Hello?\n[00:43] AGENT: Hello.\n[00:44] CUSTOMER: Hello.\n[00:46] AGENT: Haan ji sir, good afternoon. Mr. Ranveer ji se baat ho rahi hai?\n[00:49] CUSTOMER: Haan ji, boliyega.\n[00:51] AGENT: Mayuri baat kar rahi hoon sir, authorised person Kotak Securities se. Share market regarding aapka number register hua hai sir.\n[00:57] CUSTOMER: Main interested nahi hoon...\n[01:00] AGENT: Ji?\n[01:03] AGENT: Hello?\n[01:04] CUSTOMER: Interested nahi hoon main abhi. Kya bol rahe hain?\n[01:08] AGENT: Haan ji sir, working kar rahe hain abhi market mein aap investment, trading?\n[01:11] CUSTOMER: Nahi nahi, kuch nahi kar raha hoon main abhi.\n[01:14] AGENT: Nahi kar rahe hain? Koi planning hai future start karne ki?"}, {"call_id": "2026-08-28_NeelamRajput_02", "date": "2026-08-28", "scored_at": "2026-09-01T07:29:53", "agent": "Neelam Rajput", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-TBE460-7217865283-20260828-120058.mp3.mp3.mpeg", "drive_file_id": "", "call_number": "", "phone_number": "7217865283", "language": "hi", "notes": "", "score": 2.0, "call_category": "", "client_profile_en": "Male customer working as a daily-wage laborer (carries bricks/stones - 'eeta-pattar uthane wale'). States he has no knowledge of the stock market, is not literate, does not use Instagram, and uses a basic Vivo smartphone. He expressed no interest in trading or investing and repeatedly said he does not understand these concepts.", "client_profile_hi": "ग्राहक एक पुरुष दैनिक मजदूर है (ईंट-पत्थर उठाने का काम करता है)। उसने बताया कि उसे शेयर बाजार की कोई जानकारी नहीं है, वह पढ़ा-लिखा नहीं है, इंस्टाग्राम नहीं चलाता, और एक सामान्य Vivo स्मार्टफोन इस्तेमाल करता है। उसने ट्रेडिंग या निवेश में कोई रुचि नहीं दिखाई और बार-बार कहा कि उसे इन चीज़ों की समझ नहीं है।", "summary_en": "The agent repeatedly mocked and argued with a customer who clearly and respectfully stated he had no interest, knowledge or means to trade, resulting in a disrespectful and unproductive call.", "summary_hi": "एजेंट ने बार-बार उस ग्राहक का मज़ाक उड़ाया और उससे बहस की जिसने स्पष्ट और विनम्रता से कहा कि उसे ट्रेडिंग में कोई रुचि, ज्ञान या साधन नहीं है, जिससे यह कॉल अनादरपूर्ण और अनुत्पादक बन गई।", "strengths_en": ["Agent gave a basic, simple explanation of what a Demat account is when the customer asked to understand the process.", "Agent stayed on the call and attempted to keep the conversation going rather than hanging up abruptly."], "strengths_hi": ["जब ग्राहक ने प्रक्रिया समझने के लिए कहा तो एजेंट ने डीमैट अकाउंट के बारे में एक सामान्य, सरल स्पष्टीकरण दिया।", "एजेंट कॉल पर बनी रही और बातचीत को अचानक खत्म करने के बजाय उसे जारी रखने की कोशिश की।"], "issues_en": ["Agent mocked the customer's occupation and honesty, e.g. 'Lag to nahi rahe hain sir' and 'Mazak to aap kar hi rahe hain', implying he was lying about being a laborer.", "Agent ignored the customer's repeated, clear statements ('humko jankari nahi hai', 'padhe likhe nahi hain') and kept arguing instead of adapting or gracefully ending the pitch.", "Pitch about Demat, SIP, IPO and Instagram ads was completely irrelevant to a customer who explicitly said he doesn't use Instagram or know these terms, showing no personalization."], "issues_hi": ["एजेंट ने ग्राहक के पेशे और ईमानदारी का मज़ाक उड़ाया, जैसे 'लग तो नहीं रहे हैं सर' और 'मज़ाक तो आप कर ही रहे हैं', जिससे यह संकेत मिला कि वह मजदूर होने के बारे में झूठ बोल रहा है।", "एजेंट ने ग्राहक के बार-बार दिए गए स्पष्ट बयानों ('हमको जानकारी नहीं है', 'पढ़े लिखे नहीं हैं') को नज़रअंदाज़ किया और अनुकूलन करने या बात को शालीनता से समाप्त करने के बजाय बहस करती रही।", "डीमैट, SIP, IPO और इंस्टाग्राम विज्ञापनों के बारे में पिच पूरी तरह अप्रासंगिक थी क्योंकि ग्राहक ने साफ कहा था कि वह इंस्टाग्राम नहीं चलाता और इन शब्दों को नहीं जानता, जिससे कोई व्यक्तिगतकरण नहीं दिखा।"], "improvements_en": ["Respect a clearly stated 'not interested/no knowledge' response instead of arguing or challenging the customer's credibility.", "Drop sarcastic and condescending remarks entirely; use a neutral, respectful tone even when a lead does not fit the product.", "If the customer is clearly not a fit (no literacy, no smartphone usage, no interest), politely close the call rather than pushing repeatedly."], "improvements_hi": ["जब ग्राहक साफ तौर पर 'रुचि नहीं है/जानकारी नहीं है' कहे तो उसे स्वीकार करें, बहस न करें या उसकी विश्वसनीयता पर सवाल न उठाएं।", "व्यंग्यात्मक और तिरस्कारपूर्ण टिप्पणियों को पूरी तरह हटाएं; भले ही लीड उत्पाद के लिए उपयुक्त न हो, तटस्थ और सम्मानजनक लहजा अपनाएं।", "यदि ग्राहक स्पष्ट रूप से उपयुक्त नहीं है (पढ़ाई नहीं, स्मार्टफोन का उपयोग नहीं, रुचि नहीं), तो बार-बार दबाव डालने के बजाय विनम्रता से कॉल समाप्त करें।"], "transcript": "[00:05] AGENT: Hello?\n[00:07] CUSTOMER: Hello.\n[00:09] AGENT: Ji, good afternoon sir. Neelam baat kar rahi hoon Kotak Securities ke behalf se authorized person.\n[00:16] CUSTOMER: Kya cheez ma'am?\n[00:19] AGENT: Ji sir, Kotak Securities ke behalf se authorized person Neelam baat kar rahi hoon.\n[00:23] CUSTOMER: Haan ji, bolie.\n[00:25] AGENT: Ji sir, maine aapko support aur service ke regarding call kiya tha. Abhi working wagera kar rahe hain aap stock market mein?\n[00:32] CUSTOMER: Nahi ma'am. Hum to labor majdoor hain.\n[00:36] AGENT: So what happened sir? Aisa to kahi pe likha nahi hai ki wo log kaam nahi kar sakte sir.\n[00:41] CUSTOMER: Abhi hum log labor majdoor hain ma'am, eeta-pattar uthane wale.\n[00:46] AGENT: Lag to nahi rahe hain sir.\n[00:48] CUSTOMER: Sahi keh raha hoon, mazak nahi kar raha hoon, sahi keh raha hoon.\n[00:50] AGENT: Mazak to aap kar hi rahe hain.\n[00:52] CUSTOMER: Nahi nahi, bilkul. Hum to eeta hi uthate hain.\n[00:56] AGENT: Haan to koi kaam kharab thodi na hai sir.\n[01:01] CUSTOMER: Haan to...\n[01:03] AGENT: Hai na?\n[01:04] CUSTOMER: Haan, bolie.\n[01:05] AGENT: Aaj ki date mein sab kuch na kuch kuch na kuch karte hi hain sir. Iska matlab ye thodi na hai ki aap log kahi pe investment nahi kar sakte, alternate income source ke liye nahi ja sakte? Ja sakte hain na sir?\n[01:15] CUSTOMER: Yani ki aapka kaam hai kya?\n[01:20] AGENT: Aap stock market jaan-te hain?\n[01:22] CUSTOMER: Nahi, stock nahi jaante hain.\n[01:24] AGENT: Kuch bhi nahi jaante ho?\n[01:25] CUSTOMER: Nahi. Majdoor aadmi kya janega...\n[01:27] AGENT: Aray sir wahi baat, sir aisa main wahi chiz aapko bol rahi hoon, kahan pe aisa likha hai ki nahi jaan sakte aap? Aap jaanna nahi chahte ho ye alag baat hai sir, aapne apni mentality agar aisi soch ke rakhi hai to fir hum kuch bhi nahi kar sakte hain sir. Nahi to agar karna chahein to sab kuch kar sakte hain sir. Koi zaroori nahi hai aap padhe-likhe hain, nahi hain. Aaj ki date mein to wahi log zyada paisa kama rahe hain sir.\n[01:48] CUSTOMER: Haan haan.\n[01:50] AGENT: To fir sir? Sabhi log to kaam karte hain, yahan to farmer bhi kaam karte hain. Jo daily basis pe regular income rehti hai wo log bhi kaam karte hain. Jo business karte hain wo bhi karte hain, job wale bhi karte hain. Side income source to sabhi ke liye hota hai sir.\n[02:01] CUSTOMER: Haan.\n[02:02] AGENT: Kisi ek vyakti ke liye thodi na hai sir.\n[02:05] CUSTOMER: Aakhir ye kya process hai, samjhaiye aap mujhe.\n[02:09] AGENT: Iske liye ye process rehta hai sir. Sabse pehle to apan ko Demat account open karna hota hai. Jaisa apna bank account hota hai, waisa Demat account hota hai. Us Demat account ke through sir, aapne kabhi jaise ad wagera dekhe honge mobile mein, jaise Mutual Fund ke aate hain, SIP ke aate hain, IPO wagera ke baare mein aapne suna hoga sir, hai na?\n[02:29] CUSTOMER: Nahi ye sab ke baare mein sune bhi nahi hain hum.\n[02:32] AGENT: Mobile kaunsa use karte hain aap?\n[02:35] CUSTOMER: Mobile mera Vivo ka.\n[02:39] AGENT: To mobile mein khud ad aata hai sir. Kotak ka bhi aata hai, aur stock market ka bhi aata hai. Aur aajkal to Insta ka zamana hai sir, aisa ho hi nahi sakta ki aapne koi Reels wagera share market se related nahi dekhi ho.\n[02:49] CUSTOMER: Yahan tak ki hum Instagram bhi nahi chalate.\n[02:52] AGENT: Nahi chalate honge, lekin phir bhi sir, wo to cheezein kahi pe bhi update ho jaati hain.\n[02:57] CUSTOMER: Nahi chalate hain. Padhe likhe nahi hain na ma'am, isliye.\n[03:04] AGENT: Maine kab bola ki aapko share market mein degree ki zaroorat hoti hai sir?\n[03:08] CUSTOMER: Padha likha insan hi to chalata hai bada bada phone. Hum to labor majdoor aadmi hain, chhota sa phone hai chalayein. Instagram Instagram ye sab to humko ID bhi banana nahi aata.\n[03:20] AGENT: Wo to dekho sir, maine aapko wahi cheez boli na, hum karna chahein to sab kuch kar sakte hain sir. Hum nahi karna chahein to bahane hazaar hote hain sir.\n[03:28] CUSTOMER: Haan jisko jankari ho wo to karegi na ma'am.\n[03:31] AGENT: Aise aise customer hain sir jinhone kuch nahi suna lekin unke paas hai ki mujhe karna hai. To aisa to nahi hai ki apan seekh nahi sakte? Har ek cheez ka first time hota hai sir. Aap jo aaj jo aap kaam kar rahe ho wo bhi aap pehle se seekh ke thodi na aaye ho sir? Kahi na kahi se to start kiya hi hoga na sir?\n[03:45] CUSTOMER: Isme seekhna nahi padta na, bas eeta uthao le jaake de do mistri ko.\n[03:49] AGENT: Arey itna to mujhe bhi pata hai sir, aapke baat karne se mujhe bhi samajh mein aata hai kaun sa customer kya hai aur kya nahi hai sir. Agar aap market nahi jaante to aapka number bhi market mein nahi hota sir. Kis vyakti ka number hota hai market mein kis se hum discussion karte hain ye to humko bhi pata hai sir. Aapki family mein kitne logon ko call aata hai share market se related aapke alawa?\n[04:08] CUSTOMER: Ye to pata nahi, main wahi to bol raha hoon main nahi jaan...\n[04:11] AGENT: Haan to main wahi bol rahi hoon na, wo log nahi karte hain, nahi interested honge, nahi unko pata hoga to nahi aate hain sir. Meri family mein mujhe pata hai, main karti hoon to mujhe aate hain, baaki kisi ko nahi aate hain. Aayenge unhi ko jinke number registered hain, profile mentioned hain sir jo jaanta hai. Par aisa bhi nahi ki mera hi call aapko first time aaya hoga sir, to aapne pehli baar hi suna hoga. Aapko din bhar mein aise chaar se paanch calls aati honge.\n[04:32] CUSTOMER: Call call to aa hi jata hai, lekin main to bataya na humko jankari nahi hai humko.\n[04:37] AGENT: Knowledge aise hi ho jata hai sir. Lekin fir bhi koi issue nahi, agar aapko jab karna ho to phir mujhe batana sir, hai na?\n[04:45] CUSTOMER: Haan, bilkul bilkul.\n[04:46] AGENT: Theek hai, okay, thank you sir.\n[04:48] CUSTOMER: Welcome."}, {"call_id": "2026-08-27_NeelamRajput_02", "date": "2026-08-27", "scored_at": "2026-09-01T07:31:04", "agent": "Neelam Rajput", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-TBE460-9326229999-20260827-094930.mp3.mp3.mpeg", "drive_file_id": "", "call_number": "", "phone_number": "9326229999", "language": "hi", "notes": "", "score": 6.0, "call_category": "", "client_profile_en": "Male customer who has not yet completed the account-opening process; he was confused about how fund transfer/investment works once a Demat account is opened. No other demographic or profiling details (experience, broker, objective) were gathered.", "client_profile_hi": "पुरुष ग्राहक जिसने अभी तक खाता खोलने की प्रक्रिया पूरी नहीं की है; वह इस बात को लेकर उलझन में था कि डीमैट खाता खुलने के बाद फंड ट्रांसफर/निवेश कैसे होता है। अनुभव, मौजूदा ब्रोकर या निवेश उद्देश्य जैसी कोई अन्य जानकारी एकत्र नहीं की गई।", "summary_en": "The agent clearly explained the fund transfer process and kept a calm, helpful tone, but skipped proper introduction, company identification, and any customer profiling.", "summary_hi": "एजेंट ने फंड ट्रांसफर प्रक्रिया स्पष्ट रूप से समझाई और शांत, सहायक लहजा बनाए रखा, लेकिन उचित परिचय, कंपनी की पहचान और ग्राहक प्रोफाइलिंग को छोड़ दिया।", "strengths_en": ["Used a simple, relatable analogy (Google Pay/PhonePe) to explain how bank-linked fund transfers work in a Demat account.", "Patient and encouraging tone, telling the customer 'poochne ka koi paisa nahi lagta' to reduce hesitation.", "Gave clear callback options (specific time window plus WhatsApp) for future queries."], "strengths_hi": ["डीमैट खाते में बैंक-लिंक्ड फंड ट्रांसफर कैसे काम करता है, यह समझाने के लिए सरल, सुलभ उदाहरण (Google Pay/PhonePe) का उपयोग किया।", "धैर्यपूर्ण और प्रोत्साहित करने वाला लहजा, ग्राहक से कहा 'पूछने का कोई पैसा नहीं लगता' ताकि झिझक कम हो।", "भविष्य के सवालों के लिए स्पष्ट कॉलबैक विकल्प (निश्चित समय सीमा और व्हाट्सएप) दिए।"], "issues_en": ["No proper introduction — agent never mentions TradingBells/IIFL/Kotak, only says 'Neelam baat kar rahi hoon.'", "Zero profiling — no attempt to understand customer's trading experience, background, or why the process wasn't completed earlier.", "Initial confusion in understanding ('Aapne kiya tha kya us din process' → customer misunderstood, needed a repeat) shows a small listening gap."], "issues_hi": ["उचित परिचय नहीं दिया गया — एजेंट कभी भी TradingBells/IIFL/Kotak का उल्लेख नहीं करती, सिर्फ कहती है 'नीलम बात कर रही हूं।'", "कोई प्रोफाइलिंग नहीं की गई — ग्राहक के ट्रेडिंग अनुभव, पृष्ठभूमि, या प्रक्रिया पहले पूरी क्यों नहीं हुई, यह समझने की कोशिश नहीं की गई।", "समझने में शुरुआती भ्रम ('आपने किया था क्या उस दिन प्रोसेस' → ग्राहक ने गलत समझा, दोबारा स्पष्ट करना पड़ा) एक छोटी सी सुनने की कमी दर्शाता है।"], "improvements_en": ["Start every call with a clear, compliant introduction naming the company (TradingBells/IIFL/Kotak).", "Ask a few profiling questions (experience, reason for delay) before diving into process explanation.", "Confirm understanding upfront by asking one direct question instead of assuming what the customer meant."], "improvements_hi": ["हर कॉल की शुरुआत कंपनी का नाम (TradingBells/IIFL/Kotak) बताते हुए स्पष्ट, अनुपालन-युक्त परिचय से करें।", "प्रक्रिया समझाने से पहले कुछ प्रोफाइलिंग प्रश्न पूछें (अनुभव, देरी का कारण)।", "यह मान लेने के बजाय कि ग्राहक का क्या मतलब था, शुरुआत में ही एक सीधा प्रश्न पूछकर समझ की पुष्टि करें।"], "transcript": "[00:02] AGENT: Hello?\n[00:03] CUSTOMER: Hello.\n[00:04] AGENT: Ji, good morning, sir.\n[00:05] CUSTOMER: Very good morning. Boliye, ma'am.\n[00:07] AGENT: Haan ji sir, Neelam baat kar rahi hoon. Kaise hain aap?\n[00:11] pp number pe message kar lo ki ma'am matlab call kar lijiye, main turant aapko free ho ke call kar lungi, theek hai? Lag jayega, koi dikkat nahi hai, theek hai sir?\n[03:36] CUSTOMER: Theek hai ma'am.\n[03:37] AGENT: Theek hai, okay, aap kar lijiye, hai na?\n[03:39] CUSTOMER: Okay.\n[03:40] AGENT: Okay, thank you sir."}, {"call_id": "2026-08-27_NeelamRajput_03", "date": "2026-08-27", "scored_at": "2026-09-01T07:31:47", "agent": "Neelam Rajput", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-TBE460-9808764236-20260827-173020.mp3.mp3.mpeg", "drive_file_id": "", "call_number": "", "phone_number": "9808764236", "language": "hi", "notes": "", "score": 7.0, "call_category": "", "client_profile_en": "Male customer (Rahul) who traded in stock market approximately 2 years ago with a good experience, but stopped due to ongoing financial problems. Currently not trading and has no immediate plan to restart; says he is busy and needs at least one month before he can consider it again.", "client_profile_hi": "पुरुष ग्राहक (राहुल) ने लगभग 2 साल पहले शेयर बाजार में ट्रेडिंग की थी और अनुभव अच्छा रहा था, लेकिन चल रही आर्थिक समस्याओं के कारण उसे रोक दिया। फिलहाल ट्रेडिंग नहीं कर रहे और दोबारा शुरू करने की कोई तत्काल योजना नहीं है; कहते हैं कि व्यस्त हैं और दोबारा विचार करने के लिए कम से कम एक महीने का समय चाहिए।", "summary_en": "Agent handled the reactivation call with patience and secured a follow-up, though the pitch (NSE/BSE explainer) felt generic and slightly mistimed given the customer's clear disinterest.", "summary_hi": "एजेंट ने रिएक्टिवेशन कॉल को धैर्य से संभाला और फॉलो-अप तय किया, हालांकि ग्राहक की स्पष्ट अरुचि के बावजूद पिच (NSE/BSE समझाना) सामान्य और गलत समय पर लगी।", "strengths_en": ["Gathered relevant profiling facts quickly: past trading experience, positive experience, and reason for stopping (financial issues).", "Remained calm and patient throughout, without pressuring the customer after he expressed disinterest.", "Ended the call with a concrete next step by agreeing to follow up in a month."], "strengths_hi": ["प्रासंगिक जानकारी जल्दी जुटाई: पिछला ट्रेडिंग अनुभव, अच्छा अनुभव, और रुकने का कारण (आर्थिक समस्याएं)।", "ग्राहक के अरुचि जताने के बाद भी दबाव डाले बिना पूरी कॉल में शांत और धैर्यवान रहे।", "एक महीने बाद फॉलो-अप पर सहमति के साथ कॉल को एक ठोस अगले कदम पर समाप्त किया।"], "issues_en": ["Continued explaining NSE/BSE right after the customer said he has no plan to restart and no time, missing the disinterest signal.", "Introduction was repeated three times due to connectivity confusion, making the opening feel disjointed.", "Profiling was shallow — no attempt to note current broker, segments traded, or specifics of the financial problem before pitching."], "issues_hi": ["ग्राहक के यह कहने के बाद भी कि उसकी कोई योजना नहीं है और समय नहीं है, एजेंट ने NSE/BSE समझाना जारी रखा, अरुचि के संकेत को नज़रअंदाज़ किया।", "कनेक्टिविटी की उलझन के कारण परिचय तीन बार दोहराया गया, जिससे शुरुआत बिखरी हुई लगी।", "प्रोफाइलिंग सतही रही — पिच से पहले मौजूदा ब्रोकर, ट्रेड किए गए सेगमेंट, या आर्थिक समस्या की विशिष्टता जानने की कोशिश नहीं की गई।"], "improvements_en": ["Stop pitching product details the moment the customer signals disinterest or lack of time — pivot straight to scheduling.", "Deepen profiling before any pitch — ask about current broker/investments and specific concerns to personalize the reactivation offer.", "Confirm the callback date/time more precisely (exact date) rather than a vague 'one month later'."], "improvements_hi": ["जैसे ही ग्राहक अरुचि या समय की कमी का संकेत दे, उत्पाद विवरण देना बंद करें और सीधे शेड्यूलिंग पर जाएं।", "किसी भी पिच से पहले प्रोफाइलिंग को गहरा करें — मौजूदा ब्रोकर/निवेश और विशिष्ट चिंताओं के बारे में पूछें ताकि रिएक्टिवेशन ऑफर व्यक्तिगत बन सके।", "'एक महीने बाद' जैसी अस्पष्ट बात के बजाय फॉलो-अप की सटीक तारीख/समय तय करें।"], "transcript": "[00:02] AGENT: Hello\n[00:06] AGENT: Ji ma'am Neelam baat kar rahi hu Kotak Securities ke behalf pe authorized person.\n[00:12] AGENT: Hello\n[00:14] l Services से बताया और पिछली बातचीत का संदर्भ दिया।", "उलझन भरी कॉल के बावजूद अगली कॉलबैक की समयसीमा ('दो दिन में') तय की।"], "issues_en": ["When the customer genuinely asked if 'Comat Global' (a job offer) was legitimate, the agent guessed and presented fabricated details ('cement and construction material, food products') as fact — a serious misrepresentation risk.", "Poor listening/audio handling caused repeated 'Sorry? Huh?' moments and confusion over 'Comat' vs 'Global', frustrating the customer.", "No profiling or relevant pitch was attempted to move the account-opening conversation forward beyond document status."], "issues_hi": ["जब ग्राहक ने वास्तव में पूछा कि क्या 'Comat Global' (नौकरी ऑफर) असली है, एजेंट ने अंदाज़ा लगाकर गढ़ी हुई जानकारी ('सीमेंट और निर्माण सामग्री, खाद्य उत्पाद') तथ्य के रूप में दी — यह गंभीर भ्रामक बयान का जोखिम है।", "खराब सुनने/ऑडियो हैंडलिंग के कारण बार-बार 'सॉरी? हुह?' जैसे पल आए और 'Comat' बनाम 'Global' को लेकर भ्रम रहा, जिससे ग्राहक निराश हुआ।", "दस्तावेज़ स्थिति से आगे बढ़कर अकाउंट-ओपनिंग बातचीत को बढ़ाने के लिए कोई प्रोफाइलिंग या प्रासंगिक पिच नहीं की गई।"], "improvements_en": ["Never speculate on unverified information — clearly tell the customer 'I don't have this information, let me check and confirm' instead of inventing details.", "Improve call clarity/audio setup to avoid repeated 'sorry, can't hear' moments that erode customer confidence.", "Use the follow-up call to also do basic profiling (trading interest, objective) rather than only chasing documents."], "improvements_hi": ["अपुष्ट जानकारी पर कभी अंदाज़ा न लगाएं — जानकारी गढ़ने के बजाय स्पष्ट रूप से कहें 'मेरे पास यह जानकारी नहीं है, मैं जांचकर बताती हूँ'।", "कॉल की स्पष्टता/ऑडियो सेटअप सुधारें ताकि बार-बार 'सॉरी, सुनाई नहीं दे रहा' जैसे पल न आएं जो ग्राहक का भरोसा कम करते हैं।", "फॉलो-अप कॉल का उपयोग केवल दस्तावेज़ों के पीछे भागने के बजाय बुनियादी प्रोफाइलिंग (ट्रेडिंग रुचि, उद्देश्य) के लिए भी करें।"], "transcript": "[00:03] AGENT: Hello? Hello? Yes, good morning, s pose hai na?\n[01:52] AGENT: Mmm-hmm.\n[01:53] CUSTOMER: Ma'am Comat, Comat naam suna hai?\n[01:55] AGENT: Comat?\n[01:56] CUSTOMER: Mmm.\n[01:57] AGENT: Ek minute, nahi sir. Kiski baat kar rahe hain aap, Comat?\n[02:02] CUSTOMER: Comat ek trading purpose rehta na ma'am.\n[02:04] AGENT: Trading? Ek minute dekhti hoon sir, iska knowledge nahi hai mujhe. Comat Trading Company, right?\n[02:11] CUSTOMER: Hai kya?\n[02:13] AGENT: Ek minute main check karti hoon. Kyun sir? Aap usme kiya tha kya aapne?\n[02:19] CUSTOMER: Nahi nahi, aap thoda mere ko thodi jankari dijiye na. Hoti kya Comat?\n[02:26] AGENT: Ek minute...\n[02:34] AGENT: Ek minute batati hoon.\n[02:44] AGENT: Haan, Comat naam ki to multiple companies hongi sir. Aap trading ke liye hi baat kar rahe hain na?\n[02:49] CUSTOMER: Comat Global, Global wagera mein kya rehta madam? Global, wo usi ko bolte hain kya?\n[02:55] AGENT: Ek minute... Sir, actually mujhe iska knowledge nahi hai sir. Aap kya...\n[03:01] CUSTOMER: Nahi, wo to nahi hai aapko, par aati ki nahi aati matlab hai ki nahi ye sab mere ko batayie na.\n[03:06] AGENT: Mmm, Comat Global Group ki ek... ye trading aur distribution company group hai.\n[03:12] CUSTOMER: Achha.\n[03:13] AGENT: Haan.\n[03:13] CUSTOMER: Hai ye kya? Ye matlab aisa hai ki jo...\n[03:17] CUSTOMER: job wagera diya karte hain, matlab aisa kuch hai.\n[03:20] AGENT: Achha.\n[03:22] CUSTOMER: So job offer hai...\n[03:25] CUSTOMER: ...Comat mein. To main bol raha hoon ki matlab hai ki nahi, so farzi varzi kaam to nahi, aisa pooch raha tha aapse.\n[03:33] AGENT: Nahi sir, yahan se main check kar rahi hoon to hai. Matlab ye jo comp... ye jo company hai ye alag alag products ko import karke market mein distribute aur sell karti hai, sir. Iska business jaise cement aur construction material, food product...\n[03:47] CUSTOMER: Are yaar, ye nahi, ye nahi. Main to trading ka bol raha hoon. Trading wali hai kya koi?\n[03:51] AGENT: Maine Global Company, aapne mujhe Global ka bola na, to wahi maine check kiya hai.\n[03:55] CUSTOMER: Global nahi, maine Comat bola. Comat pehle bola.\n[03:57] AGENT: Comat Global, haan. Phir Global bhi to bola na aapne.\n[04:01] AGENT: Bahut sari companies hain Comat ke naam se, ek baar aap search kar lijiyega, sir.\n[04:05] CUSTOMER: Chalo.\n[04:06] AGENT: Hm. Baaki main aapko kab tak call kar loon, sir?\n[04:09] CUSTOMER: Mere ko do ek roz mein aap kariye, main aapka kaam karwata hoon, fir main...\n[04:13] AGENT: Thik hai, sir. Okay, thank you."}, {"call_id": "2026-08-25_Jayajain_03", "date": "2026-08-25", "scored_at": "2026-09-01T08:06:16", "agent": "Jaya jain", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-TBE395-7069884231-20260825-174425.wav.wav", "drive_file_id": "", "call_number": "", "phone_number": "7069884231", "language": "hi", "notes": "", "score": 4.0, "call_category": "Account Opening", "client_profile_en": "Male customer based in Pune, currently employed (referred to as 'duty'/job), has no stock market trading experience or knowledge, has an existing (seemingly unused/unaware) Kotak Mahindra demat account, and states he has no interest in stock market investing and no time to give it due to his job.", "client_profile_hi": "पुणे से एक पुरुष ग्राहक, जो वर्तमान में नौकरी ('duty') करता है, उसे शेयर बाजार में ट्रेडिंग का कोई अनुभव या ज्ञान नहीं है, उसका पहले से एक कोटक महिंद्रा डीमैट अकाउंट है (जिसके बारे में उसे खुद ठीक से जानकारी नहीं है), और वह कहता है कि उसे शेयर बाजार में निवेश में कोई रुचि नहीं है और नौकरी के कारण उसके पास समय नहीं है।", "summary_en": "The agent kept pushing a generic demat account pitch despite the customer clearly and repeatedly stating he had no interest and no time, resulting in a weak, unproductive close.", "summary_hi": "ग्राहक द्वारा बार-बार स्पष्ट रूप से रुचि न होने और समय न होने की बात कहने के बावजूद एजेंट ने सामान्य डीमैट खाता पिच जारी रखी, जिसके परिणामस्वरूप कमजोर और अनुत्पादक समापन हुआ।", "strengths_en": ["Agent clearly introduced herself and IIFL Capital and stated the purpose of the call upfront.", "Gathered some useful profiling facts such as location, profession, prior demat account, and lack of market experience."], "strengths_hi": ["एजेंट ने स्पष्ट रूप से अपना और IIFL Capital का परिचय दिया और कॉल का उद्देश्य शुरुआत में ही बताया।", "कुछ उपयोगी प्रोफाइलिंग जानकारी जुटाई जैसे स्थान, पेशा, पहले का डीमैट अकाउंट, और बाजार अनुभव की कमी।"], "issues_en": ["Customer said 'Kuch interest hi humko nahi hai' and later 'Nahi ma'am mere ko koi interest nahi hai' twice, yet the agent continued the same pitch instead of stopping or adapting.", "The pitch (Tata, Adani examples, long-term investing) was generic and disconnected from the customer's stated time constraints and lack of interest.", "Closing was weak — 'number save kar lijiye, future plan banta hai to call kar sakte hain' — no concrete next step or commitment secured."], "issues_hi": ["ग्राहक ने 'कुछ interest ही हमको नहीं है' और बाद में दो बार 'नहीं मैम मुझे कोई interest नहीं है' कहा, फिर भी एजेंट ने वही पिच जारी रखी और रुकी या अनुकूलित नहीं हुई।", "पिच (टाटा, अडानी के उदाहरण, लॉन्ग-टर्म निवेश) सामान्य थी और ग्राहक की बताई हुई समय की कमी और अरुचि से जुड़ी नहीं थी।", "क्लोजिंग कमजोर थी — 'नंबर सेव कर लीजिए, फ्यूचर प्लान बनता है तो कॉल कर सकते हैं' — कोई ठोस अगला कदम या प्रतिबद्धता तय नहीं हुई।"], "improvements_en": ["Respect a clear refusal the first time it's stated instead of pushing further, especially after repeated 'no interest' statements.", "Tailor the pitch to the customer's actual constraints (limited time, no experience) rather than reciting a generic script.", "If the customer declines, close professionally with a specific, low-pressure next step rather than a vague 'call in future'."], "improvements_hi": ["पहली बार स्पष्ट इनकार सुनते ही उसका सम्मान करें, आगे न धकेलें, खासकर जब ग्राहक बार-बार 'कोई रुचि नहीं' कहे।", "पिच को ग्राहक की वास्तविक सीमाओं (सीमित समय, अनुभव न होना) के अनुसार ढालें, न कि सामान्य स्क्रिप्ट दोहराएं।", "अगर ग्राहक मना करता है, तो एक स्पष्ट, बिना : Achha, job karte hain.\n[01:35] AGENT: Hello?\n[01:37] CUSTOMER: Haan, boliye na ma'am.\n[01:39] AGENT: Haan, aur kya... kahan pe... kahan se baat kar rahe hain vaise aap sir?\n[01:43] CUSTOMER: Pune.\n[01:44] AGENT: Pune se?\n[01:45] CUSTOMER: Haan.\n[01:46] AGENT: Achha, okay okay, theek hai. So isse pehle kabhi bhi Demat nahi open kiya aapne sir?\n[01:51] CUSTOMER: Nahi ma'am.\n[01:53] AGENT: Okay, to sir dekhiye aap IIFL join kar sakte hain na. Yahan se dekhiye abhi aapko aapne jaisa ki aapne bataya aapko abhi knowledge nahi hai market ka, to yahan se aapko learning seekhne ko milega, jaise aap long-term investment kar sakte hain. Stock market mein se kafi sari companies hain market mein, un company ke shares ko aap buy/sell kar sakte hain so, theek hai? Jaise kafi sari companies hain Tata ki companies hain, Tata ki companies mein aapne naam suna hoga Tata Power, Tata Steel, aur bahut sari company jaise Adani ki companies mein Adani 8, Adani Ports aapne naam suna hoga so.\n[02:22] CUSTOMER: Nahi ma'am wo sab nahi karna mere ko. Main abhi duty mein hu ma'am. Main time nahi de sakta usko.\n[02:27] AGENT: But sir agar ta- dekhiye long term mein to time nahi dena hota hai na. Agar ek time pe aapne koi sa share buy karke rakha hai bas aap usko buy karke rakh dete hain. Jab bhi aap free rahe free time mein aap un shares ko watch kar sakte hain so wo to long time ke liye rehta hai na sir? Wo to daily basis ke liye nahi hote hain sir ki aapko same day buy/sell karna hai to aap proper watch karenge.\n[02:47] CUSTOMER: Nahi ma'am mere ko koi interest nahi hai.\n[02:51] AGENT: Nahi karna aapko?\n[02:53] CUSTOMER: Nahi.\n[02:53] AGENT: Theek hai aap number save kar lijiye. In future plan banta hai to call kar sakte hain aap sir.\n[02:57] CUSTOMER: Okay, thank you."}, {"call_id": "2026-08-25_Jayajain_04", "date": "2026-08-25", "scored_at": "2026-09-01T08:07:11", "agent": "Jaya jain", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-TBE395-9781809159-20260825-103932.wav.wav", "drive_file_id": "", "call_number": "", "phone_number": "9781809159", "language": "hi", "notes": "", "score": 3.0, "call_category": "Account Opening", "client_profile_en": "Male customer who had earlier started a demat account process with IIFL (verified his mobile number) but did not complete it; he claims to have stock market knowledge and agrees to complete the process over the call, including sharing an OTP via WhatsApp. No further demographic or occupation details were gathered.", "client_profile_hi": "एक पुरुष ग्राहक जिसने पहले IIFL में डीमैट अकाउंट प्रोसेस शुरू किया था (मोबाइल नंबर वेरिफाई किया था) लेकिन उसे पूरा नहीं किया; वह स्टॉक मार्केट की जानकारी होने का दावा करता है और कॉल पर ही प्रोसेस पूरा करने के लिए राज़ी हो जाता है, जिसमें व्हाट्सएप पर OTP शेयर करना भी शामिल है। कोई अन्य डेमोग्राफिक या पेशे की जानकारी नहीं ली गई।", "summary_en": "The agent recovers a pending account-opening lead but causes repeated customer confusion and asks the customer to share the OTP, a serious compliance red flag, while the call ends without a clear completed next step.", "summary_hi": "एजेंट पेंडिंग अकाउंट-ओपनिंग लीड को दोबारा पकड़ती है लेकिन ग्राहक को बार-बार भ्रमित करती है और OTP शेयर करने के लिए कहती है, जो एक गंभीर कंप्लायंस रेड फ्लैग है, और कॉल बिना किसी स्पष्ट पूर्ण अगले कदम के समाप्त हो जाती है।", "strengths_en": ["Agent correctly identifies herself and IIFL Capital at the start of the call.", "Agent remains patient and keeps re-explaining despite the customer's repeated confusion."], "strengths_hi": ["एजेंट कॉल की शुरुआत में खुद को और IIFL कैपिटल को सही तरीके से पहचान बताती है।", "ग्राहक के बार-बार भ्रमित होने के बावजूद एजेंट धैर्यपूर्वक बार-बार समझाती रहती है।"], "issues_en": ["Agent directly asks the customer to 'share the OTP' with her ('OTP vagerah share kar denge aap mujhe sir?'), a serious compliance violation.", "Customer repeatedly confuses IIFL with HDFC and doesn't understand which process is being discussed, indicating poor clarity in the agent's explanation.", "No meaningful profiling was done beyond one quick 'knowledge hai stock market ka?' question, and the call ends abruptly without confirming completion or a next step."], "issues_hi": ["एजेंट सीधे ग्राहक से 'OTP शेयर करने' के लिए कहती है ('OTP vagerah share kar denge aap mujhe sir?'), जो एक गंभीर कंप्लायंस उल्लंघन है।", "ग्राहक बार-बार IIFL और HDFC में कन्फ्यूज़ होता है और समझ नहीं पाता कि किस प्रोसेस की बात हो रही है, जो एजेंट की व्याख्या में स्पष्टता की कमी दर्शाता है।", "सिर्फ एक जल्दी से पूछे गए 'knowledge hai stock market ka?' सवाल के अलावा कोई सार्थक प्रोफाइलिंग नहीं की गई, और कॉल बिना पूर्णता या अगले कदम की पुष्टि के अचानक समाप्त हो जाती है।"], "improvements_en": ["Never ask a customer to share an OTP directly with the agent — use only compliant, system-driven verification.", "Explain the process name and company clearly upfront to avoid repeated customer confusion.", "Confirm and close with a clear next step before ending the call, rather than trailing off mid-sentence."], "improvements_hi": ["ग्राहक से कभी भी सीधे OTP एजेंट के साथ शेयर करने के लिए न कहें — केवल कंप्लायंट, सिस्टम-आधारित वेरिफिकेशन का उपयोग करें।", "बार-बार होने वाली ग्राहक की उलझन से बचने के लिए प्रोसेस और कंपनी का नाम शुरू में ही स्पष्ट रूप से बताएं।", "कॉल को बीच में अधूरा छोड़ने के बजाय स्पष्ट अगले कदम की पुष्टि करके समाप्त करें।"], "transcript": "[00:04] AGENT: Hello? Yes sir, good morning. Jaya baat kar rahi hoon IIFL Capital Services se sir.\n[00:09] CUSTOMER: Haan ji.\n[00:10] AGENT: Haan. Actually sir aap apna demat account process kar rahe the IIFL mein, and ye process aapne abhi complete nahi kiya, pending show ho raha hai. Toh main aapko help kar doon complete karne ke liye sir?\n[00:20] CUSTOMER: Kahan pe ma'am?\n[00:22] AGENT: IIFL mein aapne apna mobile number verify kiya hua tha sir.\n[00:25] CUSTOMER: Haan ji.\n[00:26] AGENT: Haan, toh ye complete nahi kiya process, toh main help kar doon aapko ye process complete karne ke liye?\n[00:33] CUSTOMER: Keda कोई डेमोग्राफिक जानकारी (उम्र, लिंग, पेशा, आय) न तो बताई गई और न ही ली गई।", "summary_en": "The agent's step-by-step guidance was vague and caused repeated customer confusion, and he abruptly left the call mid-task to take another call without closing the setup or confirming a next step.", "summary_hi": "एजेंट का चरण-दर-चरण मार्गदर्शन अस्पष्ट था जिससे ग्राहक बार-बार भ्रमित हुआ, और उसने सेटअप पूरा किए या अगला कदम तय किए बिना बीच में ही एक और कॉल लेने के लिए बातचीत छोड़ दी।", "strengths_en": ["Agent remained calm and cooperative while the customer struggled to locate menu options.", "Agent adjusted the instruction path (from 'Manage My Profile' to 'Fund/Add Fund') when the customer got stuck."], "strengths_hi": ["जब ग्राहक मेनू विकल्प ढूंढने में संघर्ष कर रहा था तब एजेंट शांत और सहयोगी रहा।", "जब ग्राहक अटक गया तो एजेंट ने निर्देश का रास्ता बदला ('Manage My Profile' से 'Fund/Add Fund' की ओर)।"], "issues_en": ["Instructions were imprecise ('sabse upar dikha raha hoga'), forcing the customer to repeatedly ask 'kahan hai' and navigate blindly.", "Agent abruptly stepped away mid-task ('important call aa raha hai') while the customer was still adding a bank account, leaving the process unfinished.", "No confirmation of task completion or scheduling of a follow-up before ending the call."], "issues_hi": ["निर्देश अस्पष्ट थे ('सबसे ऊपर दिखा रहा होगा'), जिससे ग्राहक को बार-बार 'कहां है' पूछना पड़ा और अंधाधुंध नेविगेट करना पड़ा।", "एजेंट बीच में ही ('important call आ रहा है') काम अधूरा छोड़कर चला गया जबकि ग्राहक अभी भी बैंक खाता जोड़ रहा था।", "कॉल खत्म करने से पहले कार्य पूर्णता की पुष्टि या फॉलो-अप शेड्यूल नहीं किया गया।"], "improvements_en": ["Give precise, screen-specific navigation steps instead of generic references like 'upar dikha raha hoga'.", "Never disconnect or divert mid-process without completing the current task or explicitly scheduling a callback.", "Confirm at the end that the bank account/fund addition was successfully completed before closing."], "improvements_hi": ["सामान्य संदर्भों जैसे 'ऊपर दिखा रहा होगा' के बजाय स्क्रीन-विशिष्ट सटीक नेविगेशन चरण दें।", "किसी भी प्रक्रिया के बीच में मौजूदा कार्य पूरा किए बिना या स्पष्ट रूप से कॉलबैक शेड्यूल किए बिना कभी डिस्कनेक्ट या डायवर्ट न करें।", "कॉल बंद करने से पहले पुष्टि करें कि बैंक खाता/फंड जोड़ने का काम सफलतापूर्वक पूरा हो गया है।"], "transcript": "[00:01] CUSTOMER: Hello.\n[00:02] CUSTOMER: Ho gaya sir, sab kuch ho gaya hai.\n[00:04] AGENT: Acha ho gaya.\n[00:05] CUSTOMER: Hm, OTP dal gayi hai. Re-verify OTP lagbhag fir maang raha hai.\n[00:12] CUSTOMER: Haan, ye dal gayi hai wapas se.\n[00:14] CUSTOMER: Aa gayi hai.\n[00:16] CUSTOMER: Aur ye maine ok bhi kar diya hai.\n[00:18] CUSTOMER: Ye verify bhi ho gayi hai.\n[00:21] CUSTOMER: Setup device success ho gaya hai.\n[00:24] CUSTOMER: Setup device lap- to jo apne paas hai wahi... theek hai wapas se wahi kar deta hoon.\n[00:28] AGENT: Hm-hm, wahi kariye.\n[00:29] CUSTOMER: Theek hai, ye done ho gaya hai.\n[00:33] CUSTOMER: Ab ye aa gaya sab kuch jo aapne bataya tha. Ab stock pe karoon na?\n[00:37] AGENT: Haan, stock... us pe jaiye My Profile pe.\n[00:41] CUSTOMER: My Profile.\n[00:47] AGENT: Manage My Profile.\n[01:01] CUSTOMER: Manage My Profile kahan hai ye?\n[01:06] CUSTOMER: Pehle aapne stock pe jaane ko bola tha, stock...\n[01:13] CUSTOMER: Ye kahan se dekhna hai sir ye Manage My Profile? Hm?\n[01:17] CUSTOMER: Manage My Profile kahan- kahan milegi ye aapne ko?\n[01:20] AGENT: Manage My Profile pe jaiye, wo us pe jaana hai aapko, sabse home page aa raha hai na us pe dikhega.\n[01:27] CUSTOMER: Home page pe to Mutual Fund, Stock, Home likha hua...\n[01:30] AGENT: Sabse upar dikha raha hoga Manage My Profile.\n[01:34] AGENT: Ya aap to direct idhar Fund wale pe jaiye aur Add Fund wale pe chal jaiye, directly wahi pe open ho jayega.\n[01:42] CUSTOMER: Mutual Fund, Start SIP, Balance, Transaction, Realized Report, Advance Option...\n[02:14] AGENT: Haan sir.\n[02:15] CUSTOMER: Balance pe jaaoon kya Balance pe?\n[02:17] AGENT: Haan, Balance pe jaana hai. Balance wale pe aapko jaana hai Add... Add New Bank Account.\n[02:26] CUSTOMER: Ek min, Balance pe gaya to Ledger likha hai, Trading likha hai, View likha hai... Bank Accounts likha hua hai. Haan 1 in-\n[02:33] AGENT: Add... Add New Bank Account.\n[02:37] CUSTOMER: Risk Report...\n[02:40] CUSTOMER: Add Funds... nahi, Add Funds ka aaya to...\n[02:44] AGENT: Funds wala option aa raha hai aapko?\n[02:46] CUSTOMER: Likha Add Funds likha hua hai na to uspe touch kar doon?\n[02:49] CUSTOMER: Ye Add Funds kar diya humne.\n[02:52] CUSTOMER: Aur Add New Bank kar diya aapne...\n[02:54] CUSTOMER: Ye Add New Bank kar diya.\n[03:01] CUSTOMER: State Bank aa raha tha to add-\n[03:03] AGENT: Haan usko kariye. Ek mera important call aa raha hai, kya main use receive kar loon kya?\n[03:06] CUSTOMER: Haan, bilkul bilkul wo kar lijiye sir, koi dikkat nahi sir.\n[03:08] AGENT: Isse cut kar ke."}, {"call_id": "2026-08-25_Jayajain_05", "date": "2026-08-25", "scored_at": "2026-09-01T12:12:30", "agent": "Jaya jain", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-TBE395-9855099262-20260825-184857.wav.wav", "drive_file_id": "", "call_number": "", "phone_number": "9855099262", "language": "hi", "notes": "", "score": 6.0, "call_category": "Account Opening", "client_profile_en": "Male customer (Rajwant) running a kirana (grocery) shop in Amritsar; has no demat account and no stock market trading experience; had considered starting trading but has not found time due to shop work; asked for a callback the next day after 10 AM.", "client_profile_hi": "पुरुष ग्राहक (रजवंत) अमृतसर में किराने की दुकान चलाते हैं; उनका कोई डीमैट अकाउंट नहीं है और शेयर मार्केट में कोई ट्रेडिंग अनुभव नहीं है; ट्रेडिंग शुरू करने की सोची थी लेकिन दुकान के काम के कारण समय नहीं मिला; अगले दिन सुबह 10 बजे के बाद कॉलबैक मांगा।", "summary_en": "The agent maintained a polite, patient tone and secured a callback, but the pitch became a rambling, unfocused overload of unrelated stock/sector examples instead of a tight, relevant recommendation.", "summary_hi": "एजेंट ने विनम्र और धैर्यपूर्ण टोन बनाए रखी और कॉलबैक तय किया, लेकिन पिच एक फोकस्ड और relevant सुझाव के बजाय असंबंधित स्टॉक/सेक्टर उदाहरणों से भरी, बेतरतीब और ओवरलोडेड बन गई।", "strengths_en": ["Agent remained calm, respectful and patient despite the customer repeatedly saying he lacked time.", "Secured a concrete next step by scheduling a callback for a specific time the next day.", "Did basic contextual profiling (occupation, location, no prior demat/experience) before pitching."], "strengths_hi": ["ग्राहक द्वारा बार-बार समय न होने की बात कहने पर भी एजेंट शांत, सम्मानजनक और धैर्यशील रही।", "अगले दिन एक निश्चित समय पर कॉलबैक तय करके ठोस नेक्स्ट स्टेप सुरक्षित किया।", "पिच करने से पहले बुनियादी संदर्भ जानकारी (पेशा, स्थान, पहले का कोई डीमैट/अनुभव नहीं) ली।"], "issues_en": ["Pitch drifted into a long, generic tangent about sugar and petrol prices/stocks with specific price figures, unrelated to the customer's stated need or buying signal.", "Continued pushing the demat pitch even after the customer twice said 'abhi time nahi hai', delaying the natural close.", "Profiling stayed surface-level (occupation, no experience) without exploring the customer's actual objective or concerns about time/learning."], "issues_hi": ["पिच शक्कर और पेट्रोल के दामों/स्टॉक्स के बारे में एक लंबे, सामान्य विषयांतर में चली गई जिसमें specific price figures दी गईं, जो ग्राहक की जरूरत या buying signal से जुड़ी नहीं थीं।", "ग्राहक द्वारा दो बार 'अभी समय नहीं है' कहने के बावजूद एजेंट डीमैट पिच पर जोर देती रही, जिससे स्वाभाविक क्लोजिंग में देरी हुई।", "प्रोफाइलिंग सतही ही रही (पेशा, कोई अनुभव नहीं) — ग्राहक के असली उद्देश्य या समय/सीखने से जुड़ी चिंताओं को नहीं समझा गया।"], "improvements_en": ["Cut the sugar/petrol/stock-price tangent short and connect examples directly to a benefit relevant to the customer's situation.", "Acknowledge the customer's time constraint immediately and move faster to scheduling a callback let LANG = 'en';

function setLang(lang) {
  LANG = lang;
  document.getElementById('langEnBtn').classList.toggle('active', lang === 'en');
  document.getElementById('langHiBtn').classList.toggle('active', lang === 'hi');
  renderTable();
  if (window.__openCallIdx !== undefined && window.__openCallIdx !== null) {
    openModal(DATA[window.__openCallIdx], window.__openCallIdx);
  }
}

// Reads e.g. pick(call, 'summary') -> call.summary_hi if LANG is hi and it
// has content, else falls back to English (covers older rows scored before
// bilingual output existed).
function pick(call, base) {
  const localized = call[base + '_' + LANG];
  const isEmpty = localized === undefined || localized === null || localized === '' ||
    (Array.isArray(localized) && localized.length === 0);
  return isEmpty ? call[base + '_en'] : localized;
}

function scoreColor(s) {
  if (s === null || s === undefined || isNaN(s)) return "#888";
  if (s >= 8) return "#4ade80";
  if (s >= 6) return "#facc15";
  if (s >= 4) return "#fb923c";
  return "#f87171";
}

function esc(s) {
  return (s || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function displayFilename(path, phoneNumber) {
  // Shows just the filename for the modal, not the full stored path, and
  // strips any trailing extension(s) — including doubled ones like
  // ".wav.wav" — mirroring strip_trailing_extension_noise() in
  // lib/agent_resolver.py so both stay consistent. The underlying
  // call.audio_file value itself is left untouched — this only affects
  // what's shown here.
  if (!path) return '';
  let name = path.split(/[\\/]/).pop();
  for (let i = 0; i < 5; i++) {
    let next = name.replace(/\.[A-Za-z0-9]{2,5}$/, '');
    next = next.replace(/\s*\(\d+\)$/, '');
    if (next === name) break;
    name = next;
  }
  // Phone numbers are sensitive — mask everything except the first 2 and
  // last 3 digits within the filename (the number itself, e.g. in
  // call.phone_number, is a separate field and isn't touched by this).
  if (phoneNumber && phoneNumber.length > 5 && name.includes(phoneNumber)) {
    const masked = phoneNumber.slice(0, 2) + '*'.repeat(phoneNumber.length - 5) + phoneNumber.slice(-3);
    name = name.replace(phoneNumber, masked);
  }
  return name;
}

function teamOf(agent) {
  const key = (agent || '').trim().toLowerCase();
  return (AGENT_TEAM[key] && AGENT_TEAM[key].team) || 'Unassigned';
}

function branchOf(agent) {
  const key = (agent || '').trim().toLowerCase();
  return (AGENT_TEAM[key] && AGENT_TEAM[key].branch) || '';
}

function managerOf(agent) {
  const key = (agent || '').trim().toLowerCase();
  return (AGENT_TEAM[key] && AGENT_TEAM[key].manager) || '';
}

function codeOf(agent) {
  const key = (agent || '').trim().toLowerCase();
  return (AGENT_TEAM[key] && AGENT_TEAM[key].code) || '';
}

        ${call.audio_file ? `<div style="color:var(--muted); font-size:11.5px; margin-top:2px; word-break:break-all;">${esc(displayFilename(call.audio_file, call.phone_number))}</div>` : ''}

      <span style="color:var(--muted); font-size:13px;">/ 10</span>
    </div>

    </div>
    <div class="modal-section">
      <h4>Summary</h4>
      <div style="font-size:13.5px; line-height:1.5;">${esc(pick(call,'summary')) || '<span style="color:var(--muted)">No summary</span>'}</div>
    </div>

      ${listOrNone(pick(call,'strengths'), 'tag-strength')}
