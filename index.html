now about Algo Trading') as required for digital leads.", "Secured a concrete callback window (4-5 PM) instead of a vague follow-up.", "Maintained a polite, non-pushy tone despite the customer being busy."], "strengths_hi": ["एजेंट ने डिजिटल लीड के लिए आवश्यक सही लीड स्रोत का उल्लेख किया ('आपको एल्गो ट्रेडिंग के बारे में जानना है')।", "अस्पष्ट फॉलो-अप के बजाय एक निश्चित कॉलबैक समय (4-5 बजे) तय किया।", "ग्राहक के व्यस्त होने के बावजूद विनम्र और गैर-दबावपूर्ण लहजा बनाए रखा।"], "issues_en": ["Agent never asked if it was a good time before launching into the pitch context, missing the customer's cue until he said he was busy.", "No profiling questions were asked at all (e.g., trading experience, interest in algo trading) before the call ended.", "Call ended abruptly with just 'Okay okay, sir, fine' — no confirmation of number, name check, or thank-you closing."], "issues_hi": ["पिच शुरू करने से पहले एजेंट ने यह नहीं पूछा कि क्या यह बात करने का सही समय है, और ग्राहक के व्यस्त कहने तक इसका पता नहीं चला।", "कॉल समाप्त होने से पहले कोई प्रोफाइलिंग प्रश्न (जैसे ट्रेडिंग अनुभव, एल्गो ट्रेडिंग में रुचि) नहीं पूछे गए।", "कॉल 'ठीक है ठीक है सर, ठीक है' कहकर अचानक समाप्त हो गई — कोई नंबर पुष्टि, नाम जांच या धन्यवाद क्लोजिंग नहीं थी।"], "improvements_en": ["Ask 'Is this a good time to talk?' right at the start before referencing the lead topic.", "Even in a short call, quickly ask one profiling question (e.g., 'Are you already trading or new to this?') to use the callback time better.", "Confirm the callback time clearly and close with a polite thank-you and reassurance of the follow-up."], "improvements_hi": ["लीड विषय का उल्लेख करने से पहले शुरुआत में ही पूछें 'क्या अभी बात करने का सही समय है?'", "छोटी कॉल में भी, कॉलबैक समय का बेहतर उपयोग करने के लिए एक त्वरित प्रोफाइलिंग प्रश्न पूछें (जैसे 'क्या आप पहले से ट्रेडिंग कर रहे हैं या नए हैं?')।", "कॉलबैक समय की स्पष्ट पुष्टि करें और विनम्र धन्यवाद के साथ फॉलो-अप का आश्वासन देकर कॉल समाप्त करें।"], "transcript": "[00:02] AGENT: Hello?\n[00:04] AGENT: Ah good morning sir.\n[00:06] CUSTOMER: Good morning.\n[00:07] AGENT: Ah sir actually, I am calling from Bilsai. Your number was registered from our company site. You want to know something about Algo Trading, right?\n[00:20] CUSTOMER: Yes, I am a bit busy.\n[00:23] AGENT: Ah, when should I call back, tell me sir?\n[00:31] CUSTOMER: In the afternoon.\n[00:32] CUSTOMER: Means call around four to five.\n[00:34] AGENT: Okay okay, sir, fine."}, {"call_id": "2026-08-17_UNMAPPED_TBE623_02", "date": "2026-08-17", "scored_at": "2026-08-24T23:06:22", "agent": "UNMAPPED_TBE623", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-532_TBE623-8207229653-20260817-093256.wav.wav", "call_number": "", "phone_number": "8207229653", "language": "bn", "notes": "", "score": 3.0, "client_profile_en": "The call was answered by a woman on a home phone number registered under her husband's name, Mamun Mulla; the husband was at work and expected home only at night, with no alternate contact number available; no discussion of financial needs or interests took place since the intended lead was unreachable.", "client_profile_hi": "यह कॉल एक महिला ने उठाई, जिसका घरेलू नंबर उसके पति मामून मुल्ला के नाम पर पंजीकृत था; पति काम पर गए हुए थे और रात को ही घर आने की उम्मीद थी, तथा उनका कोई वैकल्पिक नंबर उपलब्ध नहीं था; चूंकि असली लीड (पति) से बात नहीं हो सकी, इसलिए किसी वित्तीय आवश्यकता या रुचि पर चर्चा नहीं हुई।", "summary_en": "The agent never reached the actual lead and left without a proper introduction, profiling, or pitch, only securing a weak third-party callback request.", "summary_hi": "एजेंट असली लीड से बात नहीं कर पाया और बिना उचित परिचय, प्रोफाइलिंग या पिच के कॉल खत्म कर दी, सिर्फ एक कमजोर कॉलबैक अनुरोध पत्नी के माध्यम से छोड़ा गया।", "strengths_en": ["Agent remained polite and calm throughout the interaction with the wife.", "Attempted to leave a WhatsApp message and requested a specific callback time (by 6 PM)."], "strengths_hi": ["एजेंट पूरी बातचीत के दौरान विनम्र और शांत रहा।", "व्हाट्सएप पर संदेश छोड़ने का प्रयास किया और एक निश्चित कॉलबैक समय (शाम 6 बजे तक) मांगा।"], "issues_en": ["Agent never introduced himself or named the company, only vaguely saying 'your number was registered from our company side'.", "No permission was sought before guessing the purpose ('You want to know something about SIP, right? Share market related?'), which sounds like a fishing question rather than a clear pitch.", "No profiling or pitch was possible since the actual lead was unavailable, and the follow-up plan relies entirely on the wife relaying the message."], "issues_hi": ["एजेंट ने कभी अपना परिचय नहीं दिया या कंपनी का नाम नहीं बताया, सिर्फ अस्पष्ट रूप से कहा 'आपका नंबर हमारी कंपनी की तरफ से रजिस्टर्ड है'।", "उद्देश्य का अनुमान लगाने से पहले अनुमति नहीं मांगी गई ('आपको SIP के बारे में जानना है ना? शेयर मार्केट से रिलेटेड?'), जो स्पष्ट पिच के बजाय अनुमान लगाने जैसा लगता है।", "असली लीड उपलब्ध न होने के कारण कोई प्रोफाइलिंग या पिच संभव नहीं हो सकी, और फॉलो-अप योजना पूरी तरह पत्नी द्वारा संदेश पहुंचाने पर निर्भर है।"], "improvements_en": ["Start with a clear, confident introduction stating agent name, company, and exact purpose of the call.", "Confirm a firm callback slot or offer to call back at a specific time rather than leaving it entirely to a third party.", "Avoid guessing the customer's interest ('SIP, right?') — instead state the actual reason for calling clearly."], "improvements_hi": ["स्पष्ट और आत्मविश्वास से भरे परिचय के साथ शुरुआत करें जिसमें एजेंट का नाम, कंपनी और कॉल का सटीक उद्देश्य बताया जाए।", "एक निश्चित कॉलबैक समय तय करें या खुद कॉल करने की पेशकश करें, बजाय इसके कि पूरी बात तीसरे व्यक्ति पर छोड़ दी जाए।", "ग्राहक की रुचि का अनुमान न लगाएं ('SIP, right?') — इसके बजाय कॉल का असली कारण स्पष्ट रूप से बताएं।"], "transcript": "[00:00] AGENT: Hello? [audio unclear or repeating here — collapsed from 3 near-identical segments]\n[00:06] CUSTOMER: Hello.\n[00:07] AGENT: Good morning, good morning, ma'am.\n[00:10] CUSTOMER: Good morning.\n[00:11] AGENT: Is this your number, ma'am?\n[00:14] CUSTOMER: Yes.\n[00:16] AGENT: Okay. Actually, your number was registered from our company side. You want to know something about SIP, right?\n[00:24] AGENT: Share market related?\n[00:29] CUSTOMER: This is our home number, who knows whose number it is. I won't be able to say anything.\n[00:35] AGENT: Okay. Is Mamun Mulla someone—is this your name, Mamun?\n[00:41] CUSTOMER: Yes, this is my husband's name.\n[00:44] AGENT: Okay. Actually, your husband's side felt from your—so can you talk to your husband now?\n[00:52] CUSTOMER: No, he is not at home now, he has gone to work.\n[00:57] AGENT: Okay, when will he come?\n[00:59] CUSTOMER: He comes at night.\n[01:01] AGENT: Okay, does he have any other number? That is—which can be connected with him, any other number of his?\n[01:07] CUSTOMER: No, he has no other number.\n[01:10] AGENT: Okay. Okay, then I have messaged on WhatsApp as well, okay? So once you'll say, reply to it or if he comes, then ask him to call once within 6 o'clock, okay?\n[01:20] CUSTOMER: Okay, fine.\n[01:21] AGENT: Okay, okay, thank you."}, {"call_id": "2026-08-21_UNMAPPED_TBE623_02", "date": "2026-08-21", "scored_at": "2026-08-24T23:06:42", "agent": "UNMAPPED_TBE623", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-532_TBE623-8207229653-20260821-101922.wav.wav", "call_number": "", "phone_number": "8207229653", "language": "bn", "notes": "", "score": 3.0, "client_profile_en": "Customer has no prior experience with Algo Trading and explicitly stated he is not interested in doing it. No other demographic or contact details were gathered.", "client_profile_hi": "ग्राहक ने पहले कभी एल्गो ट्रेडिंग नहीं की है और स्पष्ट रूप से कहा कि वह इसमें रुचि नहीं रखता। कोई अन्य जनसांख्यिकीय या संपर्क विवरण एकत्र नहीं किया गया।", "summary_en": "The agent's vague, confusing opening ('regarding a bill') led to an immediate rejection with no pitch delivered or next step secured.", "summary_hi": "एजेंट की अस्पष्ट और भ्रमित करने वाली शुरुआत ('बिल के संबंध में') के कारण ग्राहक ने तुरंत मना कर दिया, न कोई पिच दी गई और न ही अगला कदम तय हुआ।", "strengths_en": ["Agent maintained a polite, respectful tone throughout the brief exchange.", "Asked one relevant profiling question about prior Algo Trading experience."], "strengths_hi": ["एजेंट ने संक्षिप्त बातचीत में विनम्र और सम्मानजनक लहजा बनाए रखा।", "एल्गो ट्रेडिंग के पूर्व अनुभव के बारे में एक प्रासंगिक प्रोफाइलिंग प्रश्न पूछा।"], "issues_en": ["Opening was confusing and misleading, starting with 'regarding a bill' instead of a clear company introduction and purpose.", "No permission was taken to check if it was a good time to talk.", "No pitch or value proposition was delivered before the customer disengaged, so no next step was secured."], "issues_hi": ["शुरुआत भ्रमित करने वाली और गुमराह करने वाली थी, स्पष्ट कंपनी परिचय और उद्देश्य के बजाय 'बिल के संबंध में' कहकर शुरुआत की गई।", "बात करने के लिए सही समय है या नहीं, इसकी अनुमति नहीं ली गई।", "ग्राहक के मना करने से पहले कोई पिच या वैल्यू प्रपोजिशन नहीं दिया गया, इसलिए कोई अगला कदम तय नहीं हुआ।"], "improvements_en": ["Start with a clear, honest introduction stating the company name and exact purpose of the call.", "Ask permission before diving into the topic to build trust and reduce early rejection.", "Even after a decline, attempt a soft close or ask for a better time to reconnect instead of ending abruptly."], "improvements_hi": ["स्पष्ट और ईमानदार परिचय के साथ शुरुआत करें, कंपनी का नाम और कॉल का सटीक उद्देश्य बताएं।", "विषय में जाने से पहले अनुमति मांगें ताकि भरोसा बने और शुरुआती अस्वीकृति कम हो।", "मना करने के बाद भी सॉफ्ट क्लोज़ की कोशिश करें या दोबारा संपर्क के लिए बेहतर समय पूछें, अचानक कॉल समाप्त न करें।"], "transcript": "[00:01] AGENT: Hello.\n[00:03] CUSTOMER: Hello.\n[00:04] AGENT: Hello, sir. Good morning, sir.\n[00:07] CUSTOMER: Ah, good morning.\n[00:09] AGENT: Sir, we were talking regarding a bill. Actually, your number was registered from our company's side.\n[00:17] AGENT: You had some recommendations regarding Share Bazar Algo Trading, right?\n[00:23] CUSTOMER: Yeah.\n[00:24] AGENT: So, have you done any Algo Trading before, or is this the first time you'll be doing it, sir?\n[00:29] CUSTOMER: No, I haven't done it before. And I don't want to do it either, you can keep your phone down."}, {"call_id": "2026-08-21_UNMAPPED_TBE623_03", "date": "2026-08-21", "scored_at": "2026-08-24T23:07:23", "agent": "UNMAPPED_TBE623", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-532_TBE623-9933555815-20260821-171348.wav.wav", "call_number": "", "phone_number": "9933555815", "language": "bn", "notes": "", "score": 7.0, "client_profile_en": "Male client with existing demat accounts on Groww and Paytm Money, but has not actively traded on them due to lack of experience. He is completely new to algo trading and has never tried it before. He works (mentions having a showroom) and is only available for calls after 9-10am or around 7:30pm.", "client_profile_hi": "पुरुष ग्राहक के पास Groww और Paytm Money पर पहले से डीमैट अकाउंट हैं, लेकिन अनुभव की कमी के कारण उन्होंने उन पर सक्रिय रूप से ट्रेडिंग नहीं की है। वे एल्गो ट्रेडिंग में पूरी तरह नए हैं और इसे पहले कभी नहीं आजमाया। वे काम करते हैं (उनका एक शोरूम है) और सुबह 9-10 बजे के बाद या शाम करीब 7:30 बजे ही कॉल के लिए उपलब्ध हैं।", "summary_en": "The agent profiled the client well and secured a clear callback time, but the opening lacked a proper self/company introduction and one comment on profits bordered on promotional language.", "summary_hi": "एजेंट ने ग्राहक की अच्छी प्रोफाइलिंग की और स्पष्ट कॉलबैक समय तय किया, लेकिन शुरुआत में उचित परिचय (स्वयं/कंपनी) नहीं दिया गया और मुनाफे पर की गई एक टिप्पणी प्रचारात्मक भाषा के करीब थी।", "strengths_en": ["Asked relevant profiling questions covering prior algo trading experience and existing demat accounts (Groww, Paytm Money).", "Maintained a calm, patient tone throughout, letting the customer explain his schedule constraints.", "Secured a concrete next step by locking in specific callback windows (evening ~7:30 or morning after 9-10am)."], "strengths_hi": ["पिछले एल्गो ट्रेडिंग अनुभव और मौजूदा डीमैट अकाउंट्स (Groww, Paytm Money) से जुड़े प्रासंगिक प्रोफाइलिंग सवाल पूछे।", "पूरी बातचीत में शांत, धैर्यपूर्ण टोन बनाए रखी और ग्राहक को अपनी व्यस्तता समझाने दी।", "शाम करीब 7:30 या सुबह 9-10 बजे के बाद जैसे स्पष्ट कॉलबैक समय तय करके अगला कदम सुनिश्चित किया।"], "issues_en": ["Agent never clearly stated his own name or the company name — only a vague 'apnar number ta register hoyechilo amader company side theke'.", "The line 'konitate apnar profit hobe ki na sob rokom amra guide di' is a borderline promotional/assurance statement about profit outcomes.", "Permission to speak ('apni ki free achen') was asked only after the pitch had already started, not at the opening."], "issues_hi": ["एजेंट ने कभी भी अपना नाम या कंपनी का नाम स्पष्ट रूप से नहीं बताया — केवल 'आपका नंबर हमारी कंपनी की तरफ से रजिस्टर हुआ था' जैसा अस्पष्ट वाक्य कहा।", "'कोई भी हो, प्रॉफिट होगा या नहीं सब हम गाइड करते हैं' यह पंक्ति मुनाफे को लेकर सीमारेखा वाला प्रचारात्मक/आश्वासन जैसा बयान है।", "बात करने की अनुमति ('क्या आप अभी फ्री हैं') पिच शुरू होने के बाद ही पूछी गई, शुरुआत में नहीं।"], "improvements_en": ["Open every call with a clear self-introduction and company name before asking anything else.", "Avoid any language that links algo trading to guaranteed profit; instead emphasize risk and process transparency.", "Ask for permission to talk right at the start, before pitching, not midway through the call."], "improvements_hi": ["हर कॉल की शुरुआत स्पष्ट रूप से अपना और कंपनी का नाम बताकर करें, उसके बाद ही अन्य सवाल पूछें।", "एल्गो ट्रेडिंग को गारंटीड मुनाफे से जोड़ने वाली किसी भी भाषा से बचें; इसके बजाय जोखिम और प्रक्रिया की पारदर्शिता पर जोर दें।", "पिच शुरू करने से पहले, कॉल की शुरुआत में ही बात करने की अनुमति मांगें, बीच में नहीं।"], "transcript": "[00:05] AGENT: Hello good evening sir.\n[00:08] CUSTOMER: Ha bolun. a sir. 15 minute se try kar rahi hoon, nahi lag raha hai, nahi lag raha hai. Maine laga pata nahi kya problem aa raha hai.\n[00:59] CUSTOMER: Acha.\n[01:00] AGENT: Aur bataiye phir? Bas badhiya, ye photo kahan ka hai sir jo aapne mujhe WhatsApp pe bheja hai? Shivling ka?\n[01:07] CUSTOMER: Ye Banaras ka hai.\n[01:08] AGENT: Acha, Banaras ke? Okay, okay, okay. Shivling ka hai na wo, matlab Jyotirlinga?\n[01:15] CUSTOMER: Hmm, hmm.\n[01:16] AGENT: Banaras mein kaunse, uh, Jyotirlinga aate hain?\n[01:20] CUSTOMER: Vishwanath, Vishwanath temple.\n[01:22] AGENT: Acha, Vishwanath Ji, okay, okay. Aaj ka hai?\n[01:25] CUSTOMER: Haan, haan, aaj ka hai.\n[01:27] AGENT: Arey wah wah! Sab darshan ho gaye?\n[01:29] CUSTOMER: Kisi ne bheja hai humko bhi to bheja hai unhone.\n[01:31] AGENT: Ji, ji, ji, badhiya hai, badhiya hai sir.\n[01:33] CUSTOMER: Hamare paas to daily aata hai.\n[01:34] AGENT: Main to gayi hi nahi sir abhi tak Banaras.\n[01:37] CUSTOMER: Acha. Ye Banaras ke jo Shivling hai na ye,\n[01:43] AGENT: Hmm.\n[01:44] CUSTOMER: Wo jo Muslim kaun tha jo mandir tod raha tha, kya naam tha wo, masjid bana diya hai na bagal mein, jahan pehle Shiv Ji the, us time, Baba Vishwanath, theek hai na? To jahan Nandi Ji the wahan par wo masjid tha, Nandi Ji ke samne kuan mein hi wo Shivling daal diya tha. Jab ye thi na, kya naam tha aapke Madhya Pradesh ki Ahilyabai,\n[02:13] AGENT: Hmm, hmm, hmm.\n[02:14] CUSTOMER: Ahilyabai, wo kaun maharani thi?\n[02:16] AGENT: Ahilyabai, yes sir, Indore nagari, Indore ki,\n[02:20] CUSTOMER: Wahi hai na? Haan, to wahi jitne mandir tode the ye Musalman sab,\n[02:25] AGENT: Ye masjid, masjid jo the wo Mughal Baadshah the na Aurangzeb?\n[02:29] CUSTOMER: Haan, haan. To wo aayi Banaras, jitne wo mandir,\n[02:33] AGENT: inhone hi to banwai thi masjid.\n[02:35] CUSTOMER: Hmm. To wo jitne mandir poore Bharat mein tode the ye Mughal sab, Ahilyabai in sabhi jagah nirman karati thi.\n[02:44] AGENT: Okay, okay, okay. Acha, to ye usi ki wajah se bana hua hai na? Okay, okay.\n[02:48] CUSTOMER: Nahi, to bata rahe hain, kahani to suno.\n[02:50] AGENT: Hmm, hmm, bataiye, bataiye.\n[02:51] CUSTOMER: Jab wo Banaras aayi, to wo jo bhi Brahman devta the, Brahman log wahan par, to boli Shiv Ji ko khojenge. To wo log bole ki Shiv Ji to kuan mein hain. Jab kuan mein utar ke gayi, to wahan to Shiv Ji the nahi.\n[03:06] AGENT: Ji, ji.\n[03:07] CUSTOMER: To boli ki humko rudrabhishek karna hai. Humko mandir ka nirman karana hai, to jaiye pehle... Wo jab gayi to wahan par to Shiv Ji the nahi, khoji to.\n[03:15] AGENT: Hmm.\n[03:16] CUSTOMER: Bahut rone lagi. Rone lagi to Shiv Ji unko sapne mein aakar bole ki tum wahan jo kya hai ye Gujarat mein kaun sa nadi hai? Narmadeshwar. Hello?\n[03:37] AGENT: Kaun si nadi sir?\n[03:39] CUSTOMER: Narmadeshwar Gujarat mein hai. Narmada nadi,\n[03:43] AGENT: Hmm, hmm, hmm.\n[03:44] CUSTOMER: Haan, to wo bole ki aap tum wahi par jao, tumhare god mein hi jo Narmadeshwar milenge, wahi Shivling ko lekar yahan par tum sthapit karna. Main wahi hoon.\n[03:58] AGENT: Acha, Sardar Sarovar dam jo hai.\n[04:02] CUSTOMER: Narmada nadi hai Gujarat mein, theek hai na?\n[04:05] AGENT: Narmada nadi hai, Tapti nadi bhi hai, Mahi hai aur Sabarmati hai. Teen char nadiya hain.\n[04:12] CUSTOMER: Haan, hum Narmada nadi ki baat kar rahe hain. Usme jo Shiv Ji hain na, jaise ek hamare pitaji ke dost hain pandit ji, jo hum logon ke astitva hain, to wo bhi jab wahan Gujarat mein Narmada nadi mein nahar rahe the na, to unko hath mein Shivling aa gaye the, nadi mein.\n[04:31] CUSTOMER: To Narmadeshwar kahlate. Jo Narmada nadi mein se Shiv Ji mil jaate hain na, wo Narmadeshwar kahlate hain.\n[04:37] AGENT: Acha! Shivling, matlab, Shivling poori mil jaati hai?\n[04:40] CUSTOMER: Haan, haan, mil jata hai. Wo sabhi, kisi kisi ko milta hai. Hamare jo papa ke dost hain, bahut ache Brahman the, jyotish the, ab to wo bhi nahi hain. To wo bhi wahan snan kar rahe the to unko bhi mile the, nadi mein nahar rahe the to.\n[04:56] AGENT: To phir wo Shivling ko kahin sthapit karke mandir banwaye kya?\n[05:25] AGENT: Hmm, hmm, hmm.\n[05:36] AGENT: Hmm."}, {"call_id": "2026-08-05_NitinKumarRajak_01", "date": "2026-08-05", "scored_at": "2026-08-31T11:17:54", "agent": "Nitin Kumar Rajak", "audio_file": "/kaggle/working/call-quality-agent/to_score/Nitin Kumar Rajak - 1 - 20260805.mp3.mpeg", "call_number": "1", "phone_number": "", "language": "hi", "notes": "20260805.mp3", "score": 4.0, "client_profile_en": "Client name Anurag, contacted as a cold lead by IIFL Capital agent Nitin. Client stated twice that he is not interested in the stock market or investing. Client asked about the cost of account opening and the minimum funds required, and was told he could start with ₹15,000–20,000. No other demographic or occupational details were gathered.", "client_profile_hi": "ग्राहक का नाम अनुराग है, जिन्हें IIFL Capital के एजेंट नितिन ने कोल्ड लीड के तौर पर संपर्क किया। ग्राहक ने दो बार कहा कि उन्हें स्टॉक मार्केट या निवेश में कोई दिलचस्पी नहीं है। ग्राहक ने अकाउंट खोलने की लागत और न्यूनतम फंड्स के बारे में पूछा, जिसके जवाब में बताया गया कि वे ₹15,000–20,000 से शुरुआत कर सकते हैं। कोई अन्य डेमोग्राफिक या पेशे से जुड़ी जानकारी नहीं ली गई।", "summary_en": "The agent kept a calm tone and answered the fund-related question clearly, but ignored the customer's repeated 'no interest' response, pushed a profit-oriented pitch immediately, and ended the call without securing any next step.", "summary_hi": "एजेंट ने शांत लहजा बनाए रखा और फंड से जुड़े सवाल का स्पष्ट जवाब दिया, लेकिन ग्राहक के बार-बार 'रुचि नहीं है' कहने को नज़रअंदाज़ कर तुरंत प्रॉफिट-केंद्रित पिच शुरू कर दी और कॉल को बिना किसी अगला कदम तय किए समाप्त कर दिया।", "strengths_en": ["Agent remained calm and patient despite the customer's disinterest.", "Gave a clear, direct answer on account opening cost and minimum investment (₹15-20k)."], "strengths_hi": ["ग्राहक की अरुचि के बावजूद एजेंट शांत और धैर्यवान रहा।", "अकाउंट खोलने की लागत और न्यूनतम निवेश (₹15-20 हज़ार) पर स्पष्ट और सीधा जवाब दिया।"], "issues_en": ["No permission check ('is this a good time to talk') before launching into the pitch.", "Customer said 'No' twice to interest in stock market, yet agent immediately pitched profit and guidance ('aapko profit ho') within the first minute, violating cold-lead relevance rule.", "Call ends abruptly mid-sentence ('Sir aap...') with no next step, callback, or consent secured."], "issues_hi": ["पिच शुरू करने से पहले यह नहीं पूछा गया कि क्या यह बात करने का सही समय है।", "ग्राहक ने दो बार स्टॉक मार्केट में रुचि न होने की बात कही, फिर भी एजेंट ने पहले ही मिनट में प्रॉफिट और गाइडेंस की पिच दे दी ('आपको प्रॉफिट हो'), जो कोल्ड-लीड नियम का उल्लंघन है।", "कॉल अचानक बीच वाक्य में समाप्त हो जाती है ('सर आप...') बिना कोई अगला कदम, कॉलबैक या सहमति लिए।"], "improvements_en": ["Ask permission and confirm a good time to talk before starting the pitch.", "When customer says 'not interested', explore the reason (busy, bad past experience, no knowledge) before pitching further.", "Always close with a concrete next step, e.g., 'I'll send you a WhatsApp with account details, can I call you back tomorrow?'"], "improvements_hi": ["पिच शुरू करने से पहले अनुमति लें और यह सुनिश्चित करें कि यह बात करने का सही समय है।", "जब ग्राहक 'रुचि नहीं है' कहे, तो आगे पिच करने से पहले उसकी वजह (व्यस्तता, पुराना अनुभव, जानकारी की कमी) समझने की कोशिश करें।", "हमेशा कॉल को किसी ठोस अगले कदम के साथ बंद करें, जैसे 'मैं आपको व्हाट्सएप पर अकाउंट डिटेल्स भेजता हूं, क्या मैं कल कॉलबैक कर सकता हूं?'"], "transcript": "[00:01] AGENT: Hello?\n[00:02] CUSTOMER: Hello.\n[00:03] AGENT: Hello, ji sir aawaz aa rahi hai?\n[00:05] CUSTOMER: Ji sir.\n[00:07] AGENT: Good morning sir, main Nitin baat kar raha hoon IIFL Capital se. Anurag ji se baat ho rahi hai?\n[00:12] CUSTOMER: Ji.\n[00:13] AGENT: Ji, sir aap stock market mein interested hain?\n[00:18] CUSTOMER: No sir.\n[00:20] AGENT: Toh sir kabhi aap future mein aise karna chahein stock market mein investment wagaera?\n[00:26] CUSTO nflation) to explain compounding simply.", "Closed with a concrete next step—sent the Demat account link and saved contact number for follow-up."], "strengths_hi": ["ग्राहक के छोटे/एक-शब्द वाले जवाबों के बावजूद पूरी बातचीत में शांत, सम्मानजनक और धैर्यपूर्ण लहजा बनाए रखा।", "कंपाउंडिंग समझाने के लिए रोज़मर्रा के सरल उदाहरण (₹100/दिन की बचत, शर्ट की महंगाई) का इस्तेमाल किया।", "डीमैट अकाउंट का लिंक भेजकर और फॉलो-अप के लिए नंबर सेव कराकर एक ठोस अगला कदम तय किया।"], "issues_en": ["Delivered a long, scripted monologue about markets/business analogies without adapting to the customer's brief answers, showing weak two-way listening.", "No real financial profiling was done—income, savings capacity or risk appetite were never asked before pitching a Demat account.", "Used overly confident phrasing like 'I'm damn sure' and implied guaranteed wealth growth ('achha profit kama lenge'), which borders on compliance risk around return expectations."], "issues_hi": ["ग्राहक के संक्षिप्त जवाबों के अनुसार ढले बिना बाजार/व्यवसाय की उपमाओं पर एक लंबा, स्क्रिप्टेड भाषण दिया, जो कमजोर दो-तरफा सुनने को दर्शाता है।", "डीमैट अकाउंट पिच करने से पहले आय, बचत क्षमता या जोखिम क्षमता के बारे में कोई वास्तविक वित्तीय प्रोफाइलिंग नहीं की गई।", "'I'm damn sure' जैसे अत्यधिक आत्मविश्वासी शब्दों और निहित निश्चित मुनाफे ('achha profit kama lenge') का उपयोग किया, जो रिटर्न की अपेक्षाओं को लेकर अनुपालन जोखिम की सीमा पर है।"], "improvements_en": ["Cut the lengthy market-education monologue short and ask direct profiling questions on income/savings before pitching.", "Avoid absolute or suggestive profit language; keep return-related statements balanced and non-committal.", "Confirm the customer's specific interest (e.g., stock trading vs. mutual funds) before generalizing the pitch to all products."], "improvements_hi": ["लंबे बाजार-शिक्षा भाषण को संक्षिप्त करें और पिच करने से पहले आय/बचत पर सीधे प्रोफाइलिंग सवाल पूछें।", "निश्चित या सुझावात्मक मुनाफे की भाषा से बचें; रिटर्न संबंधी बातों को संतुलित और गैर :14] CUSTOMER: Haan, kar rahe hain.\n[01:17] AGENT: Kya bol rahe hain?\n[01:19] CUSTOMER: Abhi wahi kar rahe the.\n[01:21] AGENT: Haan.\n[01:30] AGENT: Koi kaam kar rahe ho to wo kar lo pehle sir fir.\n[02:33] AGENT: 3 to maine kar diya, bas peeche zero lagaya hai.\n[02:37] AGENT: Hello?\n[02:40] AGENT: Are sir, kya kar rahe ho? Hello?\n[02:43] CUSTOMER: Are, kar rahe hain."}, {"call_id": "2026-08-28_UNMAPPED_TBE465_01", "date": "2026-08-28", "scored_at": "2026-09-01T07:16:55", "agent": "UNMAPPED_TBE465", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-532_TBE465-8003960604-20260828-112814.mp3.mp3.mpeg", "call_number": "", "phone_number": "8003960604", "language": "hi", "notes": "", "score": 4.0, "client_profile_en": "Client: Vishwajit. He added approximately ₹15,000 to his Demat/trading account and is confused about a minus/negative balance shown in his account, and about a churning charge of ₹50 per ₹1 lakh (0.05%). He also mentions his watchlist is showing a 3-day delay after login. He is currently riding a bike during the call and cannot easily take a screenshot on his phone.", "client_profile_hi": "क्लाइंट: विश्वजीत। उन्होंने अपने डीमैट/ट्रेडिंग अकाउंट में लगभग ₹15,000 जोड़े हैं और उनके अकाउंट में दिख रहे माइनस बैलेंस को लेकर तथा ₹1 लाख पर ₹50 (0.05%) के चर्निंग चार्ज को लेकर उलझन में हैं। उन्होंने यह भी बताया कि लॉगिन के बाद उनकी वॉचलिस्ट 3 दिन की देरी दिखा रही है। कॉल के समय वे बाइक चला रहे थे और अपने फोन से स्क्रीनशॉट लेने में असमर्थ थे।", "summary_en": "The agent secured a follow-up callback but repeatedly failed to listen and made a dismissive remark, leaving the customer's confusion largely unresolved on this call.", "summary_hi": "एजेंट ने फॉलो-अप कॉलबैक तय किया, लेकिन बार-बार ग्राहक की बात सुनने में चूक की और एक अपमानजनक टिप्पणी की, जिससे इस कॉल में ग्राहक की उलझन काफी हद तक अनसुलझी रह गई।", "strengths_en": ["Agent secured a clear next step by scheduling a callback at 12:00 to resolve the issue.", "Agent attempted to get concrete evidence (screenshot/photo) to properly diagnose the balance discrepancy."], "strengths_hi": ["एजेंट ने समस्या सुलझाने के लिए 12:00 बजे कॉलबैक तय करके एक स्पष्ट अगला कदम सुनिश्चित किया।", "एजेंट ने बैलेंस की गड़बड़ी की सही जांच के लिए ठोस सबूत (स्क्रीनशॉट/फोटो) मांगने की कोशिश की।"], "issues_en": ["Agent repeatedly re-asked things the customer had already answered, e.g. asking 'Kya minus dikh raha hai?' after the customer had already explained the balance issue multiple times.", "Agent made a condescending remark — 'agar aapko kaam karna nahi aata hai toh aap apna nuksan na kar lo' — which comes across as blaming and dismissive.", "It took several back-and-forth exchanges for the agent to realize the customer was talking about his Demat account balance, showing weak listening/comprehension."], "issues_hi": ["एजेंट ने कई बार वही बातें फिर से पूछी जो ग्राहक पहले ही बता चुका था, जैसे 'क्या माइनस दिख रहा है?' पूछना, जबकि ग्राहक कई बार बैलेंस की समस्या समझा चुका था।", "एजेंट ने एक अपमानजनक टिप्पणी की — 'अगर आपको काम करना नहीं आता है तो आप अपना नुकसान न कर लो' — जो दोषारोपण और तिरस्कार जैसी लगती है।", "एजेंट को यह समझने में कई बार आगे-पीछे बातचीत करनी पड़ी कि ग्राहक उसके डीमैट अकाउंट के बैलेंस की बात कर रहा है, जो कमजोर सुनने/समझने को दर्शाता है।"], "improvements_en": ["Listen fully to the customer's explanation before repeating a question that has already been answered.", "Avoid blaming or condescending language when a customer is confused; stay purely helpful and neutral.", "Ask one clear diagnostic question at a time (e.g. 'which account and which screen shows the minus figure?') instead of repeating the same screenshot request multiple times."], "improvements_hi": ["पहले से जवाब दिए गए प्रश्न को दोहराने से पहले ग्राहक की बात पूरी तरह सुनें।", "ग्राहक के भ्रमित होने पर दोषारोपण या तिरस्कारपूर्ण भाषा से बचें; पूरी तरह सहायक और तटस्थ बने रहें।", "एक समय में एक स्पष्ट डायग्नोस्टिक सवाल पूछें (जैसे 'कौन सा अकाउंट और कौन सी स्क्रीन माइनस दिखा रही है?') न कि बार-बार वही स्क्रीनशॉट lient_profile_en": "Male customer with a Kotak-linked trading account (unique client code ~10JWG) who added ₹15,000 in funds and is seeing a minus ₹102 balance discrepancy that does not match the agent's terminal view. A family member (referred to as 'chacha'/uncle) was also present/involved on the call. No trading experience, objective, or holdings profiling was done.", "client_profile_hi": "एक पुरुष ग्राहक जिनका Kotak से जुड़ा ट्रेडिंग अकाउंट है (यूनीक क्लाइंट कोड लगभग 10JWG), जिन्होंने ₹15,000 का फंड जोड़ा था और उनके खाते में माइनस ₹102 की गड़बड़ी दिख रही है जो एजेंट के टर्मिनल पर मेल नहीं खा रही। कॉल के दौरान एक पारिवारिक सदस्य ('चाचा') भी मौजूद/शामिल थे। ग्राहक के ट्रेडिंग अनुभव, उद्देश्य या होल्डिंग्स की कोई प्रोफाइलिंग नहीं की गई।", "summary_en": "The agent failed to resolve a simple balance-discrepancy query through confused, repetitive troubleshooting, causing the customer's family to grow suspicious and the customer to disengage without resolution.", "summary_hi": "एजेंट एक साधारण बैलेंस गड़बड़ी की समस्या को भ्रमित और दोहराव भरी ट्रबलशूटिंग के जरिए हल नहीं कर पाई, जिससे ग्राहक के परिवार को शक हुआ और ग्राहक बिना समाधान के कॉल से हट गया।", "strengths_en": ["Agent apologized promptly for a missed earlier call, showing basic courtesy.", "Attempted step-by-step screen-navigation guidance to diagnose the issue."], "strengths_hi": ["एजेंट ने पहले छूटी हुई कॉल के लिए तुरंत माफी मांगी, जो बुनियादी शिष्टाचार दिखाता है।", "समस्या का निदान करने के लिए स्क्रीन-नेविगेशन में चरण-दर-चरण मार्गदर्शन देने की कोशिश की।"], "issues_en": ["Agent repeatedly asked the same/confusing questions ('yeh kisi aur account ka bhej diya', 'client code' twice) without resolving the core discrepancy.", "Asking about the caller's relationship ('Daddy hain, papa hain ya husband hain?') and pushing for a portfolio screenshot from an unrelated family member ('chacha') raised suspicion, with the family member openly questioning why he was even talking to the bank/agent.", "Call ended abruptly wit bhi toh. Woh kya hai, kuch time baad ki hai usse 1 September se naye plan aa rahe hain.\n[00:38] AGENT: Haan, haan bilkul aa rahe hain sir, bilkul. But woh yeh hai ki woh jo bhi plan aa rahe hain aapko uske baare mein puri purna roop se jaankari ke liye aapko call arrange karwa doon kya main? Aap kahein toh department se...\n[00:50] CUSTOMER: Haan toh September mein karenge 1 tarikh se, 1 tarikh ke baad.\n[00:54] AGENT: Haan, woh aap bilkul September mein kariye ga. I agree with you jo aap keh rahe hain, par uske liye aapko behtar aapko jaankari mil jaaye, behtar aapko cheezein pata chal jaaye, behtar aapko yeh pata chal jaaye ki main kis goal ke liye hume karna hai aur kisme kitna hume kya return mil raha hai, hain na? Toh woh saari jo aapko information milti hai woh department se milti hai. Toh main aap mujhe ek apna samay de dijiye, maine just because aapko ek appointment call kiya hai ki aap mujhe ek samay de dijiye, us din hi us samay us tarikh ko us din ko aapko call aayega department se.\n[01:27] CUSTOMER: 1 tarikh ko agar working day hai toh dekh lo us din ko.\n[01:30] AGENT: Teekh hai. 1 tarikh ko working day hai, main teekh hai, 1 tarikh ko hi phone karoon main aapko? Karwa doon?\n[01:35] CUSTOMER: Ji, ji.\n[01:36] AGENT: Okay, aaj kal mein koi baat nahi ho payegi aapse?\n[01:39] CUSTOMER: Ab baat karne ka kya fayda? Main keh raha hoon na plan hi jab 1 tarikh se launch ho rahe hain.\n[01:43] AGENT: Chaliye teekh hai, aise kar lete hain. Hain na? Main aapko 1 tarikh ke baad aapko call back karwa deti hoon.\n[01:49] CUSTOMER: Teekh hai, teekh hai.\n[01:50] AGENT: Okay sir. Number save kar lijiye ga, Sapna Wealthsy likh lijiye ga, yaad rahega aapko.\n[01:55] CUSTOMER: Teekh hai, yaad rahega.\n[01:56] AGENT: Okay, thank you so much sir.\n[01:59] CUSTOMER: Okay."}, {"call_id": "2026-08-28_UNMAPPED_TBE465_03", "date": "2026-08-28", "scored_at": "2026-09-01T07:21:26", "agent": "UNMAPPED_TBE465", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-532_TBE465-9975100049-20260828-120419.mp3.mp3.mpeg", "call_number": "", "phone_number": "9975100049", "language": "hi", "notes": "", "score": 5.0, "client_profile_en": "Customer named Ganesh; was earlier told by a 'sir' (referenced as Sharad ji) to activate his account today; on his own, without being told, he placed an options trade today for 6 lots and incurred a loss; he states he doesn't have much trading knowledge but understands 'from reading'; he was at home during the call.", "client_profile_hi": "ग्राहक का नाम गणेश है; उन्हें पहले किसी 'सर' (शरद जी के रूप में संदर्भित) ने आज खाता एक्टिवेट करने को कहा था; उन्होंने खुद से, बिना बताए, आज 6 लॉट का ऑप्शन ट्रेड लिया जिसमें नुकसान हुआ; उनका कहना है कि उन्हें ज्यादा ट्रेडिंग नहीं आती लेकिन 'पढ़कर' समझ आता है; कॉल के समय वे घर पर थे।", "summary_en": "The agent never identifies herself or the company and asks repetitive/confusing questions, though she does uncover a relevant issue (unauthorized independent trading causing a loss) and steers the client back to company-given trades.", "summary_hi": "एजेंट ने कभी अपना या कंपनी का नाम नहीं बताया और बार-बार दोहराए गए/भ्रमित करने वाले सवाल पूछे, हालांकि उसने एक प्रासंगिक मुद्दा (बिना अनुमति के स्वतंत्र ट्रेडिंग से नुकसान) उजागर किया और ग्राहक को कंपनी द्वारा दिए गए ट्रेड की ओर वापस मोड़ा।", "strengths_en": ["Agent identified that the customer traded independently and caused himself a loss, and redirected him to rely on company-provided trades instead.", "Calm, non-aggressive tone maintained throughout despite the customer's confusion.", "Asked for a screenshot proof and set a next step (resume Monday) to follow up."], "strengths_hi": ["एजेंट ने पहचाना कि ग्राहक ने खुद ट्रेड किया और नुकसान उठाया, और उसे कंपनी द्वारा दिए गए ट्रेड पर निर्भर रहने की सलाह दी।", "ग्राहक की उलझन के बावजूद पूरी कॉल में शांत, गैर-आक्रामक स्वर बनाए रखा।", "स्क्रीनशॉट प्रूफ मांगा और अगला कदम (सोमवार से काम शुरू) तय किया।"], "issues_en": ["No introduction at all — the agent never states her name or the company (TradingBells/IIFL/Kotak), which is a basic professionalism and trust failure.", "Repeated and confusing questions ('Kahan par hain aap', asked twice; guessing 'Paanch lot? Do lot?' before the customer answers) show weak listening flow.", "The purpose of the call is never clearly stated upfront, leaving the customer to piece together why he's being asked these things."], "issues_hi": ["कोई परिचय नहीं दिया गया — एजेंट ने कभी अपना नाम या कंपनी (ट्रेडिंगबेल्स/IIFL/कोटक) नहीं बताया, जो एक बुनियादी पेशेवर और विश्वास की कमी है।", "बार-बार और भ्रमित करने वाले सवाल ('आप कहां हैं' दो बार पूछा गया; ग्राहक के जवाब से पहले 'पांच लॉट? दो लॉट?' अनुमान लगाना) कमजोर सुनने की क्षमता दिखाते हैं।", "कॉल का उद्देश्य शुरुआत में स्पष्ट रूप से नहीं बताया गया, जिससे ग्राहक को खुद समझना पड़ा कि उससे ये सवाल क्यों पूछे जा रहे हैं।"], "improvements_en": ["Start every call with a clear, professional introduction stating name and company before asking any questions.", "Avoid guessing answers (e.g., lot size) before the customer responds; ask once and wait.", "Clearly state the call's purpose upfront (e.g., 'calling to confirm your account activation') to reduce customer confusion."], "improvements_hi": ["हर कॉल की शुरुआत नाम और कंपनी बताते हुए स्पष्ट, पेशेवर परिचय से करें, उसके बाद ही सवाल पूछें।", "ग्राहक के जवाब से पहले जवाब (जैसे लॉट साइज़) का अनुमान लगाने से बचें; एक बार पूछें और प्रतीक्षा करें।", "कॉल का उद्देश्य शुरुआत में ही स्पष्ट रूप से बताएं (जैसे 'आपका खाता एक्टिवेशन कन्फर्म करने के लिए कॉल कर रही हूं') ताकि ग्राहक की उलझन कम हो।"], "transcript": "[00:01] AGENT: Hello, Ganesh ji baat kar rahe hain?\n[00:03] CUSTOMER: Haan, Ganesh ji bol raha hoon.\n[00:05] AGENT: Haan sir, baat hua aapka sir se? Unhone aapko bataya tha na ki aaj activate karna hai account?\n[00:11] CUSTOMER: Haan, kiya, kiya tha.\n[00:13] AGENT: Achha, kar liya aapne?\n[00:17] AGENT: Matlab aap gaye hain kya wahan par sir ke paas? Ya kahan par hain aap abhi?\n[00:25] AGENT: Hello?\n[00:30] AGENT: Ganesh ji, aa ", "notes": "", "score": 5.0, "client_profile_en": "Male client, self-employed (works as a building contractor/construction), based in Kherliwala area near Indore, Madhya Pradesh. He has no prior stock market trading or investment experience. He does not currently have a smartphone/WhatsApp-enabled phone, which he cites as the reason he has not yet opened the Demat account link previously shared with him.", "client_profile_hi": "पुरुष ग्राहक, स्वरोजगार करता है (बिल्डिंग/कंस्ट्रक्शन का काम), इंदौर, मध्य प्रदेश के पास खेरलीवाला क्षेत्र में रहता है। उसे पहले स्टॉक मार्केट में ट्रेडिंग या निवेश का कोई अनुभव नहीं है। उसके पास फिलहाल स्मार्टफोन/व्हाट्सएप नहीं है, जिसे उसने पहले भेजे गए डीमैट अकाउंट लिंक को अभी तक न खोलने का कारण बताया।", "summary_en": "The agent was polite and identified the real blocker (no smartphone) but delivered an overloaded generic pitch and closed the call without any concrete next step.", "summary_hi": "एजेंट विनम्र था और असली बाधा (स्मार्टफोन न होना) की पहचान की, लेकिन एक सामान्य और अत्यधिक जानकारी वाला पिच दिया और कॉल को किसी ठोस अगले कदम के बिना समाप्त किया।", "strengths_en": ["Agent remained calm and patient throughout, even when repeating information.", "Correctly identified the client's actual barrier (no smartphone for WhatsApp/app access) rather than assuming disinterest.", "Did basic profiling by asking about occupation and prior trading experience."], "strengths_hi": ["एजेंट पूरी कॉल में शांत और धैर्यवान रहा, भले ही जानकारी दोहरानी पड़ी।", "ग्राहक की असली बाधा (व्हाट्सएप/ऐप के लिए स्मार्टफोन न होना) की सही पहचान की, बिना यह मान लिए कि ग्राहक की दिलचस्पी नहीं है।", "ग्राहक का पेशा और पिछला ट्रेडिंग अनुभव पूछकर बुनियादी प्रोफाइलिंग की।"], "issues_en": ["Pitch was generic and overloaded — explained stock market basics, commodities, F&O and mutual funds to a client whose only stated problem was 'I don't know how to open the account'.", "No solution was offered for the smartphone barrier (e.g., assisted/in-branch account opening) — the call simply ended with 'call me once you get a smartphone', which is a vague, open-ended close.", "Statement 'stock market mein paisa kamana bahut aasan hai' oversimplifies risk and could mislead a first-time investor."], "issues_hi": ["पिच सामान्य और अत्यधिक जानकारी से भरा था — स्टॉक मार्केट की बुनियादी बातें, कमोडिटी, F&O और म्यूचुअल फंड समझाए गए, जबकि ग्राहक ने सिर्फ यह कहा था कि 'मुझे अकाउंट खोलना नहीं आता'।", "स्मार्टफोन की बाधा के लिए कोई हल नहीं दिया गया (जैसे सहायता प्राप्त/ब्रांच में अकाउंट खोलना) — कॉल केवल 'स्मार्टफोन आ जाए तो कॉल करना' पर खत्म हुई, जो एक अस्पष्ट, बिना ठोस योजना वाला समापन है।", "'स्टॉक मार्केट में पैसा कमाना बहुत आसान है' जैसा वाक्य जोखिम को अत्यधिक सरल बनाता है और नए निवेशक को गुमराह कर सकता है।"], "improvements_en": ["Offer a concrete alternative for the smartphone issue, such as assisted account opening at the branch or via a family member's phone.", "Set a firm follow-up date/callback rather than leaving the next step entirely on the client's timeline.", "Trim the pitch to only what's relevant to a first-time, non-tech-savvy client instead of covering commodities, F&O and mutual funds in one go."], "improvements_hi": ["स्मार्टफोन की समस्या के लिए एक ठोस विकल्प दें, जैसे ब्रांच में सहायता प्राप्त अकाउंट खोलना या परिवार के किसी सदस्य के फोन का उपयोग करना।", "अगला कदम पूरी तरह ग्राहक की समय-सीमा पर छोड़ने के बजाय एक निश्चित फॉलो-अप तारीख/कॉलबैक तय करें।", "पहली बार निवेश करने वाले, कम तकनीक-जानकार ग्राहक के लिए केवल जरूरी जानकारी दें, कमोडिटी, F&O और म्यूचुअल फंड सब एक साथ न बताएं।"], "transcript": "[00:03] AGENT: Haan sir, good morning. Main Rahul baat kar raha hoon Kotak Securities se. Meri aawaz aa rahi hai aapko?\n[00:07] CUSTOMER: Yes sir.\n[00:08] AGENT: Haan sir. Sir humari baat hui thi pichle time aapka shayad mobile kharab ho gaya tha Demat account ke regarding, aapko yaad hai?\n[00:16] CUSTOMER: Haan ji sir.\n[00:17] AGENT: Aapko ek WhatsApp pe link share kiya tha Demat account ke regarding. Aapne woh Demat account bana liya tha?\n[00:23] CUSTOMER: Nahi sir.\n[00:25] AGENT: Koi reason kyun? Yeh free of cost mil raha hai aapko kaafi benefit hai.\n[00:33] CUSTOMER: Benefit to hai sir par malum nahi hai na yeh kaise karna hai.\n[00:38] AGENT: Achha aapko kaise open karna hai pata nahi hai, ha na? Yeh reason hai?\n[00:43] CUSTOMER: Haan.\n[00:44] AGENT: Theek hai main aapko bata deta hoon. Aap kya karte hain sir? Koi job kar rahe hain ya business kar rahe hain?\n[00:49] CUSTOMER: Sir main building banata hoon.\n[00:51] AGENT: Yeh to achhi baat hai phir to aap kaafi experienced hain. Aapko stock market ke regarding humari saari jankari de di thi aapko yaad hoga saari cheezein, ki ek baar main phir se bata doon aapko?\n[01:04] AGENT: Aapko saari cheezein clear hain ya main phir se ek baar bata doon sir?\n[01:08] CUSTOMER: Batao sir.\n[01:10] AGENT: Theek hai main ek baar phir se dhyan se dhyan se suniyega. Pehle sabse pehle main yeh jaanna chahta hoon aapne pehle iske pehle kabhi stock market mein trading ya investment kiya tha?\n[01:21] AGENT: Hello?\n[01:25] CUSTOMER: Haan sir bolo.\n[01:27] AGENT: Haan sir, main aapse yeh pooch raha hoon kya iske pehle aapne kabhi stock market mein trading ya investment ki thi aapne iske pehle kabhi? Experience hai aapko?\n[01:36] CUSTOMER: Nahi sir.\n[01:37] AGENT: Nahi hai. Theek hai main ek baar phir se bata deta hoon aapko, dhyan se suniyega. Yeh aap hi ke fayde ki hai. Stock market mein paisa kamana bahut aasan hai lekin sahi jankari aur experience chahiye. Aur stock market mein hum paise kaise kamate hain? Kisi company ke shares ko kam keemat mein khareed ke mehangay mein bechna hota hai. Jitna hum mehanga bechenge utna hume profit hota hai. Yeh bas waise hi hai jaise hum koi business karte hain. Toh hum kya karte hain kisi se kam keemat mein samaan khareedte hain aur mehangay mein bech dete hain. Right? Toh stock market bhi usi tarah se hai. Yahan pe bahut si companiyan listed hain. Aapko kis company ke shares ko kab khareedna hai, kab bechna hai yeh saari hum aapko batate hain, uske koi paise nahi lete hain. Iske alaawa commodity ho gaya ya phir aapko futures and option mein karna hai ya phir aapko trading jo hai mutual fund aapne suna hoga aaj kal iske kaafi yeh chal rahe hain, ads wogera chal raha hai. Agar aapko mutual fund mein karna hai toh woh bhi hum aapko help karte hain, right? Aap in sab mein investment start karne ke liye hume ek account ki zaroorat padti hai jise kehte hain Demat account. Theek hai?\n[02:37] CUSTOMER: Theek hai sir.\n[02:38] AGENT: Ji. Toh woh Demat account ko open karna bhi agar aap Kotak se karte hain toh uske liye koi paise nahi lete hain. Even agar aapko jo recommendation denge, jo aapki help karenge, sahayata denge, aapko jo aapko jo hai na step by step hum aapko batayenge uske bhi hum aap se koi paise nahi lenge, theek hai? Yeh saari services aapko free of cost milti hai, right sir Kotak ki taraf se.\n[02:58] AGENT: Theek hai. Main yeh aapka WhatsApp number hai?\n[03:04] CUSTOMER: WhatsApp number mere paas to nahi hai haan.\n[03:07] AGENT: Aapka ek baar WhatsApp number bata dijiye hume.\n[03:11] CUSTOMER: Sir WhatsApp wala number hi nahi hai mere paas.\n[03:14] AGENT: WhatsApp ka number hi nahi hai aapke paas?\n[03:18] CUSTOMER: Chhota phone mere mere paas chhota chhota phone hai na.\n[03:22] AGENT: Accha chhota phone hai toh phir sir aap trading investment kaise karenge? Uske liye\n[03:26] CUSTOMER: Tabhi to keh raha hoon sir jab smart-phone ban jaayega tab tab phone kar lunga aapko smart-phone se.\n[03:31] AGENT: Accha accha. Humari isi ke regarding baat hui thi, aapne yahi bataya tha mujhe pichli baar bhi ki aapka mobile jo hai kharab ho gaya, jab bana lenge jald se jald aur aap hume batayenge. Toh kab tak ban jaayega sir? Main us time call kar lunga aapko. Aap hi ke fayde ki aap hi ka fayda hoga usse, theek hai? Agar banate hain aur stock market mein aate hain, jo benefits maine aapko bataye hain woh aapko free of cost milte rahenge, right?\n[03:55] CUSTOMER: Ye sir padha likha jo chahiye isme.\n[03:59] AGENT: Kya kya chahiye?\n[04:00] CUSTOMER: Padhna likhna aana chahiye?\n[04:03] AGENT: Nahi nahi, yahan pe padhe likhe ki zaroorat nahi hai. Theek hai? Stock market mein koi bhi aa sakta hai kyunki India mein agar sabse zyada kahin paisa hai toh aapke jankari ke liye bata doon stock market mein hai. Theek hai? Jisko iske baare mein sahi jankari, experience hai woh paise kama rahe hain aur jinke paas sahi jankari nahi hai woh ya toh stock market mein aa nahi rahe hain ya toh phir aadhi aadhuri jankari lekar aa rahe hain. Theek hai? Abhi aap abhi aap kya kariye, mobile jab bhi aapke paas smartphone hona zaroori hai kyunki agar aap smartphone nahi rahega toh aap Demat account banayenge kaise? Demat account banayenge tabhi toh aap stock market mein trading investment jab bhi aapko start karni hogi tab kar payenge na aap.\n[04:39] CUSTOMER: Aap kahan se bol rahe hain?\n[04:41] AGENT: Accha main kahan se bol raha hoon? Main bol raha hoon Vijay Nagar Indore Madhya Pradesh se. Theek hai? Humara office hai yahan pe Kotak Securities ke taraf se baat kar rahe hain hum. Aap kabhi bhi aake humse mil sakte hain, yahan pe office mein visit kar sakte hain. Abhi aap kaun si city mein job kar rahe hain?\n[04:55] CUSTOMER: Hum Kherliwala se bol rahe hain.\n[04:59] AGENT: Accha accha accha. Theek hai, Indore Madhya Pradesh yeh hub hai, financial hub hai. Theek hai? Toh aap kabhi bhi aake mil sakte hain aur jo bhi aapko services milegi yeh on call milegi ya phir aapko WhatsApp pe bhi agar aap comfortable hain toh WhatsApp pe bhi aapko bata diya jaayega aur aap hume is number pe call bhi kar sakte hain, WhatsApp pe bhi baat kar sakte hain sabah 9:00 se leke shaam ke 6:00 baje tak. Theek hai?\n[05:20] CUSTOMER: Ji.\n[05:21] AGENT: Theek hai, toh abhi aap mobile ko bana lijiye. Jab ban jaayega aap hume contact kariyega ya hum aapko contact kar lenge, theek hai?\n[05:27] CUSTOMER: Theek hai sir.\n[05:28] AGENT: Aur koi jankari chahte hain stock market se related?\n[05:32] CUSTOMER: Nahi sir.\n[05:33] AGENT: Okay. Thank you so much. Have a good day. Happy Raksha Bandhan."}, {"call_id": "2026-08-28_UNMAPPED_TBE667_04", "date": "2026-08-28", "scored_at": "2026-09-01T07:24:44", "agent": "UNMAPPED_TBE667", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-532_TBE667-9831656731-20260828-132253.mp3.mp3.mpeg", "call_number": "", "phone_number": "9831656731", "language": "hi", "notes": "", "score": 6.0, "client_profile_en": "Male customer who previously had a Kotak Demat account and traded in F&O; investment amounts ranged from ₹25,000-50,000 up to ₹1 lakh. He stopped trading after being charged unexpected brokerage/charges he was not informed about (says he wasn't told upfront, only via an email he didn't check), and support could not waive/reduce the charges when he asked. Currently not investing due to lack of funds, but has stated he would consider restarting if the charges issue is resolved.", "client_profile_hi": "पुरुष ग्राहक, पहले Kotak में डीमैट अकाउंट था और F&O में ट्रेडिंग करता था; निवेश राशि ₹25,000-50,000 से लेकर ₹1 लाख तक रही। अचानक चार्जेस कटने की वजह से ट्रेडिंग बंद कर दी, जिनकी जानकारी पहले नहीं दी गई थी (केवल एक ईमेल में बताया गया था जो उसने नहीं देखा), और सपोर्ट टीम चार्जेस कम/माफ नहीं कर पाई। फिलहाल पैसों की कमी के कारण निवेश नहीं कर रहा, लेकिन कहा है कि चार्जेस की समस्या हल होने पर फिर से शुरू करने पर विचार करेगा।", "summary_en": "Agent listened well and profiled the customer's past trading and reason for stopping, but the call ended abruptly without a pitch or any confirmed next step.", "summary_hi": "एजेंट ने ग्राहक की बात ध्यान से सुनी और उसके पिछले ट्रेडिंग अनुभव व बंद करने की वजह को समझा, लेकिन कॉल बिना कोई पिच दिए या अगला कदम तय किए अचानक समाप्त हो गई।", "strengths_en": ["Agent patiently let the customer narrate the full charges complaint without interrupting.", "Good follow-up profiling questions on investment amount and trading segment (F&O).", "Calm, professional tone throughout with no pressure tactics."], "strengths_hi": ["एजेंट ने ग्राहक को चार्जेस की पूरी शिकायत बिना बीच में रोके बताने दिया।", "निवेश राशि और ट्रेडिंग सेगमेंट (F&O) के बारे में अच्छे फॉलो-अप प्रोफाइलिंग सवाल पूछे।", "पूरी कॉल में शांत और पेशेवर लहजा बनाए रखा, कोई दबाव नहीं डाला।"], "issues_en": ["The core charges complaint (his main reason for stopping) was never actually addressed or resolved before the call cut off.", "No pitch or relevant solution was delivered — agent was mid-explanation ('main aapko batata hoon kya hua hai actually') when interrupted.", "No callback time or next step was secured; the call ends on 'hold kijiye' with no closure."], "issues_hi": ["ग्राहक की मुख्य शिकायत (चार्जेस के कारण ट्रेडिंग बंद करना) कॉल कटने से पहले हल नहीं की गई।", "कोई पिच या समाधान नहीं दिया गया — एजेंट 'मैं आपको बताता हूं क्या हुआ है' कहते हुए बीच में ही रुक गया।", "कोई कॉलबैक समय या अगला कदम तय नहीं हुआ; कॉल 'होल्ड कीजिए' पर बिना किसी समापन के खत्म हो जाती है।"], "improvements_en": ["Address the charges complaint directly and clearly explain how it would be different this time before pitching anything else.", "When the customer asks to hold, agree but immediately lock a specific callback time to avoid losing the lead.", "Prepare a clear, concise solution statement (e.g. revised charge structure) rather than starting a long explanation that got cut off."], "improvements_hi": ["किसी भी नई पिच से पहले चार्जेस की शिकायत को सीधे संबोधित करें और स्पष्ट बताएं कि इस बार क्या अलग होगा।", "जब ग्राहक होल्ड के लिए कहे, तो सहमत हों लेकिन तुरंत एक निश्चित कॉलबैक समय तय करें ताकि लीड न खो जाए।", "लंबी अधूरी व्याख्या शुरू करने के बजाय एक स्पष्ट और संक्षिप्त समाधान (जैसे संशोधित चार्ज संरचना) पहले से तैयार रखें।"], "transcript": "[00:02] AGENT: Hello?\n[00:03] CUSTOMER: Hello?\n[00:04] AGENT: Good afternoon, main Rahul baat kar raha hoon Kotak Securities se, behalf of authorized person.\n[00:09] CUSTOMER: Boliyen sir.\n[00:10] AGENT: Ji, maine aapko call kiya hai stock market investment ke regarding. Currently aap kuch stock market me investment kar rahe hai?\n[00:18] CUSTOMER: Main abhi nahi kar raha, abhi balance nahi hai mere paas.\n[00:21] AGENT: Achha achha achha. Aapne kabhi kiya hai sir investment iske pehle?\n[00:25] CUSTOMER: Haan, kiya hai. Kotak mein karta tha DeMat account.\n[00:28] AGENT: Kotak mein aap kar rahe hai? Abhi active hai ya nahi hai?\n[00:31] CUSTOMER: Abhi main deactive... main nahi kar raha abhi isme.\n[00:35] AGENT: Achha abhi aap nahi kar rahe. Koi baat nahi. Main bas jaanna chahta tha ki aap kyun nahi kar rahe, koi reason hai ya fir chhod diya hai?\n[00:41] CUSTOMER: Haan, reason usme mera charges mujhe pata nahi tha. Pehle zero balance tha, main naya naya tha. Toh free mein tha toh main trading kaafi karta tha, galat sahi jo bhi hota tha, 10 hazar 5 hazar. Aur ek din maine itna trading kiya ki mera profit ke saath saath mera 1000 profit ke jagah par minus aapka... matlab 3000 profit hua, 1000 profit hua toh minus minus 2000 uska yeh dikha raha tha. Toh fir baad mein maine pata kiya toh bola gaya ki aapka charges start ho gaya. Toh maine kaha ki main charges toh mujhe pata nahi hai, charges to batana chahiye tha aapko. Unhone kaha ki bhai mail kar diya gaya tha. Aapne jaisa abhi phone kiya na, toh is tarah ka kabhi phone-won bhi nahi aaya mera paas. Aur main message aur phone mail utna check, mail nahi check karta. Bol rahe hai mail mein aaya aapka. Abhi sabka rules, regulations... hum bole yaar hum isi se use karta tha. Ab apne, agar main phir karna chahunga, maine kaha ki thik hai aap mujhe isko yeh kijiyen, isko aap zero karwaiye ya kuch kam karwaiye toh main isko aage badhunga. Toh fir bole ki main koshish karta hoon, lekin unhone bola ki nahi ho payega, toh maine chhod diya us tab se. Ab jaisa hai waisa chal raha hai.\n[01:46] AGENT: Main aapki baat samajh gaya hoon. Kya aapki investment jaan sakta hoon main, kitni investment kiya tha aapne?\n[01:51] CUSTOMER: Main 25, 50 aisi chalta tha, 1 lakh tak bhi kiya tha maine.\n[01:54] AGENT: Thik hai, main maan ke-\n[01:55] CUSTOMER: Aur maine kaha bhi tha ki agar aisa kuch hua toh main phir se start kar sakta hoon, main sochunga zaroor.\n[02:00] AGENT: Thik hai, main aapki baat samajh gaya hoon. Main aapko batata hoon ki kya hua hai actually. Mujhe kuch cheezein samajhni hongi, jaise aapne amount daala tha 25 to 50, aapne kis segment mein kiya tha trading?\n[02:10] CUSTOMER: F&O mein kiya tha.\n[02:11] AGENT: F&O mein, thik hai. Thik hai, main aapko ek baar phir se bata deta hoon. Kyunki jaise haan-\n[02:18] CUSTOMER: Sir, aap do minute rukiye na, ek call aa raha hai. Hold kijiyen na."}, {"call_id": "2026-08-27_UNMAPPED_TBE668_01", "date": "2026-08-27", "scored_at": "2026-09-01T07:25:45", "agent": "UNMAPPED_TBE668", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-532_TBE668-6204453934-20260827-120042.mp3.mp3.mpeg", "call_number": "", "phone_number": "6204453934", "language": "hi", "notes": "", "score": 3.0, "client_profile_en": "Male customer named Shivam, working an 8-hour job (approx. 2 PM–10 PM shift) with family responsibilities including young children. He has a dormant trading account, made a few trades in the past but stopped due to lack of time. He had a prior negative impression of stock market trading based on a friend's bad experience and prefers face-to-face/offline dealings over remote guidance. He has some interest in chemical sector stocks (mentioned a company 'Solvay').", "client_profile_hi": "शिवम नाम का पुरुष ग्राहक, जो 8 घंटे की नौकरी (लगभग दोपहर 2 बजे से रात 10 बजे तक की शिफ्ट) करता है और जिसके परिवार में छोटे बच्चों की जिम्मेदारी है। उसका ट्रेडिंग अकाउंट निष्क्रिय है, पहले कुछ ट्रेड किए थे लेकिन समय की कमी के कारण बंद कर दिया। एक दोस्त के बुरे अनुभव के कारण शेयर मार्केट को लेकर पहले से नकारात्मक धारणा है और वह दूर से गाइडेंस लेने की बजाय आमने-सामने डील करना पसंद करता है। उसे केमिकल सेक्टर के शेयरों (Solvay कंपनी का जिक्र किया) में कुछ रुचि है।", "summary_en": "The agent handled tone and listening reasonably well but made an unrealistic and misleading guaranteed-return claim ('8-10% daily profit'), which is a serious compliance violation capping the score.", "summary_hi": "एजेंट ने टोन और सुनने में ठीक-ठाक व्यवहार किया, लेकिन एक अवास्तविक और भ्रामक गारंटीड रिटर्न का दावा ('रोज़ाना 8-10% प्रॉफिट') किया, जो एक गंभीर कंप्लायंस उल्लंघन है और स्कोर को सीमित करता है।", "strengths_en": ["Agent remained calm and patient throughout despite the customer's skepticism and distractions.", "Addressed the customer's concern about needing 'face-to-face' dealing by explaining the online nature of demat trading.", "Asked about the customer's work timing to tailor the pitch around time constraints."], "strengths_hi": ["ग्राहक के संदेह और ध्यान भटकाव के बावजूद एजेंट पूरे समय शांत और धैर्यवान रही।", "'आमने-सामने' डील की ग्राहक की चिंता को डीमैट ट्रेडिंग के ऑनलाइन स्वरूप को समझाकर संबोधित किया।", "पिच को समय की कमी के अनुसार ढालने के लिए ग्राहक की ड्यूटी टाइमिंग पूछी।"], "issues_en": ["Agent made a guaranteed profit claim: 'daily basis pe aapke investment ka 8 se 10 percent tak ka profit aapko market se milega' – a serious compliance violation.", "No clear next step was secured; call ended with a vague 'chaliye theek hai karte hain' and no concrete follow-up plan.", "Profiling was shallow – agent didn't explore past trading segment, capital available, or specific reason behind distrust in enough depth."], "issues_hi": ["एजेंट ने गारंटीड प्रॉफिट का दावा किया: 'daily basis pe aapke investment ka 8 se 10 percent tak ka profit aapko market se milega' – यह एक गंभीर कंप्लायंस उल्लंघन है।", "कोई स्पष्ट अगला कदम तय नहीं हुआ; कॉल एक अस्पष्ट 'चलिए ठीक है करते हैं' के साथ बिना किसी ठोस फॉलो-अप योजना के समाप्त हुई।", "प्रोफाइलिंग सतही रही – एजेंट ने पिछले ट्रेडिंग सेगमेंट, उपलब्ध पूंजी या अविश्वास के पीछे के कारण को पर्याप्त गहराई से नहीं जाना।"], "improvements_en": ["Never quote a fixed daily/percentage return figure — replace with responsible, non-guaranteed language about market-linked outcomes.", "Close the call with a concrete next step, e.g., schedule a specific callback time or confirm a small fund top-up commitment.", "Dig deeper into why the customer distrusts remote advisory to tailor reassurance (e.g., transparency measures, trial period) rather than a generic online-trading explanation."], "improvements_hi": ["कभी भी निश्चित दैनिक/प्रतिशत रिटर्न का आंकड़ा न दें — इसके बजाय मार्केट-लिंक्ड परिणामों के बारे में जिम्मेदार, गैर-गारंटीड भाषा का प्रयोग करें।", "कॉल को एक ठोस अगले कदम के साथ बंद करें, जैसे किसी निश्चित समय पर कॉलबैक शेड्यूल करना या छोटी फंड टॉप-अप प्रतिबद्धता की पुष्टि करना।", "ग्राहक के रिमोट एडवाइजरी पर अविश्वास के पीछे की वजह को गहराई से समझें ताकि सामान्य ऑनलाइन-ट्रेडिंग स्पष्टीकरण की बजाय पारदर्शिता उपाय या ट्रायल पीरियड जैसे आश्वासन दिए जा सकें।"], "transcript": "[00:02] AGENT: Hello?\n[00:03] CUSTOMER: Hello?\n[00:04] AGENT: Good afternoon, sir.\n[00:06] CUSTOMER: Good afternoon. Batayiye kya baat hai?\n[00:08] AGENT: Mayuri baat kar rahi hoon. Mr. Shivam ji se baat ho rahi hai?\n[00:12] CUSTOMER: Jee, Shivam ji se baat ho rahi hai main.\n[00:14] AGENT: Okay. Kotak Securities Private Limited se baat kar rahi hoon, authorized person ke behalf pe.\n[00:20] CUSTOMER: Jee.\n[00:21] AGENT: Share market regarding call kiya hai aapko. Kaisa work chal raha hai abhi market mein?\n[00:28] CUSTOMER: Humne toh chhod diya hai. Hum nahi kar rahe hain share market se kuch.\n[00:33] AGENT: Okay okay. Toh kitna time ho gaya sir band kiye hue?\n[00:37] CUSTOMER: Main kiya hi nahi. Thoda sa main kiya tha fir uske baad block kar diya. Mere paas time nahi milta hai main miss ka wajah se.\n[00:43] AGENT: Okay okay. Toh sir agar market ke liye aapko knowledge diya jaaye, daily basis pe aapko zyada time bhi nahi dena rahega, 5 se 10 minute ka time lagega. Toh agar aap interested hain toh sir main aapko yahan se daily basis pe support provide kar sakti hoon. Aapko koi service charge bhi pay nahi karna rahega.\n[01:01] AGENT: Hello?\n[01:02] CUSTOMER: Haan jee.\n[01:03] AGENT: Haan, batayiye sir.\n[01:04] CUSTOMER: Isme choice utna lagta nahi hai. Mujhe kuch pata bhi nahi hai, naya naya aakar kya hota hai.\n[01:11] AGENT: Nahi toh sir dekhiye, ek cheez hai ki agar aap dekhiye market ko lekar interested hain, market jaanna chahte hain, aap kuch seekhna chahte hain toh aapko yahan se saari cheezein mil sakti hain. Aapko market mein kaise kaam hota hai jaise Nifty, Bank Nifty, Sensex aapne suna hi hoga na?\n[01:27] CUSTOMER: Jee.\n[01:28] AGENT: Haan, toh inmein kaise kaam hota hai, kaise hum kisi stock ko buy kar sakte hain, kaise sell kar sakte hain, stop loss, target, saari cheezein aapko A to Z saari cheezein yahan se batayi jayengi, sikhayi jayengi. On call pe aapko saari training di jayegi, saath hi saath kuch cheezein aapko nahi samajh aa rahi hai toh aap screenshot share karke bhi us cheez ko samajh sakte hain. Yeh saari cheezein aapko batayi jayengi. Saath hi saath daily basis pe hum kaise kaam kar sakte hain, aapka investment jo rehta hai uske behalf pe hum daily basis pe kitna return nikaal sakte hain, saari cheezein yahan se aapko milengi sir. Toh chahein agar aap toh minimum sir 15-20 hazar ke fund se kaam start karo. Daily basis pe aapke investment ka 8 se 10 percent tak ka profit aapko market se milega. Aur koi bhi... haan?\n[02:15] CUSTOMER: Pichle din pehle lagta hai saal bhar pehle main Dilli mein tha. Toh wahan pe ek banda jude hue the share market se. Usne mere ko video dikhaya, usme bohot dhokhadhari wala uska bata raha tha, \"Yaar dekho main itna ka share khareeda tha.\" Pata nahi kya kya hua tha. Toh woh bata tha ki aisa aisa hai. Par mera room mein ek bagal mein dost rehte hain, unka naam hai... toh share market mein woh lagate hain.\n[02:43] AGENT: Haan.\n[02:44] CUSTOMER: Humne unse iske baare mein puri detail se nahi pata hai. Toh iske liye...\n[02:48] AGENT: Achha, toh pehle kisne matlab aapko bataya tha jiska aap bol rahe hain ki kisi ne kaam karwaya tha aapko?\n[02:54] CUSTOMER: Nahi, woh toh me ion mil sakta hai.\n[01:19] AGENT: Aur uske liye koi aapko charges vagera bhi pay nahi karna rehta hai. Agar aap interested hain to bataiye sir.\n[01:24] CUSTOMER: Aap free mein kyun karte hain?\n[01:26] AGENT: Sir, actually hamari company jo hai full-time service broker hai. Full-time service broker matlab aapko sari service support milti hai free of cost, bas aapko hamari company ka Demat account open karna rehta hai.\n[01:37] CUSTOMER: Kaun sa aapka company ka Demat account hai?\n[01:39] AGENT: Kotak Securities.\n[01:42] AGENT: Abhi..."}, {"call_id": "2026-08-28_UNMAPPED_TBE668_01", "date": "2026-08-28", "scored_at": "2026-09-01T07:27:53", "agent": "UNMAPPED_TBE668", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-532_TBE668-9341964307-20260828-113154.mp3.mp3.mpeg", "call_number": "", "phone_number": "9341964307", "language": "hi", "notes": "", "score": 4.0, "client_profile_en": "Female customer, existing registered client of Kotak Securities flagged as an 'active trader,' who confirmed she does invest/trade in the share market when asked directly. No further details (trading experience, duration, current holdings, or reason for inactivity) were established during the call.", "client_profile_hi": "महिला ग्राहक, Kotak Securities की मौजूदा रजिस्टर्ड क्लाइंट जिन्हें 'active trader' के रूप में चिन्हित किया गया है, उन्होंने सीधे पूछे जाने पर पुष्टि की कि वे शेयर मार्केट में निवेश/ट्रेडिंग करती हैं। कॉल के दौरान कोई और जानकारी (ट्रेडिंग अनुभव, समयावधि, मौजूदा होल्डिंग्स, या ट्रेडिंग रुकने का कारण) प्राप्त नहीं की गई।", "summary_en": "The agent introduced herself clearly but the call broke down into repeated confusion and ended without any profiling or next step secured.", "summary_hi": "एजेंट ने स्पष्ट रूप से अपना परिचय दिया, लेकिन कॉल बार-बार भ्रम में उलझ गई और बिना किसी प्रोफाइलिंग या अगले कदम के समाप्त हो गई।", "strengths_en": ["Agent clearly identified herself and the company (Mayuri, Kotak Securities) at the start.", "Agent checked audio connectivity before proceeding with the pitch."], "strengths_hi": ["एजेंट ने शुरुआत में स्पष्ट रूप से अपना नाम और कंपनी (मयूरी, Kotak Securities) बताया।", "एजेंट ने आगे बढ़ने से पहले आवाज़ साफ आ रही है या नहीं, यह जांचा।"], "issues_en": ["Customer repeatedly showed confusion ('Kya phir se?', 'Kaun sa market mein?') indicating the agent's questions were not clear or well-paced.", "No profiling was completed — trading experience, duration or reason for inactivity were never established.", "Call ends abruptly with a vague 'Theek hai' and no next step, callback, or clear plan secured."], "issues_hi": ["ग्राहक ने बार-बार भ्रम दिखाया ('क्या फिर से?', 'कौन से मार्केट में?'), जिससे स्पष्ट है कि एजेंट के सवाल स्पष्ट या ठीक गति से नहीं थे।", "कोई प्रोफाइलिंग पूरी नहीं हुई — ट्रेडिंग अनुभव, समयावधि या निष्क्रियता का कारण कभी पता नहीं चला।", "कॉल एक अस्पष्ट 'ठीक है' के साथ अचानक समाप्त हो गई, बिना किसी अगले कदम, कॉलबैक या स्पष्ट योजना के।"], "improvements_en": ["Ask simpler, one-part questions and confirm the customer understood before moving to the next one.", "Slow the pace given the customer's clear difficulty following, rather than repeating the same phrasing.", "Always close with a concrete next step, such as a scheduled callback or a specific offer to follow up on."], "improvements_hi": ["सरल, एक-भाग वाले सवाल पूछें और आगे बढ़ने से पहले पुष्टि करें कि ग्राहक ने समझा है।", "ग्राहक को समझने में स्पष्ट कठिनाई को देखते हुए गति धीमी करें, न कि वही वाक्य दोहराएं।", "हमेशा किसी ठोस अगले कदम के साथ कॉल समाप्त करें, जैसे तय कॉलबैक या किसी विशेष ऑफर पर फॉलो-अप।"], "transcript": "[00:01] CUSTOMER: Hello? [audio unclear or repeating here — collapsed from 3 near-identical segments]\n[00:04] AGENT: Good morning, ma'am.\n[00:06] CUSTOMER: Hello?\n[00:10] CUSTOMER: Hello?\n[00:11] AGENT: Hello, good morning ma'am, aawaz aa rahi hai?\n[00:14] CUSTOMER: Haan ma'am, aawaz aa rahi hai.\n[00:16] AGENT: Mayuri baat kar rahi hoon Kotak Securities Private Limited se.\n[00:20] CUSTOMER: Haan.\n[00:21] AGENT: Share market regarding call kiya tha humne. Working kar rahe hain share market mein?\n[00:24] CUSTOMER: Haan.\n[00:26] AGENT: Kaisa work chal raha hai abhi market mein aapka investment, trading?\n[00:32] CUSTOMER: Kya phir se?\n[00:34] AGENT: Share market mein investment karte hain, ma'am?\n[00:38] CUSTOMER: Haan, karte hain.\n[00:40] AGENT: Okay, okay. Actually ma'am aapka number meri company mein registered hua tha as a active trader. Yahan se daily basis pe market support provide kiya jata hai.\n[00:48] AGENT: Isi ke regarding maine call kiya hai.\n[00:51] AGENT: Toh abhi bata sakte hain aapko kitna time ho gaya market mein kaam karte hue?\n[00:57] CUSTOMER: Abhi time?\n[00:59] AGENT: Ji.\n[01:01] AGENT: Matlab kitne samay se aap kaam kar rahi hain market mein?\n[01:04] CUSTOMER: Kauns market mein?\n[01:06] AGENT: Ma'am, share market ki baat kar rahi hoon na.\n[01:14] AGENT: Hello?\n[01:17] CUSTOMER: Theek hai."}, {"call_id": "2026-08-27_UNMAPPED_TBE668_04", "date": "2026-08-27", "scored_at": "2026-09-01T07:28:32", "agent": "UNMAPPED_TBE668", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-532_TBE668-9602426704-20260827-144900.mp3.mp3.mpeg", "call_number": "", "phone_number": "9602426704", "language": "hi", "notes": "", "score": 4.0, "client_profile_en": "Male customer (Mr. Ranveer) contacted via cold call from Kotak Securities; he states he is not currently doing any investment or trading and initially says he is not interested. No further profiling details (broker, experience, income) were captured.", "client_profile_hi": "पुरुष ग्राहक (मिस्टर रणवीर) को Kotak Securities की कोल्ड कॉल आई; उन्होंने बताया कि वे फिलहाल कोई निवेश या ट्रेडिंग नहीं कर रहे हैं और शुरुआत में कहा कि उन्हें दिलचस्पी नहीं है। ब्रोकर, अनुभव, आय जैसी अन्य कोई प्रोफाइलिंग जानकारी एकत्र नहीं की गई।", "summary_en": "The agent identified herself and the company correctly but kept probing after the customer's clear refusal without adjusting the approach or securing any next step.", "summary_hi": "एजेंट ने अपनी और कंपनी की पहचान सही बताई, लेकिन ग्राहक के स्पष्ट इनकार के बाद भी वैसे ही सवाल पूछती रही और कोई अगला कदम तय नहीं किया।", "strengths_en": ["Clear and correct identification as Kotak Securities authorised person.", "Calm, polite tone maintained throughout despite the customer's refusal."], "strengths_hi": ["Kotak Securities की अधिकृत व्यक्ति के रूप में स्पष्ट और सही पहचान दी गई।", "ग्राहक के इनकार के बावजूद पूरी बातचीत में शांत और विनम्र लहजा बना रहा।"], "issues_en": ["Customer said 'Interested nahi hoon' but agent continued with the same script ('working kar rahe hain market mein investment, trading?') instead of acknowledging the refusal.", "No profiling was attempted beyond a generic question; reason for inactivity or broker relationship was never explored.", "Call ends with no next step, callback, or closing statement secured."], "issues_hi": ["ग्राहक ने कहा 'Interested nahi hoon' फिर भी एजेंट वही स्क्रिप्ट दोहराती रही ('working kar rahe hain market mein investment, trading?') और इनकार को स्वीकार नहीं किया।", "एक सामान्य सवाल के अलावा कोई प्रोफाइलिंग नहीं की गई; ग्राहक की निष्क्रियता का कारण या पहले के ब्रोकर संबंध का पता नहीं लगाया गया।", "कॉल किसी अगले कदम, कॉलबैक या क्लोजिंग स्टेटमेंट के बिना समाप्त हो जाती है।"], "improvements_en": ["Acknowledge the customer's refusal explicitly before asking a follow-up question, to build trust rather than sound scripted.", "Ask a light open-ended question about why they are inactive before pitching further.", "Even if the customer declines, close with a soft next step like 'may I share details on WhatsApp / call you later?' rather than trailing off."], "improvements_hi": ["अगला सवाल पूछने से पहले ग्राहक के इनकार को स्पष्ट रूप से स्वीकार करें, ताकि यह स्क्रिप्टेड न लगे और भरोसा बने।", "आगे पिच करने से पहले हल्के ढंग से पूछें कि वे ट्रेडिंग क्यों नहीं कर रहे।", "ग्राहक के इनकार के बाद भी हल्का अगला कदम तय करें, जैसे 'क्या मैं व्हाट्सएप पर जानकारी भेज सकती हूं / बाद में कॉल कर सकती हूं?' बिना बात को अधूरा छोड़े।"], "transcript": "[00:02] AGENT: Hello?\n[00:04] AGENT: Hello?\n[00:07] AGENT: Yeah, good afternoon sir.\n[00:09] AGENT: Hello?\n[00:12] CUSTOMER: Haan hello.\n[00:14] AGENT: Mayuri baat kar rahi hoon main Kotak Securities Private Limited se.\n[00:17] CUSTOMER: Main karwati hoon baat Deepak ko.\n[00:23] CUSTOMER: Deepak se.\n[00:42] CUSTOMER: Hello?\n[00:43] AGENT: Hello.\n[00:44] CUSTOMER: Hello.\n[00:46] AGENT: Haan ji sir, good afternoon. Mr. Ranveer ji se baat ho rahi hai?\n[00:49] CUSTOMER: Haan ji, boliyega.\n[00:51] AGENT: Mayuri baat kar rahi hoon sir, authorised person Kotak Securities se. Share market regarding aapka number register hua hai sir.\n[00:57] CUSTOMER: Main interested nahi hoon...\n[01:00] AGENT: Ji?\n[01:03] AGENT: Hello?\n[01:04] CUSTOMER: Interested nahi hoon main abhi. Kya bol rahe hain?\n[01:08] AGENT: Haan ji sir, working kar rahe hain abhi market mein aap investment, trading?\n[01:11] CUSTOMER: Nahi nahi, kuch nahi kar raha hoon main abhi.\n[01:14] AGENT: Nahi kar rahe hain? Koi planning hai future start karne ki?"}, {"call_id": "2026-08-28_NeelamRajput_02", "date": "2026-08-28", "scored_at": "2026-09-01T07:29:53", "agent": "Neelam Rajput", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-TBE460-7217865283-20260828-120058.mp3.mp3.mpeg", "call_number": "", "phone_number": "7217865283", "language": "hi", "notes": "", "score": 2.0, "client_profile_en": "Male customer working as a daily-wage laborer (carries bricks/stones - 'eeta-pattar uthane wale'). States he has no knowledge of the stock market, is not literate, does not use Instagram, and uses a basic Vivo smartphone. He expressed no interest in trading or investing and repeatedly said he does not understand these concepts.", "client_profile_hi": "ग्राहक एक पुरुष दैनिक मजदूर है (ईंट-पत्थर उठाने का काम करता है)। उसने बताया कि उसे शेयर बाजार की कोई जानकारी नहीं है, वह पढ़ा-लिखा नहीं है, इंस्टाग्राम नहीं चलाता, और एक सामान्य Vivo स्मार्टफोन इस्तेमाल करता है। उसने ट्रेडिंग या निवेश में कोई रुचि नहीं दिखाई और बार-बार कहा कि उसे इन चीज़ों की समझ नहीं है।", "summary_en": "The agent repeatedly mocked and argued with a customer who clearly and respectfully stated he had no interest, knowledge or means to trade, resulting in a disrespectful and unproductive call.", "summary_hi": "एजेंट ने बार-बार उस ग्राहक का मज़ाक उड़ाया और उससे बहस की जिसने स्पष्ट और विनम्रता से कहा कि उसे ट्रेडिंग में कोई रुचि, ज्ञान या साधन नहीं है, जिससे यह कॉल अनादरपूर्ण और अनुत्पादक बन गई।", "strengths_en": ["Agent gave a basic, simple explanation of what a Demat account is when the customer asked to understand the process.", "Agent stayed on the call and attempted to keep the conversation going rather than hanging up abruptly."], "strengths_hi": ["जब ग्राहक ने प्रक्रिया समझने के लिए कहा तो एजेंट ने डीमैट अकाउंट के बारे में एक सामान्य, सरल स्पष्टीकरण दिया।", "एजेंट कॉल पर बनी रही और बातचीत को अचानक खत्म करने के बजाय उसे जारी रखने की कोशिश की।"], "issues_en": ["Agent mocked the customer's occupation and honesty, e.g. 'Lag to nahi rahe hain sir' and 'Mazak to aap kar hi rahe hain', implying he was lying about being a laborer.", "Agent ignored the customer's repeated, clear statements ('humko jankari nahi hai', 'padhe likhe nahi hain') and kept arguing instead of adapting or gracefully ending the pitch.", "Pitch about Demat, SIP, IPO and Instagram ads was completely irrelevant to a customer who explicitly said he doesn't use Instagram or know these terms, showing no personalization."], "issues_hi": ["एजेंट ने ग्राहक के पेशे और ईमानदारी का मज़ाक उड़ाया, जैसे 'लग तो नहीं रहे हैं सर' और 'मज़ाक तो आप कर ही रहे हैं', जिससे यह संकेत मिला कि वह मजदूर होने के बारे में झूठ बोल रहा है।", "एजेंट ने ग्राहक के बार-बार दिए गए स्पष्ट बयानों ('हमको जानकारी नहीं है', 'पढ़े लिखे नहीं हैं') को नज़रअंदाज़ किया और अनुकूलन करने या बात को शालीनता से समाप्त करने के बजाय बहस करती रही।", "डीमैट, SIP, IPO और इंस्टाग्राम विज्ञापनों के बारे में पिच पूरी तरह अप्रासंगिक थी क्योंकि ग्राहक ने साफ कहा था कि वह इंस्टाग्राम नहीं चलाता और इन शब्दों को नहीं जानता, जिससे कोई व्यक्तिगतकरण नहीं दिखा।"], "improvements_en": ["Respect a clearly stated 'not interested/no knowledge' response instead of arguing or challenging the customer's credibility.", "Drop sarcastic and condescending remarks entirely; use a neutral, respectful tone even when a lead does not fit the product.", "If the customer is clearly not a fit (no literacy, no smartphone usage, no interest), politely close the call rather than pushing repeatedly."], "improvements_hi": ["जब ग्राहक साफ तौर पर 'रुचि नहीं है/जानकारी नहीं है' कहे तो उसे स्वीकार करें, बहस न करें या उसकी विश्वसनीयता पर सवाल न उठाएं।", "व्यंग्यात्मक और तिरस्कारपूर्ण टिप्पणियों को पूरी तरह हटाएं; भले ही लीड उत्पाद के लिए उपयुक्त न हो, तटस्थ और सम्मानजनक लहजा अपनाएं।", "यदि ग्राहक स्पष्ट रूप से उपयुक्त नहीं है (पढ़ाई नहीं, स्मार्टफोन का उपयोग नहीं, रुचि नहीं), तो बार-बार दबाव डालने के बजाय विनम्रता से कॉल समाप्त करें।"], "transcript": "[00:05] AGENT: Hello?\n[00:07] CUSTOMER: Hello.\n[00:09] AGENT: Ji, good afternoon sir. Neelam baat kar rahi hoon Kotak Securities ke behalf se authorized person.\n[00:16] CUSTOMER: Kya cheez ma'am?\n[00:19] AGENT: Ji sir, Kotak Securities ke behalf se authorized person Neelam baat kar rahi hoon.\n[00:23] CUSTOMER: Haan ji, bolie.\n[00:25] AGENT: Ji sir, maine aapko support aur service ke regarding call kiya tha. Abhi working wagera kar rahe hain aap stock market mein?\n[00:32] CUSTOMER: Nahi ma'am. Hum to labor majdoor hain.\n[00:36] AGENT: So what happened sir? Aisa to kahi pe likha nahi hai ki wo log kaam nahi kar sakte sir.\n[00:41] CUSTOMER: Abhi hum log labor majdoor hain ma'am, eeta-pattar uthane wale.\n[00:46] AGENT: Lag to nahi rahe hain sir.\n[00:48] CUSTOMER: Sahi keh raha hoon, mazak nahi kar raha hoon, sahi keh raha hoon.\n[00:50] AGENT: Mazak to aap kar hi rahe hain.\n[00:52] CUSTOMER: Nahi nahi, bilkul. Hum to eeta hi uthate hain.\n[00:56] AGENT: Haan to koi kaam kharab thodi na hai sir.\n[01:01] CUSTOMER: Haan to...\n[01:03] AGENT: Hai na?\n[01:04] CUSTOMER: Haan, bolie.\n[01:05] AGENT: Aaj ki date mein sab kuch na kuch kuch na kuch karte hi hain sir. Iska matlab ye thodi na hai ki aap log kahi pe investment nahi kar sakte, alternate income source ke liye nahi ja sakte? Ja sakte hain na sir?\n[01:15] CUSTOMER: Yani ki aapka kaam hai kya?\n[01:20] AGENT: Aap stock market jaan-te hain?\n[01:22] CUSTOMER: Nahi, stock nahi jaante hain.\n[01:24] AGENT: Kuch bhi nahi jaante ho?\n[01:25] CUSTOMER: Nahi. Majdoor aadmi kya janega...\n[01:27] AGENT: Aray sir wahi baat, sir aisa main wahi chiz aapko bol rahi hoon, kahan pe aisa likha hai ki nahi jaan sakte aap? Aap jaanna nahi chahte ho ye alag baat hai sir, aapne apni mentality agar aisi soch ke rakhi hai to fir hum kuch bhi nahi kar sakte hain sir. Nahi to agar karna chahein to sab kuch kar sakte hain sir. Koi zaroori nahi hai aap padhe-likhe hain, nahi hain. Aaj ki date mein to wahi log zyada paisa kama rahe hain sir.\n[01:48] CUSTOMER: Haan haan.\n[01:50] AGENT: To fir sir? Sabhi log to kaam karte hain, yahan to farmer bhi kaam karte hain. Jo daily basis pe regular income rehti hai wo log bhi kaam karte hain. Jo business karte hain wo bhi karte hain, job wale bhi karte hain. Side income source to sabhi ke liye hota hai sir.\n[02:01] CUSTOMER: Haan.\n[02:02] AGENT: Kisi ek vyakti ke liye thodi na hai sir.\n[02:05] CUSTOMER: Aakhir ye kya process hai, samjhaiye aap mujhe.\n[02:09] AGENT: Iske liye ye process rehta hai sir. Sabse pehle to apan ko Demat account open karna hota hai. Jaisa apna bank account hota hai, waisa Demat account hota hai. Us Demat account ke through sir, aapne kabhi jaise ad wagera dekhe honge mobile mein, jaise Mutual Fund ke aate hain, SIP ke aate hain, IPO wagera ke baare mein aapne suna hoga sir, hai na?\n[02:29] CUSTOMER: Nahi ye sab ke baare mein sune bhi nahi hain hum.\n[02:32] AGENT: Mobile kaunsa use karte hain aap?\n[02:35] CUSTOMER: Mobile mera Vivo ka.\n[02:39] AGENT: To mobile mein khud ad aata hai sir. Kotak ka bhi aata hai, aur stock market ka bhi aata hai. Aur aajkal to Insta ka zamana hai sir, aisa ho hi nahi sakta ki aapne koi Reels wagera share market se related nahi dekhi ho.\n[02:49] CUSTOMER: Yahan tak ki hum Instagram bhi nahi chalate.\n[02:52] AGENT: Nahi chalate honge, lekin phir bhi sir, wo to cheezein kahi pe bhi update ho jaati hain.\n[02:57] CUSTOMER: Nahi chalate hain. Padhe likhe nahi hain na ma'am, isliye.\n[03:04] AGENT: Maine kab bola ki aapko share market mein degree ki zaroorat hoti hai sir?\n[03:08] CUSTOMER: Padha likha insan hi to chalata hai bada bada phone. Hum to labor majdoor aadmi hain, chhota sa phone hai chalayein. Instagram Instagram ye sab to humko ID bhi banana nahi aata.\n[03:20] AGENT: Wo to dekho sir, maine aapko wahi cheez boli na, hum karna chahein to sab kuch kar sakte hain sir. Hum nahi karna chahein to bahane hazaar hote hain sir.\n[03:28] CUSTOMER: Haan jisko jankari ho wo to karegi na ma'am.\n[03:31] AGENT: Aise aise customer hain sir jinhone kuch nahi suna lekin unke paas hai ki mujhe karna hai. To aisa to nahi hai ki apan seekh nahi sakte? Har ek cheez ka first time hota hai sir. Aap jo aaj jo aap kaam kar rahe ho wo bhi aap pehle se seekh ke thodi na aaye ho sir? Kahi na kahi se to start kiya hi hoga na sir?\n[03:45] CUSTOMER: Isme seekhna nahi padta na, bas eeta uthao le jaake de do mistri ko.\n[03:49] AGENT: Arey itna to mujhe bhi pata hai sir, aapke baat karne se mujhe bhi samajh mein aata hai kaun sa customer kya hai aur kya nahi hai sir. Agar aap market nahi jaante to aapka number bhi market mein nahi hota sir. Kis vyakti ka number hota hai market mein kis se hum discussion karte hain ye to humko bhi pata hai sir. Aapki family mein kitne logon ko call aata hai share market se related aapke alawa?\n[04:08] CUSTOMER: Ye to pata nahi, main wahi to bol raha hoon main nahi jaan...\n[04:11] AGENT: Haan to main wahi bol rahi hoon na, wo log nahi karte hain, nahi interested honge, ुभव, देरी का कारण)।", "यह मान लेने के बजाय कि ग्राहक का क्या मतलब था, शुरुआत में ही एक सीधा प्रश्न पूछकर समझ की पुष्टि करें।"], "transcript": "[00:02] AGENT: Hello?\n[00:03] CUSTOMER: Hello.\n[00:04] AGENT: Ji, good morning, sir.\n[00:05] CUSTOMER: Very good morning. Boliye, ma'am.\n[00:07] AGENT: Haan ji sir, Neelam baat kar rahi hoon. Kaise hain aap?\n[00:11] CUSTOMER: Theek hai, ma'am.\n[00:14] AGENT: Aapne kiya tha kya us din process, sir?\n[00:18] CUSTOMER: Haan ma'am, dekha maine.\n[00:23] AGENT: Haan, detail hi dekha hai. Main process ki baat kar rahi hoon, sir.\n[00:27] CUSTOMER: Nahi, process nahi kiya.\n[00:31] AGENT: To details mein aisi koi woh hai matlab jo aapko cheezein nahi samajh mein aayi ho, sir?\n[00:38] CUSTOMER: Haan ma'am, mereko ek baat... usme thoda main confused hoon. Usme investment kaisi karni hai?\n[00:47] AGENT: Investment usme jaise maan lijiye aapne Demat account open kar liya usme, theek hai?\n[00:52] AGENT: Jab hum Demat account open karte hain na sir, to usme apna bank hum attach karte hain. Jaise Google Pay, PhonePe pe kaise hum bank add karte hain, tab jaake hum usme kisi se bhi len-den kar sakte hain, transaction kar sakte hain, hai na online?\n[01:04] CUSTOMER: Ji.\n[01:05] AGENT: Waise same Demat account mein aapka bank add hota hai, phir aap apne bank ke through apne Demat mein paisa add kar sakte hain, sir. UPI ke through ho jata hai, usme option aata hai, theek hai?\n[01:17] AGENT: Aur jab aap withdraw karte hain na sir, to withdraw mein bhi aap application pe jayenge, withdraw pe aap click karoge sir, kitna amount aapko nikalna hai amount mein amount fill karoge, aapka jo bank add rahega usme aapka paisa withdraw ho jayega, sir. Theek hai? Yehi process rehta hai, simple process hai woh to.\n[01:34] AGENT: Theek hai?\n[01:35] CUSTOMER: Theek hai, ma'am.\n[01:37] AGENT: Haan, to aisa kar lena, jaise Demat wagera open kar lena, Demat account open karne ke baad mein aapko pura application samjhaungi, apan ko bina samjhe kaam s
