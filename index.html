<style>
:root {
--bg: #0f1115; --panel: #171a21; --text: #e8e8ec; --muted: #9297a3;
--accent: #7c9eff; --border: #262a35;
}
* { box-sizing: border-box; }
body {
background: var(--bg); color: var(--text); margin: 0; padding: 32px;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 4px; flex-wrap: wrap; }
.header { display: flex; align-items: center; gap: 14px; }
.header img { height: 40px; width: auto; max-width: 180px; object-fit: contain; }
h1 { font-size: 22px; font-weight: 600; margin: 0; }
.subtitle { color: var(--muted); font-size: 13px; margin: 4px 0 28px; }
.lang-toggle {
display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
}
.lang-toggle button {
background: var(--panel); color: var(--muted); border: none; padding: 7px 14px;
font-size: 13px; cursor: pointer; font-weight: 600;
}
.lang-toggle button.active { background: var(--accent); color: #0b0e14; }
.btn-small {
background: var(--panel); color: var(--text); border: 1px solid var(--border);
padding: 7px 14px; font-size: 13px; cursor: pointer; font-weight: 600;
border-radius: 8px;
}
.btn-small:hover { border-color: var(--accent); }
.btn-danger { color: #ff6b6b; border-color: #ff6b6b55; }
.btn-danger:hover { border-color: #ff6b6b; background: #ff6b6b18; }
.grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px; }
.panel {
background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
padding: 20px; min-width: 0;
}
.panel h2 { font-size: 15px; font-weight: 600; margin: 0 0 14px; color: var(--text); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
.card {
background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
padding: 16px;
}
.card .label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
.card .value { font-size: 24px; font-weight: 700; }
.filter-row { margin-bottom: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
select {
background: #0f1115; color: var(--text); border: 1px solid var(--border);
border-radius: 8px; padding: 7px 10px; font-size: 13px; min-height: 36px;
}
.chart-box { position: relative; height: 260px; }
.table-scroll { max-height: 520px; overflow-y: auto; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 480px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td.wrap { white-space: normal; }
th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--text); }
tbody tr { cursor: pointer; transition: background 0.1s; }
tbody tr:hover { background: #1d212b; }
.score-pill {
display: inline-block; padding: 2px 8px; border-radius: 999px; font-weight: 600; font-size: 12px;
}
.empty { color: var(--muted); padding: 40px; text-align: center; }

.modal-backdrop {
display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
align-items: center; justify-content: center; z-index: 100; padding: 24px;
}
.modal-backdrop.open { display: flex; }
.modal {
background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
max-width: 640px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 24px;
}
.modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; gap: 10px; }
.modal-header h3 { margin: 0; font-size: 17px; }
.modal-close {
background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer;
line-height: 1; padding: 4px;
}
.modal-meta { color: var(--muted); font-size: 12.5px; margin-bottom: 16px; }
.modal-score { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px; }
.modal-score .num { font-size: 26px; font-weight: 700; }
.modal-section { margin-bottom: 16px; }
.modal-section h4 {
font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted);
margin: 0 0 8px;
}
.modal-section ul { margin: 0; padding-left: 18px; }
.modal-section li { margin-bottom: 5px; line-height: 1.4; }
.tag-strength { color: #4ade80; }
.tag-issue { color: #f87171; }
.tag-improve { color: #7c9eff; }

@media (max-width: 820px) {
body { padding: 16px; }
.grid { grid-template-columns: 1fr; }
.cards { grid-template-columns: 1fr 1fr; }
.header img { height: 32px; }
h1 { font-size: 19px; }
.chart-box { height: 220px; }
.modal { max-width: 100%; padding: 18px; border-radius: 10px; }
.modal-backdrop { padding: 10px; }
select, .lang-toggle button { min-height: 40px; }
.filter-row { flex-direction: column; align-items: stretch; }
.filter-row label { margin-top: 4px; }
.filter-row select, .filter-row input, .filter-row button { width: 100%; margin-left: 0 !important; }
}
@media (max-width: 480px) {
.cards { grid-template-columns: 1fr; }
.card .value { font-size: 20px; }
td.wrap {
display: -webkit-box;
-webkit-line-clamp: 2;
-webkit-box-orient: vertical;
overflow: hidden;
max-width: 220px;
}
}
</style>
</head>
<body>

const DATA = [{"call_id": "2026-08-25_Jayajain_01", "date": "2026-08-25", "scored_at": "2026-09-01T08:03:06", "agent": "Jaya jain", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-TBE395-6375855831-20260825-093434.wav.wav", "drive_file_id": "", "phone_number": "6375855831", "language": "hi", "duration_seconds": "302", "score": 2.0, "call_category": "Account Activation / Reactivation", "client_profile_en": "Female customer with an existing trading account holding stock worth approx. ₹14,600 (including Kotak Mahindra Bank shares); she is trying to activate the Derivatives segment on the trading app but is facing a technical error where the 'Confirm Activation' button is not working.", "client_profile_hi": "एक महिला ग्राहक जिनके पास पहले से ट्रेडिंग अकाउंट है और लगभग ₹14,600 की होल्डिंग है (जिसमें कोटक महिंद्रा बैंक के शेयर भी शामिल हैं); वे ट्रेडिंग ऐप पर Derivatives सेगमेंट एक्टिवेट करने की कोशिश कर रही हैं, लेकिन 'Confirm Activation' बटन काम नहीं कर रहा है, यह तकनीकी समस्या आ रही है।", "summary_en": "The agent handled a technical activation issue with reasonable patience but seriously breached compliance by asking the customer for her Aadhaar number and OTP.", "summary_hi": "एजेंट ने तकनीकी एक्टिवेशन समस्या को कुछ हद तक धैर्य से संभाला, लेकिन ग्राहक से आधार नंबर और OTP मांगकर एक गंभीर अनुपालन उल्लंघन किया।", "strengths_en": ["Agent remained patient and offered alternative solutions when the app repeatedly failed.", "Maintained a calm, non-pushy tone throughout the troubleshooting."], "strengths_hi": ["जब ऐप बार-बार फेल हुआ, तब भी एजेंट धैर्यपूर्वक रही और वैकल्पिक समाधान सुझाए।", "पूरे ट्रबलशूटिंग के दौरान शांत और गैर-दबाव वाला टोन बनाए रखा।"], "issues_en": ["Agent asked the customer to share her 'Aadhaar card number aur OTP' — a serious compliance violation and major red flag.", "Purpose of the call was never clearly explained; the agent jumped into holding statements and app steps without context.", "No profiling or explanation of why derivative activation is needed or relevant to the customer's trading."], "issues_hi": ["एजेंट ने ग्राहक से 'आधार कार्ड नंबर और OTP' मांगा — यह एक गंभीर अनुपालन उल्लंघन और बड़ा रेड फ्लैग है।", "कॉल का उद्देश्य कभी स्पष्ट रूप से नहीं समझाया गया; एजेंट सीधे होल्डिंग स्टेटमेंट और ऐप स्टेप्स पर चली गई।", "यह क्यों जरूरी है और ग्राहक की ट्रेडिंग से इसका क्या संबंध है, इसकी कोई प्रोफाइलिंग या स्पष्टीकरण नहीं दिया गया।"], "improvements_en": ["Never request OTP, Aadhaar number or passwords over a call — this must be immediately flagged and corrected as a compliance breach.", "Clearly state the purpose of the call upfront (why derivative activation is needed) before jumping into technical steps.", "If the app error persists, escalate to technical support/IT rather than attempting to complete the action on the customer's behalf using sensitive credentials."], "improvements_hi": ["कॉल पर कभी भी OTP, आधार नंबर या पासवर्ड न मांगें — इसे तुरंत अनुपालन उल्लंघन के रूप में सुधारा जाना चाहिए।", "तकनीकी स्टेप्स में जाने से पहले कॉल का उद्देश्य (Derivative Activation क्यों जरूरी है) स्पष्ट रूप से बताएं।", "यदि ऐप में एरर बार-बार आ रहा है, तो संवेदनशील जानकारी का उपयोग करके खुद कार्य पूरा करने के बजाय टेक्निकल सपोर्ट/IT को एस्केलेट करें।"], "transcript": "[00:01] AGENT: Hello?\n[00:02] CUSTOMER: Hello?\n[00:04] AGENT: Ji bolie.\n[00:05] AGENT: Yes ma'am, good morning. Jaya baat kar rahi hoon IIFL Capital Services se.\n[00:09] CUSTOMER: Haan bolie.\n[00:09] AGENT: Haan, yes ma'am. Actually abhi Kotak Mahindra Bank dekhein toh abhi ₹400 pe trade kar raha hai, abhi ₹400 hi chal raha hai woh.\n[00:17] CUSTOMER: Haan bolie abhi.\n[00:19] AGENT: Haan, koi baat nahi. Baaki dekhiye main aapko state, woh bhej rahi hoon holding statement. Yeh wala apan jo hai upload karenge. Open kariye dekhiye phone mein maine aapko bheja hai, download kar lijiye ise.\n[00:38] AGENT: Dekhiye maine share kiya. Yeh wala kariye download.\n[00:44] CUSTOMER: Woh wala pehle remove karna padega na?\n[00:46] AGENT: Nahi, woh toh ho, ho gaya hoga remove. Matlab yeh wala abhi yeh download kariye, yeh wala upload karna hai aapne ko, okay?\n[00:53] CUSTOMER: Theek hai.\n[00:54] AGENT: Haan, ise download kar lijiye.\n[01:09] AGENT: Hello? [audio unclear or repeating here — collapsed from 3 near-identical segments]\n[01:18] CUSTOMER: Jo kal jaise kiya tha waise hi upload karna hai?\n[01:20] AGENT: Haan haan.\n[01:21] AGENT: Open kiya? Download kar liya? Open kariye application main karwa deti hoon aapko.\n[01:25] CUSTOMER: Haan, download kar diya maine.\n[01:27] AGENT: Theek hai, View & Edit Details pe click kariye. Aap watchlist pe jaake...\n[01:30] CUSTOMER: Haan.\n[01:32] AGENT: ...den Derivative Activation pe jaana hai.\n[01:42] CUSTOMER: Main screenshot bheja hai.\n[01:57] AGENT: Kiya click ma'am?\n[01:59] CUSTOMER: Ji.\n[02:00] AGENT: Ab isme aapki jo total holding ho gayi hai ₹14,600 ki, 14,000...\n[02:05] CUSTOMER: Isme toh pura sab, sab subscribe click karna hai na ispe?\n[02:09] AGENT: Haan haan, uspe View & Edit Details pe click kiya? Phir haan, phir Derivatives pe click karne ke baad aapko sab jo bhi boxes hain sab pe click, tick karna hai. Aur confirm activation pe click karna hai phir.\n[02:34] CUSTOMER: Yeh Confirm Activation pe click ho nahi raha hai mere se.\n[02:36] AGENT: Kya show ho raha hai?\n[02:39] CUSTOMER: Dekhiye main aapko bhejti hoon.\n[02:41] AGENT: Hmm, screenshot bhejiye.\n[02:53] AGENT: Something went... aap agar matlab comfortable rahe toh main idhar se upload karwa doon kya? Ya ek baar aur ek kaam kariye pura refresh kariye, again se open kariye application.\n[03:02] CUSTOMER: Ek sec, main karti hoon.\n[03:03] AGENT: Haan, again se kariye.\n[03:37] AGENT: Again open kar liya na ma'am?\n[03:40] CUSTOMER: Ji.\n[03:52] CUSTOMER: Wahi aa raha hai wapas.\n[03:53] AGENT: Again wahi show ho raha hai? Theek hai, ek kaam karti hoon main yahan se upload karwa deti hoon, okay? Aap Aadhaar card number aur OTP bata dijiyega. Ek minute.\n[04:47] AGENT: Hello?\n[04:47] CUSTOMER: Hello?\n[04:48] AGENT: Theek hai ma'am, haan main aapko call arrange karwa deti hoon, theek hai? Ya ek baar ek kaam kariye na, ek baar again open karke again check kariye na, ye problem toh aani nahi chahiye matlab...\n[04:59] CUSTOMER: Main ek baar pura refresh karke call cut karke phir karti hoon.\n[05:02] AGENT: Haan haan, phir se open karke dekhiye. Phir call kariye again."}, {"call_id": "2026-08-25_Jayajain_02", "date": "2026-08-25", "scored_at": "2026-09-01T08:04:11", "agent": "Jaya jain", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-TBE395-9584774444-20260825-113948.wav.wav", "drive_file_id": "", "phone_number": "9584774444", "language": "hi", "duration_seconds": "253", "score": 3.0, "call_category": "Account Opening", "client_profile_en": "Male customer previously agreed to open a Demat account with IIFL Capital Services but has not completed it; required documents (Aadhaar, PAN) are on his bhabhi's phone, which is currently at a service center as his own phone broke. He also asked the agent to verify whether a company called 'Comat' (possibly Comat Global) offering him a job is genuine.", "client_profile_hi": "एक पुरुष ग्राहक ने पहले IIFL Capital Services के साथ डीमैट अकाउंट खोलने पर सहमति दी थी लेकिन अभी तक पूरा नहीं किया; आवश्यक दस्तावेज (आधार, पैन) उसकी भाभी के फोन में हैं, जो अभी सर्विस सेंटर में है क्योंकि उसका अपना फोन खराब हो गया था। उसने एजेंट से यह भी पूछा कि क्या 'Comat' (संभवतः Comat Global) नाम की कंपनी जो उसे नौकरी का ऑफर दे रही है, असली है या नहीं।", "summary_en": "The agent failed to give clear follow-up on the account opening and, worse, fabricated uncertain details about a company the customer was trying to verify, which is a misleading-statement risk.", "summary_hi": "एजेंट अकाउंट खोलने पर स्पष्ट फॉलो-अप नहीं दे पाई और उससे भी बुरा, ग्राहक जिस कंपनी को सत्यापित करना चाहता था उसके बारे में अनिश्चित जानकारी गढ़कर बताई, जो भ्रामक बयान का जोखिम है।", "strengths_en": ["Agent correctly identified herself as calling from IIFL Capital Services and referenced the earlier conversation.", "Secured a next callback window ('do din mein') despite the confusing call."], "strengths_hi": ["एजेंट ने सही तरीके से खुद को IIFL Capital Services से बताया और पिछली बातचीत का संदर्भ दिया।", "उलझन भरी कॉल के बावजूद अगली कॉलबैक की समयसीमा ('दो दिन में') तय की।"], "issues_en": ["When the customer genuinely asked if 'Comat Global' (a job offer) was legitimate, the agent guessed and presented fabricated details ('cement and construction material, food products') as fact — a serious misrepresentation risk.", "Poor listening/audio handling caused repeated 'Sorry? Huh?' moments and confusion over 'Comat' vs 'Global', frustrating the customer.", "No profiling or relevant pitch was attempted to move the account-opening conversation forward beyond document status."], "issues_hi": ["जब ग्राहक ने वास्तव में पूछा कि क्या 'Comat Global' (नौकरी ऑफर) असली है, एजेंट ने अंदाज़ा लगाकर गढ़ी हुई जानकारी ('सीमेंट और निर्माण सामग्री, खाद्य उत्पाद') तथ्य के रूप में दी — यह गंभीर भ्रामक बयान का जोखिम है।", "खराब सुनने/ऑडियो हैंडलिंग के कारण बार-बार 'सॉरी? हुह?' जैसे पल आए और 'Comat' बनाम 'Global' को लेकर भ्रम रहा, जिससे ग्राहक निराश हुआ।", "दस्तावेज़ स्थिति से आगे बढ़कर अकाउंट-ओपनिंग बातचीत को बढ़ाने के लिए कोई प्रोफाइलिंग या प्रासंगिक पिच नहीं की गई।"], "improvements_en": ["Never speculate on unverified information — clearly tell the customer 'I don't have this information, let me check and confirm' instead of inventing details.", "Improve call clarity/audio setup to avoid repeated 'sorry, can't hear' moments that erode customer confidence.", "Use the follow-up call to also do basic profiling (trading interest, objective) rather than only chasing documents."], "improvements_hi": ["अपुष्ट जानकारी पर कभी अंदाज़ा न लगाएं — जानकारी गढ़ने के बजाय स्पष्ट रूप से कहें 'मेरे पास यह जानकारी नहीं है, मैं जांचकर बताती हूँ'।", "कॉल की स्पष्टता/ऑडियो सेटअप सुधारें ताकि बार-बार 'सॉरी, सुनाई नहीं दे रहा' जैसे पल न आएं जो ग्राहक का भरोसा कम करते हैं।", "फॉलो-अप कॉल का उपयोग केवल दस्तावेज़ों के पीछे भागने के बजाय बुनियादी प्रोफाइलिंग (ट्रेडिंग रुचि, उद्देश्य) के लिए भी करें।"], "transcript": "[00:03] AGENT: Hello? Hello? Yes, good morning, sir.\n[00:07] CUSTOMER: Good morning.\n[00:08] AGENT: Sir, Jaya baat kar rahi hoon IIFL Capital Services se. Sir, actually baat hui thi na meri aapse Demat account opening ke liye? So, abhi process kar le kya? Us din bhi aapne bola tha ki thik hai, aap kar lenge apne side se, par aapne kiya nahi, so...\n[00:26] AGENT: Sorry? Main aap... huh?\n[00:30] CUSTOMER: ...kuch abhi document wagera...\n[00:34] AGENT: Actually maine aapko details bhi share kar diya tha WhatsApp pe, sir. Sir, ye to basic documents rehte hain, Aadhaar card, PAN card, ye to available honge hi na aapke phone mein? Aisa to nahi hai ki nahi honge?\n[00:43] CUSTOMER: Nahi, mera phone ghoom gaya tha, to main kya actually aisa hua ki phone gir gaya tha, pura matlab, pura kharab ho gaya hai, to doosre waale mobile mein hai, matlab bhabhi ke mobile mein hai...\n[00:54] AGENT: Achha.\n[00:56] CUSTOMER: To wo gaye hain, wo gaye hain abhi jara service center pe.\n[01:00] AGENT: To kab tak phir kar lenge aap?\n[01:03] CUSTOMER: Aaj ab jaate hain phir karte hain madam, abhi to main bahar hoon.\n[01:07] AGENT: Achha, to kab tak call back kar sakti hoon main aapko?\n[01:11] CUSTOMER: Aap bas do ek roz baat kariye madam.\n[01:17] AGENT: Thik hai. Okay sir, thank you.\n[01:20] CUSTOMER: Jabhi ki madam, hain na?\n[01:21] AGENT: Haan, sir aapne verify kiya hua tha na mobile number, email ID? Process dekhiye, main aapko bas itna bolungi ki aap process kar lijiye. Jo bhi jaise yahan se jo bhi stocks aayenge, aap long-term ke liye kar sakte hain, daily basis par...\n[01:31] CUSTOMER: Jaise mujhe koi thodi, mere ko thodi jankari chahiye thi.\n[01:34] AGENT: Mmm, boliye.\n[01:35] CUSTOMER: Aap... aap kaun si, kaun se usse ho? Kya bolte bata raha tha aap, kaun sa...\n[01:40] AGENT: Sorry? Sir, aapki voice clear nahi aa pa rahi hai.\n[01:44] CUSTOMER: Main bola aap kaun sa khulwane ka bol rahe ho?\n[01:46] AGENT: IIFL mein, sir. IIFL Capital Services se baat kar rahi hoon, yes sir.\n[01:50] CUSTOMER: Ye jo apna trading purpose hai na?\n[01:52] AGENT: Mmm-hmm.\n[01:53] CUSTOMER: Ma'am Comat, Comat naam suna hai?\n[01:55] AGENT: Comat?\n[01:56] CUSTOMER: Mmm.\n[01:57] AGENT: Ek minute, nahi sir. Kiski baat kar rahe hain aap, Comat?\n[02:02] CUSTOMER: Comat ek trading purpose rehta na ma'am.\n[02:04] AGENT: Trading? Ek minute dekhti hoon sir, iska knowledge nahi hai mujhe. Comat Trading Company, right?\n[02:11] CUSTOMER: Hai kya?\n[02:13] AGENT: Ek minute main check karti hoon. Kyun sir? Aap usme kiya tha kya aapne?\n[02:19] CUSTOMER: Nahi nahi, aap thoda mere ko thodi jankari dijiye na. Hoti kya Comat?\n[02:26] AGENT: Ek minute...\n[02:34] AGENT: Ek minute batati hoon.\n[02:44] AGENT: Haan, Comat naam ki to multiple companies hongi sir. Aap trading ke liye hi baat kar rahe hain na?\n[02:49] CUSTOMER: Comat Global, Global wagera mein kya rehta madam? Global, wo usi ko bolte hain kya?\n[02:55] AGENT: Ek minute... Sir, actually mujhe iska knowledge nahi hai sir. Aap kya...\n[03:01] CUSTOMER: Nahi, wo to nahi hai aapko, par aati ki nahi aati matlab hai ki nahi ye sab mere ko batayie na.\n[03:06] AGENT: Mmm, Comat Global Group ki ek... ye trading aur distribution company group hai.\n[03:12] CUSTOMER: Achha.\n[03:13] AGENT: Haan.\n[03:13] CUSTOMER: Hai ye kya? Ye matlab aisa hai ki jo...\n[03:17] CUSTOMER: job wagera diya karte hain, matlab aisa kuch hai.\n[03:20] AGENT: Achha.\n[03:22] CUSTOMER: So job offer hai...\n[03:25] CUSTOMER: ...Comat mein. To main bol raha hoon ki matlab hai ki nahi, so farzi varzi kaam to nahi, aisa pooch raha tha aapse.\n[03:33] AGENT: Nahi sir, yahan se main check kar rahi hoon to hai. Matlab ye jo comp... ye jo company hai ye alag alag products ko import karke market mein distribute aur sell karti hai, sir. Iska business jaise cement aur construction material, food product...\n[03:47] CUSTOMER: Are yaar, ye nahi, ye nahi. Main to trading ka bol raha hoon. Trading wali hai kya koi?\n[03:51] AGENT: Maine Global Company, aapne mujhe Global ka bola na, to wahi maine check kiya hai.\n[03:55] CUSTOMER: Global nahi, maine Comat bola. Comat pehle bola.\n[03:57] AGENT: Comat Global, haan. Phir Global bhi to bola na aapne.\n[04:01] AGENT: Bahut sari companies hain Comat ke naam se, ek baar aap search kar lijiyega, sir.\n[04:05] CUSTOMER: Chalo.\n[04:06] AGENT: Hm. Baaki main aapko kab tak call kar loon, sir?\n[04:09] CUSTOMER: Mere ko do ek roz mein aap kariye, main aapka kaam karwata hoon, fir main...\n[04:13] AGENT: Thik hai, sir. Okay, thank you."}, {"call_id": "2026-08-25_Jayajain_03", "date": "2026-08-25", "scored_at": "2026-09-01T08:06:16", "agent": "Jaya jain", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-TBE395-7069884231-20260825-174425.wav.wav", "drive_file_id": "", "phone_number": "7069884231", "language": "hi", "duration_seconds": "177", "score": 4.0, "call_category": "Account Opening", "client_profile_en": "Male customer based in Pune, currently employed (referred to as 'duty'/job), has no stock market trading experience or knowledge, has an existing (seemingly unused/unaware) Kotak Mahindra demat account, and states he has no interest in stock market investing and no time to give it due to his job.", "client_profile_hi": "पुणे से एक पुरुष ग्राहक, जो वर्तमान में नौकरी ('duty') करता है, उसे शेयर बाजार में ट्रेडिंग का कोई अनुभव या ज्ञान नहीं है, उसका पहले से एक कोटक महिंद्रा डीमैट अकाउंट है (जिसके बारे में उसे खुद ठीक से जानकारी नहीं है), और वह कहता है कि उसे शेयर बाजार में निवेश में कोई रुचि नहीं है और नौकरी के कारण उसके पास समय नहीं है।", "summary_en": "The agent kept pushing a generic demat account pitch despite the customer clearly and repeatedly stating he had no interest and no time, resulting in a weak, unproductive close.", "summary_hi": "ग्राहक द्वारा बार-बार स्पष्ट रूप से रुचि न होने और समय न होने की बात कहने के बावजूद एजेंट ने सामान्य डीमैट खाता पिच जारी रखी, जिसके परिणामस्वरूप कमजोर और अनुत्पादक समापन हुआ।", "strengths_en": ["Agent clearly introduced herself and IIFL Capital and stated the purpose of the call upfront.", "Gathered some useful profiling facts such as location, profession, prior demat account, and lack of market experience."], "strengths_hi": ["एजेंट ने स्पष्ट रूप से अपना और IIFL Capital का परिचय दिया और कॉल का उद्देश्य शुरुआत में ही बताया।", "कुछ उपयोगी प्रोफाइलिंग जानकारी जुटाई जैसे स्थान, पेशा, पहले का डीमैट अकाउंट, और बाजार अनुभव की कमी।"], "issues_en": ["Customer said 'Kuch interest hi humko nahi hai' and later 'Nahi ma'am mere ko koi interest nahi hai' twice, yet the agent continued the same pitch instead of stopping or adapting.", "The pitch (Tata, Adani examples, long-term investing) was generic and disconnected from the customer's stated time constraints and lack of interest.", "Closing was weak — 'number save kar lijiye, future plan banta hai to call kar sakte hain' — no concrete next step or commitment secured."], "issues_hi": ["ग्राहक ने 'कुछ interest ही हमको नहीं है' और बाद में दो बार 'नहीं मैम मुझे कोई interest नहीं है' कहा, फिर भी एजेंट ने वही पिच जारी रखी और रुकी या अनुकूलित नहीं हुई।", "पिच (टाटा, अडानी के उदाहरण, लॉन्ग-टर्म निवेश) सामान्य थी और ग्राहक की बताई हुई समय की कमी और अरुचि से जुड़ी नहीं थी।", "क्लोजिंग कमजोर थी — 'नंबर सेव कर लीजिए, फ्यूचर प्लान बनता है तो कॉल कर सकते हैं' — कोई ठोस अगला कदम या प्रतिबद्धता तय नहीं हुई।"], "improvements_en": ["Respect a clear refusal the first time it's stated instead of pushing further, especially after repeated 'no interest' statements.", "Tailor the pitch to the customer's actual constraints (limited time, no experience) rather than reciting a generic script.", "If the customer declines, close professionally with a specific, low-pressure next step rather than a vague 'call in future'."], "improvements_hi": ["पहली बार स्पष्ट इनकार सुनते ही उसका सम्मान करें, आगे न धकेलें, खासकर जब ग् i jagah mind nahi lagana ma'am.\n[01:25] AGENT: Kyu sir, abhi kya karte hain vaise aap by profession? Job hai ya business hai aapka?\n[01:30] CUSTOMER: Main abhi duty karta hu.\n[01:33] AGENT: Achha, job karte hain.\n[01:35] AGENT: Hello?\n[01:37] CUSTOMER: Haan, boliye na ma'am.\n[01:39] AGENT: Haan, aur kya... kahan pe... kahan se baat kar rahe hain vaise aap sir?\n[01:43] CUSTOMER: Pune.\n[01:44] AGENT: Pune se?\n[01:45] CUSTOMER: Haan.\n[01:46] AGENT: Achha, okay okay, theek hai. So isse pehle kabhi bhi Demat nahi open kiya aapne sir?\n[01:51] CUSTOMER: Nahi ma'am.\n[01:53] AGENT: Okay, to sir dekhiye aap IIFL join kar sakte hain na. Yahan se dekhiye abhi aapko aapne jaisa ki aapne bataya aapko abhi knowledge nahi hai market ka, to yahan se aapko learning seekhne ko milega, jaise aap long-term investment kar sakte hain. Stock market mein se kafi sari companies hain market mein, un company ke shares ko aap buy/sell kar sakte hain so, theek hai? Jaise kafi sari companies hain Tata ki companies hain, Tata ki companies mein aapne naam suna hoga Tata Power, Tata Steel, aur bahut sari company jaise Adani ki companies mein Adani 8, Adani Ports aapne naam suna hoga so.\n[02:22] CUSTOMER: Nahi ma'am wo sab nahi karna mere ko. Main abhi duty mein hu ma'am. Main time nahi de sakta usko.\n[02:27] AGENT: But sir agar ta- dekhiye long term mein to time nahi dena hota hai na. Agar ek time pe aapne koi sa share buy karke rakha hai bas aap usko buy karke rakh dete hain. Jab bhi aap free rahe free time mein aap un shares ko watch kar sakte hain so wo to long time ke liye rehta hai na sir? Wo to daily basis ke liye nahi hote hain sir ki aapko same day buy/sell karna hai to aap proper watch karenge.\n[02:47] CUSTOMER: Nahi ma'am mere ko koi interest nahi hai.\n[02:51] AGENT: Nahi karna aapko?\n[02:53] CUSTOMER: Nahi.\n[02:53] AGENT: Theek hai aap number save kar lijiye. In future plan banta hai to call kar sakte hain aap sir.\n[02:57] CUSTOMER: Okay, thank you."}, {"call_id": "2026 ket rationale (Nifty range, 20-DEMA at 2450) to justify the wait-and-watch advice.", "Calm and respectful tone throughout, and quickly accepted the client's refusal without pushing further."], "strengths_hi": ["एजेंट ने प्रतीक्षा करने की सलाह को सही ठहराने के लिए विस्तृत और स्पष्ट मार्केट तर्क दिया (निफ्टी रेंज, 2450 पर 20-DEMA)।", "पूरी कॉल में शांत और सम्मानजनक लहजा बनाए रखा, और ग्राहक के इनकार को बिना और दबाव डाले तुरंत स्वीकार किया।"], "issues_en": ["Right after advising the client to wait, the agent pivoted into asking for RM allotment on the profile, which felt like an abrupt sales push mid-update.", "No confirmation check was done to ensure the client actually understood the technical explanation beyond repeated 'thiike' acknowledgements.", "The call ended without the agent securing a concrete next step — the client took ownership of the follow-up instead."], "issues_hi": ["ग्राहक को प्रतीक्षा करने की सलाह देने के तुरंत बाद, एजेंट ने प्रोफाइल पर RM अलॉटमेंट माँगना शुरू कर दिया, जो अपडेट के बीच अचानक सेल्स पुश जैसा लगा।", "यह सुनिश्चित करने के लिए कोई पुष्टिकरण चेक नहीं किया गया कि ग्राहक ने बार-बार 'ठीके' कहने के अलावा तकनीकी स्पष्टीकरण को वास्तव में समझा या नहीं।", "कॉल एजेंट द्वारा कोई ठोस अगला कदम सुनिश्चित किए बिना समाप्त हुई — फॉलो-अप की जिम्मेदारी ग्राहक ने खुद ले ली।"], "improvements_en": ["Separate the market update from the RM-allotment ask, or introduce it more naturally after confirming the client is receptive.", "Proactively schedule a specific callback date/time rather than letting the client vaguely say 'I'll call you'.", "Briefly check the client's understanding of the technical levels (e.g., 'Does this make sense?') instead of relying on passive 'thiike' responses."], "improvements_hi": ["मार्केट अपडेट और RM-अलॉटमेंट के अनुरोध को अलग रखें, या ग्राहक की तैयारी की पुष्टि करने के बाद इसे अधिक स्वाभाविक ढंग से प्रस्तुत करें।", "ग्राहक को अस्पष्ट रूप से 'मैं कॉल कर लूंगा' कहने देने के बजाय, स्वयं एक निश्चित कॉलबैक तारीख/समय तय करें।", "तकनीकी स्तरों की समझ की संक्षेप में पुष्टि करें (जैसे 'क्या यह समझ में आ रहा है?') बजाय केवल 'ठीके' जैसी निष्क्रिय प्रतिक्रियाओं पर निर्भर रहने के।"], "transcript": "[00:01] AGENT: Hello, good morning Shreshth ji. Khan bol raha hoon Apple Capital se.\n[00:05] CUSTOMER: Haan ji.\n[00:06] AGENT: Haan sir, actually kal leave pe tha to baat hi nahi ho paayi aap se.\n[00:09] CUSTOMER: Hm.\n[00:10] AGENT: Aur aaj bhi abhi Nifty mein aur kal aapne dekha hoga ki consolidation bana hua hai sir, Nifty ka.\n[00:17] CUSTOMER: Thiike.\n[00:18] AGENT: Thiike? Ab yahaan kya hota hai sir, aise hi market mein thoda sa aapko wait aur intezaar karna zaroori hota hai.\n[00:24] CUSTOMER: Thiike.\n[00:25] AGENT: Kyun? Kyunki sir tagdi range bound. 24 50 kal din bhar chalta raha aur 24 50 aaj bhi. Ek thoda sa jo hai sawa teen ke baad momentum aaya tha to aise market mein to sir dekho wait and watch sabse badiya decisions hai, kyunki iski jagah agar apan equity kaam karte hain, to equity kya rahega ki movement karke humein kuch earning de bhi dega, lekin options mein aayenge to baat wo hi hogi ki intezaar aap bhi karenge, panic hoga ki yaar movement nahi ho raha hai, kahin na kahin premium decay mein down value down hoti rahegi sir. Jabki movement nahi ho raha, value down hogi to uska bhi humein kya rahega ki nuksan dekhne ko milega, jabki trend, okay, ek particular level pe movement nahi hota. To thoda intezaar kariye sir. Abhi kya ye jo daaye mein fasa hua hai na, ye tagdi hai, kyunki 24 ka to sir ye 20 din ka DEMAs hai, day moving average. Isi liye 24 ko break nahi kar paa raha aur 24 ko break karega to ek strong downfall ya down selling bol sakte hain.\n[01:18] CUSTOMER: Thiike.\n[01:19] AGENT: Thiike? To options ke liye abhi bilkul sir aapko intezaar karne ki requirement hai sir.\n[01:23] CUSTOMER: Thiike.\n[01:24] AGENT: Thiike? Aur last time maine aapko bola hua tha ki wo RM jo hai aapke profile pe allot nahi hai taaki main entry exit kar sakoon, hai na? To uske liye agar aap RM apna profile pe allot a- kara sakte hain to main aapko bata deta hoon ki jo bhi entry exit rahega apan aapko karke de sakte hain, bas aapko call pe confirmation dena hoga aapka jo ID hai uska.\n[01:43] CUSTOMER: Nahi, abhi nahi karenge. Ye abhi thoda rukenge. Maine khud hi abhi out of station jana hai. Abhi thode din ruk ke hi karunga main ye sab.\n[01:50] AGENT: Thiike thiike, to phir mujhe bataiyega hai na sir jab bhi...\n[01:52] CUSTOMER: Main aapko call kar lunga, call kar lunga aapko.\n[01:54] AGENT: Okay sir, okay, okay.\n[01:55] CUSTOMER: Right, thank you."}, {"call_id": "2026-09-01_Shrikantpatel_04", "date": "2026-09-01", "scored_at": "2026-09-02T13:12:18", "agent": "Shrikant patel", "audio_file": "/kaggle/working/call-quality-agent/to_score/outbound-532_TBE373-9884343145-20260901-133502.wav.wav", "drive_file_id": "1YZ8vn4Bd5C6upjVSslwZT9M7YFrAO124", "phone_number": "9884343145", "language": "hi", "duration_seconds": "156", "score": 3.0, "call_category": "Account Activation / Reactivation", "client_profile_en": "The client has an existing trading account with insufficient funds for equity swing trading; he mentions he previously traded in options and lost money last month, and states he currently does not prefer options.", "client_profile_hi": "ग्राहक के पास पहले से ट्रेडिंग खाता है लेकिन इक्विटी स्विंग ट्रेडिंग के लिए पर्याप्त फंड नहीं है; उन्होंने बताया कि उन्होंने पहले ऑप्शंस में ट्रेड किया था और पिछले महीने पैसे गंवाए, और अभी वे ऑप्शंस पसंद नहीं करते।", "summary_en": "BCA 156s: The agent used an unclear/mismatched company identity, pushed a generic leveraged swing-trade pitch without properly addressing the client's stated options loss, and closed with no firm next step.", "summary_hi": "BCA 156s: एजेंट ने अस्पष्ट/गलत कंपनी पहचान का उपयोग किया, ग्राहक के बताए गए ऑप्शंस नुकसान को ठीक से संबोधित किए बिना एक सामान्य लीवरेज्ड स्विंग-ट्रेड पिच दी, और बिना किसी पक्के अगले कदम के कॉल समाप्त की।", "strengths_en": ["Agent remained polite and calm throughout, using respectful language ('sir') without pressure or rudeness.", "Attempted to redirect the client from options to swing trading after hearing about the loss."], "strengths_hi": ["एजेंट पूरी कॉल के दौरान विनम्र और शांत रहा, बिना दबाव या रूखेपन के सम्मानजनक भाषा ('सर') का उपयोग किया।", "नुकसान की बात सुनने के बाद ग्राहक को ऑप्शंस से स्विंग ट्रेडिंग की ओर मोड़ने का प्रयास किया।"], "issues_en": ["Agent introduced himself as calling from 'Apple Capital Limited,' which does not match the expected TradingBells/IIFL/Kotak identity required by policy.", "When the client revealed 'I lost money in options trading,' the agent gave only a brief acknowledgment ('Definitely, sir... we totally avoid option trade') instead of exploring the concern or adjusting the pitch.", "Closing was vague — client only said 'I will check and confirm' with no scheduled follow-up or firm commitment secured."], "issues_hi": ["एजेंट ने खुद को 'एप्पल कैपिटल लिमिटेड' से कॉल करने वाला बताया, जो नीति के अनुसार अपेक्षित TradingBells/IIFL/Kotak पहचान से मेल नहीं खाता।", "जब ग्राहक ने बताया 'मुझे ऑप्शंस ट्रेडिंग में नुकसान हुआ,' एजेंट ने केवल संक्षिप्त स्वीकृति दी ('जरूर सर... हम पूरी तरह ऑप्शन ट्रेड से बचते हैं') बिना चिंता को समझे या पिच को समायोजित किए।", "क्लोजिंग अस्पष्ट थी — ग्राहक ने केवल 'मैं चेक करके बताता हूं' कहा, बिना किसी निर्धारित फॉलो-अप या पक्की प्रतिबद्धता के।"], "improvements_en": ["Clearly and correctly state the company identity per policy before pitching any product.", "When a client mentions a prior loss, pause to understand the reason (strategy, timing, risk) before pivoting to a new product.", "Secure a specific next step — e.g., a callback date/time — rather than leaving it as an open 'I will confirm.'"], "improvements_hi": ["किसी भी प्रोडक्ट की पिच देने से पहले नीति के अनुसार स्पष्ट और सही कंपनी पहचान बताएं।", "जब ग्राहक पिछले नुकसान का जिक्र करे, तो नए प्रोडक्ट की ओर मुड़ने से पहले कारण (रणनीति, समय, जोखिम) समझने के लिए रुकें।", "एक खुले 'मैं बताऊंगा' के बजाय एक निश्चित अगला कदम तय करें — जैसे कॉलबैक की तारीख/समय।"], "transcript": "[00:00] CUSTOMER: Hello?\n[00:02] AGENT: Sir, good afternoon. Srikant bol raha hoon Apple Capital Limited se.\n[00:05] CUSTOMER: Namaskar.\n[00:06] AGENT: Uh namaskar. Actually, sir, today Nifty is uh okay downside movement and 24,000 okay maybe break. And it's a very g- strong support. So, Nifty give a okay around 100 point momentum. Can you add some fund, sir?\n[00:22] CUSTOMER: Right now option is not preferred, sir, okay? Fine.\n[00:25] AGENT: Okay. Sir, yeah, do not worry for that, okay? We can do the trade in equity for swing trading, sir.\n[00:33] CUSTOMER: Okay.\n[00:34] AGENT: Okay? That's why, okay, last, okay, before 1 week, okay, company will provide you Bharat Electronics Limited on the rate of 389, okay? Current rate is 412, sir.\n[00:47] CUSTOMER: Okay.\n[00:48] AGENT: But right now I'm checking your profile ki you have a not uh okay, sufficient fund for equity okay, swing trade. Can you add sir? Today we can provide you 5-time limit on that uh swing trade.\n[01:02] CUSTOMER: Okay.\n[01:03] AGENT: Okay? And we will provide you some okay, quality levels stock, okay? Uh they will provide you okay, momentum okay, minimum 1 week, okay? That is called swing trade, sir.\n[01:16] AGENT: Okay, we we can't do the trade in uh 1 month and 2 month, 6 month. We okay, focus only swing trade, sir.\n[01:25] AGENT: So, add you add you fund and okay, we will use BNPL, Buy Now Pay Later, okay, facility, and broker will be provide you on your investment 5-time limit, sir.\n[01:38] AGENT: Suppose that you have a 5- 50,000 fund, okay, suppose that you have a 50,000 fund, so included 5-time limit, that means okay, you can do the trade in swing trade for on the investment of 2,50,000, sir.\n[01:53] CUSTOMER: Okay.\n[01:55] AGENT: Okay, so that's a very good opportunity, sir. Because we okay, can do okay, nothing do the trade in uh 1 month, 2 month, 6 month, we will only focus on weekly.\n[02:06] CUSTOMER: I lost money in options trading, okay?\n[02:09] AGENT: Sorry, sir?\n[02:10] CUSTOMER: I lost for last month.\n[02:13] AGENT: Definitely, sir. Uh sir, I know ki you are uh okay, do the option trade, but option trade is uh okay, give the earning and loss also. But we avoid, totally avoid option trade. We will pro- okay, totally focus on swing trade, sir. That's it.\n[02:28] CUSTOMER: Okay, sir. I will check and confirm.\n[02:30] AGENT: Yeah, definitely. Okay, you will add and confirm me, we will provide you swing trade level, sir.\n[02:35] CUSTOMER: Okay.\n[02:36] AGENT: Okay. Okay, sir. Okay."}, {"call_id": "2026-09-01_Shrikantpatel_05", "date": "2026-09-01", "scored_at": "2026-09-02T13:13:12", "agent": "Shrikant patel", "audio_file": "/kaggle/working/call-quality-agent/to_score/outbound-532_TBE373-9904141419-20260901-151258.wav.wav", "drive_file_id": "1aK3HUGI560Imlawz0WLQfaUZiwX_SHY7", "phone_number": "9904141419", "language": "hi", "duration_seconds": "166", "score": 4.0, "call_category": "Other / Service", "client_profile_en": "The client has an existing trading account and previously applied for the Synbiotics IPO, which was not allotted. The client is now following up on a separate IPO application (referred to as 'Dominos'), where the mandate status still shows 'pending' in the app despite receiving a fund-unblock SMS in the morning, causing confusion about whether the application was actually processed or allotted.", "client_profile_hi": "ग्राहक का पहले से ट्रेडिंग खाता है और उन्होंने पहले Synbiotics IPO के लिए अप्लाई किया था, जो अलॉट नहीं हुआ। अब वे एक अलग IPO ('Dominos') के आवेदन को लेकर फॉलो-अप कर रहे हैं, जिसमें ऐप में मैंडेट स्टेटस अभी भी 'पेंडिंग' दिखा रहा है, जबकि सुबह उन्हें फंड-अनब्लॉक का SMS मिल गया था, जिससे यह असमंजस है कि आवेदन वास्तव में प्रोसेस हुआ या अलॉट हुआ या नहीं।", "summary_en": "BCA 166s: The agent failed to clearly resolve the client's genuine confusion about a pending mandate versus an unblock message, offering a vague 'call me back if it happens again' instead of a concrete fix.", "summary_hi": "BCA 166s: एजेंट ग्राहक की पेंडिंग मैंडेट और अनब्लॉक मैसेज को लेकर वास्तविक उलझन को स्पष्ट रूप से हल नहीं कर पाया और ठोस समाधान के बजाय एक अस्पष्ट 'दोबारा हो तो कॉल कर लेना' वाला जवाब दिया।", "strengths_en": ["Agent remained calm and did not get defensive despite the customer repeating the issue multiple times.", "Attempted to give a general explanation of how mandate blocking/unblocking works."], "strengths_hi": ["ग्राहक द्वारा बार-बार मुद्दा दोहराने के बावजूद एजेंट शांत रहा और डिफेंसिव नहीं हुआ।", "मैंडेट ब्लॉकिंग/अनब्लॉकिंग कैसे काम करता है, इसकी सामान्य जानकारी देने की कोशिश की।"], "issues_en": ["Agent never directly addressed the customer's specific concern of receiving an unblock SMS at 9:30am when allotment status is normally only known after 5pm.", "Suggesting the customer 'refresh the app' and implying it's a device/login issue ('kisi ko dikkat nahi aa rahi sir') deflects rather than investigates the actual mandate discrepancy.", "No concrete next step or resolution was given; the call ended with a vague 'call me if it happens again' rather than escalating or checking the backend status."], "issues_hi": ["एजेंट ने ग्राहक की इस खास चिंता को कभी सीधे संबोधित नहीं किया कि सुबह 9:30 बजे अनब्लॉक SMS कैसे आया जबकि अलॉटमेंट स्टेटस सामान्यतः शाम 5 बजे के बाद ही पता चलता है।", "ग्राहक को 'ऐप रिफ्रेश करो' कहना और यह संकेत देना कि यह डिवाइस/लॉगिन की समस्या है ('किसी को दिक्कत नहीं आ रही सर') असल मैंडेट विसंगति की जांच करने के बजाय टालमटोल है।", "कोई ठोस अगला कदम या समाधान नहीं दिया गया; कॉल एक अस्पष्ट 'फिर से हो तो कॉल कर लेना' के साथ समाप्त हुई, बैकएंड स्टेटस चेक करने या एस्केलेट करने के बजाय।"], "improvements_en": ["Directly acknowledge and investigate the specific mismatch the customer raised (unblock message at 9:30am vs. allotment normally known after 5pm) rather than giving a generic explanation.", "Offer to check the backend/RTA status on the call or commit to a specific callback with an answer, instead of asking the customer to call e client about the illness/delay before pushing to move forward immediately."], "issues_hi": ["कॉल केवल एक प्रश्न ('तो मैं अभी कॉल करा दूं?') के साथ अचानक समाप्त हो जाती है, बिना किसी स्पष्ट पुष्टि किए हुए अगले कदम के।", "शॉर्टलिस्ट किए गए फंड्स के बारे में कोई विशेष जानकारी नहीं दी जाती, जिससे कॉल ट्रांसफर करने से पहले क्लाइंट का विश्वास मजबूत करने का मौका छूट जाता है।", "एजेंट आगे बढ़ने पर जोर देने से पहले क्लाइंट की बीमारी/देरी को लेकर सहानुभूति या आश्वासन देने का प्रयास नहीं करता।"], "improvements_en": ["Confirm explicitly that the client is ready and available now before transferring, rather than ending on an open question.", "Briefly mention the shortlisted funds or their key benefit to build anticipation before handing over to Amit.", "Set a clear fallback next step (e.g., specific callback time) in case the client is still not ready to proceed immediately."], "improvements_hi": ["कॉल ट्रांसफर करने से पहले स्पष्ट रूप से पुष्टि करें कि क्लाइंट अभी तैयार और उपलब्ध है, न कि एक खुले प्रश्न पर कॉल समाप्त करें।", "अमित को कॉल सौंपने से पहले शॉर्टलिस्ट किए गए फंड्स या उनके मुख्य लाभ का संक्षेप में उल्लेख करें ताकि क्लाइंट की उत्सुकता बढ़े।", "यदि क्लाइंट अभी आगे बढ़ने के लिए तैयार नहीं है, तो एक स्पष्ट फॉलबैक नेक्स्ट स्टेप (जैसे विशिष्ट कॉलबैक समय) तय करें।"], "transcript": "[00:00] CUSTOMER: Hello?\n[00:01] AGENT: Hello, ji sir, very good morning. Rajesh baat kar raha hoon IIFL se.\n[00:05] CUSTOMER: Haan, bolna.\n[00:07] AGENT: Ji ji, kaise hain Sagar sir aap?\n[00:09] CUSTOMER: Haan, theek hai.\n[00:10] AGENT: Ji ji. Kal liya tha wo mutual fund SIP start karna tha aapko, aapne bola tha Monday ko karte hain.\n[00:16] CUSTOMER: Mm-hmm.\n[00:17] AGENT: Ji, to sir aapko Amit ji ne call bhi kiya hoga, aap shayad busy the to pick nahi kiya tha aapne?\n[00:22] CUSTOMER: Uh, nahi nahi. Kya ho gaya, thoda kaam chalu tha, beemar tha, usme...\n[00:26] AGENT: Ji ji, to aaj kar lijiye sir. Main aapki Amit ji se baat kara deta hoon, to wo unhone fund search karke rakhe hain, t eeze bhi hai na account sir, aapka? Wo to baad me agar aap chahein to change kar sakte hain, SBI agar nahi rakhna hai, jaise hi unfreeze ho jayega account, sahi kara lijiye aap ek do din me.\n[02:00] CUSTOMER: Theek hai, sir.\n[02:01] AGENT: Haan, jaise hi apne stock transfer ho jayenge...\n[02:03] CUSTOMER: Hmm.\n[02:04] AGENT: ...phir aap uske baad kar sakte hain. Ye dekhiye jo...\n[02:05] CUSTOMER: Kuch date wagerah daalna rehta hai na, date?\n[02:08] AGENT: Haan, date main aapko bata deta hoon kaun-kaun se page me karna hai. Aaj hi kar lenge na courier aap?\n[02:14] CUSTOMER: Haan, aaj hi karenge sir.\n[02:15] AGENT: Haan, dekhiye jo maine aapko abhi tick karke bheja hai, ye address hai usme.\n[02:20] CUSTOMER: Theek hai, theek hai sir.\n[02:21] AGENT: Haan, to is wale address pe karna hai aur date ka main ek baar confirm karke bata deta hoon kaun-kaun se page me aapko date likhna hai.\n[02:27] AGENT: Ji, to thoda sa wait kariye, main call karta hoon aapko, theek hai?\n[02:30] CUSTOMER: Theek hai, sir.\n[02:32] AGENT: Okay, sir."}, {"call_id": "2026-09-01_NehaGoyal_02", "date": "2026-09-01", "scored_at": "2026-09-02T13:23:46", "agent": "Neha Goyal", "audio_file": "/kaggle/working/call-quality-agent/to_score/outbound-TBE428-8128390607-20260901-100121.wav.wav", "drive_file_id": "1jPZnKdvseNodCJhukI1LoPgq61pUSw5n", "phone_number": "8128390607", "language": "hi", "duration_seconds": "134", "score": 8.0, "call_category": "Account Activation / Reactivation", "client_profile_en": "Male client who recently opened a Demat account with IIFL, intends to use it for IPO applications and stock trading, expressed interest in unlisted shares, and works a job (currently busy at work, available for calls after 1-2 PM lunch break).", "client_profile_hi": "पुरुष ग्राहक ने हाल ही में IIFL में डीमैट अकाउंट खोला है, IPO और स्टॉक ट्रेडिंग के लिए इसका उपयोग करना चाहता है, अनलिस्टेड शेयरों में रुचि जताई, और नौकरी करता है (फिलहाल काम में व्यस्त है, दोपहर 1-2 बजे लंच ब्रेक के बाद कॉल के लि he client's stated interest in IPOs rather than listing several services at once.", "During the follow-up call at 2 PM, lead with a targeted recommendation based on today's stated interests."], "improvements_hi": ["कई प्रोडक्ट्स की पिच करने से पहले बेसिक प्रोफाइलिंग (occupation, investment राशि, अनुभव) पूरी करें।", "पिच को ग्राहक की IPO में बताई गई रुचि से अधिक विशेष रूप से जोड़ें, बजाय एक साथ कई सेवाओं की सूची देने के।", "दोपहर 2 बजे के फॉलो-अप कॉल में, आज बताई गई रुचियों के आधार पर एक टार्गेटेड सिफारिश से शुरुआत करें।"], "transcript": "[00:01] CUSTOMER: Hello?\n[00:02] AGENT: Hello?\n[00:03] CUSTOMER: Haan, kaun?\n[00:04] AGENT: Yes, very good morning sir, Neha baat kar rahi thi IIFL Capital se. Aap Jaydev Kumar ji baat kar rahe hain?\n[00:11] CUSTOMER: Haan, boliye.\n[00:13] AGENT: Ji sir, aapne IIFL mein recently abhi Demat account open karaya hai na? So usi ke regarding maine call kiya hai. Main aapki RM baat kar rahi hoon, Relationship Manager.\n[00:22] CUSTOMER: Haan, boliye.\n[00:23] AGENT: So main ... ki sir abhi matlab ye jo account aapne open karaya kis purpose se open karaya hai?\n[00:30] CUSTOMER: Basically, jo IPO bharne ke liye, phir vo kya bolte hain, stock trading, vo sab.\n[00:35] AGENT: Okay, investment purpose se majorly aapne ye account open kiya hai. Okay, okay. Toh sir dekhiye batana chahungi ki yahan par aapko aah jo RM support hai bilkul free provide hota hai, plus aapke account pe aapko call and trade ki facility bilkul free hai.\n[00:51] AGENT: Matlab ki agar aap apne kaam mein hain, job mein ya business mein, so aap agar khud se market watch nahi kar pa rahe, toh yahan pe RM ka aapko pura support rehta hai. RM aapki position take care karta hai, plus aapko timely update bhi karta hai.\n[01:04] AGENT: Yahan par aapko proper support and guidance provide hoga sir humari taraf se. Even yahan par aapko hum recommendations bhi provide karte hain aapke fund aur aapke risk ke according.\n[01:14] AGENT: Proper SL and targets ke sath. Jaise ki aapne bataya ki aap stocks mein investment karenge ya phir IPO mein investment aap karte hain. Toh sir IPO ke sath-sath aap pre-IPO shares ya unlisted mein bhi interest rakhte hain? Unlisted shares?\n[01:28] CUSTOMER: Yes, ma'am.\n[01:30] AGENT: Okay, so IIFL aapko unlisted shares bhi provide karta hai. So aah jaanna chahungi ki aap working kya karte hain majorly? Job karte hain ya business karte hain?\n[01:38] CUSTOMER: Ma'am main aapko thodi der baad mein call karun? Main abhi thoda kaam mein hoon, waise job hi karta hoon.\n[01:44] AGENT: Haan, aap kab tak free ho jayenge?\n[01:46] AGENT: Free kab ho jayenge aap?\n[01:47] CUSTOMER: Free main ma'am aah 1-2 baje, haan na? Lunch break.\n[01:50] AGENT: 2 baje tak, thik hai. Toh main 2 baje tak aapko call kar leti hoon. Aap mera number zaroor save karke rakhiye Jaydev sir, Neha ke naam se.\n[01:57] AGENT: And aapka ye same number WhatsApp pe available hai?\n[02:01] CUSTOMER: Yes, ma'am.\n[02:02] AGENT: So main aapko WhatsApp support se bhi message drop kar deti hoon, jisme mera ye number mention rahega Neha ke naam se message kar rahi hoon. So aap ye dono number save kar lijiyega Neha IIFL ke naam se.\n[02:11] CUSTOMER: Okay.\n[02:12] AGENT: Okay sir, thank you.\n[02:14] CUSTOMER: Okay, thank you."}, {"call_id": "2026-09-01_NehaGoyal_03", "date": "2026-09-01", "scored_at": "2026-09-02T13:24:44", "agent": "Neha Goyal", "audio_file": "/kaggle/working/call-quality-agent/to_score/outbound-TBE428-9108682300-20260901-112034.wav.wav", "drive_file_id": "1qREYRzWKFtVG1qniaTM2LlaV9NPCF656", "phone_number": "9108682300", "language": "hi", "duration_seconds": "226", "score": 6.0, "call_category": "Account Activation / Reactivation", "client_profile_en": "Male client (Himesh) who recently opened a demat account with IIFL Capital, states the purpose is long-term investment (not active trading); works in an IT company with 10am-7pm job timings, free on Saturday/Sunday; already invests in IPOs and mutual funds.", "client_profile_hi": "पुर  "improvements_en": ["Break the unlisted-shares explanation into shorter chunks and check the customer's interest/understanding at each step.", "Avoid words like 'huge return' — use balanced language (e.g., 'potential for good returns, subject to market risk').", "End with a specific commitment, e.g., 'I will call you this Saturday to walk you through the unlisted share options.'"], "improvements_hi": ["अनलिस्टेड शेयरों की जानकारी को छोटे हिस्सों में बांटें और हर स्टेप पर ग्राहक की रुचि/समझ की पुष्टि करें।", "'huge return' जैसे शब्दों से बचें — संतुलित भाषा का उपयोग करें (जैसे 'अच्छे रिटर्न की संभावना, मार्केट रिस्क के अधीन')।", "कॉल को एक ठोस कमिटमेंट के साथ खत्म करें, जैसे 'मैं इस शनिवार आपको कॉल करके अनलिस्टेड शेयर ऑप्शंस समझाऊंगी।'"], "transcript": "[00:00] AGENT: Hello\n[00:01] CUSTOMER: Hello\n[00:03] AGENT: Yes, very good morning sir, Neha baat kar rahi thi IIFL Capital se.\n[00:07] CUSTOMER: Okay.\n[00:07] AGENT: Himesh sir se baat kar rahe hain?\n[00:09] CUSTOMER: Yeah, yes.\n[00:10] AGENT: Okay, Himesh sir, actually main aapki RM baat kar rahi hoon, relationship manager. Jaisa ki main dekh pa rahi hoon aapne abhi recently IIFL mein demat account open kiya hai sir.\n[00:19] CUSTOMER: Yeah, yeah, correct.\n[00:20] AGENT: So main jaanna chah rahi thi ki kis purpose se open karwaya hai right? Trading ke liye ya fir investment ke liye?\n[00:26] CUSTOMER: Investment, ah for investment long term investment I opened it.\n[00:30] AGENT: Okay okay, so you are also doing investment in IPO and mutual funds?\n[00:35] CUSTOMER: Yeah yeah, I do it.\n[00:37] AGENT: Okay okay. So sir dekhiye main yahan par aapko proper market se related support and guidance provide karungi, because aapko IIFL ke account pe RM support bilkul free hai.\n[00:47] AGENT: And aapko call and trade facility bhi free hai. Call and trade facility means ki agar in case aap busy hain apne work mein, so aap agar market mein khud se buying selling nahi kar pa rahe hain, because application aapke liye new hai, toh yahan par main aapka portfolio bhi take care karungi plus aapke positions se related aapko timely update bhi kar dungi, even main yahan se buying selling bhi aapke order place karungi, agar aap busy hain, thik hai? So aapko call and trade facility bilkul free hai. Waise sir main jaan sakti hoon aap kya karte hain Himesh sir working?\n[01:19] CUSTOMER: Uh I work in an IT company.\n[01:21] AGENT: IT company mein aapka job hai. Okay, so kya job timings hota hai generally?\n[01:26] CUSTOMER: Like ah 10:00 to 7:00.\n[01:29] AGENT: 10:00 to 7:00. Okay okay, that's why aap long term karna chah rahe hain. Because aapka job timings thoda sa aisa hai ki market timing rehta hai. Okay, so investment dekhiye long term stocks mein toh aap karenge hi, iske alawa jaise ki maine baat ki IPO investment sir, so aapko batana chahungi ki IIFL mein aapko unlisted shares bhi available hain jine hum pre-IPO shares bolte hain. Usme bhi aap investment kar sakte hain, means jo upcoming IPOs hote hain na sir, ab IPO mein kya hota hai hum apply karte hain, par allotment milna ya nahi milna confirm nahi hota hai, because it's a computer generated system, right? Toh wahan par allotment nahi milna hota hai, generally aap 10 IPO apply karte hain toh only one aapko allot hota hai. Lekin unlisted mein aisa nahi hai, unlisted mein aap jo IPOs upcoming hain un shares ko already buy karke apne DP mein le sakte hain. Toh yeh thoda sa aisa rehta hai ki aapka confirmation rehta hai ki aapke paas woh stock hai, already. Toh woh investment bhi aap dekh sakte hain, accha investment hota hai long term ke liye hi hota hai. Because jo unlisted shares hote hain na sir, woh aapko kafi kam price mein milte hain. Jine aap 2-3 years ke liye minimum carry kar sakte hain aur ek accha return aap le sakte hain, huge return, hai na, plan kar sakte hain. So agar aap jab bhi free rahenge, jaise generally free kis din hote hain aap?\n[02:49] CUSTOMER: Free Saturday Sunday.\n[02:51] AGENT: Saturday Sunday, toh Saturday aap free rehte hain na? Thik hai, usse pehle bhi sir agar aapko lagta hai ki lunch break hai ya kuch hai, toh aap agar detail mein iske baare mein jaanna chahein toh aap mujhe call bhi kar sakte hain is number pe. So sabse pehle toh aap mera number save kijiye Neha IIFL ke naam se.\n[03:07] CUSTOMER: Okay okay.\n[03:08] AGENT: Thik hai? And aapka yeh same number Himesh sir WhatsApp pe available hai?\n[03:12] CUSTOMER: Yeah, it's 91086...\n[03:13] AGENT: 9108682300, okay, so main aapko Neha ke naam se message drop karti hoon, yahan par mere saath-saath aapki ek RM aur hain Shweta ji, thik hai? So main unka number bhi aapko forward kar deti hoon WhatsApp pe hi, taaki aap save kar sakein, thik hai? Toh do RM aapko rahenge yahan par support mein, ek Shweta ji aur ek main, thik hai?\n[03:36] CUSTOMER: Okay.\n[03:37] AGENT: Toh aap dono mera number aur WhatsApp support ka number dono hi save kijiyega Neha IIFL ke naam se.\n[03:42] CUSTOMER: Okay.\n[03:43] AGENT: Thik hai Himesh sir?\n[03:44] CUSTOMER: Okay.\n[03:45] AGENT: Okay, thank you.\n[03:46] CUSTOMER: Yeah, thank you."}, {"call_id": "2026-09-01_NehaGoyal_04", "date": "2026-09-01", "scored_at": "2026-09-02T13:25:23", "agent": "Neha Goyal", "audio_file": "/kaggle/working/call-quality-agent/to_score/outbound-TBE428-9493128054-20260901-113312.wav.wav", "drive_file_id": "1c85nIHi1e71TKY8ZIlN9loI87XJqgnlS", "phone_number": "9493128054", "language": "hi", "duration_seconds": "61", "score": 5.0, "call_category": "Account Activation / Reactivation", "client_profile_en": "Client is addressed as Chitralekha; she has an existing Demat account with IIFL but appears unaware of why or by whom it was opened, mentioning it may have been arranged through a 'Dr. N.C. Padmanabhan.' No trading experience, objective, or other demographic details were gathered before the call cuts off.", "client_profile_hi": "ग्राहक को चित्रलेखा नाम से संबोधित किया गया है; उनका IIFL में एक मौजूदा डीमैट अकाउंट है लेकिन उन्हें यह स्पष्ट नहीं है कि यह किसने और क्यों खोला। उन्होंने बताया कि यह 'डॉ. एन.सी. पद्मनाभन' के माध्यम से हुआ हो सकता है। कॉल कटने से पहले ट्रेडिंग अनुभव, उद्देश्य या अन्य जानकारी एकत्र नहीं की गई।", "summary_en": "BCA 61s: The agent opened the call correctly and stayed polite amid customer confusion, but the call ends abruptly without clarifying the account purpose or securing any next step.", "summary_hi": "BCA 61s: एजेंट ने कॉल की शुरुआत सही तरीके से की और ग्राहक की उलझन के बावजूद विनम्र रही, लेकिन कॉल अचानक समाप्त हो जाती है और अकाउंट का उद्देश्य स्पष्ट या कोई अगला कदम तय नहीं हो पाता।", "strengths_en": ["Clear, professional introduction identifying herself and IIFL Capital correctly.", "Remained calm and patient despite the customer's evident confusion about the account."], "strengths_hi": ["एजेंट ने स्पष्ट और पेशेवर तरीके से अपना और IIFL Capital का परिचय दिया।", "ग्राहक की स्पष्ट उलझन के बावजूद एजेंट शांत और धैर्यवान बनी रही।"], "issues_en": ["Customer clearly does not recall opening the account or its purpose, but the agent doesn't pause to reassure or explain basics before pushing forward.", "The agent guesses ('Maybe aapke bacchon ne khulwaya ho') rather than probing with clear questions, risking further confusion.", "Call ends with no resolution or next step agreed upon."], "issues_hi": ["ग्राहक को स्पष्ट रूप से याद नहीं है कि अकाउंट क्यों या किसने खोला, फिर भी एजेंट आगे बढ़ने से पहले उन्हें भरोसा दिलाने या बुनियादी बातें समझाने के लिए नहीं रुकती।", "एजेंट स्पष्ट सवाल पूछने के बजाय अनुमान लगाती है ('शायद आपके बच्चों ने खुलवाया हो'), जिससे उलझन और बढ़ सकती है।", "कॉल किसी समाधान या अगले कदम के बिना ही समाप्त हो जाती है।"], "improvements_en": ["Slow down and reassure a confused customer before continuing the pitch—confirm what they do remember first.", "Ask specific, simple questions (e.g., 'Did you visit any bank/advisor recently?') instead of guessing who opened the account.", "Always close with a concrete next step, such as a callback time, even in a confusing call."], "improvements_hi": ["उलझे हुए ग्राहक को आगे बढ़ने से पहले धीरे और भरोसे के साथ समझाएं—पहले यह पुष्टि करें कि उन्हें क्या याद है।", "यह अनुमान लगाने के बजाय कि अकाउंट किसने खोला, स्पष्ट और सरल सवाल पूछें (जैसे 'क्या आप हाल ही में किसी बैंक/एडवाइजर के पास गए थे?')।", "उलझन भरी कॉल में भी हमेशा एक ठोस अगला कदम (जैसे कॉलबैक का समय) तय करके कॉल समाप्त करें।"], "transcript": "[00:01] AGENT: Hello?\n[00:03] CUSTOMER: Hello.\n[00:04] AGENT: Yes, am I speaking with Chitralekha ma'am?\n[00:11] AGENT: Hello, are you comfortable in English?\n[00:14] CUSTOMER: Yes, boliye.\n[00:16] AGENT: Yes, very good morning ma'am. Neha baat kar rahi thi IIFL Capital se. Aap Chitralekha ji baat kar rahe hain?\n[00:24] CUSTOMER: Haan.\n[00:25] AGENT: Okay. Ma'am actually aapne Demat account open karwaya hai IIFL mein. Toh main IIFL se hi baat kar rahi hoon, main aapki RM baat kar rahi hoon. Toh main jaanna chaa rahi thi account aapne kis purpose se karwaya hai? Trading ke liye ya phir investment ke purpose se?\n[00:41] CUSTOMER: Acha. Humne N. C. Padmanabhan Dr. ke paas bheja tha.\n[00:49] AGENT: Nahi nahi, ma'am main ye bol rahi hoon, aapne ek Demat account khulwaya hai. Matlab share market mein investment wala account.\n[00:55] CUSTOMER: Haan, humko malum nahi.\n[00:57] AGENT: Maybe aapke bacchon mein kisi ne khulwaya ho, aapke husband ne khulwaya ho.\n[01:01] CUSTOMER: Acha, humko humara..."}, {"call_id": "2026-09-01_NehaGoyal_05", "date": "2026-09-01", "scored_at": "2026-09-02T13:26:13", "agent": "Neha Goyal", "audio_file": "/kaggle/working/call-quality-agent/to_score/outbound-TBE428-9714116282-20260901-100839.wav.wav", "drive_file_id": "1t3tFBDeYxntocKI6gvKYpIWcibvISiek", "phone_number": "9714116282", "language": "hi", "duration_seconds": "135", "score": 7.0, "call_category": "Account Activation / Reactivation", "client_profile_en": "Client has a demat account with IIFL that resulted from a merger with Karvy; he holds some shares in the old Karvy account and wants them transferred/redeemed into the IIFL account. He states he has no plan to trade or invest further, only wants the share transfer completed.", "client_profile_hi": "क्लाइंट का IIFL में डीमैट अकाउंट है जो Karvy के मर्जर से बना है; उनके पास पुराने Karvy अकाउंट में कुछ शेयर्स हैं जिन्हें वे IIFL अकाउंट में ट्रांसफर/रिडीम करना चाहते हैं। उन्होंने बताया कि आगे ट्रेडिंग या इन्वेस्टमेंट का कोई प्लान नहीं है, सिर्फ शेयर ट्रांसफर करवाना है।", "summary_en": "BCA 135s: The agent handled the share-transfer query professionally and clearly but pushed the customer to buy stock for 'DP activation' without fully justifying the necessity, and closed without a firm next step.", "summary_hi": "BCA 135s: एजेंट ने शेयर ट्रांसफर की समस्या को पेशेवर और स्पष्ट तरीके से संभाला, लेकिन 'DP activation' के लिए स्टॉक खरीदने पर जोर दिया बिना इसकी पूरी जरूरत समझाए, और कॉल को किसी पुख्ता नेक्स्ट स्टेप के बिना बंद किया।", "strengths_en": ["Clear, calm and professional tone throughout the call.", "Correctly identified the customer's actual need (Karvy share transfer) and responded to it directly.", "Explained the DP-linking process and timelines in reasonable detail."], "strengths_hi": ["पूरी कॉल में स्पष्ट, शांत और पेशेवर टोन बनाए रखी।", "ग्राहक की वास्तविक ज़रूरत (Karvy शेयर ट्रांसफर) को सही तरीके से पहचाना और उसका सीधा जवाब दिया।", "DP-लिंकिंग प्रक्रिया और समय-सीमा को उचित विस्तार से समझाया।"], "issues_en": ["Agent insists customer must buy ₹15,000 of stock to 'activate' the DP without clearly explaining why this is genuinely required, which risks sounding like a forced sale.", "Profiling was shallow — no questions on trading experience, income, or investment interest beyond the immediate transfer request.", "Closing was vague: 'aap fund add karke mujhe contact karega' has no confirmed date/amount or follow-up commitment."], "issues_hi": ["एजेंट ने कहा कि DP 'एक्टिवेट' करने के लिए ₹15,000 का स्टॉक खरीदना जरूरी है, बिना यह स्पष्ट किए कि यह वास्तव में क्यों आवश्यक है, जो जबरन बिक्री जैसा लग सकता है।", "प्रोफाइलिंग सतही रही — ट्रेडिंग ें ट्रेडिंग एप्लिकेशन में लॉगिन नहीं कर पा रहा है; इस कॉल में अन्य कोई डेमोग्राफिक या प्रोफाइलिंग जानकारी (पेशा, अनुभव, ब्रोकर) एकत्र नहीं की गई।", "summary_en": "The agent remained patient through a login troubleshooting call but gave confusing, contradictory instructions and never identified the company, leaving the issue unresolved with only a vague follow-up.", "summary_hi": "एजेंट लॉगिन समस्या सुलझाने के दौरान धैर्यवान रही, लेकिन उसने भ्रमित करने वाले, विरोधाभासी निर्देश दिए और कंपनी की पहचान कभी नहीं बताई, जिससे समस्या अनसुलझी रही और केवल एक अस्पष्ट फॉलो-अप मिला।", "strengths_en": ["Agent maintained a calm, non-pushy tone throughout the troubleshooting.", "Agent proactively offered to re-check the issue internally and follow up ('main yahan se phir ek baar confirm karti hoon')."], "strengths_hi": ["एजेंट ने पूरी समस्या-निवारण प्रक्रिया के दौरान शांत, गैर-दबावपूर्ण लहजा बनाए रखा।", "एजेंट ने सक्रियता से आंतरिक रूप से समस्या को फिर से जाँचने और फॉलो-अप देने की पेशकश की ('मैं यहाँ से फिर एक बार कन्फर्म करती हूँ')।"], "issues_en": ["Agent never stated the company name (TradingBells/IIFL/Kotak), only introduced herself by first name.", "Instructions were contradictory and confusing — e.g. 'client ID' vs 'email' vs 'number' were mixed up ('Email mat add kijiye... client ID likhiye' then later 'ab number add karo'), leaving the customer lost.", "Repeatedly asked for a screenshot the customer clearly said he couldn't take ('Screenshot toh hoga nahi'), without offering an alternative solution."], "issues_hi": ["एजेंट ने कभी कंपनी का नाम (ट्रेडिंगबेल्स/आईआईएफएल/कोटक) नहीं बताया, केवल अपना पहला नाम बताया।", "निर्देश विरोधाभासी और भ्रमित करने वाले थे — जैसे 'क्लाइंट आईडी' बनाम 'ईमेल' बनाम 'नंबर' में गड़बड़ी हुई ('ईमेल मत ऐड कीजिए... क्लाइंट आईडी लिखिए' फिर बाद में 'अब नंबर ऐड करो'), जिससे ग्राहक भ्रमित हो गया।", "ग्राहक द्वारा स्पष्ट रूप से कहने के बावजूद कि स्क्रीनशॉट नहीं ले पा रहा ('स्क्रीनशॉट तो होगा नहीं'), एजेंट ने बार-बार स्क्रीनशॉट माँगा, बिना कोई वैकल्पिक समाधान दिए।"], "improvements_en": ["Always open with clear company identification before diving into any troubleshooting.", "Give one clear, sequential instruction at a time instead of overlapping/contradictory steps.", "When the customer says a requested action (screenshot) isn't possible, immediately pivot to an alternative method rather than repeating the same request."], "improvements_hi": ["किसी भी समस्या-निवारण में जाने से पहले हमेशा स्पष्ट रूप से कंपनी की पहचान बताकर शुरुआत करें।", "एक समय में एक स्पष्ट, क्रमबद्ध निर्देश दें, न कि आपस में टकराने वाले कदम।", "जब ग्राहक कहे कि अनुरोधित कार्य (स्क्रीनशॉट) संभव नहीं है, तो तुरंत वैकल्पिक तरीके पर जाएँ, न कि वही अनुरोध दोहराएँ।"], "transcript": "[00:05] CUSTOMER: Hello?\n[00:06] AGENT: Hello?\n[00:09] AGENT: Hello, haan ma'am? Good afternoon sir, main Aafreen baat kar rahi hoon. Free hain abhi aap?\n[00:17] CUSTOMER: Haan, boliye, aawaz aa rahi hai.\n[00:20] AGENT: Okay, aapka number mere paas registered aaya tha, aur maine aapka demat account activate kiya tha. Phir apan ne sir aaj hi activate karke application apan login kar rahe the, yaad hoga aapko, toh kuch issues create ho rahe the.\n[00:36] AGENT: Abhi check kijiye sir, abhi bhi wahi issue aa raha hai kya application login mein?\n[00:41] CUSTOMER: Dekh raha hoon, abhi dekhta hoon.\n[00:59] CUSTOMER: Download ho gaya application, lekin ismein yeh email aur password maang raha hai.\n[01:03] AGENT: Download ho gaya application?\n[01:05] CUSTOMER: Haan, application download ho gaya, lekin email aur matlab email password hi maang raha hai matlab.\n[01:10] AGENT: Email mat add kijiye, wahan par apna client ID add kijiye. Client ID likhiye aapka 10991.\n[01:17] CUSTOMER: Kya?\n[01:18] AGENT: 10... 10... 10... 1099... WhatsApp kiya hai maine sir, paanch anko ka aapka password... 10991.\n[01:36] CUSTOMER: Email toh daalni nahi na?\n[01:38] AGENT: Haan.\n[01:39] CUSTOMER: Email daal ke, password aap jo bata rahe ho, woh daal doon?\n[01:42] AGENT: Email mat add karo, email nahi hai sir, mujhe screenshot do aap.\n[01:49] CUSTOMER: Screenshot toh iska... de raha hoon. Screenshot toh hoga nahi, mana kar raha hai.\n[01:57] AGENT: Back karo phir application.\n[02:04] AGENT: Kiya back apna application?\n[02:06] CUSTOMER: Haan, back kar diya.\n[02:07] AGENT: Ab kya option aa raha hai?\n[02:09] CUSTOMER: Back mein toh yeh matlab woh hota hai, off ho jata hai.\n[02:14] AGENT: Haan, num- ab number add karo.\n[02:18] CUSTOMER: Woh mera number... Back karte hi yeh wapas off ho jata hai.\n[02:26] AGENT: Mujhe off- screenshot do aap.\n[02:29] CUSTOMER: Screenshot... aa nahi raha, aap log isme kya woh karoge.\n[02:39] AGENT: Abhi bhi nahi aa raha hai sir?\n[02:42] CUSTOMER: Nahi aa raha hai.\n[02:44] AGENT: Rukiye sir, main yahan se phir ek baar confirm karti hoon kya issue hai.\n[02:48] CUSTOMER: Haan, dekh ke check kar do.\n[02:50] AGENT: Okay."}, {"call_id": "2026-09-02_MikhleshChouhan_01", "date": "2026-09-02", "scored_at": "2026-09-03T13:49:42", "agent": "Mikhlesh Chouhan", "audio_file": "/kaggle/working/call-quality-agent/to_score/outbound-TBE457-8982193093-20260902-102039.wav.wav", "drive_file_id": "1r_BzoSMgZIDWkO0xNwQEPWMLZW-9_I0d", "phone_number": "8982193093", "language": "hi", "duration_seconds": "218", "score": 4.0, "call_category": "Trade / Position Call", "client_profile_en": "The client holds multiple positions including Jio Finance, Swiggy and HDFC shares, a Sensex derivative trade bought at ₹15 (quantity 700, later risen to ₹20-21 with next-day expiry), and other holdings such as RailTel and Deepak Nitrite that are currently down in value. The client's core concern on this call is recovering losses and understanding what will be done about the underperforming positions.", "client_profile_hi": "क्लाइंट के पास कई पोजीशन हैं जिनमें Jio Finance, Swiggy और HDFC के शेयर, ₹15 पर खरीदा गया एक Sensex डेरिवेटिव ट्रेड (क्वांटिटी 700, जो बाद में ₹20-21 तक बढ़ा और जिसकी एक्सपायरी अगले दिन है), और RailTel व Deepak Nitrite जैसी अन्य होल्डिंग्स शामिल हैं जो फिलहाल घाटे में हैं। इस कॉल में क्लाइंट की मुख्य चिंता नुकसान की भरपाई और खराब प्रदर्शन कर रही पोजीशंस के बारे में स्पष्टता पाना है।", "summary_en": "FL: The agent gave confused, unclear trade updates and pushed the client to add more funds into a losing averaging strategy, leaving the client visibly frustrated and the call ending abruptly with no clear next step.", "summary_hi": "FL: एजेंट ने ट्रेड की जानकारी अस्पष्ट और भ्रमित तरीके से दी और घाटे वाली पोजीशन में एवरेजिंग के लिए और पैसा डालने का दबाव बनाया, जिससे क्लाइंट स्पष्ट रूप से नाराज़ हो गया और कॉल किसी स्पष्ट अगले कदम के बिना अचानक खत्म हो गई।", "strengths_en": ["Agent remained calm and did not become rude despite the customer's frustration.", "Agent provided some reassurance about the delivery holdings not being stuck long-term."], "strengths_hi": ["ग्राहक की नाराज़गी के बावजूद एजेंट शांत रहा और अशिष्ट नहीं हुआ।", "एजेंट ने डिलीवरी होल्डिंग्स के लंबे समय तक फंसे न रहने को लेकर कुछ आश्वासन दिया।"], "issues_en": ["Agent initially failed to understand which trade the customer was referring to ('Kiski baat kar rahe hain sir, sorry?'), showing poor listening.", "Agent made a condescending comparison ('main daily laakh-laakh quantity pe karta hu') that made the client feel small about his 700-quantity position.", "Agent pushed the client to add more funds/quantity to average a losing Sensex trade without clearly explaining risk, and the call ended abruptly with the client cutting it short."], "issues_hi": ["एजेंट शुरुआत में यह समझ नहीं पाया कि ग्राहक किस ट्रेड की बात कर रहा है ('किसकी बात कर रहे हैं सर, सॉरी?'), जो कमजोर सुनने की क्षमता दर्शाता है।", "एजेंट ने एक अपमानजनक तुलना की ('मैं डेली लाख-लाख क्वांटिटी पे करता हूं') जिससे क्लाइंट को उसकी 700 क्वांटिटी की पोजीशन के बारे में छोटा महसूस हुआ।", "एजेंट ने बिना जोखिम स्पष्ट किए घाटे वाले Sensex ट्रेड में एवरेजिंग के लिए और फंड/क्वांटिटी डालने का दबाव बनाया, और कॉल बिना किसी स्पष्ट अगले कदम के अचानक खत्म हो गई जब क्लाइंट ने इसे बीच में काट दिया।"], "improvements_en": ["Confirm the client's specific position/query clearly before responding, instead of asking 'which trade?' mid-conversation.", "Avoid comparing the client's trade size to your own volumes as it comes across as dismissive.", "Close with a concrete next step (specific follow-up time or action) rather than letting the client end the call abruptly."], "improvements_hi": ["जवाब देने से पहले क्लाइंट की विशेष पोजीशन/सवाल को स्पष्ट रूप से समझें, बीच बातचीत में 'कौन सा ट्रेड?' पूछने के बजाय।", "क्लाइंट के ट्रेड साइज़ की अपने वॉल्यूम से तुलना करने से बचें क्योंकि यह उपेक्षापूर्ण लगता है।", "कॉल को किसी ठोस अगले कदम (विशेष फॉलो-अप समय या कार्रवाई) के साथ बंद करें, न कि क्लाइंट को अचानक कॉल खत्म करने दें।"], "transcript": "[00:01] CUSTOMER: Hello?\n[00:02] AGENT: Hello, good morning. Akhilesh baat kar raha hu FL Capital se, relationship manager se.\n[00:06] CUSTOMER: Boliye.\n[00:07] AGENT: Abhi sir aapne kuch stock buy kiye hain, Jio Finance ka, Swiggy ka aur HDFC ka, right?\n[00:13] CUSTOMER: Hmm.\n[00:14] AGENT: Acha hai sir, thik hai? Strong iska fundamental hai. Isko long term ke...\n[00:18] CUSTOMER: Are woh chhodo, jo aap woh kar diya hai mere saath mein uska kya karenge?\n[00:23] AGENT: Kiski baat kar rahe hain sir, sorry?\n[00:25] CUSTOMER: Acha aapko nahi pata? 15 rupaye pe aa gaya woh.\n[00:29] AGENT: Sensex ka trade sir?\n[00:30] CUSTOMER: Haan.\n[00:31] AGENT: Abhi 20 rupaye ke around chal raha hai aur iski expiry kal ki na maine aapko bataya sir.\n[00:36] CUSTOMER: Haan.\n[00:37] AGENT: Toh kal tak hum isko positive, hum isko nikal sakte hain.\n[00:43] CUSTOMER: Thik hai, jo...\n[00:44] AGENT: Thik hai? Iska koi problem nahi hai, thik hai? Aur isme abhi movement bhi acha ho raha hai. Humko isme kuch quantity add karna padega sir.\n[00:52] CUSTOMER: Woh maine dala par us rate pe aaya nahi woh. Dali toh thi maine.\n[00:56] AGENT: Kya bid lagaya aapne?\n[00:58] CUSTOMER: Haan.\n[00:59] AGENT: Acha, kitna quantity lagaya sir?\n[01:01] CUSTOMER: 700 laga GENT: Toh ye toh sir apna delivery product hai na sir.\n[02:54] CUSTOMER: Toh kab tak rakhunga bhai? Inko upar aane mein bhi time lagega na.\n[02:59] AGENT: Nahi nahi aapka paisa zyada din tak ke liye stuck nahi rahega. Ye possibilities hai aane wale time mein abhi hapte ek hapte do hapte mein humko hai na booking karne ka mauka dega sir, don't worry sir, thik hai?\n[03:11] CUSTOMER: Thik hai.\n[03:12] AGENT: Hain na, aur ye Jio Finance ko nikal dijiye toh apan sir isme kuch averaging karke ya kuch quantity add karke ya koi another trade karke nikalte hain sir. 15-16 hazaar rupaye koi badi baat nahi hai sir, profit-loss...\n[03:24] CUSTOMER: Haan woh nahi hai, woh thik hai lekin... Na profit bhi toh hona chahiye seedha...\n[03:28] AGENT: Haan, dekho sir kal toh humne beginning kiya hai. Derivative mein pehle din kaam kiya kal. Toh humne jo bhi...\n[03:34] CUSTOMER: Abhi yaar lecture nahi sunna abhi subah-subah, bhai. Ab main karta hu kuch karta hu, thik hai?\n[03:38] AGENT: Okay okay okay, thank you."}, {"call_id": "2026-09-03_ShivamSinghTomar_01", "date": "2026-09-03", "scored_at": "2026-09-04T13:15:11", "agent": "Shivam Singh Tomar", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-TBE053-7815851928-20260903-164934.wav.wav", "drive_file_id": "", "phone_number": "7815851928", "language": "hi", "duration_seconds": "", "score": 3.0, "call_category": "Account Activation / Reactivation", "client_profile_en": "Male client with an existing IIFL demat account that was not yet activated/used; limited comfort with Hindi (client later reveals 'mera pura Hindi nahi aata' and needed his sister to translate); no trading experience ('naya hai'/fresher in market); wanted to start trading with a small amount (₹2,000-3,000) rather than the ₹10,000-15,000 the agent pushed for.", "client_profile_hi": "पुरुष ग्राहक जिसका IIFL में डीमैट अकाउंट पहले से मौजूद था पर सक्रिय/उपयोग में नहीं था; हिंदी में सहजता सीमित थी (ग्राहक ने बाद में कहा 'मेरा पूरा हिंदी नहीं आता' और अनुवाद के लिए अपनी बहन को बुलाना पड़ा); बाजार में कोई ट्रेडिंग अनुभव नहीं ('नया है'); वह ₹2,000-3,000 की छोटी राशि से ट्रेडिंग शुरू करना चाहता था, जबकि एजेंट ने ₹10,000-15,000 डालने पर जोर दिया।", "summary_en": "BCA 428s: The agent successfully walked the client through login/password setup but the call was marred by a risky request for a password screenshot, pushy fund-amount upselling, confusing multiple call transfers, and a client left needing his sister's help to communicate.", "summary_hi": "BCA 428s: एजेंट ने ग्राहक को लॉगिन/पासवर्ड सेटअप में सफलतापूर्वक मदद की, लेकिन कॉल में पासवर्ड का स्क्रीनशॉट मांगने जैसा जोखिमपूर्ण कदम, फंड राशि बढ़ाने का दबाव, कई बार भ्रमित करने वाला कॉल ट्रांसफर, और अंत में ग्राहक को अपनी बहन की मदद लेनी पड़ी — इस वजह से कॉल कमज़ोर रही।", "strengths_en": ["Agent patiently stayed on the line and re-explained password format multiple times without losing composure.", "Successfully guided a non-technical, confused client through login and fund-add screens step-by-step."], "strengths_hi": ["एजेंट ने बार-बार पासवर्ड फॉर्मेट समझाते हुए भी संयम बनाए रखा और कॉल पर बना रहा।", "एक भ्रमित, गैर-तकनीकी ग्राहक को लॉगिन और फंड-एड स्क्रीन पर चरण-दर-चरण सफलतापूर्वक गाइड किया।"], "issues_en": ["Agent asked the client to send a screenshot of his login/password screen ('Screenshot bhejiye mujhe') — a serious security/compliance concern.", "Agent pressured the client to increase fund addition from the requested ₹2,000-3,000 to ₹10,000-15,000 ('kam se kam aap 10-15 toh kariye hi').", "Poor listening and language mismatch went unaddressed for most of the call, leaving the client confused until his sister had to step in near the end."], "issues_hi": ["एजेंट ने ग्राहक से उसके लॉगिन/पासवर्ड स्क्रीन का स्क्रीनशॉट भेजने को कहा ('स्क्रीनशॉट भेजिए मुझे') — यह एक गंभीर सुरक्षा/अनुपालन चिंता है।", "एजेंट ने ग्राहक की मांगी गई ₹2,000-3,000 राशि को बढ़ाकर ₹10,000-15,000 करने का दबाव डाला ('कम से कम आप 10-15 तो करिए ही')।", "अधिकांश कॉल में खराब श्रवण और भाषा की समस्या को नज़रअंदाज़ किया गया, जिससे ग्राहक भ्रमित रहा और अंत में उसकी बहन को मदद के लिए आना पड़ा।"], "improvements_en": ["Direct clients to secure in-app 'Forgot Password' recovery flows instead of verbally dictating password characters and requesting screenshots.", "Respect the client's stated investment amount rather than pushing for a higher deposit.", "Check for language preference early in the call and route to a Hindi/English-appropriate agent immediately to avoid confusion."], "improvements_hi": ["पासवर्ड के अक्षर मुंह से बताने और स्क्रीनशॉट मांगने के बजाय ग्राहक को ऐप के सुरक्षित 'Forgot Password' प्रक्रिया की ओर निर्देशित करें।", "ग्राहक द्वारा बताई गई निवेश राशि का सम्मान करें, अधिक जमा राशि के लिए दबाव न डालें।", "कॉल की शुरुआत में ही भाषा की प्राथमिकता जांचें और भ्रम से बचने के लिए तुरंत उचित हिंदी/अंग्रेज़ी एजेंट को कॉल भेजें।"], "transcript": "[00:00] AGENT: Hello\n[00:02] CUSTOMER: Hello\n[00:03] AGENT: Ji, namaskar. Shivam baat kar raha hoon IIFL Capital se.\n[00:06] CUSTOMER: Haan, batao.\n[00:08] AGENT: Ji sir, aapka ye account activate ho gaya hai. Application open kiya aapne?\n[00:13] CUSTOMER: Nahi nahi.\n[00:14] AGENT: Theek hai, main ye open karva doon aapka?\n[00:16] CUSTOMER: Haan, open kar raha hoon.\n[00:18] AGENT: Ji ji, aap application open karo IIFL.\n[00:22] CUSTOMER: Haan, open...\n[00:30] AGENT: Aapke paas hai na abhi?\n[00:32] CUSTOMER: Haan, hai.\n[00:33] AGENT: Theek hai.\n[00:43] AGENT: Aur aap login karna.\n[00:46] CUSTOMER: Haan, login kar raha hoon.\n[01:18] AGENT: Login kiya aapne?\n[01:20] CUSTOMER: Haan, login kiya.\n[01:23] AGENT: Ji.\n[01:24] AGENT: Ab aap kya option aa rahe hain aapko?\n[01:27] CUSTOMER: ID number poocha hai.\n[01:29] AGENT: Usne ID aapko yaad hai aapko? User ID pata hai?\n[01:34] CUSTOMER: Pata nahi hai.\n[01:36] AGENT: Haan, user ID daliye usme 7325\n[01:40] CUSTOMER: 7325\n[01:43] AGENT: 07\n[01:45] CUSTOMER: 07\n[01:47] AGENT: 98\n[01:47] CUSTOMER: 98\n[01:48] AGENT: Yes. Ab aapko Forget Password ka option aa
