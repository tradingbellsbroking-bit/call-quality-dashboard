<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --text: #e8e8ec; --muted: #9297a3;
    --accent: #7c9eff; --border: #262a35;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); margin: 0; padding: 32px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 4px; flex-wrap: wrap; }
  .header { display: flex; align-items: center; gap: 14px; }
  .header img { height: 40px; width: auto; max-width: 180px; object-fit: contain; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; }
  .subtitle { color: var(--muted); font-size: 13px; margin: 4px 0 28px; }
  .lang-toggle {
    display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  }
  .lang-toggle button {
    background: var(--panel); color: var(--muted); border: none; padding: 7px 14px;
    font-size: 13px; cursor: pointer; font-weight: 600;
  }
  .lang-toggle button.active { background: var(--accent); color: #0b0e14; }
  .btn-small {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    padding: 7px 14px; font-size: 13px; cursor: pointer; font-weight: 600;
    border-radius: 8px;
  }
  .btn-small:hover { border-color: var(--accent); }
  .btn-danger { color: #ff6b6b; border-color: #ff6b6b55; }
  .btn-danger:hover { border-color: #ff6b6b; background: #ff6b6b18; }
  .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px; }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; min-width: 0;
  }
  .panel h2 { font-size: 15px; font-weight: 600; margin: 0 0 14px; color: var(--text); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px;
  }
  .card .label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .card .value { font-size: 24px; font-weight: 700; }
  .filter-row { margin-bottom: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  select {
    background: #0f1115; color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; font-size: 13px; min-height: 36px;
  }
  .chart-box { position: relative; height: 260px; }
  .table-scroll { max-height: 520px; overflow-y: auto; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 480px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td.wrap { white-space: normal; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  tbody tr { cursor: pointer; transition: background 0.1s; }
  tbody tr:hover { background: #1d212b; }
  .score-pill {
    display: inline-block; padding: 2px 8px; border-radius: 999px; font-weight: 600; font-size: 12px;
  }
  .empty { color: var(--muted); padding: 40px; text-align: center; }

  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    align-items: center; justify-content: center; z-index: 100; padding: 24px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    max-width: 640px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 24px;
  }
  .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; gap: 10px; }
  .modal-header h3 { margin: 0; font-size: 17px; }
  .modal-close {
    background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer;
    line-height: 1; padding: 4px;
  }
  .modal-meta { color: var(--muted); font-size: 12.5px; margin-bottom: 16px; }
  .modal-score { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px; }
  .modal-score .num { font-size: 26px; font-weight: 700; }
  .modal-section { margin-bottom: 16px; }
  .modal-section h4 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted);
    margin: 0 0 8px;
  }
  .modal-section ul { margin: 0; padding-left: 18px; }
  .modal-section li { margin-bottom: 5px; line-height: 1.4; }
  .tag-strength { color: #4ade80; }
  .tag-issue { color: #f87171; }
  .tag-improve { color: #7c9eff; }

  @media (max-width: 820px) {
    body { padding: 16px; }
    .grid { grid-template-columns: 1fr; }
    .cards { grid-template-columns: 1fr 1fr; }
    .header img { height: 32px; }
    h1 { font-size: 19px; }
    .chart-box { height: 220px; }
    .modal { max-width: 100%; padding: 18px; border-radius: 10px; }
    .modal-backdrop { padding: 10px; }
    select, .lang-toggle button { min-height: 40px; }
  }
  @media (max-width: 480px) {
    .cards { grid-template-columns: 1fr; }
    .card .value { font-size: 20px; }
  }
</style>
</head>
<body>

\n[02:54] Okay.\n[02:55] There is option on fund.\n[03:01] One of option, fund option.\n[03:05] Just go on a fund option.\n[03:13] Yes, it is there for fund.\n[03:15] Okay. What is showing?\n[03:23] Showing portfolio watch list.\n[03:25] Okay.\n[03:26] And also, there is fund option.\n[03:37] This fund is there.\n[03:38] Okay. Just click on.\n[03:40] Okay.\n[03:42] After that, fill the amount.\n[03:46] How much investment do you want to add right now?\n[03:50] On the start.\n[03:52] Already added 5000.\n[03:56] Added 5000. Okay.\n[03:59] So, just you want to...\n[04:01] At least add some amount, sir.\n[04:03] At least add 15000.\n[04:06] Just...\n[04:07] I am just seeing that.\n[04:10] 15000 is that amount for start a good investment, right?\n[04:17] Okay.\n[04:18] Okay. So, just add a 50000.\n[04:20] After that, I will provide you some stock.\n[04:24] Like that, search it on.\n[04:26] Sir, Hindustan...\n[04:29] Sorry.\n[04:30] Just search it on.\n[04:31] Click on a search.\n[04:32] Okay.\n[04:37] Just search on Hindustan Jink.\n[04:40] Hind Jink.\n[04:42] Sorry, sir.\n[04:43] I have to give what?\n[04:45] Hind Jink, sir.\n[04:46] H-I-N-D.\n[04:48] H-I-N-D, right?\n[04:50] Yes. Yes.\n[05:08] No, no. This is...\n[05:09] You are seeing stock.\n[05:10] I am getting message.\n[05:11] Another message like stating that exchange account is not enabled.\n[05:15] Like that, I am getting.\n[05:17] While purchase some stock.\n[05:19] Okay. Okay. Okay. Okay.\n[05:21] Just got it.\n[05:22] So, just give me some time.\n[05:24] I will check your profile.\n[05:26] What is the problem here?\n[05:28] And after that, I will call you and update you.\n[05:31] Right?\n[05:32] Okay.\n[05:33] Give me a while, sir.\n[05:34] Okay. Thank you.\n[05:35] Thank you so much."}, {"call_id": "2026-08-14_Prakash_01", "date": "2026-08-14", "scored_at": "2026-08-17T07:56:58", "agent": "Prakash", "audio_file": "/kaggle/working/call-quality-agent/to_score/Prakash - 1 - 14082026.wav", "call_number": "1", "phone_number": "", "language": "hi", "notes": "", "score": 3.0, "client_profile_en": "", "client_profile_hi": "", "summary_en": "The agent profiled the lead reasonably well but seriously breached compliance by pitching a live options trade with entry/target/stoploss to an unonboarded cold lead.", "summary_hi": "एजेंट ने लीड की प्रोफाइलिंग ठीक से की, लेकिन बिना डिमैट अकाउंट खुले एक कोल्ड लीड को एंट्री/टारगेट/स्टॉपलॉस सहित लाइव ऑप्शन ट्रेड बताकर गंभीर कंप्लायंस उल्लंघन किया।", "strengths_en": ["Asked multiple relevant profiling questions (platform used, trading style, income, profession) before pitching.", "Used a simple SIP illustration to explain long-term investing to a non-technical customer.", "Ended with a concrete next step (save number, callback with trade updates)."], "strengths_hi": ["पिच से पहले कई प्रासंगिक प्रोफाइलिंग सवाल पूछे (प्लेटफॉर्म, ट्रेडिंग स्टाइल, आय, पेशा)।", "गैर-तकनीकी ग्राहक को लंबी अवधि के निवेश समझाने के लिए सरल SIP उदाहरण का उपयोग किया।", "अंत में एक ठोस अगला कदम दिया (नंबर सेव करना, ट्रेड अपडेट के लिए कॉलबैक)।"], "issues_en": ["Gave a specific live options trade ('7700 put option... target... stoploss') to a cold lead whose account isn't even open yet — a serious compliance red flag.", "Compared trading returns to guaranteed business income ('अगर आप 10-15 लाख बिजनेस में लगाएं तो क्या 1500 रोज़ नहीं आएगा') which is overly promotional and borderline misrepresentation.", "Pitch was long, rambling and unstructured, mixing SIP, mutual funds, IPOs and options in one confusing block."], "issues_hi": ["एक ऐसे कोल्ड लीड को लाइव ऑप्शन ट्रेड ('7700 पुट ऑप्शन... टारगेट... स्टॉपलॉस') दिया जिसका अकाउंट अभी खुला भी नहीं है — यह एक गंभीर कंप्लायंस रेड फ्लैग है।", "ट्रेडिंग रिटर्न की तुलना गारंटीड बिजनेस इनकम से की ('अगर आप 10-15 लाख बिजनेस में लगाएं तो क्या 1500 रोज़ नहीं आएगा'), जो अत्यधिक प्रचारात्मक और भ्रामक है।", "पिच लंबी, बिखरी हुई और असंरचित थी, जिसमें SIP, म्यूचुअल फंड, IPO और ऑप्शन सब एक साथ मिला दिए गए।"], "improvements_en": ["Never share li ा लीड हैं और जिनकी एजेंट से एल्गो ट्रेडिंग को लेकर पहले भी बातचीत हो चुकी है। पिछली बातचीत में उन्होंने चार्जेस को लेकर आपत्ति जताई थी कि वे उनके लिए किफायती/comfortable नहीं हैं।", "summary_en": "The agent failed to recall the charges he had previously quoted and had to ask the customer to remind him, showing poor preparation and ending the call without any pitch or next step.", "summary_hi": "एजेंट को याद नहीं था कि उसने पहले कौन से चार्जेस बताए थे और उसे ग्राहक से ही याद दिलाने को कहना पड़ा, जिससे तैयारी की कमी झलकती है और कॉल बिना किसी पिच या अगले कदम के समाप्त हो गई।", "strengths_en": ["Agent maintained a calm and respectful tone throughout the exchange.", "Agent directly acknowledged the customer's stated objection about charges instead of ignoring it."], "strengths_hi": ["एजेंट ने पूरी बातचीत के दौरान शांत और सम्मानजनक टोन बनाए रखा।", "एजेंट ने ग्राहक की चार्जेस को लेकर आपत्ति को नज़रअंदाज़ न करके सीधे स्वीकार किया।"], "issues_en": ["Agent did not check if it was a good time to talk before jumping into the pitch/follow-up.", "Agent forgot the previously quoted charges and asked the customer, 'Kitna bataya tha? Mujhe thoda ek baar remind karwa sakte hain kya?' — a clear lack of preparation.", "Call ends abruptly with no pitch delivered and no next step secured."], "issues_hi": ["एजेंट ने बातचीत शुरू करने से पहले यह नहीं पूछा कि क्या ग्राहक के लिए यह सही समय है।", "एजेंट पहले बताए गए चार्जेस भूल गया और ग्राहक से पूछा, 'कितना बताया था? मुझे थोड़ा एक बार remind करवा सकते हैं क्या?' — जो तैयारी की स्पष्ट कमी दिखाता है।", "कॉल बिना कोई पिच दिए और बिना अगला कदम तय किए अचानक समाप्त हो जाती है।"], "improvements_en": ["Agent should review CRM/call notes before calling back so previously discussed charges/details are not forgotten.", "Address the affordability objection with a clear, simplified charge breakdown or alternative plan instead of asking the customer to repeat it.", "Always confirm a concrete next step (callback time, revised quote, or WhatsApp follow-up) before ending the call."], "improvements_hi": ["एजेंट को कॉल करने से पहले CRM/कॉल नोट्स देख लेने चाहिए ताकि पहले बताए गए चार्जेस/विवरण न भूलें।", "किफायत की आपत्ति को स्पष्ट, सरल चार्ज ब्रेकडाउन या वैकल्पिक प्लान के साथ हल करें, न कि ग्राहक से ही दोहराने को कहें।", "कॉल समाप्त करने से पहले हमेशा कोई ठोस अगला कदम (कॉलबैक समय, संशोधित कोटेशन, या व्हाट्सएप फॉलो-अप) तय करें।"], "transcript": "[00:00] CUSTOMER: Hello.\n[00:02] AGENT: Hello?\n[00:03] AGENT: Haan Deep Chand ji, namaste. Shantilal baat kar raha hoon sir, IIFL Capital se.\n[00:08] CUSTOMER: Hello.\n[00:10] AGENT: Ji ji, meri aawaz aa rahi hai aapko?\n[00:12] CUSTOMER: Haan, bataiye.\n[00:13] AGENT: Ji ji, toh aapko algo trading ke regarding aapse meri baat hui thi?\n[00:19] CUSTOMER: Haan, toh aapne uske charges kuch bataye the jo ki mere comfortable nahi hain.\n[00:26] AGENT: Kiska charges?\n[00:28] CUSTOMER: Algo ka.\n[00:30] AGENT: Charges maine clear kiya tha sir us samay aapko ya nahi kiya tha?\n[00:36] CUSTOMER: Nahi, kiya tha aapne. Shaayad us time mere ko samajh mein aaya tha toh main comfortable nahi hua.\n[00:43] AGENT: Haan.\n[00:45] AGENT: Kitna bataya tha? Mujhe thoda ek baar remind karwa sakte hain kya?"}, {"call_id": "2026-08-10_UNMAPPED_TBE650_01", "date": "2026-08-10", "scored_at": "2026-08-23T22:54:35", "agent": "UNMAPPED_TBE650", "audio_file": "/kaggle/working/call-quality-agent/to_score/outbound-532_TBE650-9979347906-20260810-095202.wav.wav", "call_number": "", "phone_number": "9979347906", "language": "hi", "notes": "", "score": 5.0, "client_profile_en": "Client (addressed as Milan) had previously discussed starting a SIP (systematic investment) with the agent and was expecting a follow-up call on Monday; he is considering a monthly SIP amount somewhere between ₹1000-₹2500 but has not finalized it, and asked for details/estimates to be sent via WhatsApp/PDF before committing.", "client_profile_hi": "ग्राहक (मिलन के नाम से संबोधित) ने पहले एजेंट के साथ SIP (सिस्टेमेटिक इन्वेस्टमेंट) शुरू करने पर बात की थी और सोमवार को फॉलो-अप कॉल की उम्मीद कर रहा था; वह ₹1000-₹2500 के बीच मासिक SIP राशि पर विचार कर रहा है लेकिन अभी तय नहीं किया है, और प्रतिबद्ध होने से पहले WhatsApp/PDF के जरिए विवरण/अनुमान भेजने को कहा।", "summary_en": "The agent maintained a polite tone but the pitch was confusing and ended in only a vague follow-up rather than a firm next step.", "summary_hi": "एजेंट ने विनम्र लहजा बनाए रखा, लेकिन पिच भ्रमित करने वाली थी और अंत में एक ठोस अगले कदम के बजाय केवल एक अस्पष्ट फॉलो-अप हुआ।", "strengths_en": ["Agent remained calm, patient, and respectful throughout despite the customer's confusing responses.", "Referenced the prior conversation ('aapse baat hua tha na mera SIP se related') to establish continuity."], "strengths_hi": ["ग्राहक के भ्रमित करने वाले जवाबों के बावजूद एजेंट पूरी कॉल में शांत, धैर्यवान और सम्मानजनक रहा।", "पिछली बातचीत का संदर्भ दिया ('आपसे बात हुआ था ना मेरा SIP से related') जिससे निरंतरता बनी।"], "issues_en": ["Agent never confirmed if it was a good time to talk, jumping straight into the SIP topic.", "The exchange around amount and WhatsApp/PDF was muddled - agent asked 'Kya WhatsApp karoon?' showing he didn't grasp what the customer wanted.", "No firm next step was secured; customer just said he'd 'look and call back' with no date/time committed."], "issues_hi": ["एजेंट ने कभी पुष्टि नहीं की कि बात करने का सही समय है या नहीं, सीधे SIP विषय पर चला गया।", "राशि और WhatsApp/PDF को लेकर बातचीत उलझी हुई थी - एजेंट ने पूछा 'क्या WhatsApp करूं?' जिससे पता चलता है कि उसे ग्राहक की मांग समझ नहीं आई।", "कोई ठोस अगला कदम तय नहीं हुआ; ग्राहक ने बस 'देख कर वापस कॉल करूंगा' कहा, बिना किसी तारीख/समय की प्रतिबद्धता के।"], "improvements_en": ["Ask a direct permission question ('Is this a good time?') before diving into the pitch.", "Clarify the customer's ask in one clear question instead of multiple confused follow-ups about amount/WhatsApp.", "Lock a specific callback date/time before ending the call rather than leaving it open-ended."], "improvements_hi": ["पिच में जाने से पहले सीधे अनुमति वाला सवाल पूछें ('क्या अभी बात करने का सही समय है?')।", "राशि/WhatsApp को लेकर कई भ्रमित करने वाले सवालों के बजाय एक स्पष्ट प्रश्न से ग्राहक की मांग समझें।", "कॉल खत्म करने से पहले एक निश्चित कॉलबैक तारीख/समय तय करें, बजाय इसे खुला छोड़ने के।"], "transcript": "[00:02] CUSTOMER: Hello.\n[00:03] AGENT: Ji Milan sir, good morning. Sagar baat kar raha hoon Wellsice se sir.\n[00:08] CUSTOMER: Hello.\n[00:09] AGENT: Haan ji.\n[00:10] CUSTOMER: Haan, haan ji.\n[00:11] AGENT: Ji ji. Sir ji aapse baat hua tha na mera SIP se related, aapne bola tha Monday call karte aap punch karne wale the Monday se, SIP means investment?\n[00:20] CUSTOMER: Haan, haan.\n[00:21] AGENT: Ji ji ji, toh abhi aap comfortable rehte hain sir toh abhi main aapka punch kara deta hoon SIP mein. Kaise karna rahega saari cheezein.\n[00:27] CUSTOMER: Haan, woh poora mere ko uh WhatsApp kar do na.\n[00:32] AGENT: Kya WhatsApp karoon?\n[00:33] CUSTOMER: Uh kya karna budget mein kitna kitna hoga, kitne saal mein kitna hoga woh.\n[00:38] AGENT: Uh per month aapne jaise mujhe bataya tha do-dhadhai hazaar rupaye ka aapka plan hai.\n[00:43] CUSTOMER: Haan, woh sab daal do na usme.\n[00:45] AGENT: Ji?\n[00:46] CUSTOMER: Uh kitna amount rehta kitna hota\n[00:49] AGENT: Achha, main woh share kar deta hoon. Toh aap mujhe ek cheez yeh bata payenge ki matlab dhadhai hazaar se karna chahte ya do hazaar se karna chahte hain aap?\n[00:56] CUSTOMER: Woh sab daal do na uh 1000 se chalu hua hai, sab daal do na 1000 se 1200, 1500, 2000 tak.\n[01:06] AGENT: Theek hai, toh main aapko ek cheez clear kar deta hoon.\n[01:08] CUSTOMER: Haan, woh usme kya WhatsApp mein estimate daal do na usme.\n[01:13] AGENT: Theek hai, theek hai. Toh aap mujhe batayenge sir ki aap kab tak fi- matlab kab call connect kar sakta hoon abhi? Aapko share karke call connect karoon main aapko?\n[01:20] CUSTOMER: Woh PDF share kar do, con- connect toh main karunga. Abhi thoda kaam pe rehta hoon, isliye abhi dekh ke fir daal deta hoon.\n[01:27] AGENT: Okay okay sir, theek hai toh main aapko co- detail share karke main aapko call back kar- aap call karenge, okay?\n[01:33] CUSTOMER: Haan, okay okay, WhatsApp kar do.\n[01:35] AGENT: Ji."}, {"call_id": "2026-08-14_DharmendraPandey_01", "date": "2026-08-14", "scored_at": "2026-08-23T23:06:28", "agent": "Dharmendra Pandey", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-TBE430-918980847412-20260814.mp3", "call_number": "", "phone_number": "918980847412", "language": "hi", "notes": "", "score": 6.0, "client_profile_en": "Customer identifies himself as Rohan, brother of Dashrath (who originally submitted the inquiry via a social media campaign for SIP/mutual funds). Rohan already runs a personal SIP of ₹500/month since January, roughly 8 months in with about ₹4,000 invested, and does not track its returns. He has an existing Demat account with a discount broker (Groww/Upstox/Zerodha) but does not trade in stocks. He works as a driver of his own vehicle, and his personal phone does not have WhatsApp (his brother's number is used for that).", "client_profile_hi": "ग्राहक खुद को रोहन बताता है, जो दशरथ का भाई है (जिसने सोशल मीडिया कैंपेन के जरिए SIP/म्यूचुअल फंड के लिए इन्क्वायरी की थी)। रोहन का खुद का SIP जनवरी से ₹500 प्रति माह चल रहा है, लगभग 8 महीने से लगभग ₹4,000 निवेश हो चुका है, और वह उसका रिटर्न ट्रैक नहीं करता। उसका एक डिस्काउंट ब्रोकर (Groww/Upstox/Zerodha) में डीमैट अकाउंट पहले से है लेकिन वह स्टॉक ट्रेडिंग नहीं करता। वह अपनी खुद की गाड़ी चलाने का काम करता है, और उसके निजी फोन में WhatsApp नहीं है (उसके भाई का नंबर इसके लिए इस्तेमाल होता है)।", "summary_en": "The agent profiled the customer reasonably well and stayed patient throughout, but skipped a permission check, drifted into risky IPO/gold speculation with overly promotional claims, and closed with only a vague callback request instead of a firm next step.", "summary_hi": "एजेंट ने ग्राहक की प्रोफाइलिंग ठीक-ठाक की और पूरे कॉल में धैर्य बनाए रखा, लेकिन बात करने की अनुमति नहीं ली, जोखिम भरे IPO/गोल्ड सट्टे की ओर बहुत उत्साहजनक दावों के साथ बढ़ गया, और अंत में सिर्फ एक अस्पष्ट कॉलबैक अनुरोध किया न कि कोई ठोस अगला कदम तय किया।", "strengths_en": ["Good profiling — asked about existing SIP amount, duration, returns tracking, and profession before pitching further.", "Calm, patient tone throughout with no interruptions, letting the customer explain in his own words.", "Referenced the original lead source (social media SIP/mutual fund inquiry) correctly at the start."], "strengths_hi": ["अच्छी प्रोफाइलिंग — आगे पिच करने से पहले मौजूदा SIP राशि, अवधि, रिटर्न ट्रैकिंग और पेशे के बारे में पूछा।", "पूरे कॉल में शांत, धैर्यपूर्ण लहजा रखा, बीच में नहीं टोका, ग्राहक को अपनी बात कहने दी।", "शुरुआत में लीड के मूल स्रोत (सोशल मीडिया पर SIP/म्यूचुअल फंड इन्क्वायरी) का सही ढंग से उल्लेख किया।"], "issues_en": ["No permission check ('is this a good time to talk?') before launching into the pitch.", "Made overly promotional claims like '95% chances of profit' on IPOs and cited a specific customer's ₹15,000-20,000 gain, which is borderline compliance risk.", "Call ended with only a vague 'call me when free' instead of a firm next step like a scheduled callback or WhatsApp confirmation."], "issues_hi": ["पिच शुरू करने से पहले 'क्या अभी बात करने का सही समय है?' जैसी अनुमति नहीं ली गई।", "IPO पर '95% प्रॉफिट के चांस' जैसे अत्यधिक प्रचारात्मक दावे किए और एक ग्राहक के ₹15,000-20,000 के मुनाफे का उदाहरण दिया, जो कंप्लायंस के लिहाज से जोखिम भरा है।", "कॉल का अंत केवल एक अस्पष्ट 'फ्री होने पर कॉल करना' के साथ हुआ, न कि किसी तय कॉलबैक या WhatsApp पुष्टि जैसे ठोस अगले कदम के साथ।"], "improvements_en": ["Start with a clear permission check before diving into the pitch.", "Stay focused on the customer's stated interest (mutual funds/SIP) rather than expanding into IPO/gold/Demat trading pitches with strong return claims.", "Lock a specific callback time or WhatsApp confirmation instead of leaving the next step open-ended."], "improvements_h nt gives a misleading explanation of IPO lock-in rules and pushes unverified profit claims without proper profiling, triggering a serious compliance concern that caps the score.", "summary_hi": "एजेंट IPO लॉक-इन नियमों की भ्रामक व्याख्या देती है और उचित प्रोफाइलिंग के बिना असत्यापित मुनाफे के दावे करती है, जिससे एक गंभीर कम्प्लायंस चिंता उत्पन्न होती है जो स्कोर को सीमित कर देती है।", "strengths_en": ["Agent remains calm and patient despite the client's repeated skeptical questions.", "Secures a concrete next step by getting a time commitment (12:30 PM) for the Demat process and confirming a callback number."], "strengths_hi": ["क्लाइंट के बार-बार संदेहपूर्ण सवालों के बावजूद एजेंट शांत और धैर्यवान बनी रहती है।", "डीमैट प्रोसेस के लिए समय (12:30 बजे) की प्रतिबद्धता लेकर और कॉलबैक नंबर कन्फर्म करके एक ठोस अगला कदम सुनिश्चित करती है।"], "issues_en": ["Agent misrepresents IPO trading rules, claiming shares can be sold if 'a buyer is found' before listing, which is a serious compliance/misrepresentation issue.", "No profiling is done to understand why the client hasn't yet activated or what his trading experience/goals are before pitching.", "Agent opens with unverified profit claims ('5,500 profit booked', '34% listing gain') without acknowledging any risk, which is overly promotional."], "issues_hi": ["एजेंट IPO ट्रेडिंग नियमों को गलत तरीके से बताती है, यह दावा करते हुए कि लिस्टिंग से पहले 'buyer मिल जाने पर' शेयर बेचे जा सकते हैं, जो एक गंभीर कम्प्लायंस/गलतबयानी का मुद्दा है।", "पिच देने से पहले यह समझने के लिए कोई प्रोफाइलिंग नहीं की गई कि क्लाइंट ने अभी तक एक्टिवेशन क्यों नहीं किया या उसका ट्रेडिंग अनुभव/लक्ष्य क्या है।", "एजेंट बिना किसी जोखिम को स्वीकार किए असत्यापित मुनाफे के दावों ('5,500 का प्रॉफिट', '34% लिस्टिंग गेन') से शुरुआत करती है, जो अत्यधिक प्रचारात्मक है।"], "improvements_en": ["Do not describe pre-listing IPO resale mechanics inaccurately — give SEBI-compliant, accurate information about lock-in and trading rules.", "Ask why the client paused the process before pitching another product, per reactivation call requirements.", "Balance any profit example with a risk disclaimer to avoid compliance exposure."], "improvements_hi": ["लिस्टिंग से पहले IPO पुनर्विक्रय की प्रक्रिया को गलत तरीके से न बताएं — लॉक-इन और ट्रेडिंग नियमों के बारे में SEBI-अनुपालक, सटीक जानकारी दें।", "पुनः सक्रियण कॉल की आवश्यकता के अनुसार, नया प्रोडक्ट पिच करने से पहले पूछें कि क्लाइंट ने प्रोसेस क्यों रोका था।", "किसी भी मुनाफे के उदाहरण को जोखिम की चेतावनी के साथ संतुलित करें ताकि कम्प्लायंस जोखिम से बचा जा सके।"], "transcript": "[00:01] AGENT: Hello Rajendra ji, good morning.\n[00:03] CUSTOMER: Haan ma'am, good morning.\n[00:05] AGENT: Haan kaise hain sir aap? Neetu baat kar rahi hoon.\n[00:08] CUSTOMER: Haan badhiya hain ma'am.\n[00:09] AGENT: Ji. Kiya tha fir aapne process?\n[00:11] CUSTOMER: Nahi nahi main mana kar diya tha na aapko Somwar ke liye bola tha.\n[00:15] AGENT: Achha achha okay. Aaj maine aapko ek share bataya tha jiska IPO bataya tha 823 rupee uska GMP hai. Aaj list hua hai sir 34% pe list hua hai. Ek customer ne 5,500 ka profit book kara hai pata hai aapko?\n[00:28] CUSTOMER: Achha, kaunsa wala bataya tha?\n[00:31] AGENT: Maine aapko ye bheja abhi hai aap check kar sakte hain WhatsApp pe.\n[00:35] CUSTOMER: Iska IPO aaj khula hai?\n[00:37] AGENT: Haan aaj khula hai. Aaj list, aaj mil gaya.\n[00:41] CUSTOMER: Is customer ne kab, is customer ne kab liya tha?\n[00:43] AGENT: Ye abhi hafte bhar pehle ki baat hai matlab ek hafte pehle aaya tha ye. Haan na, listing me ye bhi tha hai na, price band tha iska ₹829 se ₹871 aur iska jo open ka tha ki open hoga 1100 ke upar, aaj dekh sakte hain 1150, ₹1160 chal raha hai. 10 taareek ko aaya tha ye.\n[01:03] CUSTOMER: Hmm.\n[01:04] AGENT: Haan, to main aapko bol rahi hoon sir aap MSCI leke rakh dijiye. MSCI hai na, aur ya fir Zepto. Ye agar aap leke rakh denge na sir achhe achhe return aa rahe hain. Abhi main aapko bhejti hoon agar aap bolo to main iska profit bhi aapko bhej sakti hoon check kar sakte ho aap.\n[01:22] CUSTOMER: Nahi to wo main open hote hi thodi sell kar sakte hain 6 mahine ka locking period hota hai na ma'am?\n[01:26] AGENT: Nahi nahi, wo wo wala rehta hai matlab agar aap agar maine aapko bataya tha na ki agar seller mil jaate hain matlab buyer mil jaate hain to aap sell kar paoge.\n[01:34] CUSTOMER: Achha achha.\n[01:35] AGENT: Isliye sell ho gaya hamara.\n[01:37] CUSTOMER: Achha agar seller mil jaate... nahi usme wo option...\n[01:41] AGENT: Waise hota kya hai dekho main aapko batati hoon. Hota kya hai IPO khola, bahut saare logo ko kya rehta hai ki yahan se bhi buying karni padti hai. Kisi-kisi ko IPO nahi mil rahe hain, to wo log jis price pe khula hai us price pe khareedte hain. To agar aap us price pe khareedge wo to aap to sell kar paoge kyunki wo buy kar rahe hain to aap sell kar sakte ho wahan pe. Wo hum aapko sell karwayenge. Haan.\n[02:04] AGENT: Haan jaise ki aaj humne sell karwaya.\n[02:07] CUSTOMER: Aur wo ek ek aap share bhi to bataye the kaunsa share bataye the? Aaj batane wale the na kaunsa share bataoge?\n[02:13] AGENT: Share?\n[02:14] CUSTOMER: Aap haan ek share bhi to batate ho ek din ke liye do din ke liye?\n[02:17] AGENT: Achha wo, haan pehle abhi aaj hum Demat process kar lenge sir?\n[02:21] CUSTOMER: Haan aaj kar lenge 12:00 baje.\n[02:24] AGENT: Haan, to abhi kar lijiye to fir hamara kaam bhi shuru ho jaaye.\n[02:29] CUSTOMER: Abhi to abhi to main mere jo kaam hai real estate ka, to uske liye hamare ko subah 8:00 baje hi nikal gaya tha. Abhi main jaaunga ghar pe khana khane ke liye aalam 12:30 baje.\n[02:43] AGENT: Achha, thik hai.\n[02:45] CUSTOMER: Tab jaake aapko bolunga fir aapko kar dunga.\n[02:47] AGENT: Thik hai ji, okay. Mujhe number bata dena aap hai na us time bhi matlab kaunse number pe call...\n[02:51] CUSTOMER: Haan. Aap ye aap ye detail to bhej do ki ye pre-IPO me kitna tha aur kitne me khula hai?\n[02:55] AGENT: Main bhej deti hoon aapko ek second, thik hai? Haan ji.\n[03:00] CUSTOMER: Thik ng?\n[00:03] CUSTOMER: Good morning.\n[00:05] AGENT: Ashish ji, main Neetu baat kar rahi hoon Kotak Securities ke authorised person ke behalf pe. Sir, aapne humare social media platform Facebook ads pe apna inquiry show kiya tha. Aapko share market mein investment karna hai kya?\n[00:20] CUSTOMER: Ji, batayein.\n[00:21] AGENT: Bareilly se baat kar rahe hain aap, right?\n[00:24] CUSTOMER: Hello?\n[00:25] AGENT: Hello, sir aapne yeh mention nahi kiya hai ki aapko investment karna hai, unlisted shares purchase karna hai, kya buy karna hai aapko?\n[00:35] CUSTOMER: Sikhna hai ma'am share market jo hai.\n[00:37] AGENT: Achha, learning karni hai aapko.\n[00:39] CUSTOMER: Haan.\n[00:40] AGENT: Okay, Demat account abhi aapke paas kaun sa hai?\n[00:44] CUSTOMER: Mere paas Groww ka hai, SBI ka hai.\n[00:47] AGENT: SBI aur Groww ka hai. Yahan se koi support ya phir yahan se kuch batate hain kya? Market sikha rahe hain kya?\n[00:54] CUSTOMER: Haan, SBI mein batate hain.\n[00:56] AGENT: Batate hain. Ab jaise main Kotak se baat kar rahi hoon sir, Kotak Neo application hai humara, isme aapko 250 plus videos bhi mil jayenge learning ke liye, thike? Jisme aapka basic aur advance dono clear hoga.\n[01:10] CUSTOMER: Okay.\n[01:12] CUSTOMER: Video mil jayenge?\n[01:14] AGENT: Haan, humare application mein, matlab proper tarike se humare jo classes chalti hai na sir, wo aapko mil jayenge. Kotak Neo application aapko download karna padega lekin.\n[01:26] CUSTOMER: Matlab live nahi sikhate hain?\n[01:28] AGENT: Live nahi sikhate hain, sir. Live sikhna hai aapko?\n[01:32] CUSTOMER: Live sikhna tha jo hai.\n[01:34] AGENT: Okay, matlab live class dhoond rahe hain aap. Sir, humare paas videos hain, aap wo dekh sakte hain, wahan pe agar aapko kuch doubt aa raha hai toh aap wo clear kar sakte hain humse.\n[01:44] CUSTOMER: Kya brokerage rehti hai?\n[01:46] AGENT: Sir, humari us Kotak ki brokerage hai sir 49/49 share. Par abhi aapko kaam toh karna nahi hai?\n[01:54] CUSTOMER: Nahi, jaise usme le bhi target aa jaaye uske baad batata hoon main aapko.\n[03:43] AGENT: Achha, usme aapka investment hai abhi?\n[03:45] CUSTOMER: Haan, lagbhag ₹2 lakh padha hua hai.\n[03:47] AGENT: 2 lakh ka? Toh learning agar aapko karna hai sir, toh aap Kotak ke saath kar sakte hain learning.\n[03:53] CUSTOMER: Agar achha sikhate hain toh bataiye aap jo hai.\n[03:56] AGENT: Sir, vaise toh nahi sikhate hain, baaki main baat karke aapko call back kar leti hoon, thike?\n[04:01] CUSTOMER: Aisa kar lijiye jo hai.\n[04:03] AGENT: Haan thike, number save kar lijiye, main call back karke aapko batati hoon phir, okay?\n[04:06] CUSTOMER: Kahan se baat kar rahi, kahan se baat kar rahi hain?\n[04:08] AGENT: Main Neetu, Indore, MP se baat kar rahi hoon sir, Kotak Securities humari, matlab humara Kotak Neo par Demat hai, Kotak Securities humari company hai, okay?\n[04:18] CUSTOMER: Account kholne ke baad guide karte hain? Dete hain calls vagairah?\n[04:21] AGENT: Haan sir, aapko proper tarike se aapko RM support milega jisse agar mein, mujhse aapki baat hui hai, aapko proper tarike se saari cheezein batayenge, aap option, equity, commodity aap jisme bhi karte ho. IPO mein bhi aap yahan hum zaadatar sabko recommend kar rahe hain, IPO aap abhi aap dekho, aap share toh aap dekhte hi ho na equity, matlab usme karte hi ho aap, aap dekh sakte ho, Dhoot Transmission ka abhi IPO aaya tha, kaafi achha IPO aaya tha, 871 pe aaya tha, aaj ka rate dekho toh ₹1400 chal raha hai.\n[04:48] CUSTOMER: Kya accuracy rehti hai?\n[04:51] AGENT: Haan?\n[04:52] CUSTOMER: Kya accuracy rehti hai?\n[04:53] AGENT: Sir, humari 85 to 90 hai abhi.\n[04:56] CUSTOMER: 85 to 90% hai?\n[04:58] AGENT: Haan ji.\n[05:00] CUSTOMER: Target aur SL mein kitna fark rehta hai?\n[05:03] AGENT: Sir, jaise maan lijiye agar humne koi trade di hai aapko, thike, ₹100 se buy karwayi hai, target humare rehte hain 20 point ke, 25 se 30 point ke, hai na, Nifty ka. Sensex mein humare 60-70 point 100 bhi chale jaate hain, aur stop loss Sensex ka humara 30 se 40 point ka rehta hai, aur Nifty ki baat karoon toh 15 point ka stop loss leke chalte hain.\n[05:24] CUSTOMER: Sensex mein 40 point ka rehta hai SL?\n[05:26] AGENT: Haan, aa nahi jata hai sir, leke chalte hain. Abhi jaise abhi humne position ek book karwa diya hai, aap search kar sakte hain Nifty ka 24150 ka call option buy karwaya tha humne 155 se, 175 pe booking ho chuka hai.\n[05:41] AGENT: Okay, 20 point mile toh humne book kar liya.\n[05:48] CUSTOMER: Chaliye, sikhane ke purpose se koi badhiya badhiya schedule ho toh batayega, mujhe phone kariyega.\n[05:52] AGENT: Haan ji, main batati hoon aapko, thike? Baat karke phir aapko call back karti hoon, thike?\n[05:57] CUSTOMER: Okay, thank you.\n[05:58] AGENT: Thank you so much."}, {"call_id": "2026-08-18_ShantilalPethari_02", "date": "2026-08-18", "scored_at": "2026-08-23T23:11:15", "agent": "Shantilal Pethari", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-TBE187-7087405393-20260818-131930.wav.wav", "call_number": "", "phone_number": "7087405393", "language": "hi", "notes": "", "score": 4.0, "client_profile_en": "Customer (Manoj) previously held an IIFL trading account which he had permanently closed; he is trying to reopen/reactivate it and mentions he had already spoken to customer care about this earlier. No other demographic details (age, occupation, income) were gathered.", "client_profile_hi": "ग्राहक (मनोज) के पास पहले IIFL में ट्रेडिंग अकाउंट था जिसे उन्होंने permanently बंद करवा दिया था; वे अब उसे दोबारा खुलवाना/reactivate करना चाहते हैं और बताते हैं कि इस बारे में पहले customer care से बात हो चुकी है। उम्र, पेशा, आय जैसी कोई अन्य जानकारी एजेंट ने नहीं ली।", "summary_en": "The agent identified the reactivation need but repeatedly pushed the customer for his PAN number on-call despite the customer offering to WhatsApp it, and the call ended abruptly without a confirmed next step.", "summary_hi": "एजेंट ने reactivation की जरूरत को पहचाना, लेकिन ग्राहक के WhatsApp पर भेजने की पेशकश के बावजूद बार-बार कॉल पर PAN नंबर मांगता रहा, और कॉल बिना किसी पक्के अगले कदम के अचानक खत्म हो गई।", "strengths_en": ["Agent correctly referenced the earlier conversation and the customer's closed IIFL account, showing some continuity.", "Agent asked the customer what difficulty he faced in reopening the account, touching on the reactivation barrier."], "strengths_hi": ["एजेंट ने पिछली बातचीत और ग्राहक के बंद IIFL अकाउंट का सही संदर्भ दिया, जिससे कुछ निरंतरता दिखी।", "एजेंट ने ग्राहक से पूछा कि अकाउंट दोबारा खोलने में क्या दिक्कत आ रही है, जिससे reactivation की बाधा पर बात हुई।"], "issues_en": ["Agent repeatedly insisted on getting the PAN number over the call ('PAN card number aise nahi bata sakte kya?') even after the customer twice said he'd rather WhatsApp it.", "No permission check was done at the opening to confirm if it was a good time to talk.", "Call ends abruptly mid-conversation with no confirmed next step, callback time, or summary."], "issues_hi": ["ग्राहक द्वारा दो बार WhatsApp पर भेजने की पेशकश करने के बावजूद एजेंट कॉल पर ही PAN नंबर लेने पर अड़ा रहा ('PAN card number aise nahi bata sakte kya?')।", "कॉल की शुरुआत में यह पूछकर परमिशन नहीं ली गई कि बात करने का यह सही समय है या नहीं।", "कॉल बीच में ही अचानक खत्म हो गई, बिना किसी पक्के अगले कदम, कॉलबैक टाइम या सारांश के।"], "improvements_en": ["Respect the customer's stated preference (WhatsApp) for sharing sensitive details like PAN instead of pushing repeatedly on call.", "Dig deeper into why the account was permanently closed to personalize the reactivation pitch.", "Always close with a clear next step, such as a confirmed callback time or WhatsApp follow-up."], "improvements_hi": ["PAN जैसी संवेदनशील जानकारी के लिए बार-बार कॉल पर जोर देने के बजाय ग्राहक की बताई गई पसंद (WhatsApp) का सम्मान करें।", "अकाउंट को permanently बंद करने की असली वजह गहराई से पूछें ताकि reactivation पिच को व्यक्तिगत बनाया जा सके।", "कॉल हमेशा किसी स्पष्ट अगले कदम के साथ बंद करें, जैसे पक्का कॉलबैक टाइम या WhatsApp फॉलो-अप।"], "transcript": "[00:01] CUSTOMER: Hello\n[00:02] AGENT: Hello\n[00:03] AGENT: Um Manoj ji namaste, Shantilal baat kar raha hu main IIFL Capital se sir.\n[00:09] CUSTOMER: Haan sir?\n[00:10] AGENT: IIFL se main baat kar raha hu, aap se last time meri baat hua tha sir stock market ke regarding, aapne matlab listed share ke regarding aapne baat kar rahe the na?\n[00:20] CUSTOMER: Haan ji haan ji.\n[00:21] AGENT: Acha sir, haan. Toh aap bol rahe the ki sir aapka mera pehle toh account tha IIFL me, iske baad me maine close kar diya tha usko sir.\n[00:27] CUSTOMER: Haan ji haan ji, woh dubara open nahi ho raha. Maine baat ki thi, customer care ki call bhi aayi thi.\n[00:32] AGENT: Kya dikkat aa rahi thi dubara open karne me?\n[00:35] CUSTOMER: Sir permanently close karwaya tha maine account na.\n[00:38] AGENT: Nahi, aisa rehta hai, toh doosre number se ho jayega sir account open.\n[00:43] CUSTOMER: Acha.\n[00:44] AGENT: Haan, is number se aapne kiya tha? Ya toh aap apna PAN card number mujhe bata sakte hain kya?\n[00:51] CUSTOMER: Haan ji, abhi bata deta hu.\n[00:52] AGENT: PAN card se main ek baar check karwa leta hu aapka account active hai ya abhi process ho payega ya nahi.\n[00:57] CUSTOMER: Nahi, woh kyunki permanently close karwaya tha na, aur pehle bhi bataya tha kal woh...\n[01:02] AGENT: Mujhe ek baar apna PAN card number bata dijiye, main check karke aapko update kar dunga aisa.\n[01:07] CUSTOMER: Theek hai ji, main aapko WhatsApp pe send kar deta hu...\n[01:09] AGENT: PAN card number aise nahi bata sakte kya?\n[01:11] CUSTOMER: Nahi, aise yaad nahi hai sir.\n[01:13] AGENT: Ek baar dekh lo sir, call pe bata do toh main aage update kar deta hu abhi call pe rahe kahi.\n[01:19] CUSTOMER: Theek hai ji.\n[01:21] AGENT: Abhi update kar dunga toh turant mere pass response aa jayega thode samay me.\n[01:26] CUSTOMER: Ji.\n[01:29] AGENT: Abhi kaun sa account aap use kar rahe hain waise?"}, {"call_id": "2026-08-20_ShantilalPethari_02", "date": "2026-08-20", "scored_at": "2026-08-23T23:29:21", "agent": "Shantilal Pethari", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-TBE187-7087405393-20260820-143802.wav.wav", "call_number": "", "phone_number": "7087405393", "language": "hi", "notes": "", "score": 4.0, "client_profile_en": "Customer (Manoj) previously discussed opening an IIFL Demat account but had earlier declined it when speaking with another agent (Dharmendra). He has since opened a Zerodha account instead. He mentioned an app installation attempt for IIFL showed 'already registered'. At the time of this call he was driving and said he would respond the next day.", "client_profile_hi": "ग्राहक (मनोज) पहले IIFL डीमैट अकाउंट खोलने की बात कर रहे थे, लेकिन एक अन्य एजेंट (धर्मेंद्र) से बात होने पर उन्होंने पहले ही मना कर दिया था। इसके बाद उन्होंने Zerodha में अकाउंट खुलवा लिया है। उन्होंने बताया कि IIFL ऐप इंस्टॉल करने पर 'already registered' दिखा रहा था। इस कॉल के समय वे गाड़ी चला रहे थे और कहा कि अगले दिन जवाब देंगे।", "summary_en": "The agent kept pushing to reopen the IIFL account without addressing the customer's earlier refusal or confirming a proper time/purpose, resulting in a weak, unfocused follow-up call.", "summary_hi": "एजेंट ग्राहक के पहले के मना करने या उचित समय/उद्देश्य की पुष्टि किए बिना IIFL अकाउंट फिर से खुलवाने पर जोर देता रहा, जिससे यह फॉलो-अप कॉल कमजोर और दिशाहीन रही।", "strengths_en": ["Agent identified himself and the company (IIFL Capital) at the start of the call.", "Agent tried to troubleshoot the app registration issue by suggesting the customer try another mobile number."], "strengths_hi": ["एजेंट ने कॉल की शुरुआत में अपना और कंपनी (IIFL Capital) का परिचय दिया।", "एजेंट ने ऐप रजिस्ट्रेशन की समस्या हल करने की कोशिश की और दूसरे नंबर से ट्राई करने का सुझाव दिया।"], "issues_en": ["Agent never asked if it was a good time to talk and the purpose was confusing at the start ('Kiske regarding sir?').", "Customer clearly said he had already refused IIFL earlier ('mana kar diya tha'), but the agent ] CUSTOMER: Haan wo to sir wo mana kar diya tha na jab Dharmendra ji se baat hua tha mera.\n[00:52] AGENT: Abhi ho jayega, maine baat ki hai, aapka number to verify karwaya tha mere paas to dikh raha tha ki process aage badh jayega aapka. But us samay kya last time aapse jab baat kar raha tha to baat ho nahi payi thi call, phir aap busy the us samay sir.\n[01:08] CUSTOMER: Hello?\n[01:10] CUSTOMER: Haan ji sir, abhi main drive kar raha hoon, uske baad kal batate hain aapko.\n[01:13] AGENT: Aapne... Thik hai, koi baat nahi. Aapne app install kar liya tha kya?\n[01:16] CUSTOMER: Haan ji, haan ji, app install kar liya tha maine, login...\n[01:18] AGENT: To aap new user sign up pe ja rahe the to kya bata raha tha aapko?\n[01:21] CUSTOMER: Already registered aa raha tha.\n[01:23] AGENT: Already, kisi dusre number se try kiya aapne?\n[01:26] CUSTOMER: Haan ji sir...\n[01:27] AGENT: Dusre number se try kiya aapne?\n[01:29] CUSTOMER: Nahi, dusre number se nahi kiya tha.\n[01:31] AGENT: Ek baar aap dusre number se try kariye aur wo number mujhe pehle batana rahega.\n[01:37] CUSTOMER: Thik hai.\n[01:38] AGENT: Aap aur kaunsa number hai aapka wo number ek baar mujhe bata dijiye main update kar dunga yahan pe."}, {"call_id": "2026-08-12_UNMAPPED_TBE615_01", "date": "2026-08-12", "scored_at": "2026-08-23T23:35:25", "agent": "UNMAPPED_TBE615", "audio_file": "/kaggle/working/call-quality-agent/to_score/inbound-8116661308-532_TBE615-20260812-103131.wav.wav", "call_number": "", "phone_number": "8116661308", "language": "hi", "notes": "", "score": 4.0, "client_profile_en": "Client (addressed as 'Jeevan ji') is in the middle of an account KYC/activation process, being guided by the agent through DigiLocker and Aadhaar verification steps; no other demographic or need details were gathered.", "client_profile_hi": "ग्राहक (जिन्हें 'जीवन जी' कहकर संबोधित किया गया) अपने अकाउंट के KYC/एक्टिवेशन प्रोसेस में हैं, और एजेंट उन्हें DigiLocker और आधार वेरिफिकेशन के स्टेप्स में गाइड कर रहा है; कोई अन्य डेमोग्राफिक या ज़रूरत संबंधी जानकारी नहीं ली गई।", "summary_en": "The agent walked the client through the Aadhaar/DigiLocker KYC steps calmly but skipped introduction, permission, and profiling, and the call ended abruptly without a confirmed next step.", "summary_hi": "एजेंट ने ग्राहक को शांतिपूर्वक आधार/डिजीलॉकर KYC के स्टेप्स में गाइड किया, लेकिन परिचय, अनुमति और प्रोफाइलिंग को छोड़ दिया, और कॉल बिना किसी पक्के अगले कदम के अचानक समाप्त हो गई।", "strengths_en": ["Agent maintained a calm, patient tone while giving step-by-step technical instructions.", "Instructions for Aadhaar selection and OTP were clear and easy to follow."], "strengths_hi": ["एजेंट ने स्टेप-बाय-स्टेप तकनीकी निर्देश देते समय शांत और धैर्यपूर्ण लहजा बनाए रखा।", "आधार चयन और OTP से जुड़े निर्देश स्पष्ट और समझने में आसान थे।"], "issues_en": ["No self-introduction, company name, or permission check at call start (e.g., jumps straight to 'Ji Jeevan ji').", "Zero profiling questions asked about the client's situation or reason for pending activation.", "Call ends abruptly on 'Ruko ruko ruko' / 'haan haan theek hai' with no confirmed next step or timeline."], "issues_hi": ["कॉल की शुरुआत में कोई सेल्फ-इंट्रोडक्शन, कंपनी का नाम या अनुमति नहीं ली गई (सीधे 'जी जीवन जी' कहा गया)।", "ग्राहक की स्थिति या एक्टिवेशन रुकने के कारण के बारे में एक भी प्रोफाइलिंग सवाल नहीं पूछा गया।", "'रुको रुको रुको' / 'हां हां ठीक है' पर कॉल अचानक समाप्त हो गई, कोई पक्का अगला कदम या समय तय नहीं हुआ।"], "improvements_en": ["Start with a proper introduction, company name, and a quick permission check before diving into the process.", "Ask why activation was pending or what's blocking the client before jumping into technical steps.", "Close with a clear next step, e.g., 'call you back in 10 minutes once you complete this' with confirmation."], "improvements_hi": ["प्रोसेस में जाने से पहले उचित परिचय, कंपनी का नाम और त्वरित अनुमति लें।", "तकनीकी स्टेप्स में जाने से पहले पूछें कि एक्टिवेशन क्यों अटका था या ग्राहक को क्या रुकाव  ने एड का जिक्र किया और चार्जेज के सवालों के जवाब दिए, लेकिन प्रोफाइलिंग नहीं की, ग्राहक को रिटर्न/स्टॉप-लॉस के भ्रमित करने वाले आंकड़ों से भर दिया, और अंत में सिर्फ एक अस्पष्ट व्हाट्सएप फॉलो-अप पर कॉल खत्म कर दी।", "strengths_en": ["Agent correctly referenced the Facebook algo trading ad at the start, grounding the call context.", "Promptly and clearly answered direct brokerage questions (25 paisa delivery, 2.5 paisa intraday).", "Offered a free manual advisory alternative for customers not wanting algo ('koi commission ya profit sharing nahi lete, free of cost')."], "strengths_hi": ["एजेंट ने शुरुआत में सही तरीके से फेसबुक एल्गो ट्रेडिंग एड का जिक्र किया, जिससे कॉल का संदर्भ स्पष्ट हुआ।", "ब्रोकरेज से जुड़े सीधे सवालों का जल्दी और स्पष्ट जवाब दिया (डिलीवरी में 25 पैसा, इंट्राडे में 2.5 पैसा)।", "एल्गो न चाहने वाले ग्राहकों के लिए फ्री मैनुअल एडवाइजरी का विकल्प दिया ('कोई कमीशन या प्रॉफिट शेयरिंग नहीं लेते, फ्री ऑफ कॉस्ट')।"], "issues_en": ["No permission check ('is this a good time to talk') and no profiling questions before jumping into pitch and pricing.", "Overloaded the customer with disjointed figures (62% return, 99.04, RR 1.3, 30% stop-loss) leaving him openly confused: 'main samajh nahi pa raha hoon kuch.'", "Quoted 3-month '62% return' and '99.04' results as selling points without any risk disclaimer, raising a compliance concern."], "issues_hi": ["कॉल की अनुमति ('क्या अभी बात करने का सही समय है') और प्रोफाइलिंग सवाल पूछे बिना सीधे पिच और प्राइसिंग पर चला गया।", "ग्राहक को बिखरे हुए आंकड़ों (62% रिटर्न, 99.04, RR 1.3, 30% स्टॉप-लॉस) से भर दिया, जिससे ग्राहक खुद कह उठा: 'मैं समझ नहीं पा रहा हूं कुछ।'", "3-महीने का '62% रिटर्न' और '99.04' रिजल्ट बिना किसी जोखिम डिस्क्लेमर के बेचने के तरीके के रूप में बताया, जो एक कंप्लायंस चिंता है।"], "improvements_en": ["Ask 2-3 profiling questions upfront (experience, capital, trading goal) before diving into strategy numbers.", "Simplify the pitch to one clear strategy at a time instead of stacking multiple overlapping percentages and figures.", "Add a balanced risk disclaimer whenever quoting past returns and secure a concrete next step (specific callback time) instead of just 'WhatsApp pe dekh lena.'"], "improvements_hi": ["स्ट्रेटेजी के आंकड़ों में जाने से पहले 2-3 प्रोफाइलिंग सवाल पूछें (अनुभव, पूंजी, ट्रेडिंग लक्ष्य)।", "एक साथ कई ओवरलैपिंग प्रतिशत और आंकड़े देने के बजाय एक समय में एक स्पष्ट स्ट्रेटेजी पर पिच सीमित करें।", "पिछले रिटर्न बताते समय संतुलित जोखिम डिस्क्लेमर जोड़ें और सिर्फ 'व्हाट्सएप पर देख लेना' कहने के बजाय एक ठोस अगला कदम (निश्चित कॉलबैक समय) तय करें।"], "transcript": "[00:00] CUSTOMER: Hello.\n[00:02] AGENT: Hello?\n[00:03] CUSTOMER: Haan, phone aaya tha?\n[00:04] AGENT: Haan sir, Shantilal baat kar raha hoon, namaste. Wealth Choice se main baat kar raha hoon waisi sir.\n[00:10] CUSTOMER: Haan, bataiye.\n[00:10] AGENT: Jee jee, aapne sir hamara ad visit kiya tha algo trading ke regarding sir. Haan na, Facebook pe algo trading.\n[00:17] CUSTOMER: Haan haan, charges kya hain?\n[00:19] AGENT: Kis cheez ke sir?\n[00:23] CUSTOMER: Software algo ke charges kya hain?\n[00:26] AGENT: Bilkul, bilkul. Bahut sir dekhiye hum aapko provide karte hain, algo trading bhi hum aapko karwate hain. Saath hi jaise aapko demat account pe hum aapko services bhi provide karte hain sir. Jee, abhi aap matlab haan haan, boliye.\n[00:41] CUSTOMER: Toh matlab kya, brokerage kya hai demat ke aapke?\n[00:46] AGENT: Sorry? Brokerage charges pooch rahe hain?\n[00:49] CUSTOMER: Yes.\n[00:49] AGENT: Brokerage charges dekhiye isme delivery mein jo aapka delivery mein jo charges lagta hai na, woh 25 paisa rehta hai sir, fund ke turnover pe, aur intraday mein 2.5 paisa sir aapka.\n[01:01] CUSTOMER: Kya rehta hai?\n[01:03] AGENT: 2.5 paisa.\n[01:04] CUSTOMER: 2.5 paisa?\n[01:06] AGENT: Haan ji.\n[01:06] CUSTOMER: Accha.\n[01:07] AGENT: Isme rehta hai, jee.\n[01:09] CUSTOMER: Toh sir kab se, kya naam hai demat ka?\n[01:13] AGENT: IIFL Demat Account, sir.\n[01:15] CUSTOMER: IIFL Demat?\n[01:17] AGENT: Haan, Shantilal dekhiye... haan, boliye.\n[01:21] CUSTOMER: Matlab isko mere ko do-char din kaam dekhna tha WhatsApp pe.\n[01:25] AGENT: WhatsApp pe kaisa work dekhna hai aapko? Matlab kis type se?\n[01:28] CUSTOMER: Matlab ki kya market mein profit-loss, kuch uska...\n[01:31] AGENT: Woh main aapko usme main aapko saara bata deta hoon. Aapko WhatsApp pe main share kiya hai sir, WhatsApp pe main aapko bheja hai, dekhiye mera message aaya kya aapko?\n[01:41] CUSTOMER: Chaliye, isko main dekh loonga, abhi thoda kaam mein busy tha.\n[01:44] AGENT: Isme dekhiye jo strategy option buying mein jaise ek strategy hai jisme minimum jo matlab capital jo rakhna rehta hai woh 50,000 ke rehta hai, theek hai? 3-month ka iska report abhi tak aa raha hai 99.04 ka abhi nikal ke aa raha hai sir. Jee, ek fixed RR 1.3 ka hai isme. 30% ka stop loss hai isme. Isme jo minimum capital 45,000 ka hai, isme 3 month mein 62% ka return matlab diya hai sir usne. 62% ka result hai sir isme.\n[02:20] CUSTOMER: Toh stop loss kya rehta hai?\n[02:22] AGENT: 30% ka isme stop loss hai, second wale mein 45,000 jisme minimum hai, aur isme jo bullish wala RR karke hai, 1... isme, isme 25 point ka stop loss hai sir.\n[02:37] CUSTOMER: Accha.\n[02:38] AGENT: Jee, aur woh strategy aap wahan pe apan dekh sakte hain uske according phir apan matlab woh settle kar sakte hain sir usko.\n[02:46] CUSTOMER: Jaise agar 30,000 tak ka fund rahe toh investment toh trading nahi ho payegi aapke demat mein.\n[02:54] AGENT: Kitna hazar ka?\n[02:55] CUSTOMER: 30,000.\n[02:56] AGENT: 30,000 mein sir aap algo lena chahte hain kya? Matlab algo ke through aap karna chahte hain kya?\n[03:03] CUSTOMER: Yes.\n[03:04] AGENT: Toh phir dekhiye woh dekhna padega sir mujhe ek baar, woh strategy alag-alag rehti hai sir usme.\n[03:10] CUSTOMER: Toh algo matlab, algo ke alag se charges hain ki kya hai main samajh nahi pa raha hoon kuch?\n[03:16] AGENT: Algo mein dekhiye, sabse pehle toh hum demat provide karte hain. Yadi aap algo se trading nahi karna chahte hain toh hum manually bhi matlab hum aapko khud se bhi trade yahan se provide karte hain, personally hum aapko main aapko trade yahan se provide karunga sir. Jisme aapko personally ek assistant mil jayega jo market mein aapko koi view banta hai toh woh aapko call karke proper batayega iska stop loss kya hai, iska target kya hai sir. Is tarah. Aur hum aapse koi commission ya profit sharing nahi lete hain, free of cost rahega sir yeh.\n[03:45] CUSTOMER: Aur agar algo use karenge toh uske kya rahenge?\n[03:50] AGENT: Algo ka sir dekhiye, jo jaise minimum 50,000 ka capital hai na usme lagbhag usme matlab usko buying karne ke liye dekh rahe hain aap. 15,000 ke something ka dikha raha hai sir usme strategy ka. Alag-alag rehta hai sir usme, haan.\n[04:09] CUSTOMER: 15,000 charges hai?\n[04:12] AGENT: Haan, usme...\n[04:15] CUSTOMER: Chaliye thik hai, WhatsApp pe detail send kar dijiyega, main free ho ke dekh loonga.\n[04:18] AGENT: Maine bheja hoon aapko, dekhiye message pe.\n[04:21] CUSTOMER: Thik hai."}, {"call_id": "2026-08-19_ShantilalPethari_01", "date": "2026-08-19", "scored_at": "2026-08-23T23:44:03", "agent": "Shantilal Pethari", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-TBE187-9024912504-20260819-120616.wav.wav", "call_number": "", "phone_number": "9024912504", "language": "hi", "notes": "", "score": 3.0, "client_profile_en": "Male customer, approx. 27 years old, works at Triveni Print (a cloth/garment company) in Barmer district, Rajasthan. He has no existing Demat account with the calling company; he previously invested roughly ₹2-3 lakh in the stock market via the Groww app on his own and lost money. He explicitly states he does not want to do share-market trading again and is instead looking for alternative online work/income opportunities. He had responded to an ad about algo/AI-based trading and called seeking 'service' related to that inquiry.", "client_profile_hi": "पुरुष ग्राहक, लगभग 27 वर्ष, बाड़मेर जिला, राजस्थान में त्रिवेणी प्रिंट (एक कपड़ा कंपनी) में नौकरी करता है। कॉल करने वाली कंपनी के पास उसका कोई डीमैट अकाउंट नहीं है; उसने पहले Groww ऐप के जरिए खुद से लगभग 2-3 लाख रुपये शेयर मार्केट में लगाए थे और नुकसान उठाया था। वह स्पष्ट रूप से कहता है कि वह दोबारा शेयर मार्केट ट्रेडिंग नहीं करना चाहता और इसके बजाय कोई अन्य ऑनलाइन काम/इनकम का विकल्प तलाश रहा है। उसने algo/AI ट्रेडिंग से जुड़ा एक विज्ञापन देखा था और उसी पूछताछ से जुड़ी 'सर्विस' के लिए कॉल किया था।", "summary_en": "The agent contradicted his own company identity (Wealthwise vs IIFL) and kept pushing a share-market pitch even after the customer clearly said he had lost money in the market and didn't want to trade again, ending the call with no real next step.", "summary_hi": "एजेंट ने अपनी कंपनी की पहचान में ही विरोधाभास किया (पहले Wealthwise, बाद में IIFL) और ग्राहक द्वारा साफ तौर पर मना करने के बावजूद (कि वह मार्केट में पैसा गंवा चुका है और दोबारा ट्रेडिंग नहीं करना चाहता) शेयर मार्केट पिच को आगे बढ़ाता रहा, और कॉल बिना किसी ठोस अगले कदम के समाप्त हो गई।", "strengths_en": ["Agent referenced the ad the customer had responded to, as required for a digital lead.", "Asked several profiling questions (occupation, trading experience, prior investment, city, age) rather than jumping straight into the pitch.", "Explained basic stock market concepts (buy low, sell high) in simple, non-technical Hindi."], "strengths_hi": ["एजेंट ने उस विज्ञापन का हवाला दिया जिस पर ग्राहक ने प्रतिक्रिया दी थी, जैसा कि डिजिटल लीड के लिए आवश्यक है।", "पिच सीधे शुरू करने के बजाय कई प्रोफाइलिंग सवाल पूछे (पेशा, ट्रेडिंग अनुभव, पिछला निवेश, शहर, उम्र)।", "शेयर मार्केट की बेसिक अवधारणाएं (सस्ता खरीदो, महंगा बेचो) सरल हिंदी में समझाईं।"], "issues_en": ["Agent introduced himself from 'Wealthwise' but later claimed 'main IIFL se hoon sir, IIFL ka Demat account hai humara' — a company-identity contradiction that is a misrepresentation risk.", "Customer stated twice 'ye share market ka kaam nahi karenge' after revealing he lost ₹2-3 lakh in the market, but the agent kept pushing the same trading pitch instead of pivoting.", "No clear, committed next step was secured — the WhatsApp/app-link promise was left vague and the call ended abruptly with the customer disengaged."], "issues_hi": ["एजेंट ने खुद को 'Wealthwise' से बताया लेकिन बाद में कहा 'main IIFL se hoon sir, IIFL ka Demat account hai humara' — यह कंपनी पहचान में विरोधाभास है और गलत प्रतिनिधित्व का जोखिम है।", "ग्राहक ने दो बार साफ कहा 'ये शेयर मार्केट का काम नहीं करेंगे' क्योंकि वह पहले 2-3 लाख गंवा चुका था, फिर भी एजेंट वही ट्रेडिंग पिच दोहराता रहा।", "कोई स्पष्ट, तय अगला कदम सुनिश्चित नहीं किया गया — WhatsApp/ऐप लिंक भेजने का वादा अस्पष्ट रहा और कॉल ग्राहक के अरुचि दिखाने पर अचानक समाप्त हो गई।"], "improvements_en": ["Use one consistent, correct company name throughout the call to avoid misrepresentation.", "When a customer states a clear objection or prior negative experience, acknowledge it and pivot the pitch to something relevant instead of repeating the same offer.", "Close with a concrete, time-bound next step (specific callback time or confirmed link sent) rather than a vague 'I'll send it on WhatsApp'."], "improvements_hi": ["पूरी कॉल में एक ही सही कंपनी का नाम consistently इस्तेमाल करें ताकि गलत प्रतिनिधित्व न हो।", "जब ग्राहक कोई स्पष्ट आपत्ति या पुराना बुरा अनुभव बताए, तो उसे स्वीकार करते हुए पिच को प्रासंगिक दिशा में मोड़ें, न कि वही ऑफर दोहराएं।", "कॉल को किसी ठोस, समयबद्ध अगले कदम (निश्चित कॉलबैक समय या पुष्ट लिंक भेजना) के साथ बंद करें, न कि अस्पष्ट 'मैं WhatsApp पर भेज देता हूं' के साथ।"], "transcript": "[00:01] AGENT: Hello\n[00:02] CUSTOMER: Haan ji\n[00:03] AGENT: Namaste sir, Shantilal baat kar raha hoon main Wealthwise se sir.\n[00:09] CUSTOMER: Kaun se?\n[00:10] AGENT: Main Indore, Madhya Pradesh se baat kar raha hoon. Meri baat Prahlad Ram Navik ji se ho rahi hai?\n[00:16] CUSTOMER: Haan ji, boliye.\n[00:17] AGENT: Okay. Prahlad ji, aapne humara jo ek ad visit kiya tha recently jisme algo trading, stock market ke regarding, saa ith no scheduled callback or clear next step."], "issues_hi": ["जब ग्राहक ने साफ कहा \"मुझे तो नया अकाउंट नहीं खुलवाना,\" एजेंट ने फिर भी जोर देना जारी रखा और पत्नी के नंबर से अकाउंट खुलवाने का सुझाव तक दे दिया।", "कंपनी की पहचान भ्रमित करने वाली थी — शुरुआत में 'Bellsize' बताया गया लेकिन पिच IIFL Capital की गई, जिससे ग्राहक भ्रमित हुआ (\"आपकी कौन सी कंपनी है?\")।", "कॉल एक अस्पष्ट, गैर-प्रतिबद्ध ग्राहक प्रतिक्रिया (\"ठीक है देखता हूं\") के साथ समाप्त हुई, बिना किसी तय कॉलबैक या स्पष्ट अगले कदम के।"], "improvements_en": ["Respect the customer's stated preference instead of repeatedly probing for reasons after a clear 'no'.", "Clarify the calling entity and the actual brokerage name upfront to avoid customer confusion.", "Close with a concrete next step — a callback time or WhatsApp follow-up — rather than ending on an ambiguous note."], "improvements_hi": ["ग्राहक के स्पष्ट 'ना' कहने के बाद बार-बार कारण पूछने के बजाय उसकी पसंद का सम्मान करें।", "भ्रम से बचने के लिए शुरुआत में कॉल करने वाली संस्था और असली ब्रोकरेज कंपनी का नाम स्पष्ट करें।", "अस्पष्ट नोट पर कॉल खत्म करने के बजाय एक ठोस अगला कदम — कॉलबैक समय या व्हाट्सएप फॉलो-अप — तय करें।"], "transcript": "[00:02] CUSTOMER: Hello\n[00:07] AGENT: Hello\n[00:08] CUSTOMER: Hmm\n[00:10] AGENT: Ji, very good morning sir, Alka baat kar rahi hoon Bellsize se.\n[00:13] CUSTOMER: Kahan se?\n[00:15] AGENT: Bellsize se sir, actually aapne hamari website pe ad watch kiya tha.\n[00:19] CUSTOMER: Haan.\n[00:23] AGENT: Hello?\n[00:24] CUSTOMER: Haan haan, bolo.\n[00:25] AGENT: Ji ad aapka Gujarati tha, main explain Hindi, Hindi samajhte hain na sir aap?\n[00:30] CUSTOMER: Haan, samajhta.\n[00:31] AGENT: Ji ji, share market ke liye aapne woh ad watch kiya tha demat account ke liye.\n[00:37] CUSTOMER: Sir boliye.\n[00:39] AGENT: Haan, toh like abhi abhi jaan sakti hoon abhi kaun sa demat use kar rahe hain aap, abhi aapke paas demat account hai kisi company ka?\n[00:46] CUSTOMER: Haan.\n[00:47] AGENT: Accha, kaun si company ka hai sir One demat account and had previously opened (then deleted) a Kotak account, and is also interested in learning about trading. He requested a callback between 1:00-2:00 PM.", "client_profile_hi": "ग्राहक का नाम चिरंजीत मंडल है, वह नौकरी करते हैं, उन्होंने पहले Facebook विज्ञापन के माध्यम से SIP/IPO में रुचि दिखाई थी लेकिन प्रक्रिया स्पष्ट न होने के कारण शुरू नहीं कर पाए। वे ₹100/माह की SIP 3 साल के लिए शुरू करने पर विचार कर रहे हैं, उनके पास पहले से Angel One का डीमैट अकाउंट है और पहले Kotak का अकाउंट खोला था जो बाद में डिलीट हो गया, वे ट्रेडिंग के बारे में भी जानना चाहते हैं। उन्होंने दोपहर 1:00-2:00 के बीच कॉलबैक मांगा।", "summary_en": "The agent referenced the ad source, profiled the customer well, and secured a clear callback and WhatsApp follow-up, but gave a slightly promotional return figure without disclaimers.", "summary_hi": "एजेंट ने विज्ञापन स्रोत का उल्लेख किया, ग्राहक की अच्छी प्रोफाइलिंग की, और स्पष्ट कॉलबैक व व्हाट्सएप फॉलो-अप तय किया, लेकिन बिना डिस्क्लेमर के थोड़ा प्रचारात्मक रिटर्न आंकड़ा बताया।", "strengths_en": ["Correctly referenced the Facebook ad/SIP-IPO source as required for digital leads.", "Asked multiple relevant profiling questions (SIP amount, duration, occupation, existing accounts).", "Secured a concrete next step with a specific callback time (2 PM) and WhatsApp confirmation."], "strengths_hi": ["डिजिटल लीड के अनुसार Facebook विज्ञापन/SIP-IPO स्रोत का सही उल्लेख किया।", "कई प्रासंगिक प्रोफाइलिंग प्रश्न पूछे (SIP राशि, अवधि, पेशा, मौजूदा अकाउंट्स)।", "स्पष्ट अगला कदम तय किया - निश्चित कॉलबैक समय (2 बजे) और व्हाट्सएप कन्फर्मेशन।"], "issues_en": ["Stated a specific return figure ('4-500 rupees interest in 3 years') without any risk disclaimer, bordering on a return guarantee.", "No explicit permission check ('is this a good time to talk') at the start of the call.", "Pitch on trading felt generic and shifted focus away from the customer's original SIP query without much personalization."], "issues_hi": ["बिना किसी जोखिम डिस्क्लेमर के एक विशिष्ट रिटर्न आंकड़ा बताया ('3 साल में 4-500 रुपये ब्याज'), जो रिटर्न की गारंटी जैसा लगता है।", "कॉल की शुरुआत में स्पष्ट रूप से समय की अनुमति नहीं ली गई ('क्या अभी बात करने का सही समय है')।", "ट्रेडिंग की पिच सामान्य लगी और ग्राहक की मूल SIP जिज्ञासा से हटकर व्यक्तिगतकरण की कमी दिखी।"], "improvements_en": ["Add a risk disclaimer whenever discussing potential SIP/trading returns to avoid compliance risk.", "Explicitly confirm the customer's availability at call start before pitching.", "Stay focused on the customer's stated need (SIP) before pivoting to trading/demat upsell."], "improvements_hi": ["SIP/ट्रेडिंग रिटर्न पर चर्चा करते समय जोखिम डिस्क्लेमर जोड़ें ताकि कंप्लायंस जोखिम न हो।", "पिच शुरू करने से पहले ग्राहक की उपलब्धता की स्पष्ट पुष्टि करें।", "ट्रेडिंग/डीमैट अपसेल की ओर बढ़ने से पहले ग्राहक की बताई गई जरूरत (SIP) पर केंद्रित रहें।"], "transcript": "[00:00] AGENT: Hello.\n[00:03] CUSTOMER: Hello.\n[00:06] AGENT: Hello, sir.\n[00:07] CUSTOMER: Yes.\n[00:10] AGENT: Actually, brother, Subir is talking from Belsa Company. Actually, we ran a Facebook ad campaign.\n[00:19] CUSTOMER: Huh.\n[00:20] AGENT: Regarding SIP, Systematic Investment Plan, and IPO. So, you registered for it and showed interest. So, I wanted to know if you invest in SIP or investment plan.\n[00:34] CUSTOMER: I wanted to, but how to start it? I didn't understand, that's why I didn't do it.\n[00:38] AGENT: Ah, I see. So now you want to start an SIP?\n[00:43] CUSTOMER: Yes.\n[00:44] AGENT: So brother, to start an SIP, basically, we need a DEMAT account.\n[00:50] CUSTOMER: Hmm.\n[00:51] AGENT: And if you don't have a DEMAT account, then also if we SIP, if you have an Aadhaar card, PAN card, and a bank account, then we can start the SIP. But if you have a DEMAT account, we can track how many months it has been, in how many months, how much profit is running, or how much return is getting from the market, how much money we have deposited, all this we can see in a DEMAT account. And if you don't ovide full over guidance, etc., because we... basically, A to Z facility and they provide, so that we guide the shop, etc.\n[03:20] CUSTOMER: Yes.\n[03:21] AGENT: So do you want to do trading, etc.?\n[03:25] CUSTOMER: Trading, I want to do, I have opened a few accounts, Angel One's account has been opened, one account, yours, Kotak's was opened, but that was deleted again, I don't know what happened.\n[03:35] AGENT: Achha.\n[03:35] CUSTOMER: So Kotak, I'll do one thing, you come on WhatsApp now, let's chat on WhatsApp.\n[03:41] AGENT: Now it won't happen, some other time is a bit good, I'm doing some work.\n[03:44] CUSTOMER: Achha, now you are doing work, no, I'm just asking if you are on WhatsApp, this WhatsApp number, should we chat on this number or another number?\n[03:51] AGENT: On this number only, it chats.\n[03:53] AGENT: This number only, your WhatsApp chats. So I'll register your number once, and I'll send you all my name, etc., I'll send it to you. So... when you are free, brother, then I will guide you, so we can open a DEMAT account today, and tomorrow...\n[04:08] CUSTOMER: Can you call between 1:00 to 2:00?\n[04:12] AGENT: You call at a certain time, I will call you. Can I call you around 2:00?\n[04:16] CUSTOMER: Yes, yes.\n[04:18] AGENT: Okay, okay, so your whole name coming is... Chiranjit Mandal.\n[04:25] CUSTOMER: Yes.\n[04:26] AGENT: Okay, so brother, my name is Subir Shah, so you save your number, I am sending you my details, etc., and whatever is there, link, etc., whatever you need to open an account, I am sending it to you, then at 2:00 we will open an account and after that I will guide you through everything.\n[04:45] CUSTOMER: Okay.\n[04:46] AGENT: Okay, okay, so save the number, I am calling you at 2:00.\n[04:50] CUSTOMER: Achha.\n[04:51] AGENT: Okay, brother, thank you."}, {"call_id": "2026-08-17_UNMAPPED_TBE623_01", "date": "2026-08-17", "scored_at": "2026-08-24T23:04:45", "agent": "UNMAPPED_TBE623", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-532_TBE623-7003198533-20260817-104221.wav.wav", "call_number": "", "phone_number": "7003198533", "language": "bn", "notes": "", "score": 8.0, "client_profile_en": "Male customer, first-time SIP investor with no existing Demat account, though he and family members (mother, daughter) hold a few shares individually. He tracks mutual fund/gold investment options based on past year's returns and plans to open three separate Demat accounts for himself and family members.", "client_profile_hi": "पुरुष ग्राहक, पहली बार SIP में निवेश कर रहा है और उसके पास अभी कोई डीमैट अकाउंट नहीं है, हालांकि उसके और परिवार के सदस्यों (माँ, बेटी) के पास व्यक्तिगत रूप से कुछ शेयर हैं। वह पिछले वर्ष के रिटर्न के आधार पर म्यूचुअल फंड/गोल्ड निवेश विकल्पों को ट्रैक करता है और खुद व परिवार के लिए तीन अलग-अलग डीमैट अकाउंट खोलने की योजना बना रहा है।", "summary_en": "The agent profiled the customer well and secured a clear next-day callback with WhatsApp follow-up, but skipped a proper self/company introduction and permission check at the start.", "summary_hi": "एजेंट ने ग्राहक की अच्छी प्रोफाइलिंग की और अगले दिन कॉलबैक के साथ व्हाट्सएप फॉलो-अप तय किया, लेकिन शुरुआत में उचित परिचय और अनुमति नहीं ली।", "strengths_en": ["Asked multiple relevant profiling questions (prior SIP experience, existing Demat account, preferred fund companies) before pitching.", "Secured a concrete next step: a callback at the same time tomorrow plus WhatsApp for document/details sharing.", "Kept the pitch simple and non-jargon, explaining Demat account process and SIP amount flexibility clearly."], "strengths_hi": ["पिच से पहले कई प्रासंगिक प्रोफाइलिंग सवाल पूछे (पहले SIP का अनुभव, मौजूदा डीमैट अकाउंट, पसंदीदा फंड कंपनियां)।", "एक ठोस अगला कदम तय किया: कल इसी समय कॉलबैक और दस्तावेज़/जानकारी साझा करने के लिए व्हाट्सएप।", "पिच को सरल और जार्गन-मुक्त रखा, डीमैट अकाउंट प्रक्रिया और SIP राशि की लचीलापन स्पष्ट रूप से समझाई।"], "issues_en": ["No proper self-introduction or clear company name given; agent only said 'your number was registered from our company side'.", "Did not check if it was a good time to talk before starting the pitch — permission was asked only midway ('Are you busy right now, or are you free?').", "Pitch remained somewhat generic (listing fund houses like HDFC, Birla, Kotak, SBI) rather than tailored to his stated goal of tracking prior-year returns."], "issues_hi": ["उचित आत्म-परिचय या स्पष्ट कंपनी का नाम नहीं दिया गया; एजेंट ने केवल कहा 'आपका नंबर हमारी कंपनी की तरफ से रजिस्टर्ड था'।", "पिच शुरू करने से पहले यह नहीं पूछा कि यह बात करने का सही समय है या नहीं — अनुमति बीच में ही पूछी गई ('अभी बिज़ी हैं या फ्री हैं?')।", "पिच कुछ हद तक सामान्य रही (HDFC, बिड़ला, कोटक, SBI जैसे फंड हाउस सूचीबद्ध करना) बजाय पिछले साल के रिटर्न ट्रैक करने के उसके बताए लक्ष्य के अनुरूप।"], "improvements_en": ["Start every call with a clear self-introduction, company name, and a permission check before diving into questions.", "Personalize the pitch by directly referencing the customer's stated method of selecting funds (past-year returns) rather than a generic fund-house list.", "Confirm document requirements and timeline ownership more firmly by setting a specific reminder/callback task rather than leaving it open-ended."], "improvements_hi": ["हर कॉल की शुरुआत स्पष्ट आत्म-परिचय, कंपनी का नाम और सवाल पूछने से पहले अनुमति लेकर करें।", "ग्राहक द्वारा बताए गए फंड चुनने के तरीके (पिछले साल के रिटर्न) का सीधा संदर्भ देकर पिच को व्यक्तिगत बनाएं, न कि सामान्य फंड-हाउस सूची से।", "दस्तावेज़ आवश्यकताओं और समय-सीमा की जिम्मेदारी को अधिक मजबूती से तय करें, जैसे विशिष्ट रिमाइंडर/कॉलबैक कार्य निर्धारित करना।"], "transcript": "[00:01] AGENT: Hello?\n[00:03] UNKNOWN: Hello.\n[00:04] AGENT: Hello, yes. Good morning, sir.\n[00:06] CUSTOMER: Morning.\n[00:07] AGENT: Yes, sir. Actually, sir, your number was registered from our company side. You had some requirements for SIP mutual funds, right?\n[00:15] CUSTOMER: Yes, yes, yes, yes.\n[00:17] AGENT: Okay, okay. So, sir, have you done any SIP before, or is this the first time you are doing it, sir?\n[00:23] CUSTOMER: I double check, wait, wait, let me get a postcard.\n[00:26] AGENT: Sir, I'm saying, have you done any SIP before, or is this the first time you'll do it?\n[00:30] CUSTOMER: No, no, I haven't done it before. I'm doing it for the first time, I'm interested.\n[00:34] AGENT: That's why I'm asking you.\n[00:35] CUSTOMER: Okay, okay.\n[00:36] AGENT: So, sir, currently are you using any company's Demat account?\n[00:40] CUSTOMER: No, my Demat account is not anywhere, I have two or three shares of my own. My and my family's. So I can only do Demat account now, right?\n[00:48] AGENT: So regarding the Demat account, will you open a Demat account now, or...\n[00:52] CUSTOMER: Oh, sure.\n[00:53] AGENT: See, from our side, your Demat account will be open. There is no problem.\n[00:56] AGENT: And it doesn't take much time to process, it takes 5 to 10 minutes.\n[01:00] AGENT: You can do it directly, or you can open a Demat account and do it. But yes, if you open a Demat account, it will be a bit convenient for some processes. For that reason, we prefer that one.\n[01:09] AGENT: And sir, the SIP process is like this, that you have to invest on a monthly basis, okay?\n[01:15] AGENT: Like as per your capacity, you can give 500, 1000 or above that also.\n[01:19] CUSTOMER: Yes, yes, yes, yes, yes.\n[01:21] AGENT: Okay, one minute. One minute, there is one thing. SIP, you are doing through some particular company, or are you doing it generally?\n[01:29] CUSTOMER: No, we do it on a particular company, the companies we see, we keep those companies listed, the companies which have given good returns or a percentage in the previous year or before that.\n[01:39] CUSTOMER: Yes, those companies...\n[01:41] AGENT: Can you give me a couple of examples of which companies are there?\n[01:44] CUSTOMER: Ah, yes, you stay on the line, I'll bring the list.\n[01:47] AGENT: Yes.\n[01:47] CUSTOMER: Yes, yes, whatever company, it will be a bit easy for me to understand.\n[01:50] AGENT: Okay, very, very good.\n[01:52] AGENT: See, we have HDFC Mutual Fund, then Aditya Birla, Kotak, SBI, and after that there are many things like gold, many companies are there who want to invest in gold.\n[02:03] AGENT: We keep those companies listed. So, many companies, we have listed them like this.\n[02:08] CUSTOMER: Okay, I understood. I got a rough idea.\n[02:11] AGENT: Yes.\n[02:12] AGENT: So, should I... Next time, should I contact you on this phone only?\n[02:15] CUSTOMER: Yes, yes, absolutely.\n[02:16] AGENT: Yes, you can definitely do that. You can contact this number, or do you have WhatsApp on this?\n[02:22] CUSTOMER: Yes, yes, this number has WhatsApp.\n[02:24] CUSTOMER: Okay. Are you busy right now, or are you free?\n[02:27] CUSTOMER: No, I... Actually, let me tell you, I was in the middle of some work, that's why you are taking time.\n[02:32] AGENT: No, I need a little bit, like 5 to 10 minutes of your time, roughly 10 minutes of your time, then I can process your application right now.\n[02:38] CUSTOMER: Okay, okay, yes.\n[02:39] AGENT: Yes, yes.\n[02:40] CUSTOMER: Yes, yes, if you do that, then I can share how we'll do it. You can give me a hint.\n[02:45] AGENT: I will guide you.\n[02:46] AGENT: Yes, yes. If you open a Demat account now, then the documents you have now, like whatever is required, do you have them with you now?\n[02:53] CUSTOMER: Yes, please tell me what documents.\n[02:55] AGENT: Like Aadhaar card and bank details are required, nothing else is required.\n[02:59] CUSTOMER: Oh, okay, okay. Yes, I'll make arrangements for that, Aadhaar card.\n[03:01] CUSTOMER: Because my money, my mother's and my daughter's, whatever is there, I'll collect all that and tell you how we'll share it.\n[03:09] AGENT: You can call on this number. Will you be free at some time? Tell me.\n[03:13] CUSTOMER: Okay, I'll tell you.\n[03:14] CUSTOMER: Yes, yes. Right now they are not here, so she has gone out with her niece, she has also gone out.\n[03:18] CUSTOMER: So when they come back, I'll collect the documents, and tomorrow I'll contact you.\n[03:23] AGENT: Tomorrow?\n[03:24] CUSTOMER: Yes.\n[03:25] AGENT: Okay. Tomorrow at what time? Should I call you at the same time?\n[03:28] CUSTOMER: Yes, yes, yes, same time.\n[03:30] AGENT: Okay.\n[03:30] AGENT: I will open the Demat account then, or should I do it now?\n[03:34] AGENT: Okay, okay.\n[03:35] AGENT: It will be done right now, sir. Now, if you say that you have the documents now, and want to do it now, I'll do it right now, no problem.\n[03:41] CUSTOMER: No, no, I'll do it together, one by one, because one by one I'll open three accounts.\n[03:47] AGENT: Yes, yes, yes.\n[03:48] AGENT: Then you can do one thing, if you mean you are depending on yourself, meaning if you are free a bit, then I can keep your Demat account open and ready, okay?\n[03:58] AGENT: Tomorrow you can download the application, and I can start your SIP. SIP will start from tomorrow, your proper mail will go.\n[04:06] AGENT: Then it will be convenient for you if you keep the processes ready one by one.\n[04:10] CUSTOMER: Okay, okay, okay.\n[04:12] AGENT: So, you need to give some time. Will you do it now? Tell me.\n[04:15] CUSTOMER: Yes, so I need a little time, because I am busy with other work, so I can take it out.\n[04:19] CUSTOMER: I have to get the Aadhar card and bank details.\n[04:27] AGENT: Okay, okay. You can take some time, take some time. If not, you can call back on this number, or I can message you on WhatsApp.\n[04:33] AGENT: You can message me there.\n[04:35] AGENT: I will send all the details on WhatsApp, you can check and then call or message me back.\n[04:43] CUSTOMER: Okay, okay. Okay, Madam.\n[04:45] AGENT: Okay, thank you.\n[04:47] CUSTOMER: Thank you."}, {"call_id": "2026-08-07_UNMAPPED_TBE623_01", "date": "2026-08-07", "scored_at": "2026-08-24T23:05:19", "agent": "UNMAPPED_TBE623", "audio_file": "/kaggle/working/call-quality-agent/to_score/local-532_TBE623-7890966192-20260807-152733.wav.wav", "call_number": "", "phone_number": "7890966192", "language": "bn", "notes": "", "score": 3.0, "client_profile_en": "Customer already has an existing Demat account (mentioned as possibly with Nippon) and had earlier filled a form/inquiry with the company. No age, occupation, or income details were gathered.", "client_profile_hi": "ग्राहक के पास पहले से एक डीमैट खाता है (शायद Nippon के साथ) और उसने पहले कंपनी के फॉर्म/इन्क्वायरी में विवरण भरा था। कॉल में उम्र, पेशा या आय संबंधी कोई जानकारी नहीं ली गई।", "summary_en": "The agent confusingly pushed a redundant Demat account on a customer who already had one, then contradicted himself and ended the call without any next step.", "summary_hi": "एजेंट ने उस ग्राहक को एक अनावश्यक डीमैट खाता खोलने के लिए उलझन में डाल दिया जिसके पास पहले से खाता था, फिर खुद ही अपनी बात पलट दी और कॉल बिना किसी अगले कदम के समाप्त कर दी।", "strengths_en": ["Agent asked whether the customer already had a Demat account and with which company.", "Tone remained calm and non-aggressive throughout the call."], "strengths_hi": ["एजेंट ने पूछा कि क्या ग्राहक के पास पहले से डीमैट खाता है और किस कंपनी में है।", "पूरी कॉल के दौरान टोन शांत और गैर-आक्रामक रहा।"], "issues_en": ["Agent pushed for a new Demat account ('would you like to open another Demat account right now?') despite the customer clearly stating he already has one, causing confusion.", "Agent then contradicted himself ('so there is no need to make it') without explaining any real benefit, making the pitch incoherent.", "Call ended abruptly with just 'thank you sir' and no next step, follow-up, or WhatsApp/callback plan."], "issues_hi": ["ग्राहक द्वारा साफ बताने के बावजूद कि उसके पास पहले से डीमैट खाता है, एजेंट ने नया खाता खोलने पर जोर दिया ('क्या आप अभी दूसरा डीमैट खाता खोलना चाहेंगे?'), जिससे भ्रम पैदा हुआ।", "फिर एजेंट ने खुद ही अपनी बात पलट दी ('तो बनाने की जरूरत नहीं है') बिना कोई वास्तविक फायदा बताए, जिससे पिच असंगत लगी।", "कॉल बिना किसी अगले कदम, फॉलो-अप या व्हाट्सएप/कॉलबैक योजना के केवल 'धन्यवाद सर' कहकर अचानक समाप्त कर दी गई।"], "improvements_en": ["Ask for permission to talk and clearly state the call's purpose before pitching anything.", "Since the customer already has an account, pivot the pitch to a clear added value (e.g., research support, lower brokerage) instead of pushing a duplicate account.", "Close every call with a concrete next step, such as a scheduled callback or sending onboarding details on WhatsApp."], "improvements_hi": ["कुछ भी पिच करने से पहले बात करने की अनुमति लें और कॉल का उद्देश्य स्पष्ट रूप से बताएं।", "चूंकि ग्राहक के पास पहले से खाता है, डुप्लीकेट खाता खोलने पर जोर देने के बजाय किसी स्पष्ट अतिरिक्त लाभ (जैसे रिसर्च सपोर्ट, कम ब्रोकरेज) पर पिच को केंद्रित करें।", "हर कॉल को एक ठोस अगले कदम के साथ समाप्त करें, जैसे कॉलबैक शेड्यूल करना या व्हाट्सएप पर ऑनबोर्डिंग विवरण भेजना।"], "transcript": "[00:01] AGENT: Hello?\n[00:02] CUSTOMER: Hello.\n[00:04] AGENT: Uh, yes sir, good afternoon, I was calling from Belsite.\n[00:09] CUSTOMER: From where?\n[00:10] AGENT: Belsite, I was calling, sir. Actually, your number was registered from our company side. Uh, you filled out your details for the Demat account process, right?\n[00:23] AGENT: Okay. So, uh, before this, have you used any Demat account or is this your first time using one?\n[00:30] AGENT: Demat account is already made, right?\n[00:32] CUSTOMER: Made, it's already there.\n[00:35] AGENT: Which company's?\n[00:37] CUSTOMER: That was made, I think, Nippon, I think, very possibly.\n[00:45] AGENT: Okay.\n[00:46] AGENT: So, would you like to open another Demat account right now?\n[00:50] CUSTOMER: Why, that is there, that is there itself.\n[00:52] AGENT: Sir, every application has different information, right? Different, uh, processes, different systems. So, in the same day account, you get that support from there, you will get that support from here.\n[01:05] AGENT: Whatever requirements you have,
